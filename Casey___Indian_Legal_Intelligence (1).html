 for Advance Rulings, Gujarat", "year": 2019, "bench": 2, "judges": ["Sonal Mishra J", "Vasa Seshagiri Rao J"], "subject": "Tax Law", "tags": ["GST", "educational institution", "exemption", "notification", "IIM", "executive program", "residential course", "Schedule"], "facts": "IIM Ahmedabad sought an advance ruling on whether its executive education programmes and other commercial activities were exempt from GST as educational services. The question was whether IIM Ahmedabad qualifies as an 'educational institution' for GST exemption purposes and whether all its programmes fall within the exemption.", "judgement": "The AAR held that IIM Ahmedabad qualifies as an educational institution for its degree-granting programmes which are covered by the GST exemption notification. However, its commercial executive education programmes — short-term courses not leading to a degree or diploma recognised by law — do not qualify for the exemption and are subject to GST.", "principle": "Not all courses offered by educational institutions qualify for GST exemption. The exemption for educational services is limited to programmes leading to recognised qualifications (degrees, diplomas) approved under Indian law. Commercial executive education programmes and non-recognised courses offered by educational institutions are subject to GST. This ruling clarifies the scope of GST exemption for education and has significant implications for IIMs, IITs and similar institutions."}, {"id": "cit-v-chetak-construction-2019", "title": "CIT v. Chetak Construction Ltd.", "citation": "(2019) 418 ITR 104 (Raj HC)", "court": "Rajasthan High Court", "year": 2019, "bench": 2, "judges": ["Sangeet Lodha J", "Rekha Borana J"], "subject": "Tax Law", "tags": ["Section 80IB", "housing project", "deduction", "timeline", "completion certificate", "real estate", "affordable housing"], "facts": "Chetak Construction claimed deduction under Section 80IB(10) of the Income Tax Act for profits from an approved housing project. The Revenue denied the deduction on the ground that the project was not completed within the statutory time limit specified in the section. The developer argued that delays were caused by circumstances beyond its control.", "judgement": "The Rajasthan High Court held that the timeline for completion of a housing project under Section 80IB(10) is a mandatory condition and failure to complete within the specified period disentitles the developer from the deduction. The courts cannot extend the statutory time limit by importing doctrines of force majeure or circumstances beyond control into the statute.", "principle": "The conditions for claiming deductions under Section 80IB, including the timeline for project completion, are mandatory and cannot be relaxed by courts. Statutory tax deductions are conditional benefits and taxpayers must strictly comply with all conditions to be entitled to the deduction. Where Parliament has prescribed time limits, those limits are binding and cannot be extended by judicial interpretation."}];

// ── STATE ──
let activePage = 'landing';
let activeSubject = 'all';
let activeCourt = 'all';
let acHighlight = -1;
let acResults = [];

// ── ORBS ──
window.addEventListener('load', () => {
  setTimeout(() => {
    document.getElementById('orb1').classList.add('visible');
    document.getElementById('orb2').classList.add('visible');
  }, 100);
});

// ══ PAGE SWITCHING ══
function showLanding() {
  document.getElementById('page-landing').style.display = 'flex';
  document.getElementById('page-results').style.display = 'none';
  activePage = 'landing';
  closeAutocomplete();
}

function showResults(subject) {
  document.getElementById('page-landing').style.display = 'none';
  document.getElementById('page-results').style.display = 'block';
  activePage = 'results';

  if (subject && subject !== 'all') {
    activeSubject = subject;
    document.querySelectorAll('[data-subject]').forEach(b => b.classList.toggle('active', b.dataset.subject === subject));
  }

  const landingQ = document.getElementById('landingSearch').value.trim();
  if (landingQ) document.getElementById('resultsSearch').value = landingQ;

  applyFilters();
}

// ══ LANDING SEARCH + AUTOCOMPLETE ══
function normalize(s) { return s.toLowerCase(); }

function scoreMatch(c, q) {
  if (!q) return 1;
  const terms = normalize(q).split(/\s+/).filter(Boolean);
  const corpus = normalize(c.title + ' ' + c.tags.join(' ') + ' ' + c.facts + ' ' + c.principle + ' ' + c.subject);
  return terms.every(t => corpus.includes(t)) ? 1 : 0;
}

function onLandingSearch() {
  const q = document.getElementById('landingSearch').value.trim();
  if (!q) { closeAutocomplete(); return; }

  acResults = JUDGMENTS.filter(c => scoreMatch(c, q)).slice(0, 6);
  acHighlight = -1;
  renderAutocomplete(q);
}

function renderAutocomplete(q) {
  const drop = document.getElementById('autocomplete');
  if (acResults.length === 0) { drop.classList.remove('open'); return; }

  const subjectIcon = { 'Company Law': '🏢', 'Constitutional Law': '⚖', 'Tax Law': '📋' };

  drop.innerHTML = acResults.map((c, i) => `
    <div class="autocomplete-item" data-idx="${i}" onmousedown="selectAcItem(${i})">
      <div class="autocomplete-icon">${subjectIcon[c.subject] || '📄'}</div>
      <div class="autocomplete-info">
        <div class="autocomplete-title">${c.title}</div>
        <div class="autocomplete-meta">
          <span>${c.court}</span>
          <span>·</span>
          <span>${c.year}</span>
        </div>
      </div>
      <div class="autocomplete-subject">${c.subject.replace(' Law','').replace('Constitutional','Const.')}</div>
    </div>
  `).join('') + `<div class="autocomplete-footer" onmousedown="commitSearch()">See all results for "${q}" →</div>`;

  drop.classList.add('open');
}

function closeAutocomplete() {
  document.getElementById('autocomplete').classList.remove('open');
  acResults = []; acHighlight = -1;
}

function selectAcItem(idx) {
  const c = acResults[idx];
  if (!c) return;
  closeAutocomplete();
  document.getElementById('landingSearch').value = c.title;
  showResults('all');
  setTimeout(() => openModal(c.id), 80);
}

function commitSearch() {
  closeAutocomplete();
  showResults('all');
}

function onLandingKeydown(e) {
  const drop = document.getElementById('autocomplete');
  if (!drop.classList.contains('open')) {
    if (e.key === 'Enter') commitSearch();
    return;
  }
  const items = drop.querySelectorAll('.autocomplete-item');
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    acHighlight = Math.min(acHighlight + 1, items.length - 1);
    items.forEach((el, i) => el.classList.toggle('highlighted', i === acHighlight));
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    acHighlight = Math.max(acHighlight - 1, -1);
    items.forEach((el, i) => el.classList.toggle('highlighted', i === acHighlight));
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (acHighlight >= 0 && acResults[acHighlight]) {
      selectAcItem(acHighlight);
    } else {
      commitSearch();
    }
  } else if (e.key === 'Escape') {
    closeAutocomplete();
  }
}

document.addEventListener('click', e => {
  if (!e.target.closest('.search-container')) closeAutocomplete();
});

// ══ RESULTS FILTERS ══
function setSubject(val, btn) {
  activeSubject = val;
  document.querySelectorAll('[data-subject]').forEach(b => b.classList.toggle('active', b.dataset.subject === val));
  applyFilters();
}

function setCourt(val, btn) {
  activeCourt = val;
  document.querySelectorAll('[data-court]').forEach(b => b.classList.toggle('active', b.dataset.court === val));
  applyFilters();
}

function applyFilters() {
  const q = normalize(document.getElementById('resultsSearch').value.trim());
  const yFrom = parseInt(document.getElementById('yearFrom').value) || 0;
  const yTo = parseInt(document.getElementById('yearTo').value) || 9999;

  const filtered = JUDGMENTS.filter(c => {
    if (activeSubject !== 'all' && c.subject !== activeSubject) return false;
    if (activeCourt === 'sc' && c.court !== 'Supreme Court of India') return false;
    if (activeCourt === 'other' && c.court === 'Supreme Court of India') return false;
    if (c.year < yFrom || c.year > yTo) return false;
    if (q) {
      const corpus = normalize(c.title + ' ' + c.facts + ' ' + c.judgement + ' ' + c.principle + ' ' + c.tags.join(' ') + ' ' + c.citation);
      if (!q.split(' ').filter(Boolean).every(t => corpus.includes(t))) return false;
    }
    return true;
  });

  document.getElementById('resultCount').textContent = filtered.length;
  renderGrid(filtered);
}

function renderGrid(cases) {
  const grid = document.getElementById('caseGrid');
  if (!cases.length) {
    grid.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">⚖</div>
        <div class="empty-title">No judgments found</div>
        <div class="empty-body">Try different keywords or clear your filters.</div>
      </div>`;
    return;
  }
  grid.innerHTML = cases.map(c => {
    const tags = c.tags.slice(0, 3);
    const extra = c.tags.length - 3;
    return `<div class="case-card" onclick="openModal('${c.id}')">
      <div class="card-subject-tag">${c.subject}</div>
      <div class="card-title">${c.title}</div>
      <div class="card-meta">
        <span>${c.court}</span>
        <span class="card-sep">·</span>
        <span>${c.year}</span>
      </div>
      <div class="card-preview">${c.facts}</div>
      <div class="card-tags">
        ${tags.map(t => `<span class="tag">${t}</span>`).join('')}
        ${extra > 0 ? `<span class="tag-overflow">+${extra}</span>` : ''}
      </div>
    </div>`;
  }).join('');
}

function clearFilters() {
  document.getElementById('resultsSearch').value = '';
  document.getElementById('yearFrom').value = '';
  document.getElementById('yearTo').value = '';
  activeSubject = 'all'; activeCourt = 'all';
  document.querySelectorAll('[data-subject]').forEach(b => b.classList.toggle('active', b.dataset.subject === 'all'));
  document.querySelectorAll('[data-court]').forEach(b => b.classList.toggle('active', b.dataset.court === 'all'));
  applyFilters();
}

// ══ MODAL ══
function openModal(id) {
  const c = JUDGMENTS.find(j => j.id === id);
  if (!c) return;
  document.getElementById('mSubject').textContent = c.subject;
  document.getElementById('mTitle').textContent = c.title;
  document.getElementById('mCitation').textContent = c.citation;
  document.getElementById('mFacts').textContent = c.facts;
  document.getElementById('mJudgement').textContent = c.judgement;
  document.getElementById('mPrinciple').textContent = c.principle;
  document.getElementById('mMeta').innerHTML = `
    <span><strong>Court</strong> ${c.court}</span>
    <span><strong>Year</strong> ${c.year}</span>
    <span><strong>Bench</strong> ${c.bench} judges</span>`;
  document.getElementById('mJudges').innerHTML = c.judges.join('&ensp;·&ensp;');
  document.getElementById('mTags').innerHTML = c.tags.map(t => `<span class="tag">${t}</span>`).join('');
  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

function closeModalOverlay(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeModal(); closeAutocomplete(); }
});

// ── INIT ──
renderGrid(JUDGMENTS);
</script>

<script>
// ── SPLASH ──
(function () {
  const body = document.body, splash = document.getElementById('splash'), logo = document.getElementById('splash-logo');
  const navLogo = document.querySelector('.nav-logo svg');
  const finish = () => { splash.remove(); logo.remove(); body.classList.remove('splashing'); setTimeout(() => body.classList.remove('reveal'), 2500); };
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { finish(); return; }
  body.classList.add('splashing');
  const place = () => {
    const w = Math.min(innerWidth * 0.66, 560), h = w * 190 / 600;
    logo.style.width = w + 'px';
    logo.style.left = (innerWidth - w) / 2 + 'px';
    logo.style.top = (innerHeight - h) / 2 + 'px';
  };
  place(); addEventListener('resize', place);
  let done = false;
  const exit = () => {
    if (done) return; done = true;
    removeEventListener('resize', place);
    const a = logo.getBoundingClientRect(), b = navLogo.getBoundingClientRect(), s = b.width / a.width;
    logo.style.transition = 'transform 1.1s cubic-bezier(.7,0,.2,1)';
    logo.style.transform = `translate(${b.left - a.left}px, ${b.top - a.top}px) scale(${s})`;
    body.classList.add('reveal'); splash.classList.add('out');
    setTimeout(finish, 1300);
  };
  splash.addEventListener('click', exit);
  setTimeout(exit, 3400);
})();
</script>
</body>
