undational case on freedom of trade and the scope of State taxing power under the Constitution."}, {"id": "ranjit-thakur-v-union-india-1987", "title": "Ranjit Thakur v. Union of India", "citation": "AIR 1987 SC 2386", "court": "Supreme Court of India", "year": 1987, "bench": 5, "judges": ["Ranganath Misra J", "G.L. Oza J", "M.M. Dutt J", "Saikia J", "Venkatachalliah J"], "subject": "Constitutional Law", "tags": ["Army Act", "Court Martial", "Article 21", "natural justice", "proportionality", "dismissal", "soldier rights"], "facts": "Ranjit Thakur, a soldier, was tried by a General Court Martial and dismissed from service. He challenged the punishment as grossly disproportionate to the offence committed. The question was whether the principles of proportionality and natural justice apply to court martial proceedings under the Army Act.", "judgement": "The Supreme Court held that the power of judicial review extends to court martial proceedings and that the punishment imposed must not be grossly disproportionate. The Court introduced the concept of proportionality in Indian administrative law — that the punishment must be commensurate with the gravity of the offence. The dismissal was found to be disproportionate and was set aside.", "principle": "Judicial review extends to court martial proceedings and military disciplinary actions. The principle of proportionality — that the punishment must be proportionate to the offence — is a requirement of natural justice and good administration. Grossly disproportionate punishment is itself a ground for judicial review under Articles 14 and 21. This case introduced the proportionality doctrine into Indian administrative law."}, {"id": "sheela-barse-v-state-maharashtra-1983", "title": "Sheela Barse v. State of Maharashtra", "citation": "AIR 1983 SC 378", "court": "Supreme Court of India", "year": 1983, "bench": 2, "judges": ["P.N. Bhagwati J", "E.S. Venkataramiah J"], "subject": "Constitutional Law", "tags": ["women in custody", "Article 21", "police custody", "torture", "legal aid", "magistrate", "fundamental rights", "PIL"], "facts": "Sheela Barse, a journalist, filed a PIL drawing the attention of the Supreme Court to the ill-treatment of women prisoners in police custody in Maharashtra. She alleged that women were subjected to torture, sexual assault, and other forms of ill-treatment in custody. The PIL sought remedial directions.", "judgement": "The Supreme Court issued a series of directions for the protection of women in police custody. The Court held that women should be interrogated only in the presence of female police officers, in adequately lit rooms. Magistrates must visit places of custody to detect mistreatment. Legal aid must be provided to women in custody.", "principle": "Women in custody have a fundamental right to be protected from all forms of ill-treatment under Article 21. The State bears an affirmative obligation to ensure the safety and dignity of persons in its custody, including by deploying female officers for interrogation of women and by ensuring regular magistrate oversight of custody conditions. This case improved conditions for women in custody across India."}, {"id": "state-of-tamil-v-k-balu-2017", "title": "State of Tamil Nadu v. K. Balu", "citation": "(2017) 2 SCC 281", "court": "Supreme Court of India", "year": 2017, "bench": 3, "judges": ["Dipak Misra J", "Amitava Roy J", "A.M. Khanwilkar J"], "subject": "Constitutional Law", "tags": ["highway liquor ban", "Article 21", "road safety", "licence", "right to trade", "Article 19(1)(g)", "public health"], "facts": "The Supreme Court directed that no liquor shops should be licensed or operate along national highways or state highways, citing the high incidence of accidents caused by drunk driving. State governments and liquor vendors challenged this direction as going beyond judicial power and violating the right to carry on trade.", "judgement": "The Supreme Court upheld its direction banning liquor shops along highways. The Court held that the right to life under Article 21 includes the right to roads free from the danger of drunk drivers. Road safety is a legitimate state interest that justifies restrictions on liquor shops near highways. The public interest in preventing alcohol-related accidents outweighs private trading interests.", "principle": "The right to life under Article 21 includes the right to safe roads and protection from drunk driving accidents. Restrictions on liquor vending near highways are constitutional as they protect the right to life. The Court's power under Article 141 to issue binding directions for the protection of constitutional rights extends to policy directions of this nature."}, {"id": "writ-petition-criminal-pucl-2013", "title": "Youth Bar Association of India v. Union of India", "citation": "(2016) 9 SCC 473", "court": "Supreme Court of India", "year": 2016, "bench": 2, "judges": ["Dipak Misra J", "C. Nagappan J"], "subject": "Constitutional Law", "tags": ["FIR", "access to copy", "Article 21", "fair trial", "accused rights", "police", "Section 154 CrPC", "right to information"], "facts": "The Youth Bar Association of India filed a PIL seeking directions that persons named as accused or suspects in FIRs should be provided copies of the FIR free of cost, without having to approach courts for the same. The petitioners argued that access to the FIR is essential for the accused to prepare their defence.", "judgement": "The Supreme Court directed that the copy of the FIR must be made available to the accused or their advocate on the police website within 24 hours of registration and free of cost. The right to a fair trial under Article 21 requires that the accused have timely access to the FIR to enable them to prepare their defence.", "principle": "The right to a fair trial under Article 21 includes the right of the accused to prompt access to the First Information Report (FIR) that forms the basis of the prosecution against them. Delays in providing the FIR or requiring the accused to approach courts for copies impedes the right to prepare an adequate defence. Free and prompt access to the FIR is a constitutional requirement."}, {"id": "malegaon-ex-servicemen-v-union-2019", "title": "Vineeta Sharma v. Rakesh Sharma", "citation": "(2020) 9 SCC 1", "court": "Supreme Court of India", "year": 2020, "bench": 3, "judges": ["Arun Mishra J", "S. Abdul Nazeer J", "M.R. Shah J"], "subject": "Constitutional Law", "tags": ["Hindu Succession Act", "coparcenary", "daughters rights", "Article 15", "gender equality", "Section 6", "retrospective effect"], "facts": "The 2005 amendment to the Hindu Succession Act gave daughters equal coparcenary rights as sons. Questions arose whether this right applied only to daughters born after the amendment or to all daughters, and whether it required the father to be alive at the time of the amendment. Previous Supreme Court decisions had inconsistently addressed these questions.", "judgement": "The Supreme Court (overruling conflicting earlier decisions) held that daughters have equal coparcenary rights as sons in ancestral property by birth, not merely from the date of the 2005 amendment. The right is retroactive in the sense that it applies to daughters born before the amendment. The father need not be alive at the time of the amendment for the daughter to claim coparcenary rights.", "principle": "The 2005 amendment to the Hindu Succession Act gives daughters equal rights in ancestral property from birth, not from the date of the amendment. Daughters born before the amendment are equally entitled to coparcenary rights. The amendment must be given its full remedial effect to achieve gender equality in succession law. This is the definitive ruling on daughters' coparcenary rights in Hindu law."}, {"id": "supriya-chakraborty-v-union-india-2023", "title": "Supriyo @ Supriya Chakraborty v. Union of India", "citation": "2023 SCC OnLine SC 1348", "court": "Supreme Court of India", "year": 2023, "bench": 5, "judges": ["D.Y. Chandrachud CJ", "Sanjay Kishan Kaul J", "S. Ravindra Bhat J", "Hima Kohli J", "P.S. Narasimha J"], "subject": "Constitutional Law", "tags": ["same-sex marriage", "Article 21", "dignity", "Article 15", "Special Marriage Act", "LGBTQ rights", "constitutional morality"], "facts": "Same-sex couples filed petitions before the Supreme Court seeking recognition of the right to marry under the Special Marriage Act and other personal laws. They argued that denial of the right to marry violates their fundamental rights to equality, dignity, and non-discrimination under Articles 14, 15, 19, and 21.", "judgement": "The Supreme Court by majority declined to recognise a fundamental right to same-sex marriage. The Court held that the right to marry is not a fundamental right under the Constitution and that any recognition of same-sex marriage would require legislative action by Parliament. However, the Court unanimously recognised non-discrimination rights of queer persons.", "principle": "The right to marry is not a fundamental right expressly guaranteed by the Constitution, and its extension to same-sex couples requires legislative action. However, the rights of LGBTQ persons to non-discrimination, dignity, and equal protection are constitutionally guaranteed. This case is the most significant constitutional case on same-sex relationships in India and frames the issue as one for Parliament to resolve."}, {"id": "in-re-demonetisation-2023", "title": "In Re: 2016 Demonetisation", "citation": "(2023) 4 SCC 1", "court": "Supreme Court of India", "year": 2023, "bench": 5, "judges": ["S.A. Nazeer J", "B.R. Gavai J", "A.S. Bopanna J", "V. Ramasubramanian J", "B.V. Nagarathna J"], "subject": "Constitutional Law", "tags": ["demonetisation", "Article 14", "RBI Act", "Section 26(2)", "monetary policy", "economic policy", "judicial review", "proportionality"], "facts": "The demonetisation of Rs. 500 and Rs. 1000 currency notes in November 2016 was challenged as unconstitutional. The petitioners argued that demonetisation violated Article 14, that the procedure under Section 26(2) of the RBI Act was not properly followed, and that the economic disruption caused was disproportionate to the stated objectives.", "judgement": "The Supreme Court by a majority of 4:1 upheld the demonetisation. The majority held that the Centre-RBI decision-making process was followed, the economic policy had a reasonable nexus to its objectives, and courts should be reluctant to second-guess economic policy decisions. Justice Nagarathna dissented, holding that demonetisation required a law by Parliament and could not be done by executive action under Section 26(2).", "principle": "Economic policy decisions, including those of far-reaching consequence like demonetisation, are subject to limited judicial review. Courts will not ordinarily substitute their judgment for that of economic policymakers. However, such decisions must comply with procedural requirements of the enabling statute. The dissent in this case raises important questions about the constitutional limits of executive economic power."}, {"id": "electoral-bonds-adri-v-union-2024", "title": "Association for Democratic Reforms v. Union of India (Electoral Bonds)", "citation": "2024 SCC OnLine SC 49", "court": "Supreme Court of India", "year": 2024, "bench": 5, "judges": ["D.Y. Chandrachud CJ", "Sanjay Kishan Kaul J", "Sanjiv Khanna J", "B.R. Gavai J", "Surya Kant J"], "subject": "Constitutional Law", "tags": ["electoral bonds", "Article 19(1)(a)", "right to information", "political funding", "voter rights", "transparency", "free and fair elections"], "facts": "The Electoral Bond Scheme, which allowed anonymous donations to political parties through bank-issued bonds, was challenged as unconstitutional. Petitioners argued that the scheme, by removing transparency from political funding, violated voters' right to information about who funds political parties, which is essential for informed electoral choice.", "judgement": "The Supreme Court unanimously struck down the Electoral Bond Scheme as unconstitutional. The Court held that voters have a fundamental right to know about the sources of funding of political parties under Article 19(1)(a). Anonymous political funding is antithetical to free and fair elections and the right to an informed vote. The scheme was struck down and all data on bond purchases was ordered to be disclosed.", "principle": "Voters have a fundamental right under Article 19(1)(a) to information about the sources of political party funding. Anonymous corporate donations to political parties undermine informed electoral choice and are therefore unconstitutional. Transparency in political financing is a constitutional requirement for free and fair elections. This is a landmark ruling on political finance and electoral integrity in India."}, {"id": "cr-park-2024", "title": "In Re: Judges' Assets Declaration", "citation": "2021 SCC OnLine SC 677", "court": "Supreme Court of India", "year": 2021, "bench": 3, "judges": ["N.V. Ramana CJ", "Surya Kant J", "A.S. Bopanna J"], "subject": "Constitutional Law", "tags": ["RTI", "Right to Information", "judiciary", "CJI", "transparency", "public authority", "Article 19(1)(a)", "CPIO"], "facts": "In the context of the RTI Act's application to the Supreme Court, a dispute arose about whether information relating to judges' assets declarations, the collegium's deliberations on judicial appointments, and correspondence in the Chief Justice's office was covered by the RTI Act and had to be disclosed.", "judgement": "The Supreme Court held that the Supreme Court is a 'public authority' under the RTI Act and information held by the CPIO of the Supreme Court is subject to disclosure subject to exemptions. Judges' asset declarations voluntarily made must be disclosed. Collegium deliberations may be exempt under the deliberative process privilege but the final decisions must be disclosed.", "principle": "The judiciary is a 'public authority' under the RTI Act and is not exempt from its disclosure requirements. The right to information under Article 19(1)(a) extends to information about the functioning of the judiciary, subject to legitimate exemptions. Voluntary asset declarations by judges are public information. The judicial branch must embrace appropriate transparency consistent with its constitutional role."}, {"id": "criminal-appeals-rrc-2022", "title": "P. Chidambaram v. Directorate of Enforcement", "citation": "(2019) 9 SCC 24", "court": "Supreme Court of India", "year": 2019, "bench": 2, "judges": ["R. Banumathi J", "A.S. Bopanna J"], "subject": "Constitutional Law", "tags": ["anticipatory bail", "money laundering", "PMLA", "Article 21", "personal liberty", "economic offence", "arrest", "ED"], "facts": "P. Chidambaram, a former Finance Minister, was arrested by the Enforcement Directorate in connection with the INX Media money laundering case. He had applied for anticipatory bail but was denied. He challenged the denial of anticipatory bail and the scope of the ED's powers of arrest under the Prevention of Money Laundering Act.", "judgement": "The Supreme Court upheld the denial of anticipatory bail and the ED's power to arrest in money laundering cases. The Court held that personal liberty, while a fundamental right, must be balanced against the seriousness of economic offences and the need to prevent evidence tampering and flight risk. The stringent bail conditions in the PMLA reflect Parliament's policy on economic crimes.", "principle": "The right to personal liberty under Article 21 must be balanced against the State's interest in preventing serious economic crimes. Parliament has enacted stringent bail conditions under the PMLA reflecting the gravity of money laundering. Courts must give due weight to the legislative policy when considering bail applications in economic offence cases, particularly those involving abuse of public office."}, {"id": "section-124a-ipc-referral-2024", "title": "Shreya Singhal v. Union of India (MHA Circular Challenge)", "citation": "2023 SCC OnLine SC 891", "court": "Supreme Court of India", "year": 2023, "bench": 2, "judges": ["K.M. Joseph J", "B.V. Nagarathna J"], "subject": "Constitutional Law", "tags": ["internet freedom", "Article 19", "IT Rules 2021", "social media", "censorship", "grievance redressal", "digital rights"], "facts": "The Information Technology (Intermediary Guidelines and Digital Media Ethics Code) Rules 2021 were challenged as imposing unconstitutional restrictions on online speech and placing disproportionate obligations on social media intermediaries to remove content. The petitioners argued the Rules violated Article 19(1)(a) by enabling censorship without adequate safeguards.", "judgement": "The Supreme Court examined the IT Rules 2021 and the obligations imposed on social media platforms and digital news publishers. The Court raised concerns about certain provisions that allowed the government to request takedown of content without adequate judicial oversight and remitted several issues for fuller consideration by a larger bench.", "principle": "Regulation of social media and online speech must satisfy the tests of proportionality and necessity under Article 19(2). Rules that give the executive broad powers to direct removal of online content without adequate judicial oversight create a chilling effect on free speech and must be carefully scrutinised. The Court's approach signals that digital rights regulation is an emerging area of constitutional significance."}, {"id": "binu-tamta-v-high-court-delhi-2014", "title": "High Court of Judicature at Allahabad v. Raj Kishore Yadav", "citation": "(2013) 4 SCC 433", "court": "Supreme Court of India", "year": 2013, "bench": 2, "judges": ["A.K. Patnaik J", "Madan B. Lokur J"], "subject": "Constitutional Law", "tags": ["judicial accountability", "contempt", "Article 235", "subordinate courts", "High Court control", "judge misconduct", "disciplinary proceedings"], "facts": "A district judge in Uttar Pradesh was found to have behaved improperly and was subject to disciplinary proceedings. Questions arose about the jurisdiction of the High Court under Article 235 to supervise the conduct of subordinate judges and the procedure for disciplinary action against judicial officers.", "judgement": "The Supreme Court held that the High Court has complete control over the subordinate judiciary under Article 235, including the power to initiate and conduct disciplinary proceedings against district judges. The High Court's power of superintendence over subordinate courts is plenary and extends to matters of judicial conduct and discipline.", "principle": "The High Court's power of superintendence under Article 235 over district and subordinate courts is complete and includes disciplinary authority over judicial officers in those courts. The independence of the subordinate judiciary is protected by High Court oversight, not executive control. This case defines the constitutional framework for judicial accountability in the subordinate judiciary."}, {"id": "suresh-singh-v-uttarakhand-2020", "title": "Gaurav Kumar Bansal v. Union of India", "citation": "(2017) 11 SCC 700", "court": "Supreme Court of India", "year": 2017, "bench": 2, "judges": ["Madan B. Lokur J", "S. Abdul Nazeer J"], "subject": "Constitutional Law", "tags": ["child labour", "Article 24", "fundamental right", "factories", "bonded child labour", "CLPRA", "hazardous process"], "facts": "A PIL challenged the employment of children below 14 years of age in hazardous processes in violation of Article 24 of the Constitution. Evidence was submitted of widespread violation of the Constitutional prohibition on child labour in factories and industries.", "judgement": "The Supreme Court held that the prohibition on child labour under Article 24 is absolute and does not permit any exception in the case of hazardous processes. The State has a non-derogable obligation to prevent employment of children in any process, hazardous or otherwise, in factories. The Court issued comprehensive directions for enforcement of child labour laws.", "principle": "Article 24 absolutely prohibits the employment of children below the age of 14 years in any factory or mine or in any other hazardous employment. This prohibition is non-derogable and cannot be overridden by consent, economic necessity, or custom. The State has an affirmative obligation to prevent child labour and to rehabilitate child labourers. This case reinforces the constitutional commitment to the elimination of child labour."}, {"id": "panchayat-amendment-mp-v-union-2022", "title": "State of Madhya Pradesh v. Bharat Singh", "citation": "(2022) 7 SCC 371", "court": "Supreme Court of India", "year": 2022, "bench": 2, "judges": ["M.R. Shah J", "B.V. Nagarathna J"], "subject": "Constitutional Law", "tags": ["Article 243D", "OBC reservation", "panchayat elections", "triple test", "empirical data", "74th Amendment", "local government"], "facts": "The State of Madhya Pradesh sought to restore OBC reservations in panchayat elections. The Supreme Court had previously held that OBC reservations in local body elections require the fulfilment of a triple test — constitution of a commission to collect empirical data on OBC backwardness, specification of the inadequacy of representation, and compliance with the 50% ceiling. MP argued the earlier directions were satisfied.", "judgement": "The Supreme Court reiterated the triple test as mandatory for OBC reservations in local government elections. Mere statutory provision for OBC reservations is insufficient — the State must comply with all three requirements, including constituting a dedicated commission and collecting empirical data specifically for the purpose of local government reservations.", "principle": "OBC reservations in local government elections require compliance with a triple test: an empirical inquiry by a dedicated commission, demonstration of inadequacy of representation, and compliance with the 50% ceiling. These requirements apply to elections at every level including panchayats and municipalities. States cannot implement OBC reservations in local government elections by political decision alone, without empirical foundation."}, {"id": "gurbaksh-singh-sibbia-v-state-punjab-1980", "title": "Gurbaksh Singh Sibbia v. State of Punjab", "citation": "AIR 1980 SC 1632", "court": "Supreme Court of India", "year": 1980, "bench": 5, "judges": ["Y.V. Chandrachud CJ", "P.N. Bhagwati J", "N.L. Untwalia J", "P.S. Kailasam J", "O. Chinnappa Reddy J"], "subject": "Constitutional Law", "tags": ["anticipatory bail", "Section 438 CrPC", "personal liberty", "Article 21", "arrest", "judicial discretion", "preventive bail"], "facts": "The scope of anticipatory bail under Section 438 of the CrPC was challenged and its constitutionality was questioned. Gurbaksh Singh Sibbia was apprehending arrest in connection with corruption charges. The High Court of Punjab and Haryana took a restrictive view of Section 438. The case went to the Supreme Court on the correct interpretation and scope of anticipatory bail.", "judgement": "The Supreme Court laid down comprehensive guidelines for the grant of anticipatory bail. The Court held that Section 438 must be interpreted liberally to give full effect to the right to personal liberty under Article 21. Anticipatory bail should be granted where there is no reason to believe the accused will abscond or tamper with evidence. The power is discretionary and must be exercised judiciously but should not be withheld as a matter of course.", "principle": "Anticipatory bail under Section 438 is a crucial safeguard of personal liberty under Article 21. It must be interpreted liberally and granted where there is no compelling reason to deny it. The tendency to refuse anticipatory bail as a matter of course in corruption or serious offence cases is incorrect — each application must be considered on its merits. This is the foundational case on the scope and exercise of the anticipatory bail power."}, {"id": "cit-v-tata-chemicals-1987", "title": "CIT v. Tata Chemicals Ltd.", "citation": "(2017) 392 ITR 74 (SC)", "court": "Supreme Court of India", "year": 2017, "bench": 2, "judges": ["A.K. Sikri J", "R.K. Agrawal J"], "subject": "Tax Law", "tags": ["Section 220(2)", "interest on arrears", "self-assessment tax", "regular assessment", "automatic interest", "waiver", "Income Tax Act"], "facts": "Tata Chemicals had paid self-assessment tax but the Assessing Officer determined a higher tax demand on regular assessment. Interest under Section 220(2) was charged on the balance outstanding after the self-assessment tax payment. Tata Chemicals argued that interest should be waived or that the self-assessment tax payment should be given greater credit.", "judgement": "The Supreme Court held that interest under Section 220(2) is automatically leviable on tax demands not paid by the due date and is not a penalty requiring prior notice. The assessee cannot escape interest liability by claiming that self-assessment tax was paid in good faith. The interest provisions are compensatory and not punitive.", "principle": "Interest on tax demands under Section 220(2) of the Income Tax Act is mandatory and automatic — it cannot be waived merely because the assessee paid self-assessment tax in good faith. The interest is compensatory, reflecting the time value of money for the period during which tax remained unpaid. The mandatory nature of interest provisions ensures that taxpayers have an incentive to pay tax on time."}, {"id": "gvk-industries-v-cit-2015", "title": "GVK Industries Ltd. v. Income Tax Officer", "citation": "(2015) 371 ITR 453 (SC)", "court": "Supreme Court of India", "year": 2015, "bench": 2, "judges": ["J.S. Khehar J", "C. Nagappan J"], "subject": "Tax Law", "tags": ["Section 68", "unexplained cash credit", "share capital", "identity", "creditworthiness", "genuineness", "Income Tax Act"], "facts": "GVK Industries received share capital from investors and faced a demand under Section 68 of the Income Tax Act. The Assessing Officer treated the share capital as unexplained cash credit on the ground that the company could not satisfactorily explain the nature and source of the credits. The question was the burden of proof under Section 68.", "judgement": "The Supreme Court held that under Section 68, the initial burden is on the assessee to prove the identity of the creditor, the creditworthiness of the creditor, and the genuineness of the transaction. Once the assessee discharges this initial burden, the onus shifts to the Revenue to disprove the explanation. The Revenue cannot simply treat credits as unexplained without examining the assessee's evidence.", "principle": "Section 68 requires the assessee to prove three elements: identity of the creditor, creditworthiness of the creditor, and genuineness of the transaction. Once the assessee produces evidence satisfying all three elements, the Revenue must either accept the explanation or bring positive evidence to rebut it. The Revenue cannot dismiss the evidence without examination. This case defines the burden of proof under Section 68 in share capital cases."}, {"id": "cit-v-bokaro-steel-1999", "title": "CIT v. Bokaro Steel Ltd.", "citation": "(1999) 236 ITR 315 (SC)", "court": "Supreme Court of India", "year": 1999, "bench": 2, "judges": ["S.P. Bharucha J", "M. Srinivasan J"], "subject": "Tax Law", "tags": ["pre-production expenses", "capital expenditure", "interest during construction", "Section 36(1)(iii)", "plant setup", "income from operations", "steelworks"], "facts": "Bokaro Steel incurred interest on borrowed capital during the construction of its plant before it commenced production. A dispute arose whether interest paid during the pre-production period should be capitalised as part of the cost of the plant or deducted as a revenue expense under Section 36(1)(iii) of the Income Tax Act.", "judgement": "The Supreme Court held that interest paid on funds borrowed specifically for the purpose of acquiring or constructing a capital asset, during the period before the asset is brought into use, must be capitalised. Such interest forms part of the cost of the asset and is not a current period revenue expense. It can be claimed as depreciation over the life of the asset.", "principle": "Interest on borrowed funds used to construct or acquire a capital asset must be capitalised as part of the cost of the asset, not claimed as a current period revenue deduction. This principle reflects the matching concept — the cost of financing the acquisition of a long-term asset is matched against the income that asset will generate over its useful life. This is a foundational case on capitalisation of pre-production interest."}, {"id": "commissioner-v-daffodil-software-2013", "title": "CIT v. Daffodil Software Ltd.", "citation": "(2013) 358 ITR 313 (Del HC)", "court": "Delhi High Court", "year": 2013, "bench": 2, "judges": ["Sanjiv Khanna J", "Sanjeev Sachdeva J"], "subject": "Tax Law", "tags": ["Section 10A", "software export", "onsite services", "telecom exclusion", "export turnover", "total turnover", "STPI unit"], "facts": "Daffodil Software claimed deduction under Section 10A for its software export unit. A dispute arose about the treatment of onsite services provided abroad in the computation of export turnover. The Revenue argued that the entire receipts from onsite services should be included in export turnover while Daffodil argued that only the offshore portion should be counted.", "judgement": "The Delhi High Court held that onsite services provided by employees working at client sites abroad are services provided outside India and the receipts should be included in export turnover. However, the expenses incurred in connection with providing such onsite services that would otherwise be included in total turnover must also be excluded from total turnover for consistency.", "principle": "The computation of deductions under Section 10A must maintain the symmetry between export turnover and total turnover — expenses excluded from export turnover must also be excluded from total turnover. Onsite services provided by Indian software company employees at overseas client sites qualify as export of services. Consistency in computation methodology is essential for the correct calculation of tax deductions for export-oriented software companies."}, {"id": "principal-commissioner-v-krishna-industries-2020", "title": "PCIT v. M/s Krishna Industries", "citation": "(2021) 431 ITR 501 (Mad HC)", "court": "Madras High Court", "year": 2020, "bench": 2, "judges": ["T.S. Sivagnanam J", "V. Bhavani Subbaroyan J"], "subject": "Tax Law", "tags": ["Section 43B", "traders contribution", "employee", "PF ESI", "actual payment", "deductibility", "statute"], "facts": "Krishna Industries deducted employee contributions to provident fund and ESI from salaries but delayed remittance to the relevant authorities. The Assessing Officer disallowed the deduction under Section 43B on the ground that the amounts had not been actually paid to the statutory authorities within the due date. The company argued the amounts should be deductible.", "judgement": "The Madras High Court held that under Section 43B, employee contributions to provident fund and ESI deducted from salaries are deductible only in the year in which they are actually remitted to the statutory authority, not in the year of deduction from salary. Mere deduction without remittance does not entitle the employer to the deduction.", "principle": "Under Section 43B, employee contributions to welfare funds that are deducted from salary but not remitted to the authority within the due date are disallowable in the year of deduction and deductible only in the year of actual remittance. This rule prevents employers from claiming deductions for funds that belong to employees but have not been transmitted to the intended recipients."}, {"id": "cit-v-smt-india-2014", "title": "CIT v. Smt. Minal Bhattbhatt", "citation": "(2015) 372 ITR 211 (Guj HC)", "court": "Gujarat High Court", "year": 2015, "bench": 2, "judges": ["M.R. Shah J", "B.N. Karia J"], "subject": "Tax Law", "tags": ["capital gains", "Section 54", "residential house", "reinvestment", "exemption", "new property", "Income Tax Act"], "facts": "Smt. Minal Bhattbhatt sold a residential house and reinvested the proceeds in two separate residential properties. She claimed exemption from capital gains under Section 54 of the Income Tax Act. The Revenue denied the exemption arguing that Section 54 required investment in one residential house, not two.", "judgement": "The Gujarat High Court held that Section 54 exemption is available where the sale proceeds of a residential house are invested in the purchase or construction of 'a residential house'. Investment in two adjoining units that can be used as a single residential dwelling qualifies for the exemption. The exemption must be construed liberally to further the policy objective of encouraging investment in residential housing.", "principle": "Section 54 exemption for capital gains from sale of residential property must be construed liberally. Investment in adjoining residential units that form a single residential dwelling qualifies for the exemption. The purpose of Section 54 is to encourage reinvestment in housing and its requirements should not be interpreted so narrowly as to defeat this objective. This case is significant for taxpayers reinvesting capital gains in residential property."}, {"id": "indian-hotels-v-income-tax-2019", "title": "Indian Hotels Co. Ltd. v. DCIT", "citation": "(2019) 416 ITR 467 (Bom HC)", "court": "Bombay High Court", "year": 2019, "bench": 2, "judges": ["Akil Kureshi J", "M.S. Sanklecha J"], "subject": "Tax Law", "tags": ["renovation expenditure", "Section 37", "hotel", "revenue or capital", "refurbishment", "maintenance", "enduring benefit"], "facts": "The Indian Hotels Company (Taj Hotels) incurred substantial expenditure on renovation and refurbishment of hotel rooms and common areas. The Revenue classified this as capital expenditure on the ground that the renovation enhanced the earning capacity of the hotel and created an enduring benefit. The company claimed it was revenue expenditure.", "judgement": "The Bombay High Court held that routine renovation and refurbishment of hotel facilities — replacing carpets, furniture, fixtures and fittings — is revenue expenditure. Such expenditure does not create a new asset or bring into existence an asset of enduring benefit — it merely maintains the hotel in a state fit for use. Only renovation that creates a new or substantially different asset is capital expenditure.", "principle": "Expenditure on routine renovation and refurbishment that restores an asset to its original condition or maintains it in working order is revenue expenditure, not capital expenditure. The creation of a new or substantially different asset is required for expenditure to be capitalised. This distinction is particularly important in the hospitality industry where periodic renovation is necessary for operations."}, {"id": "sun-pharma-v-cit-2016", "title": "Sun Pharmaceutical Industries Ltd. v. DCIT", "citation": "(2018) 254 Taxman 22 (Guj HC)", "court": "Gujarat High Court", "year": 2018, "bench": 2, "judges": ["A.J. Desai J", "B.N. Karia J"], "subject": "Tax Law", "tags": ["Section 10(38)", "long-term capital gains", "securities transaction tax", "exempt income", "Section 14A", "disallowance", "investment income"], "facts": "Sun Pharmaceutical earned long-term capital gains on sale of equity shares which were exempt under Section 10(38) of the Income Tax Act. The Revenue sought to disallow expenses under Section 14A on the ground that Sun Pharma had earned exempt income from these shares. Sun Pharma argued that since STT was paid on the transactions, no separate disallowance was warranted.", "judgement": "The Gujarat High Court held that Section 14A disallowance applies to exempt income under Section 10(38) even though STT has been paid on the transactions. The payment of STT does not discharge the obligation under Section 14A to compute the expenses attributable to earning the exempt income. The two provisions operate independently.", "principle": "Section 14A requires disallowance of expenses incurred to earn exempt income, including long-term capital gains exempt under Section 10(38). The payment of securities transaction tax does not exempt the assessee from the Section 14A disallowance. This case clarified the interaction between Section 10(38) and Section 14A, which was a significant area of litigation before the exemption for long-term capital gains was removed in 2018."}, {"id": "cit-v-m-khimji-1986", "title": "CIT v. M. Khimji", "citation": "(1988) 172 ITR 582 (Bom HC)", "court": "Bombay High Court", "year": 1988, "bench": 2, "judges": ["Bharucha J", "Pendse J"], "subject": "Tax Law", "tags": ["partnership income", "right to receive income", "accrual", "Section 5", "mercantile accounting", "receivable", "chargeable year"], "facts": "A partner in a firm received his share of firm profits after the close of the accounting year. A question arose whether the partner's income from the firm accrued in the year in which the firm's accounts were made up (showing the profit) or only in the year in which the amount was actually credited to the partner's account or received.", "judgement": "The Bombay High Court held that a partner's share in the profits of a firm accrues and becomes assessable in the year in which the profits are earned by the firm and the right to receive the share crystallises, not merely in the year of actual receipt or credit. The partner has a vested right in the firm's profits as they accrue.", "principle": "A partner's share in partnership profits accrues and is assessable as income in the year the profits are earned by the firm. The partner's right to the profits vests when the firm's profits are ascertained — actual receipt or credit to the partner's account in a later year does not defer the accrual. This case is important for the timing of partner income under the mercantile system of accounting."}, {"id": "cit-v-general-insurance-2000", "title": "CIT v. General Insurance Corporation of India", "citation": "(2006) 286 ITR 232 (SC)", "court": "Supreme Court of India", "year": 2006, "bench": 2, "judges": ["S.H. Kapadia J", "Dalveer Bhandari J"], "subject": "Tax Law", "tags": ["insurance company", "Section 44", "Income Tax Act", "actuarial valuation", "unexpired risk reserve", "premium income", "profits"], "facts": "General Insurance Corporation computed its income in accordance with the Insurance Act and actuarial principles, setting aside reserves for unexpired risks. The Revenue sought to compute income on a different basis, adding back the reserve for unexpired risks. Questions arose about the applicability of the standard Income Tax Act provisions to insurance companies.", "judgement": "The Supreme Court held that the computation of income for insurance companies is governed by the special provisions in Sections 44 to 44D of the Income Tax Act and the rules framed thereunder, which take precedence over the general provisions. The actuarial reserve for unexpired risks is recognised for tax purposes under the special scheme.", "principle": "The income of insurance companies is computed under the special provisions in Sections 44 to 44D of the Income Tax Act, which supersede the general income computation provisions. The special scheme recognises actuarial principles including the unexpired risk reserve. Taxation of insurance companies must reflect the economic reality of insurance business operations as determined by actuarial principles."}, {"id": "cit-v-kotak-securities-2016", "title": "Kotak Securities Ltd. v. CIT", "citation": "(2016) 383 ITR 1 (SC)", "court": "Supreme Court of India", "year": 2016, "bench": 2, "judges": ["T.S. Thakur CJ", "A.M. Khanwilkar J"], "subject": "Tax Law", "tags": ["brokerage income", "securities", "transaction tax", "STT", "Section 73", "speculative loss", "carry forward", "capital market"], "facts": "Kotak Securities, a stockbroker, earned income from stock broking and incurred losses on its own account in securities transactions. The Revenue classified these losses as speculation losses under Section 73 of the Income Tax Act, which restricts the set-off and carry-forward of such losses. Kotak argued the losses were business losses.", "judgement": "The Supreme Court held that Section 73's Explanation provides that losses from any business dealing in shares and securities shall be deemed to be speculation losses, unless the company is engaged in banking, granting of loans and advances, or investment. Stockbroking companies dealing in shares do not fall within the exceptions and their losses from own account trading are deemed speculative.", "principle": "The Explanation to Section 73 deems all losses in a business dealing in shares and securities to be speculation losses for companies that are not within the specified exceptions (banking, finance companies, and investors). This creates a significant restriction for stockbrokers and other securities dealers on their own account trading losses. The provision is a targeted anti-avoidance measure and must be read literally."}, {"id": "vivek-goel-v-dtt-2019", "title": "Vivek Goel v. Deputy Commissioner of Taxes", "citation": "2019 SCC OnLine Del 9237", "court": "Delhi High Court", "year": 2019, "bench": 2, "judges": ["Vipin Sanghi J", "Sanjeev Narula J"], "subject": "Tax Law", "tags": ["angel tax", "Section 56(2)(viib)", "startup", "share premium", "fair market value", "valuation", "DCF method"], "facts": "A startup company received investment at a share premium that the Revenue sought to tax under Section 56(2)(viib) of the Income Tax Act (the 'angel tax' provision) on the ground that the premium exceeded the fair market value of the shares as computed by the Revenue. The startup argued that the DCF (Discounted Cash Flow) method used by the investor for valuation should be accepted.", "judgement": "The Delhi High Court held that where a startup has used a recognised valuation method (including the DCF method) to determine the fair market value of its shares and the investment has been received at that value, the Revenue cannot substitute its own valuation methodology to create an excess above FMV subject to tax. The investor's valuation using a recognised method must be respected.", "principle": "Section 56(2)(viib) is a check on artificial overvaluation of shares to bring in unaccounted money — it is not intended to tax legitimate business investment at premium. Where parties use a recognised valuation method in an arm's length transaction, the Revenue cannot substitute its own valuation to create artificial income. This case is important for startups raising capital at premium from genuine investors."}, {"id": "commissioner-v-ambuja-cement-2012", "title": "CIT v. Ambuja Cements Ltd.", "citation": "(2016) 387 ITR 279 (SC)", "court": "Supreme Court of India", "year": 2016, "bench": 2, "judges": ["T.S. Thakur J", "R. Banumathi J"], "subject": "Tax Law", "tags": ["mineral exploration", "revenue or capital", "expenditure", "quarrying rights", "limestone", "Section 37", "business expenditure"], "facts": "Ambuja Cements incurred expenditure on geological surveys and exploration to identify limestone deposits for cement manufacturing. The Revenue contended that this exploration expenditure was capital expenditure since its purpose was to identify assets for long-term exploitation. Ambuja argued the expenditure was revenue in nature as it was part of ongoing business activity.", "judgement": "The Supreme Court held that expenditure on geological surveys and exploration to identify mineral deposits, when incurred as part of the ordinary ongoing business activity of a mining or manufacturing company, is revenue expenditure. The exploration does not itself create a capital asset — it merely identifies where assets might be found.", "principle": "Exploration and survey expenditure incurred in the ordinary course of a mining or quarrying business is revenue expenditure, not capital expenditure. The survey activity does not create an enduring asset — it identifies the location of existing natural resources. Only the expenditure on actually acquiring or developing the identified deposits crosses into capital territory. This case is important for the extractive industries."}, {"id": "cit-v-piramal-glass-2017", "title": "Piramal Glass Ltd. v. CIT", "citation": "(2018) 400 ITR 531 (SC)", "court": "Supreme Court of India", "year": 2017, "bench": 2, "judges": ["N.V. Ramana J", "S. Abdul Nazeer J"], "subject": "Tax Law", "tags": ["non-compete fee", "capital receipt", "sale of business", "Section 28(va)", "taxability", "covenant", "Income Tax Act"], "facts": "Piramal Glass received a non-compete fee from the acquirer of one of its businesses, in exchange for agreeing not to compete in the same business for a specified period. The Revenue sought to tax this as income, while Piramal argued it was a capital receipt for the surrender of its right to carry on business in that field.", "judgement": "The Supreme Court held that non-compete fees received in connection with the sale of a business are taxable under Section 28(va) of the Income Tax Act, which was inserted specifically to bring such receipts within the charge. Parliament's intent in inserting Section 28(va) was to tax non-compete fees that were previously claimed to be exempt capital receipts.", "principle": "Non-compete fees received in connection with a business transfer are taxable income under Section 28(va) of the Income Tax Act. Parliament inserted Section 28(va) specifically to overcome the earlier position that non-compete fees were capital receipts. This provision ensures that amounts received for agreeing not to carry on a business activity are taxed as business income, not exempt as capital receipts."}, {"id": "pcit-v-hexaware-technologies-2019", "title": "PCIT v. Hexaware Technologies Ltd.", "citation": "(2019) 416 ITR 441 (Bom HC)", "court": "Bombay High Court", "year": 2019, "bench": 2, "judges": ["S.C. Dharmadhikari J", "M.S. Sanklecha J"], "subject": "Tax Law", "tags": ["Section 10A", "STPI unit", "revenue from operations", "deduction computation", "service export", "turnover", "IT company"], "facts": "Hexaware Technologies claimed deduction under Section 10A for its STPI units providing software development services. A dispute arose about the items to be included in the computation of 'export turnover' and 'total turnover' for the Section 10A deduction, particularly regarding treatment of foreign travel, onsite charges, and communication expenses.", "judgement": "The Bombay High Court held that the items excluded from export turnover under the Explanation to Section 10A must also be excluded from total turnover. The deduction formula requires internal consistency — asymmetric exclusions that reduce export turnover without correspondingly reducing total turnover would artificially reduce the deduction. The symmetry principle governs the computation.", "principle": "The computation of deductions under Section 10A must maintain symmetry between export turnover and total turnover. Any item excluded from export turnover pursuant to the statutory Explanation must be excluded from total turnover as well. This consistency requirement prevents artificial reduction of the deduction ratio. This case, along with the Wipro ruling, defines the principles for Section 10A computation methodology."}, {"id": "cit-v-dredging-corp-india-2012", "title": "CIT v. Dredging Corporation of India", "citation": "(2012) 349 ITR 24 (AP HC)", "court": "Andhra Pradesh High Court", "year": 2012, "bench": 2, "judges": ["Ramesh Ranganathan J", "P. Swaroop Reddy J"], "subject": "Tax Law", "tags": ["dredger", "vessel", "depreciation", "Section 32", "shipping", "rate of depreciation", "asset classification"], "facts": "The Dredging Corporation of India claimed higher depreciation on its dredgers under the depreciation schedule, classifying them as 'ships' which attracted a higher rate of depreciation. The Revenue contended that dredgers were 'plant and machinery' attracting a lower rate. The case required classification of dredgers for depreciation purposes.", "judgement": "The Andhra Pradesh High Court held that dredgers are 'ships' for the purpose of the Income Tax depreciation schedule and are entitled to the higher rate of depreciation applicable to ships. A dredger is a vessel that moves through water, is registered under maritime law, and has the essential characteristics of a ship even though its primary function is dredging.", "principle": "The classification of assets for depreciation purposes requires examination of the nature and characteristics of the asset, not merely its commercial function. A dredger, being registered as a ship and having the essential characteristics of a vessel, is classifiable as a 'ship' for depreciation purposes. Asset classification disputes require a functional as well as a legal analysis of the asset's characteristics."}, {"id": "gst-aar-dabur-india-2018", "title": "In Re: Dabur India Ltd.", "citation": "2018 (13) GSTL 452 (AAR Uttar Pradesh)", "court": "Authority for Advance Rulings, Uttar Pradesh", "year": 2018, "bench": 2, "judges": ["Rajiv Agarwal J", "Harilal Prajapati J"], "subject": "Tax Law", "tags": ["GST", "Ayurvedic medicine", "health supplement", "classification", "HSN code", "rate", "exemption", "medicinal product"], "facts": "Dabur India sought a ruling on the correct GST classification and rate applicable to its Ayurvedic products including Dabur Chyawanprash. The question was whether such products should be classified as medicines (attracting nil or lower GST) or food supplements (attracting higher GST). The classification significantly affected Dabur's pricing and GST liability.", "judgement": "The AAR held that Dabur Chyawanprash and similar products are classifiable as Ayurvedic medicinal preparations and attract the lower GST rate applicable to medicines, not the higher rate applicable to food products or health supplements. The regulatory approval of the product as an Ayurvedic medicine and its primary therapeutic purpose determine the classification.", "principle": "GST classification of products with both medicinal and nutritional attributes must be determined based on the product's primary purpose and regulatory classification. Products approved as Ayurvedic medicines under the Drugs and Cosmetics Act are classified as medicines for GST purposes, attracting lower rates. This ruling has significant implications for the fast-moving consumer goods and healthcare industries."}, {"id": "pcit-v-top-glove-2019", "title": "PCIT v. Triumph International Finance India Ltd.", "citation": "(2022) 443 ITR 381 (Bom HC)", "court": "Bombay High Court", "year": 2022, "bench": 2, "judges": ["R.D. Dhanuka J", "S.G. Mehare J"], "subject": "Tax Law", "tags": ["NBFC", "income recognition", "prudential norms", "non-performing assets", "interest income", "RBI circular", "Section 145"], "facts": "Triumph International Finance, an NBFC, did not recognise interest income on non-performing assets in accordance with RBI's prudential norms for income recognition. The Revenue contended that interest income accrues and must be recognised regardless of recoverability, under the mercantile system of accounting.", "judgement": "The Bombay High Court held that an NBFC following RBI's income recognition and asset classification norms is entitled to recognise interest income in accordance with those norms. RBI's prudential norms constitute a recognised method of accounting for NBFCs, and income on NPAs need not be accrued when recovery is doubtful in accordance with regulatory requirements.", "principle": "NBFCs are entitled to recognise income in accordance with RBI's income recognition norms, which constitute a recognised method of accounting. Interest on non-performing assets need not be accrued when RBI norms require deferral of such recognition. The regulatory accounting framework for NBFCs must be respected for income tax purposes, preventing forced recognition of doubtful income."}, {"id": "cit-v-bharat-aluminium-2009", "title": "Bharat Aluminium Co. Ltd. v. Kaiser Aluminium", "citation": "(2012) 9 SCC 552", "court": "Supreme Court of India", "year": 2012, "bench": 5, "judges": ["S.H. Kapadia CJ", "D.K. Jain J", "S.S. Nijjar J", "Ranjana Prakash Desai J", "J.S. Khehar J"], "subject": "Tax Law", "tags": ["international arbitration", "Part I", "Part II", "Arbitration Act", "foreign seated arbitration", "interim relief", "Section 9"], "facts": "Bharat Aluminium's joint venture agreement with Kaiser Aluminium contained an arbitration clause with the seat of arbitration in London. Disputes arose and arbitration proceedings were initiated. BALCO sought interim relief from Indian courts under Section 9 of the Arbitration and Conciliation Act. Kaiser argued that Indian courts had no jurisdiction over foreign-seated arbitrations.", "judgement": "The Supreme Court, overruling its earlier decision in Bhatia International, held that Part I of the Arbitration Act applies only to arbitrations seated in India. Indian courts have no supervisory jurisdiction (including the power to grant interim relief under Section 9) over arbitrations with a foreign seat. The seat of arbitration determines the supervisory jurisdiction.", "principle": "Part I of the Arbitration and Conciliation Act applies only to India-seated arbitrations. Where arbitration is seated abroad, Indian courts have no jurisdiction under Part I to grant interim relief, appoint arbitrators, or supervise the arbitral proceedings. The law of the seat of arbitration governs the arbitral proceedings. This case fundamentally reformed Indian international arbitration law by adopting the territorial approach to arbitration."}, {"id": "rajkot-nagarpalika-v-state-gujarat-2019", "title": "Rajkot Nagarpalika v. State of Gujarat", "citation": "(2020) 14 SCC 447", "court": "Supreme Court of India", "year": 2020, "bench": 2, "judges": ["Deepak Gupta J", "Aniruddha Bose J"], "subject": "Tax Law", "tags": ["property tax", "municipal tax", "Article 243X", "74th Amendment", "urban local body", "constitutional validity", "levy"], "facts": "A challenge was made to a municipal property tax levied by the Rajkot Municipal Corporation. The question was whether the municipal levy complied with the constitutional provisions enabling urban local bodies to levy taxes under the 74th Constitutional Amendment and whether the computation methodology was constitutionally valid.", "judgement": "The Supreme Court upheld the constitutional validity of the municipal property tax. The 74th Amendment empowered urban local bodies to levy specified taxes and the property tax was within the scope of the authorised levies. The computation methodology based on property valuation was a reasonable basis for the tax.", "principle": "Urban local bodies, empowered by the 74th Constitutional Amendment, have valid authority to levy property taxes. The computation of property tax based on rateable value is a constitutionally permissible methodology. Municipal taxes levied by urban local bodies in exercise of powers conferred by the 74th Amendment are entitled to the same constitutional respect as state and central taxes."}, {"id": "cit-v-samara-builders-2018", "title": "Samara Builders Pvt. Ltd. v. DCIT", "citation": "(2019) 101 taxmann.com 246 (Mum ITAT)", "court": "ITAT Mumbai", "year": 2018, "bench": 2, "judges": ["Shamim Yahya (AM)", "Ravish Sood (JM)"], "subject": "Tax Law", "tags": ["real estate developer", "project completion method", "income recognition", "AS-7", "ICAI", "Section 145", "construction contract"], "facts": "Samara Builders, a real estate developer, recognised revenue from residential projects using the project completion method — recognising revenue only on full completion and handover. The Revenue sought to apply the percentage completion method, which would have accelerated revenue recognition. The case raised questions about the correct accounting method for real estate developers.", "judgement": "The ITAT held that a real estate developer is entitled to follow the project completion method for recognising revenue from residential projects. The percentage completion method is one option but the project completion method is equally valid for long-term real estate projects. The consistency requirement means the assessee must follow the same method year after year.", "principle": "Real estate developers may choose between the project completion method and the percentage completion method for revenue recognition, provided they adopt the method consistently from year to year. The Revenue cannot compel a change in accounting method where the developer's chosen method is a recognised method under generally accepted accounting principles. Consistency of accounting method is a fundamental principle in income recognition."}, {"id": "gst-e-gaming-federation-2023", "title": "Skill Lotto Solutions Pvt. Ltd. v. Union of India", "citation": "(2021) 6 SCC 1", "court": "Supreme Court of India", "year": 2021, "bench": 3, "judges": ["A.M. Khanwilkar J", "Dinesh Maheshwari J", "C.T. Ravikumar J"], "subject": "Tax Law", "tags": ["GST", "lottery", "actionable claim", "goods", "Entry 6 Schedule III", "rate", "face value", "prize"], "facts": "State-run lotteries challenged the levy of GST on lottery distributors and sellers at 28% on the face value of lottery tickets. The challenge was on the ground that lotteries are 'actionable claims' falling under Entry 6 of Schedule III of the CGST Act, which takes them outside the scope of GST.", "judgement": "The Supreme Court upheld the levy of GST on lotteries. The Court held that lotteries are 'goods' for the purposes of GST and are not excluded by Entry 6 of Schedule III. Entry 6 covers actionable claims other than lottery, betting, and gambling. Therefore, lotteries are taxable under GST and the 28% rate is constitutionally valid.", "principle": "Lotteries are 'goods' subject to GST and are expressly carved out from the exclusion for actionable claims under Entry 6 of Schedule III. The levy of GST on the face value of lottery tickets at the applicable rate is constitutional. This case resolved the long-standing uncertainty about the GST treatment of lottery transactions and has broader implications for the taxation of gambling and betting activities."}, {"id": "cit-v-durga-cement-2011", "title": "CIT v. Durga Cement Works", "citation": "(2011) 337 ITR 476 (Bom HC)", "court": "Bombay High Court", "year": 2011, "bench": 2, "judges": ["S.J. Vazifdar J", "A.K. Menon J"], "subject": "Tax Law", "tags": ["cessation of liability", "Section 41(1)", "trading liability", "remission", "waiver", "income", "income tax"], "facts": "Durga Cement Works had a trading liability that was waived by the creditor. The Income Tax department sought to tax the waived amount as income under Section 41(1) of the Income Tax Act, which treats the cessation of a trading liability as a benefit received by the assessee assessable as income in the year of cessation.", "judgement": "The Bombay High Court held that where a trading liability is waived or remitted by a creditor, the amount of the waiver is assessable as income under Section 41(1) in the year of cessation. The cessation of liability represents a benefit to the assessee equivalent to the receipt of income. The Revenue was correct to bring the waived amount to charge.", "principle": "The cessation or remission of a trading liability is a taxable benefit under Section 41(1) of the Income Tax Act. When a creditor waives or writes off a debt relating to the assessee's trading activities, the benefit arising to the assessee is assessable as income in the year of waiver. This provision applies to trading liabilities — not capital liabilities, which follow the different capital receipt principle."}, {"id": "dcit-v-kotak-mahindra-capital-2020", "title": "DCIT v. Kotak Mahindra Capital Co. Ltd.", "citation": "(2021) 430 ITR 461 (Bom HC)", "court": "Bombay High Court", "year": 2020, "bench": 2, "judges": ["R.D. Dhanuka J", "N.R. Borkar J"], "subject": "Tax Law", "tags": ["investment banking", "Section 14A", "Rule 8D", "fee income", "exempt income", "disallowance", "share trading", "nexus"], "facts": "Kotak Mahindra Capital earned fee income from investment banking activities. It also earned dividend income from its equity investment portfolio. The Revenue applied Section 14A disallowance to allocate a portion of the investment banking overheads to the dividend income. The company argued that its investment banking expenses had no nexus with its dividend income.", "judgement": "The Bombay High Court held that for Section 14A disallowance to apply, there must be a proximate connection between the expenditure and the exempt income. Where the nature of the expenditure is entirely different from the activity that generates exempt income, no disallowance can be made. Investment banking fees have no proximate nexus with dividend income from a passive investment portfolio.", "principle": "Section 14A disallowance requires a proximate nexus between the expenditure claimed and the exempt income earned. Expenditure on business activities that happen to co-exist with exempt income but have no causal connection to earning that income cannot be disallowed. This limits the scope of Section 14A to expenditure that is functionally connected to generating the exempt income."}, {"id": "cit-v-united-bank-india-2016", "title": "CIT v. United Bank of India", "citation": "(2016) 385 ITR 394 (Cal HC)", "court": "Calcutta High Court", "year": 2016, "bench": 2, "judges": ["Biswanath Somadder J", "Arindam Sinha J"], "subject": "Tax Law", "tags": ["bank", "provisioning", "NPA", "Section 36(1)(viia)", "bad debt", "deductibility", "rural branch", "Schedule Bank"], "facts": "United Bank of India, a scheduled commercial bank, claimed deductions under Section 36(1)(viia) of the Income Tax Act for provisions for bad and doubtful debts from its rural branches. The Revenue sought to restrict the deduction to a fixed percentage of the aggregate rural advances, while the bank argued for a higher deduction based on actual provisioning.", "judgement": "The Calcutta High Court held that the deduction under Section 36(1)(viia) for provisions for bad and doubtful debts is computed at the prescribed percentage of the gross total income and rural advances. The statutory formula governs the maximum deduction regardless of the actual provisioning made by the bank under RBI guidelines.", "principle": "The deduction for bad debt provisions under Section 36(1)(viia) is capped at the percentage prescribed in the Income Tax Act and cannot exceed that cap even if actual provisions made under RBI guidelines are higher. The statutory cap reflects Parliament's policy on the quantum of tax deduction for provisioning in the banking sector. Banks must plan their provisioning with awareness of this statutory limitation."}, {"id": "real-time-leasing-v-cit-2017", "title": "Alembic Ltd. v. CIT", "citation": "(2018) 403 ITR 571 (Guj HC)", "court": "Gujarat High Court", "year": 2018, "bench": 2, "judges": ["Akil Kureshi J", "A.Y. Kogje J"], "subject": "Tax Law", "tags": ["slump sale", "Section 50B", "capital gains", "business transfer", "going concern", "net worth", "tax computation"], "facts": "Alembic Ltd. sold one of its business divisions as a going concern to another company. The Revenue sought to tax the gain as short-term capital gains under Section 50B of the Income Tax Act, which provides for computation of gains on slump sale (sale of undertakings as going concerns). A dispute arose about the computation of the net worth of the undertaking.", "judgement": "The Gujarat High Court held that Section 50B provides a complete code for computing capital gains on slump sales. The gain is computed as the difference between the sale consideration and the net worth of the undertaking as computed under the provisions of Section 50B. The net worth must be computed in accordance with the method prescribed and not by reference to the book value of individual assets.", "principle": "The computation of capital gains on a slump sale under Section 50B is governed by the special formula prescribed in that section. The net worth of the transferred undertaking must be computed as per the formula specified — it is not the book value or market value of individual assets. This formula provides certainty in the taxation of business transfers as going concerns and is a specific departure from the general capital gains computation provisions."}, {"id": "in-re-amendment-article-370-abrogation-challenge", "title": "Kedar Nath Singh v. State of Bihar", "citation": "AIR 1962 SC 955", "court": "Supreme Court of India", "year": 1962, "bench": 5, "judges": ["Sinha CJ", "Shah J", "Sarkar J", "Mudholkar J", "Kapur J"], "subject": "Constitutional Law", "tags": ["sedition", "Section 124A IPC", "Article 19(1)(a)", "constitutional validity", "incitement to violence", "narrow reading", "free speech"], "facts": "Kedar Nath Singh, a member of the Forward Communist Party, made a speech using strong language against the ruling party and government, calling Congress leaders and police 'dogs' and 'goondas'. He was convicted under Section 124A IPC (sedition). He challenged the constitutional validity of the sedition provision itself as being inconsistent with the right to free speech under Article 19(1)(a).", "judgement": "The Supreme Court upheld the constitutional validity of Section 124A IPC but read it down significantly. Sedition under Section 124A must be limited to acts that have a tendency to incite violence or public disorder. Strong criticism of the government, however harsh, that does not incite violence does not constitute sedition. The section is saved by Article 19(2) only to the extent it targets incitement.", "principle": "Section 124A IPC is constitutionally valid only if read narrowly to cover speech that incites violence or creates public disorder. Criticism of the government, even in vitriolic terms, is protected free speech and does not constitute sedition. Courts must read the sedition provision as limited to incitement, not as covering all expression of disaffection. This case is the foundational authority on the constitutional scope of sedition law."}, {"id": "state-of-mp-v-bhopalsingh-2012", "title": "State of M.P. v. Bharat Singh", "citation": "(2019) 4 SCC 191", "court": "Supreme Court of India", "year": 2019, "bench": 2, "judges": ["Deepak Gupta J", "Sanjiv Khanna J"], "subject": "Constitutional Law", "tags": ["Article 21", "prisoner", "right to legal aid", "Article 39A", "fair trial", "State obligation", "advocate", "first hearing"], "facts": "A prisoner facing trial for a serious offence was not provided with legal assistance at the initial stage of proceedings. The question was when the State's obligation to provide legal aid under Article 39A arises and whether failure to provide legal aid at the first hearing violates the right to a fair trial under Article 21.", "judgement": "The Supreme Court held that the right to legal aid under Article 39A, read with Article 21, must be provided from the very first hearing. The State's obligation to inform an accused of their right to free legal assistance and to provide it arises immediately upon arrest or at the first court appearance, not only when the accused requests it. Failure to provide early legal aid may vitiate subsequent proceedings.", "principle": "The right to legal aid is a fundamental component of the right to a fair trial under Article 21 and Article 39A. The State must proactively inform every accused person of their right to free legal assistance and provide it from the first court appearance. This right cannot be made contingent on the accused requesting it. Failure to provide timely legal aid may be a ground for challenging the validity of subsequent criminal proceedings."}, {"id": "pcit-v-rajasthan-state-cooperative-2018", "title": "PCIT v. Rajasthan State Cooperative Bank Ltd.", "citation": "(2019) 414 ITR 457 (Raj HC)", "court": "Rajasthan High Court", "year": 2018, "bench": 2, "judges": ["Sangeet Lodha J", "Pushpendra Singh Bhati J"], "subject": "Tax Law", "tags": ["cooperative bank", "Section 80P", "deduction", "interest income", "members", "non-members", "schedule bank"], "facts": "A state cooperative bank claimed deduction under Section 80P for all its interest income. The Revenue restricted the deduction only to income from activities with members, excluding income from investments in scheduled banks and non-member transactions. A question arose whether the cooperative bank qualified for the full deduction under Section 80P.", "judgement": "The Rajasthan High Court held that the deduction under Section 80P is available to cooperative banks on income from banking activities conducted with their members. Income earned from deposits placed with scheduled banks (non-cooperative entities) does not qualify for the Section 80P deduction as it is not income from cooperative activities with members.", "principle": "Section 80P deductions for cooperative banks extend only to income from cooperative banking activities with member institutions, not to income from dealings with non-members or from investments in the general banking system. The essential character of cooperative banking — mutual dealing with members — must be satisfied for the deduction to apply. This case is important for defining the scope of Section 80P for cooperative banks."}, {"id": "commissioner-customs-v-garware-polyester-2018", "title": "Commissioner of Customs v. Garware Polyester Ltd.", "citation": "(2019) 17 SCC 523", "court": "Supreme Court of India", "year": 2018, "bench": 3, "judges": ["A.M. Sapre J", "Indu Malhotra J", "Vineet Saran J"], "subject": "Tax Law", "tags": ["customs duty", "advance licence", "export obligation", "condition", "DEEC", "exemption", "import", "violation"], "facts": "Garware Polyester imported raw materials under an Advance Licence scheme which provided customs duty exemption on the condition that the imported materials were used to manufacture and export goods. Garware failed to fulfil the export obligation and was assessed to customs duty on the imported goods along with interest.", "judgement": "The Supreme Court held that an advance licence holder who fails to fulfil the export obligation is liable to pay the customs duty that would have been payable had the goods not been imported under the exemption. The exemption is conditional and the condition must be fulfilled. Failure of the condition entails the liability that was deferred.", "principle": "Conditional customs duty exemptions require fulfilment of the condition — in the case of advance licences, the export obligation. Failure to fulfil the export obligation renders the importer liable for the customs duty along with interest from the date of import. The conditional exemption is not a gift but a deferral of duty liability subject to subsequent compliance with the export obligation."}, {"id": "icai-v-shaunak-satya-2011", "title": "Brij Lal v. CIT", "citation": "(2010) 328 ITR 477 (SC)", "court": "Supreme Court of India", "year": 2010, "bench": 3, "judges": ["S.H. Kapadia J", "K.G. Balakrishnan J", "Aftab Alam J"], "subject": "Tax Law", "tags": ["Voluntary Disclosure of Income Scheme", "VDIS", "tax demand", "settlement", "immunity from interest", "Section 73", "black money"], "facts": "Persons who had disclosed income under the Voluntary Disclosure of Income Scheme 1997 were subsequently subjected to demands for interest and penalty. They argued that the scheme provided full immunity from all consequences including interest and penalty upon disclosure and payment of tax. The Revenue argued that the immunity was only from prosecution and penalty, not interest.", "judgement": "The Supreme Court held that the VDIS scheme provided complete immunity from tax demands, interest, and penalty upon valid disclosure and payment of the specified tax. The purpose of the scheme was to encourage declaration of undisclosed income and any residual demands would defeat the scheme's purpose. Declarants who paid the tax in full under the scheme were entitled to full immunity.", "principle": "Voluntary disclosure schemes must be given their full intended effect. Persons who make valid disclosures and pay the tax under such schemes are entitled to the full immunity promised, including from interest and penalty. Residual demands by the Revenue after valid compliance with a voluntary disclosure scheme defeat the legislative purpose of encouraging disclosure and are not permissible."}, {"id": "pcit-v-krishna-land-developers-2021", "title": "PCIT v. Krishna Land Developers Pvt. Ltd.", "citation": "(2022) 443 ITR 229 (Guj HC)", "court": "Gujarat High Court", "year": 2021, "bench": 2, "judges": ["Sonia Gokani J", "Nisha Thakore J"], "subject": "Tax Law", "tags": ["joint development agreement", "Section 53A TPA", "possession", "capital gains", "year of transfer", "real estate", "developer"], "facts": "Krishna Land Developers entered into a joint development agreement under which it handed possession of land to a developer in exchange for a share of the developed units. A dispute arose about the year in which the transfer was taxable as capital gains — whether it was the year of execution of the JDA (when possession was given) or the year of receipt of the developed units.", "judgement": "The Gujarat High Court held that where possession of land is handed over to the developer under a JDA and the developer acquires the right to develop, a transfer occurs under Section 2(47) read with Section 53A of the Transfer of Property Act in the year of handing over possession. The capital gains are taxable in that year, not in the year the developed units are received.", "principle": "A joint development agreement under which possession of land is handed over to a developer and the developer performs part of the agreement constitutes a transfer for capital gains purposes in the year of handing over possession. The transfer is triggered by possession plus performance, not by the ultimate delivery of developed units. This case is critical for real estate developers and landowners entering into JDA arrangements."}, {"id": "commissioner-v-shree-cement-2019", "title": "Shree Cement Ltd. v. Commissioner of Central Excise", "citation": "(2020) 371 ELT 481 (SC)", "court": "Supreme Court of India", "year": 2019, "bench": 2, "judges": ["Ashok Bhushan J", "Navin Sinha J"], "subject": "Tax Law", "tags": ["excise duty", "captive consumption", "Section 4", "transaction value", "cost of production", "cement", "valuation"], "facts": "Shree Cement produced clinker which was entirely used internally for the manufacture of cement without any external sale of clinker. The Revenue sought to levy excise duty on the captively consumed clinker based on the cost of production. Shree Cement challenged the valuation basis, arguing that cost of production was not the correct basis where there was no market for the intermediate product.", "judgement": "The Supreme Court held that excise duty on captively consumed goods is levied under the Central Excise Valuation Rules based on the cost of production. Where goods are produced for captive consumption and there are no comparable market sales, the cost-based valuation is the appropriate method. The Revenue is entitled to examine the correctness of the cost computation.", "principle": "Excise duty on captively consumed intermediate goods is computed on the basis of cost of production as prescribed in the Central Excise Valuation Rules. The absence of external market sales does not exempt captive consumption from excise duty — it changes the valuation method to cost-based. This case is important for manufacturing companies with integrated production processes where intermediate goods are not sold externally."}, {"id": "pcit-v-samsung-india-electronics-2022", "title": "PCIT v. Samsung India Electronics Pvt. Ltd.", "citation": "(2022) 449 ITR 76 (Del HC)", "court": "Delhi High Court", "year": 2022, "bench": 2, "judges": ["Manmohan J", "Manmeet Pritam Singh Arora J"], "subject": "Tax Law", "tags": ["corporate guarantee", "transfer pricing", "intra-group guarantee", "international transaction", "Section 92B", "guarantee commission", "ALP"], "facts": "Samsung India provided corporate guarantees to banks on behalf of its group entities. The Transfer Pricing Officer treated these guarantees as international transactions requiring arm's length compensation. A dispute arose about whether guarantees provided for group companies are 'international transactions' under Section 92B and if so, how to price them.", "judgement": "The Delhi High Court held that the provision of a corporate guarantee by an Indian company for the benefit of its foreign associated enterprise is an international transaction under Section 92B. A guarantee commission at the arm's length rate must be charged. The guarantee commission is the price that an independent guarantor would charge for bearing the contingent liability.", "principle": "Corporate guarantees provided by Indian companies for their overseas associated enterprises are international transactions requiring arm's length pricing under transfer pricing rules. The guarantee commission should reflect what an independent guarantor would charge for bearing the credit risk. This case clarifies the transfer pricing treatment of intra-group guarantees, an area of significant litigation for Indian MNCs with overseas operations."}, {"id": "cit-v-ansal-properties-2019", "title": "CIT v. Ansal Properties and Infrastructure Ltd.", "citation": "(2019) 416 ITR 526 (Del HC)", "court": "Delhi High Court", "year": 2019, "bench": 2, "judges": ["Vipin Sanghi J", "Sanjeev Sachdeva J"], "subject": "Tax Law", "tags": ["real estate", "percentage completion method", "project completion method", "Section 145", "income recognition", "accounting standard", "AS-7"], "facts": "Ansal Properties recognised revenue from its real estate development projects using the project completion method. The Assessing Officer applied the percentage completion method under AS-7 (Construction Contracts) to accelerate income recognition. The company argued that real estate development projects are not 'construction contracts' within AS-7.", "judgement": "The Delhi High Court held that AS-7 on Construction Contracts does not automatically apply to real estate developers selling units to end customers. The distinction between a developer selling its own inventory and a contractor constructing for a client is fundamental. A real estate developer may apply the project completion method consistently as a recognised accounting method.", "principle": "Real estate developers selling residential or commercial units from their own inventory are not 'contractors' within the scope of AS-7 on Construction Contracts. Such developers may legitimately apply the project completion method for revenue recognition. The forced application of the percentage completion method to all long-term projects is incorrect — the nature of the project and the accounting method adopted consistently governs."}, {"id": "gst-advance-ruling-iim-ahmedabad-2019", "title": "In Re: IIM Ahmedabad", "citation": "2019 (27) GSTL 65 (AAR Gujarat)", "court": "Authority
