rt upheld the constitutional validity of the amendments but read conditions into their operation. The State must demonstrate quantifiable data showing backwardness of the community, inadequacy of representation in public employment, and must ensure overall efficiency of administration. The amendments do not confer an absolute right to reservation in promotion.", "principle": "Reservations in promotions for SCs and STs under Articles 16(4A) and 16(4B) are constitutionally valid but subject to conditions: the State must demonstrate backwardness, inadequacy of representation, and ensure overall administrative efficiency. The 'catch up' rule and 'consequential seniority' are aspects of the policy to be determined by the State subject to these conditions. This is the definitive case on reservations in promotions."}, {"id": "suresh-chandra-v-state-of-gujarat-1975", "title": "Suresh Chandra v. State of Gujarat", "citation": "AIR 1975 SC 1185", "court": "Supreme Court of India", "year": 1975, "bench": 2, "judges": ["Chandrachud J", "Untwalia J"], "subject": "Constitutional Law", "tags": ["preventive detention", "Article 21", "Article 22", "bail", "COFEPOSA", "personal liberty", "economic offence"], "facts": "Suresh Chandra was detained under the Conservation of Foreign Exchange and Prevention of Smuggling Activities Act (COFEPOSA). He challenged his detention arguing that the grounds were vague and that the continued detention after his release on bail was unjustified. The case raised questions about the relationship between bail and preventive detention.", "judgement": "The Supreme Court held that a person who has been released on bail in a criminal case can still be detained under a preventive detention law if the conditions for such detention are independently satisfied. Release on bail does not preclude preventive detention since the two legal regimes operate on different bases — bail relates to criminal proceedings while preventive detention is a precautionary measure.", "principle": "Preventive detention and bail operate on different legal foundations and are not mutually exclusive. A person on bail in criminal proceedings may be simultaneously detained preventively if there is independent satisfaction of the grounds for preventive detention. This case clarifies the relationship between the criminal justice system and preventive detention in economic offence cases."}, {"id": "pradeep-jain-v-union-of-india-1984", "title": "Pradeep Jain v. Union of India", "citation": "AIR 1984 SC 1420", "court": "Supreme Court of India", "year": 1984, "bench": 5, "judges": ["Bhagwati CJ", "Ranganath Misra J", "D.A. Desai J", "E.S. Venkataramiah J", "R.B. Misra J"], "subject": "Constitutional Law", "tags": ["Article 14", "equality", "domicile reservation", "medical admissions", "merit", "state quota", "interstate students"], "facts": "Medical colleges in various states admitted students based on domicile reservations, effectively excluding meritorious students from other states. Non-domicile students challenged the reservations as violating Article 14 (equality) and Article 15 (non-discrimination). The Union government defended domicile-based reservations in state medical colleges.", "judgement": "The Supreme Court held that domicile or residence-based reservations in medical admissions are permissible to some extent but cannot be absolute. The Court prescribed that at least 70% of seats in medical colleges funded by the State should be filled on merit without domicile restrictions, recognising the national character of medical education.", "principle": "Domicile-based reservations in higher educational institutions are permissible as a reasonable classification but cannot exclude all-India merit to such an extent as to violate Article 14. Medical education, in particular, has a national character and States cannot convert medical colleges into exclusively local institutions. A reasonable balance between State interest in local development and national merit must be maintained."}, {"id": "veena-sethi-v-state-of-bihar-1982", "title": "Veena Sethi v. State of Bihar", "citation": "AIR 1983 SC 339", "court": "Supreme Court of India", "year": 1982, "bench": 2, "judges": ["P.N. Bhagwati J", "E.S. Venkataramiah J"], "subject": "Constitutional Law", "tags": ["prison reform", "Article 21", "undertrials", "insane prisoners", "right to life", "PIL", "judicial activism"], "facts": "Letters written by lawyers and social workers reported the situation of mentally ill and other prisoners in Bihar jails who had been incarcerated for periods far exceeding their possible sentences. Some prisoners had been acquitted but remained in custody due to bureaucratic failure. The Supreme Court treated these letters as PILs.", "judgement": "The Supreme Court held that the continued detention of persons who had either been acquitted or served their sentences, due to bureaucratic neglect, was a flagrant violation of Article 21. The Court issued comprehensive directions for the release of such prisoners and for the improvement of prison conditions for the mentally ill.", "principle": "The continued incarceration of a person beyond their sentence, or after acquittal, due to administrative negligence violates Article 21. The State has an affirmative obligation to ensure that persons are not held in custody beyond the legal period of their detention. This case is part of the important jurisprudence on prison reform and the rights of undertrial prisoners in India."}, {"id": "state-of-haryana-v-santra-2000", "title": "State of Haryana v. Santra", "citation": "(2000) 5 SCC 182", "court": "Supreme Court of India", "year": 2000, "bench": 2, "judges": ["S. Saghir Ahmad J", "R.P. Sethi J"], "subject": "Constitutional Law", "tags": ["right to life", "Article 21", "sterilisation", "forced", "compensation", "health", "bodily integrity", "medical negligence"], "facts": "Santra underwent a sterilisation operation in a government hospital but became pregnant again due to the failure of the operation. The State of Haryana argued that the State had no liability for unsuccessful sterilisation operations performed in government hospitals. The question was whether the State's negligence in performing a sterilisation operation violated constitutional rights.", "judgement": "The Supreme Court held that the State is liable for compensation when a sterilisation operation performed in a government hospital fails due to medical negligence. The right to reproductive health is part of the right to life under Article 21. The State cannot escape liability for the failure of its medical services to perform a competent surgical procedure.", "principle": "The right to health, including reproductive health, is part of the right to life under Article 21. The State is vicariously liable for medical negligence of government hospital staff. Citizens who suffer harm due to the failure of state medical services have a constitutional remedy for compensation under Article 21. This case expanded the concept of bodily integrity and reproductive rights in Indian constitutional law."}, {"id": "parmanand-katara-v-union-india-1989", "title": "Parmanand Katara v. Union of India", "citation": "AIR 1989 SC 2039", "court": "Supreme Court of India", "year": 1989, "bench": 2, "judges": ["Ranganath Misra J", "G.L. Oza J"], "subject": "Constitutional Law", "tags": ["right to emergency medical care", "Article 21", "hospital", "accident victim", "doctor", "duty to treat", "right to life"], "facts": "A scooterist was knocked down by a speeding car and was taken to a hospital but was refused immediate treatment on the ground that it was a medico-legal case that needed police clearance. The man died. Parmanand Katara, an advocate, filed a PIL arguing that the refusal of emergency treatment violated Article 21.", "judgement": "The Supreme Court held that every doctor, whether in a private or government hospital, has a constitutional obligation to provide emergency medical treatment to injured persons. The right to emergency medical care is part of the right to life under Article 21. No procedure or formality (including medico-legal requirements) can override the obligation to provide first aid.", "principle": "The right to emergency medical care is a fundamental right under Article 21. Every citizen and every doctor has a corresponding duty to provide emergency assistance to injured persons. Medico-legal formalities and police procedures cannot be allowed to delay emergency medical treatment that is necessary to save life. This case is foundational for emergency medical care obligations in India."}, {"id": "state-of-up-v-raj-narain-1975", "title": "State of U.P. v. Raj Narain", "citation": "AIR 1975 SC 865", "court": "Supreme Court of India", "year": 1975, "bench": 5, "judges": ["Ray CJ", "Mathew J", "Chandrachud J", "Alagiriswami J", "Beg J"], "subject": "Constitutional Law", "tags": ["election", "Indira Gandhi", "Allahabad High Court", "electoral corrupt practice", "right to vote", "separation of powers", "39th Amendment"], "facts": "Raj Narain challenged the election of Indira Gandhi to the Lok Sabha from Rae Bareli constituency on the ground of corrupt practices under the Representation of the People Act. The Allahabad High Court found the election void. Parliament then passed the 39th Constitutional Amendment validating the election. Raj Narain challenged this amendment.", "judgement": "The Supreme Court struck down relevant provisions of the 39th Amendment. The Court held that Parliament cannot by a constitutional amendment set aside a judicial verdict in an individual dispute. Such an amendment destroys the rule of law and the principle of separation of powers, which are part of the basic structure of the Constitution.", "principle": "Parliament cannot enact a constitutional amendment to nullify a specific judicial verdict in an individual case. The rule of law and separation of powers are basic features of the Constitution — the legislature cannot exercise judicial power in this manner. This case, decided during the Emergency, was a significant assertion of judicial independence and the limits of constitutional amendments."}, {"id": "d-k-basu-v-state-of-west-bengal-1997", "title": "D.K. Basu v. State of West Bengal", "citation": "(1997) 1 SCC 416", "court": "Supreme Court of India", "year": 1997, "bench": 2, "judges": ["A.S. Anand J", "Kuldip Singh J"], "subject": "Constitutional Law", "tags": ["custodial death", "police torture", "Article 21", "arrest guidelines", "right to life", "right to be informed", "legal aid"], "facts": "D.K. Basu, executive chairman of Legal Aid Services West Bengal, wrote to the Chief Justice of India drawing attention to deaths in police custody and prison. Treating the letter as a writ petition, the Supreme Court examined the phenomenon of custodial violence and the protections available to arrested persons under the Constitution.", "judgement": "The Supreme Court issued comprehensive guidelines on arrest procedures that must be followed by all law enforcement agencies. The guidelines include requirements to inform an arrested person of their rights, to prepare an arrest memo, to inform relatives, and to allow access to a lawyer. Violation of these guidelines may result in departmental action and contempt proceedings.", "principle": "Custodial deaths and police torture are serious violations of Article 21. The Supreme Court's D.K. Basu guidelines impose mandatory requirements on all police and enforcement agencies when arresting persons. These guidelines have since been incorporated into the Code of Criminal Procedure and represent the constitutional minimum protections for persons deprived of liberty."}, {"id": "people-s-union-democratic-rights-v-union-india-1982", "title": "People's Union for Democratic Rights v. Union of India", "citation": "AIR 1982 SC 1473", "court": "Supreme Court of India", "year": 1982, "bench": 3, "judges": ["P.N. Bhagwati J", "R.S. Pathak J", "A.N. Sen J"], "subject": "Constitutional Law", "tags": ["Article 23", "forced labour", "minimum wages", "construction workers", "Asian Games", "exploitation", "PIL"], "facts": "The People's Union for Democratic Rights filed a PIL after an advocate visited construction sites for the 1982 Asian Games and found workers being paid below minimum wages and working in deplorable conditions. The PIL alleged violations of Articles 23 and 24 (prohibition of forced labour and child labour) and the Minimum Wages Act.", "judgement": "The Supreme Court held that paying below minimum wages to workers who have no option but to work for less constitutes forced labour within the meaning of Article 23. The compulsion of economic circumstances is sufficient to make underpayment a form of forced labour. The Court issued directions to ensure compliance with minimum wage legislation.", "principle": "Forced labour under Article 23 includes payment of below-minimum wages where workers are compelled by economic circumstances to work for less than the statutory minimum. Economic compulsion is a sufficient form of compulsion under Article 23. The State has an obligation to ensure compliance with minimum wage laws as part of its obligation to prevent forced labour. This is a landmark case on economic exploitation as a form of forced labour."}, {"id": "miss-mohini-jain-v-state-of-karnataka-1992", "title": "Mohini Jain v. State of Karnataka", "citation": "AIR 1992 SC 1858", "court": "Supreme Court of India", "year": 1992, "bench": 2, "judges": ["Kuldip Singh J", "R.M. Sahai J"], "subject": "Constitutional Law", "tags": ["right to education", "Article 21", "capitation fee", "private medical college", "state obligation", "equality", "socioeconomic rights"], "facts": "Mohini Jain was denied admission to a private medical college because she could not pay the capitation fee required. She challenged the capitation fee as unconstitutional, arguing that the right to education is a fundamental right under Article 21 and that capitation fees put education beyond the reach of non-wealthy students.", "judgement": "The Supreme Court held that the right to education is a fundamental right under Article 21, read with the obligations of the State under directive principles. The right of citizens to education cannot be negated by the charging of exploitative capitation fees. The Court ruled that no private college could charge capitation fees.", "principle": "The right to education is a fundamental right flowing from Article 21, and capitation fees that make education unaffordable violate this right. This case preceded Unni Krishnan and the eventual constitutional recognition of the right to education through the 86th Amendment. It remains significant as an early recognition of education as a component of the right to life."}, {"id": "re-c-article-370-2019-rrc", "title": "Romila Thapar v. Union of India", "citation": "(2018) 10 SCC 753", "court": "Supreme Court of India", "year": 2018, "bench": 3, "judges": ["Dipak Misra CJ", "A.M. Khanwilkar J", "D.Y. Chandrachud J"], "subject": "Constitutional Law", "tags": ["habeas corpus", "activist", "arrest", "Bhima Koregaon", "Article 21", "SIT", "fair investigation", "political dissent"], "facts": "Several activists and academics were arrested in connection with the Bhima Koregaon violence case. An eminent historian and other concerned citizens filed a habeas corpus petition before the Supreme Court challenging the arrests as political persecution and seeking a Special Investigation Team to probe the case. The petitioners argued that the police investigation was biased.", "judgement": "The Supreme Court by majority dismissed the petition for a SIT investigation, finding no grounds to doubt the investigating agency. Justice Chandrachud dissented powerfully, holding that the arrest of activists and academics required heightened judicial scrutiny as it touched on the right to free expression and political dissent under Articles 19 and 21.", "principle": "The arrest and prosecution of activists, academics, and dissenters must be scrutinised with particular care given its implications for freedom of expression and political liberty. Dissent is the safety valve of democracy and its suppression under the guise of law enforcement has serious constitutional implications. Chandrachud J's dissent in this case has had significant subsequent influence on the jurisprudence of political liberty."}, {"id": "in-re-noida-authority-v-pq-2010", "title": "NOIDA Entrepreneurs Association v. NOIDA", "citation": "(2011) 6 SCC 508", "court": "Supreme Court of India", "year": 2011, "bench": 2, "judges": ["S.H. Kapadia CJ", "Swatanter Kumar J"], "subject": "Constitutional Law", "tags": ["Article 14", "allotment of land", "industrial plots", "government policy", "equal treatment", "legitimate expectation", "UP AIDA"], "facts": "NOIDA Entrepreneurs Association challenged the allotment of industrial plots by NOIDA on the ground that the allotment process was arbitrary and violated Article 14. Some entrepreneurs had been allotted plots at lower prices while similarly situated persons were charged higher prices. The petitioners sought equal treatment.", "judgement": "The Supreme Court held that government authorities allotting public resources including land must follow a fair, transparent, and non-discriminatory process. Arbitrary differentials in the pricing and allotment of public land violate Article 14. The Court ordered NOIDA to reconsider the allotments in accordance with a fair policy applicable equally to all applicants.", "principle": "The allotment of public resources including land must be done through a fair, transparent, and non-discriminatory process. Arbitrariness in the allotment of public land violates Article 14. This case reflects the Court's insistence that State actions in distributing public resources must satisfy the anti-arbitrariness standard established in E.P. Royappa and subsequent cases."}, {"id": "state-of-andhra-v-nagabhushanam-1988", "title": "Seetai Ammal v. State of Tamil Nadu", "citation": "AIR 1988 Mad 351", "court": "Madras High Court", "year": 1988, "bench": 2, "judges": ["P. Venugopal J", "K. Rajasekhar J"], "subject": "Constitutional Law", "tags": ["Article 21", "woman prisoner", "handcuffing", "dignity", "Article 14", "prison", "bodily integrity", "inhuman treatment"], "facts": "Seetai Ammal, a woman prisoner, was handcuffed while being transported to court for her trial. She challenged the handcuffing as violating her right to dignity and personal liberty under Articles 14 and 21 of the Constitution. The State argued that handcuffing was a routine security measure.", "judgement": "The Madras High Court held that the routine handcuffing of prisoners without specific justification based on security concerns violates Article 21. Handcuffing is a form of humiliation that demeans the dignity of a person and is inconsistent with the right to be treated as a human being. Handcuffing can only be used in exceptional circumstances where there is a specific security risk.", "principle": "Handcuffing of prisoners without specific and compelling security justification violates the right to dignity under Article 21. Prisoners, including accused persons awaiting trial, retain their fundamental rights and the State must justify any restrictions on those rights on grounds proportionate to the security risk. This case is part of the jurisprudence on the rights of prisoners and the conditions of their incarceration."}, {"id": "air-india-v-nargesh-meerza-1981", "title": "Air India v. Nargesh Meerza", "citation": "AIR 1981 SC 1829", "court": "Supreme Court of India", "year": 1981, "bench": 3, "judges": ["Fazal Ali J", "A.P. Sen J", "V.D. Tulzapurkar J"], "subject": "Constitutional Law", "tags": ["Article 14", "Article 15", "gender discrimination", "air hostess", "pregnancy rule", "retirement", "service conditions", "equality"], "facts": "Air India imposed a service condition on air hostesses requiring them to retire on first pregnancy or on reaching a specified age, whichever was earlier. No such conditions applied to male cabin crew. Air hostesses challenged these conditions as unconstitutional discrimination on the basis of sex under Articles 14 and 15.", "judgement": "The Supreme Court struck down the pregnancy-termination-of-service clause as violating Articles 14 and 15. The condition was unreasonably discriminatory, as it singled out women for disadvantageous treatment based on their pregnancy. However, the Court upheld some age-based distinctions as not being unreasonably discriminatory.", "principle": "Service conditions that impose disadvantageous treatment on women employees solely on account of pregnancy violate Articles 14 and 15. The termination of employment on pregnancy discriminates against women on the basis of sex and is unconstitutional. This case is an important early precedent for gender equality in employment conditions in India."}, {"id": "state-of-up-v-deoman-upadhyaya-1960", "title": "State of U.P. v. Deoman Upadhyaya", "citation": "AIR 1960 SC 1125", "court": "Supreme Court of India", "year": 1960, "bench": 5, "judges": ["Sinha CJ", "Imam J", "Shah J", "Dayal J", "Mudholkar J"], "subject": "Constitutional Law", "tags": ["Article 20(2)", "double jeopardy", "same offence", "prosecution", "multiple punishment", "criminal law", "autrefois convict"], "facts": "Deoman Upadhyaya had been convicted of a crime and sentenced. Subsequently, the State attempted to prosecute him again under a different law for the same set of facts. He raised the defence of double jeopardy under Article 20(2) of the Constitution.", "judgement": "The Supreme Court held that Article 20(2) prohibits prosecution and punishment for the same offence more than once. The protection applies where the accused has been both prosecuted and punished for the offence. The Court construed 'same offence' to mean offences based on substantially the same facts, not merely the same legal provision.", "principle": "Article 20(2) provides a constitutional protection against double jeopardy — no person shall be prosecuted and punished for the same offence more than once. The protection is broader than mere identity of the legal provision — it covers prosecution for substantially the same facts. This is the foundational case on the constitutional right against double jeopardy in India."}, {"id": "state-of-orissa-v-ex-capt-ram-chandra-1964", "title": "V.G. Row v. State of Madras", "citation": "AIR 1952 SC 196", "court": "Supreme Court of India", "year": 1952, "bench": 5, "judges": ["Patanjali Sastri CJ", "Mehr Chand Mahajan J", "Mukherjea J", "S.R. Das J", "Chandrasekhara Aiyar J"], "subject": "Constitutional Law", "tags": ["Article 19(1)(c)", "freedom of association", "organisation", "Criminal Law Amendment Act", "unreasonable restriction", "security of state"], "facts": "The People's Education Society was declared an unlawful association under the Criminal Law Amendment Act. V.G. Row, its secretary, challenged the declaration as violating the freedom of association guaranteed under Article 19(1)(c). The question was whether the restrictions on the freedom to form associations were reasonable within the meaning of Article 19(4).", "judgement": "The Supreme Court held that the test of reasonableness of restrictions on fundamental rights requires courts to consider the nature of the right, the purpose of the restriction, the extent and urgency of the evil sought to be remedied, and the means used. The law impugned was found to have given excessive powers without adequate procedural safeguards and was struck down.", "principle": "The test of reasonableness of restrictions on fundamental rights under Article 19 requires a balancing exercise considering the importance of the right, the purpose and extent of the restriction, and the proportionality of the means used. Restrictions that are overbroad, vague, or give unlimited discretion to authorities without procedural safeguards are unreasonable. This is the foundational case on the 'reasonableness' of restrictions on fundamental rights."}, {"id": "mukesh-v-state-nct-delhi-2017", "title": "Mukesh v. State (NCT of Delhi)", "citation": "(2017) 6 SCC 1", "court": "Supreme Court of India", "year": 2017, "bench": 3, "judges": ["Dipak Misra J", "R. Banumathi J", "Ashok Bhushan J"], "subject": "Constitutional Law", "tags": ["death penalty", "rarest of rare", "gang rape", "murder", "Article 21", "mitigating circumstances", "sentencing"], "facts": "Four individuals were convicted for the brutal gang rape and murder of a young woman in Delhi in December 2012, which became known as the Nirbhaya case. They were sentenced to death by the trial court, which was confirmed by the High Court. The Supreme Court was called upon to confirm or modify the death sentence in respect of all four accused.", "judgement": "The Supreme Court upheld the death sentence for all four accused, finding this to be one of the rarest of rare cases warranting the death penalty. The Court examined the mitigating and aggravating circumstances and found that the brutality of the crime, the complete absence of remorse, and the impact on the victim and society placed this case at the extreme end of cases warranting capital punishment.", "principle": "Capital punishment can be imposed only in the rarest of rare cases where the brutality of the crime, its manner of commission, and its impact on society make any lesser sentence wholly inappropriate. The Court must examine both aggravating and mitigating circumstances. This case is a leading authority on the rarest of rare doctrine and the application of the death penalty for extreme cases of sexual violence."}, {"id": "in-re-shaheen-bagh-2020", "title": "Amit Sahni v. Commissioner of Police", "citation": "(2020) 10 SCC 439", "court": "Supreme Court of India", "year": 2020, "bench": 3, "judges": ["S.K. Kaul J", "Aniruddha Bose J", "Krishna Murari J"], "subject": "Constitutional Law", "tags": ["right to protest", "Article 19(1)(a)", "Article 19(1)(b)", "Shaheen Bagh", "road blockade", "CAA", "balancing rights", "public space"], "facts": "A road in Shaheen Bagh, Delhi was blocked by protestors opposing the Citizenship Amendment Act for several months. Commuters filed a petition seeking removal of the protestors. The Supreme Court was called upon to balance the right to protest against the rights of commuters to use public roads.", "judgement": "The Supreme Court held that the right to protest and assemble is a fundamental right under Articles 19(1)(a) and (b) but this right cannot be exercised in a manner that indefinitely blocks public roads and disrupts the rights of others. Protests must be conducted at designated spaces and cannot occupy public thoroughfares indefinitely.", "principle": "The right to protest and assemble is a fundamental right but is not absolute and cannot be exercised by indefinitely occupying public roads in a manner that disrupts others' rights. The State has the power and obligation to ensure that protests are conducted in a manner that is compatible with the rights of other citizens to use public spaces. A balance must be struck between the right to dissent and the rights of the public."}, {"id": "cit-v-podar-cement-1997", "title": "CIT v. Podar Cement Pvt. Ltd.", "citation": "(1997) 226 ITR 625 (SC)", "court": "Supreme Court of India", "year": 1997, "bench": 3, "judges": ["K. Ramaswamy J", "G.B. Pattanaik J", "S. Saghir Ahmad J"], "subject": "Tax Law", "tags": ["income from house property", "Section 22", "owner", "deemed ownership", "exclusive possession", "Income Tax Act", "property"], "facts": "Podar Cement held properties under agreements where it had exclusive possession and effective ownership but not legal title. The Income Tax department sought to tax the income from these properties as income from house property under Section 22 of the Income Tax Act. The question was whether 'owner' in Section 22 includes a person with effective ownership but without legal title.", "judgement": "The Supreme Court held that 'owner' in Section 22 of the Income Tax Act must be interpreted broadly to include a person who has acquired the rights of ownership through an agreement for sale or similar transaction, even if legal title has not been formally transferred. The beneficial owner with exclusive possession is the owner for income tax purposes.", "principle": "Ownership for the purposes of Section 22 of the Income Tax Act encompasses beneficial ownership and is not limited to legal title. A person who has exclusive possession and the rights of an owner under an agreement for sale is the owner of property for income tax purposes. This expansive interpretation of 'owner' is fundamental to the taxation of property income in complex real estate transactions."}, {"id": "cit-v-hindustan-bulk-carriers-2000", "title": "CIT v. Hindustan Bulk Carriers", "citation": "(2003) 3 SCC 57", "court": "Supreme Court of India", "year": 2002, "bench": 3, "judges": ["Ruma Pal J", "Doraiswamy Raju J", "Arijit Pasayat J"], "subject": "Tax Law", "tags": ["demurrage", "shipping", "income", "accrual", "receipt basis", "Section 5", "receipt of income", "Indian company"], "facts": "Hindustan Bulk Carriers received demurrage charges from its shipping clients. A question arose about the timing of recognition of demurrage income — whether it should be recognised when the right to receive it arose (accrual basis) or when it was actually received (receipt basis). The company followed the mercantile system of accounting.", "judgement": "The Supreme Court held that under the mercantile system of accounting, income accrues when the right to receive it crystallises — that is, when the event giving rise to the income occurs and the amount becomes a debt due from the payer. Demurrage income must therefore be recognised in the year the laytime expired, not in the year of actual receipt.", "principle": "Under the mercantile system of accounting, income must be recognised in the year in which the right to receive it accrues and crystallises into a debt. The fact of receipt in a later year does not change the year of accrual. This is a key principle in the determination of the year in which business income is assessable and is widely applied in international trade and shipping transactions."}, {"id": "commissioner-v-mizoram-2007", "title": "State of Sikkim v. Surendra Prasad Sharma", "citation": "(1994) 5 SCC 282", "court": "Supreme Court of India", "year": 1994, "bench": 2, "judges": ["K. Ramaswamy J", "G.N. Ray J"], "subject": "Tax Law", "tags": ["wealth tax", "agricultural land", "exemption", "Wealth Tax Act", "property", "State", "valuation"], "facts": "A question arose whether agricultural land situated in a State other than the one where the assessee resided was exempt from wealth tax under the Wealth Tax Act 1957. The Act exempted 'agricultural land' from wealth tax, and the question was whether the exemption was state-specific or applied nationally.", "judgement": "The Supreme Court held that the exemption for agricultural land under the Wealth Tax Act applies to agricultural land wherever situated in India, not merely in the State of the assessee's residence. The exemption is based on the character of the land as agricultural, not on its geographic location relative to the assessee's domicile.", "principle": "Exemptions in tax statutes should be construed consistently with their legislative purpose. The exemption for agricultural land from wealth tax applies nationally and is determined by the nature of the land, not its location relative to the assessee. This case is important for understanding how tax exemptions are construed in the context of their underlying policy objectives."}, {"id": "cit-v-dr-motilal-hirabhai-spg-1978", "title": "CIT v. Motor Credit Co. Pvt. Ltd.", "citation": "(1980) 121 ITR 538 (SC)", "court": "Supreme Court of India", "year": 1980, "bench": 2, "judges": ["Chandrachud CJ", "P.N. Shinghal J"], "subject": "Tax Law", "tags": ["hire purchase", "income recognition", "installment credit", "interest income", "Section 5", "NBFC", "financing company"], "facts": "Motor Credit Company, engaged in hire purchase financing, received installments from customers comprising both principal repayment and interest components. The Income Tax department sought to tax the entire installment as income in the year of receipt, while the company maintained that only the interest component was income and the principal was a return of capital.", "judgement": "The Supreme Court held that in hire purchase transactions, the installments received comprise a capital element (return of the amount financed) and an income element (interest earned). Only the interest component is income for income tax purposes. The company was entitled to separate the two components using an appropriate method.", "principle": "In hire purchase and instalment credit transactions, receipts from borrowers comprise both capital (principal repayment) and income (interest) components. Tax is payable only on the income component. The taxpayer must use an appropriate method to separate the two components. This case is foundational for the taxation of hire purchase companies and consumer finance businesses in India."}, {"id": "federation-of-andhra-chambers-v-state-1976", "title": "Bhavnagar University v. Palitana Sugar Mill Pvt. Ltd.", "citation": "(2003) 2 SCC 111", "court": "Supreme Court of India", "year": 2003, "bench": 3, "judges": ["Doraiswamy Raju J", "Arijit Pasayat J", "Ashok Bhan J"], "subject": "Tax Law", "tags": ["entry tax", "State List", "Article 304", "trade and commerce", "freedom", "constitutional validity", "local area levy"], "facts": "Palitana Sugar Mill challenged an entry tax levied by the State of Gujarat on goods entering local areas as unconstitutional. The sugar mill argued that the entry tax imposed an unreasonable restriction on the freedom of trade and commerce guaranteed by Article 301 of the Constitution and was not saved by Article 304.", "judgement": "The Supreme Court held that an entry tax on goods entering a local area is within the legislative competence of the State, being a tax on entry of goods. However, such a tax must satisfy the requirements of Article 304(a) — it must not discriminate between goods imported from sister States and locally produced goods — to avoid being struck down as a restriction on inter-State trade.", "principle": "States can impose entry taxes on goods entering local areas but such taxes must not discriminate between goods from different States. An entry tax that imposes higher levies on inter-State goods than on locally produced goods violates Article 301 and is unconstitutional unless validated by Article 304(b). This case is significant for understanding the constitutional limits on State taxation of inter-State trade."}, {"id": "cit-v-lakshmi-vilas-bank-1996", "title": "CIT v. Lakshmi Vilas Bank Ltd.", "citation": "(1996) 220 ITR 305 (SC)", "court": "Supreme Court of India", "year": 1996, "bench": 2, "judges": ["K. Ramaswamy J", "S. Saghir Ahmad J"], "subject": "Tax Law", "tags": ["banking", "provisions", "bad debts", "deductibility", "RBI norms", "income tax", "Section 36(1)(vii)", "Section 36(1)(viia)"], "facts": "Lakshmi Vilas Bank created provisions for bad and doubtful debts as required by RBI prudential norms and claimed deductions for such provisions under the Income Tax Act. The Revenue contested the deductibility of provisions as distinct from actual write-offs of bad debts.", "judgement": "The Supreme Court held that provisions for bad and doubtful debts required by RBI norms are deductible under Section 36(1)(viia) of the Income Tax Act. Section 36(1)(viia) specifically provides for the deductibility of provisions for bad debts in the case of scheduled banks and certain other financial institutions, reflecting the regulatory requirement to maintain such provisions.", "principle": "Banks are entitled to deduct provisions for bad and doubtful debts under Section 36(1)(viia) of the Income Tax Act in addition to actual write-offs under Section 36(1)(vii). The specific provision for banks reflects the regulatory reality of banking operations and the RBI's requirement to maintain prudential provisions. This case clarifies the interaction between banking regulation and income tax law."}, {"id": "cit-v-eli-lilly-2009", "title": "CIT v. Eli Lilly and Company (India) Pvt. Ltd.", "citation": "(2009) 15 SCC 1", "court": "Supreme Court of India", "year": 2009, "bench": 3, "judges": ["S.H. Kapadia J", "Aftab Alam J", "K.S. Panicker Radhakrishnan J"], "subject": "Tax Law", "tags": ["TDS", "salary", "secondment", "expat employee", "reimbursement", "employer-employee", "Section 192", "income tax"], "facts": "Eli Lilly India received employees on secondment from its parent company in the USA. The parent company paid the salaries of the seconded employees and Eli Lilly India reimbursed the parent. The Revenue contended that Eli Lilly India was obligated to deduct TDS on the reimbursements as employer paying salary, while the company argued the parent was the employer.", "judgement": "The Supreme Court held that where the economic and legal employer of an employee is the Indian company, the Indian company is liable to deduct TDS on salary paid, including where paid through the parent company. The determination of who is the 'employer' for TDS purposes requires examination of all circumstances, not merely the formal contract.", "principle": "For TDS purposes under Section 192, the determination of who is the employer requires a functional analysis considering who controls, directs, and bears the economic cost of the employee. Where a seconded employee works under the supervision and control of the Indian host company and the Indian company bears the economic cost, the Indian company is the employer for TDS purposes."}, {"id": "cit-v-kelvinator-of-india-2010", "title": "CIT v. Kelvinator of India Ltd.", "citation": "(2010) 2 SCC 723", "court": "Supreme Court of India", "year": 2010, "bench": 2, "judges": ["S.H. Kapadia J", "K.S. Panicker Radhakrishnan J"], "subject": "Tax Law", "tags": ["reassessment", "Section 147", "reason to believe", "income escaped", "fresh tangible material", "change of opinion", "income tax"], "facts": "The Income Tax Officer sought to reopen Kelvinator's completed assessments under Section 147 of the Income Tax Act on the basis that income had escaped assessment. Kelvinator argued that the reopening was based on a mere change of opinion and not on any fresh tangible material that gave reason to believe income had escaped assessment.", "judgement": "The Supreme Court held that reopening of a completed assessment under Section 147 requires the existence of fresh tangible material giving the Assessing Officer reason to believe that income has escaped assessment. A mere change of opinion by the successor officer about a view taken by the predecessor does not constitute sufficient reason to believe. The power to reopen cannot be exercised on a review of the original order.", "principle": "Reassessment under Section 147 of the Income Tax Act requires fresh tangible material — the discovery of new facts or new evidence that indicates income has escaped assessment. The power cannot be exercised merely because a new officer takes a different view on the same facts. This is the leading authority on the limits of the power to reopen completed assessments and is one of the most frequently cited cases in income tax litigation."}, {"id": "principal-commissioner-v-super-max-2011", "title": "ACIT v. Rajesh Jhaveri Stock Brokers Pvt. Ltd.", "citation": "(2007) 291 ITR 500 (SC)", "court": "Supreme Court of India", "year": 2007, "bench": 2, "judges": ["P.P. Naolekar J", "S.H. Kapadia J"], "subject": "Tax Law", "tags": ["Section 147", "reassessment", "return filed", "Section 143(1)", "intimation", "income escaped", "reason to believe"], "facts": "Rajesh Jhaveri Stock Brokers filed its return of income which was processed under Section 143(1) with an intimation. The Assessing Officer subsequently sought to reopen the assessment under Section 147. The question was whether a return processed under Section 143(1) resulted in a 'completed assessment' such that reopening required the higher threshold of fresh tangible material.", "judgement": "The Supreme Court held that the processing of a return under Section 143(1) does not constitute an 'assessment' for the purposes of Section 147. Where a return has merely been processed under Section 143(1), the threshold for reopening is lower — the Assessing Officer needs only a reason to believe that income has escaped assessment, without needing fresh tangible material.", "principle": "There is a distinction between an assessment completed after scrutiny and a return merely processed under Section 143(1). For a return processed under Section 143(1), reopening requires only a reason to believe that income has escaped assessment, without the requirement of fresh tangible material applicable to scrutiny assessments. This case defines the scope of the Kelvinator principle and its limits."}, {"id": "commissioner-service-tax-v-ims-health-2012", "title": "Commissioner of Service Tax v. Bharti Airtel Ltd.", "citation": "(2014) 48 GST 38 (SC)", "court": "Supreme Court of India", "year": 2014, "bench": 2, "judges": ["T.S. Thakur J", "C. Nagappan J"], "subject": "Tax Law", "tags": ["service tax", "telecom", "roaming charges", "SIM card", "sim based services", "Finance Act", "taxability"], "facts": "Bharti Airtel charged roaming tariffs to subscribers using its network outside their home circle. A question arose whether the roaming service provided by the host network to the home network's subscriber constituted a taxable service and who the service recipient was — the home network or the subscriber.", "judgement": "The Supreme Court held that roaming services provided by a host telecom network to subscribers of another operator's network are taxable services under the Finance Act. The home network operator is the recipient of the roaming service, not the individual subscriber. The transaction is B2B and taxable as a telecommunications service.", "principle": "In telecom roaming arrangements, the host network provides a service to the home network (not directly to the subscriber), making the home network the assessable service recipient. The commercial reality of telecom inter-operator agreements determines the characterisation of the transaction for service tax purposes. This case is important for understanding the taxation of telecom inter-company transactions."}, {"id": "in-re-icici-bank-advance-ruling-2014", "title": "In Re: ICICI Bank Ltd.", "citation": "2014 AAR 34", "court": "Authority for Advance Rulings", "year": 2014, "bench": 2, "judges": ["V.S. Sirpurkar J (Chairman)", "A.K. Tiwari J"], "subject": "Tax Law", "tags": ["permanent establishment", "branch", "DTAA", "attributable profits", "banking", "Section 9", "income tax", "India-UAE treaty"], "facts": "ICICI Bank's UAE branch received interest income from Indian borrowers. ICICI Bank sought an advance ruling on whether such interest was taxable in India. The question was whether the UAE branch was a PE of ICICI Bank in the UAE and whether interest paid by Indian borrowers to the UAE branch was taxable in India.", "judgement": "The AAR held that the UAE branch of an Indian bank constitutes a PE in the UAE. Interest paid by Indian residents to a UAE PE of an Indian bank is attributable to the PE and is therefore not taxable in India under the India-UAE DTAA. The PE rule protects such income from Indian taxation.", "principle": "Interest income attributable to a foreign permanent establishment of an Indian company is not taxable in India if the applicable DTAA allocates taxing rights over such income to the country where the PE is located. Indian banks with overseas branches must carefully attribute income to the relevant PE to determine Indian tax liability. This case is significant for the taxation of cross-border banking income."}, {"id": "sesa-goa-v-commissioner-2015", "title": "Sesa Goa Ltd. v. Commissioner of Income Tax", "citation": "(2016) 383 ITR 537 (Goa HC)", "court": "Bombay High Court (Goa Bench)", "year": 2015, "bench": 2, "judges": ["F.M. Reis J", "M.S. Sonak J"], "subject": "Tax Law", "tags": ["mining", "royalty", "Section 80IB", "deduction", "mining undertaking", "extraction", "natural resources", "income tax"], "facts": "Sesa Goa, an iron ore mining company, claimed deduction under Section 80IB of the Income Tax Act for profits from its mining undertaking. The Revenue denied the deduction arguing that mining was not manufacturing or production of an article and therefore not eligible for the Section 80IB deduction.", "judgement": "The High Court held that extraction of iron ore from mines constitutes 'production' of an article within the meaning of Section 80IB. Mining involves the application of labour and capital to transform sub-surface deposits into commercially usable mineral commodities, which constitutes production. The deduction was upheld.", "principle": "The extraction of minerals from the earth constitutes 'production of an article' for the purposes of Section 80IB of the Income Tax Act. Mining is a productive activity that transforms natural deposits into commercially usable commodities, and profits from such activity are eligible for the deduction. This case is important for mining companies claiming industrial deductions under the Income Tax Act."}, {"id": "vsl-steels-v-commissioner-2017", "title": "JSW Steel Ltd. v. Commissioner of Income Tax", "citation": "(2018) 405 ITR 58 (Kar HC)", "court": "Karnataka High Court", "year": 2017, "bench": 2, "judges": ["S. Abdul Nazeer J", "Aravind Kumar J"], "subject": "Tax Law", "tags": ["capital goods", "CENVAT", "Section 43B", "duty paid", "capital expenditure", "credit", "steel manufacture"], "facts": "JSW Steel purchased capital goods and paid excise duty on them, claiming CENVAT credit. A question arose about the timing of the CENVAT credit entitlement and whether the credit could be availed immediately on payment of duty on the capital goods or only on installation and use.", "judgement": "The Karnataka High Court held that CENVAT credit on capital goods becomes available from the year in which the capital goods are received, not from the year of their installation. The credit rules allow a portion of the credit to be availed in the year of receipt and the balance in subsequent years. The timing of credit availability is as prescribed in the CENVAT Credit Rules.", "principle": "The CENVAT credit on capital goods is available in stages as prescribed by the CENVAT Credit Rules — a specified percentage in the year of receipt and the balance in subsequent years. The credit becomes available on receipt, not on installation or use. This case clarifies the timing rules for capital goods credit in the manufacturing sector and is important for capital-intensive industries."}, {"id": "commissioner-customs-v-dilip-kumar-2018", "title": "Commissioner of Customs v. Dilip Kumar and Company", "citation": "(2018) 9 SCC 1", "court": "Supreme Court of India", "year": 2018, "bench": 5, "judges": ["Ranjan Gogoi J", "R. Banumathi J", "Navin Sinha J", "Mohan M. Shantanagoudar J", "S. Abdul Nazeer J"], "subject": "Tax Law", "tags": ["customs duty", "exemption notification", "strict construction", "benefit", "assessee", "interpretation", "ambiguity"], "facts": "Dilip Kumar and Company claimed exemption from customs duty under a notification issued by the government. A dispute arose about the interpretation of the exemption notification — specifically whether the goods imported fell within the scope of the exemption. The assessee relied on a broad reading of the notification.", "judgement": "The Constitution Bench of the Supreme Court overruled the earlier position and held that exemption notifications under taxing statutes must be strictly construed. If there is ambiguity in an exemption provision, the ambiguity must be resolved in favour of the Revenue, not the assessee. The benefit of doubt in interpreting exemptions goes to the Revenue.", "principle": "Exemption notifications under customs and other tax statutes must be strictly construed. The earlier rule that ambiguities in exemptions are to be resolved in favour of the assessee was overruled. If the words of an exemption are clear, they are given their plain meaning; if ambiguous, the ambiguity is resolved against the claimant of the exemption. This is a landmark ruling that significantly changed the approach to interpreting tax exemptions in India."}, {"id": "cit-v-cochin-company-2018", "title": "M/s Kerala State Cooperative Marketing Federation Ltd. v. CIT", "citation": "(1998) 5 SCC 48", "court": "Supreme Court of India", "year": 1998, "bench": 2, "judges": ["S.P. Bharucha J", "S.C. Sen J"], "subject": "Tax Law", "tags": ["cooperative society", "income tax", "deduction", "Section 80P", "trading income", "members", "non-members", "exemption"], "facts": "The Kerala State Cooperative Marketing Federation sought deduction under Section 80P of the Income Tax Act for income derived from its cooperative activities. The Revenue contended that certain income earned from non-members was not entitled to the Section 80P deduction, which is available only for income from activities with members.", "judgement": "The Supreme Court held that the deduction under Section 80P is available to cooperative societies for income derived from their primary cooperative activities with their members. Income from activities with non-members does not qualify for the deduction. The deduction is specifically designed to promote the cooperative sector by providing tax relief on member-to-member cooperative activities.", "principle": "Section 80P deductions for cooperative societies are limited to income from cooperative activities with members. Income from transactions with non-members is not entitled to the deduction. This interpretation gives effect to the legislative purpose of Section 80P, which is to encourage the cooperative form of economic organisation by providing tax relief for cooperative activities proper."}, {"id": "re-five-minute-car-wash-1966", "title": "Re Five Minute Car Wash Service Ltd.", "citation": "[1966] 1 WLR 745", "court": "Chancery Division (UK)", "year": 1966, "bench": 1, "judges": ["Buckley J"], "subject": "Company Law", "tags": ["just and equitable winding up", "oppression", "directorial misconduct", "minority", "private company", "breakdown of trust"], "facts": "A minority shareholder in a small private company petitioned for winding up on the just and equitable ground. The majority shareholders and directors had systematically excluded the minority from information about the company's affairs, paid themselves excessive remuneration, and failed to distribute profits as dividends.", "judgement": "The court held that the conduct of the majority amounted to a course of conduct justifying a winding-up order. The failure to share information, the excessive remuneration, and the refusal to pay dividends collectively amounted to oppression of the minority in a company that was in substance a quasi-partnership.", "principle": "A pattern of exclusion from information, excessive remuneration of the majority, and refusal to pay dividends can collectively amount to oppression justifying winding up or relief under company law. Courts look at the cumulative effect of majority conduct in quasi-partnership companies when assessing whether the minority has been treated in a manner incompatible with the company's quasi-partnership character."}, {"id": "pedro-v-sao-joao-2003", "title": "SEBI v. Sterlite Industries Ltd.", "citation": "(2003) 15 SCC 208", "court": "Supreme Court of India", "year": 2003, "bench": 2, "judges": ["N. Santosh Hegde J", "B.P. Singh J"], "subject": "Company Law", "tags": ["SEBI", "GDR", "Global Depositary Receipts", "securities", "overseas listing", "Indian company", "disclosure"], "facts": "Sterlite Industries issued Global Depositary Receipts overseas and SEBI sought to regulate the issuance of GDRs by Indian companies on the ground that GDRs are 'securities' under the SEBI Act. Sterlite argued that GDRs issued overseas were beyond SEBI's jurisdiction.", "judgement": "The Supreme Court upheld SEBI's jurisdiction over GDR issuances by Indian companies. Indian companies remain subject to SEBI's regulatory oversight when they raise capital overseas through instruments representing their underlying equity. The fact that the instruments are listed overseas does not remove them from the scope of SEBI's regulatory ambit.", "principle": "SEBI has jurisdiction over securities issued by Indian companies even when such securities are listed on foreign exchanges. The regulatory reach of SEBI extends to all instruments that represent an interest in an Indian company's equity, including GDRs and ADRs. This case is foundational for the regulation of cross-border capital raising by Indian companies."}, {"id": "central-bank-india-v-ravindra-2001", "title": "Central Bank of India v. Ravindra", "citation": "(2002) 1 SCC 367", "court": "Supreme Court of India", "year": 2001, "bench": 3, "judges": ["R.C. Lahoti J", "Brijesh Kumar J", "Ashok Bhan J"], "subject": "Company Law", "tags": ["bank mortgage", "SARFAESI", "security interest", "NPA", "equitable mortgage", "deposit of title deeds", "enforcement"], "facts": "Central Bank of India sought to enforce its security interest over mortgaged property of a defaulting borrower. A dispute arose about the nature of the mortgage and the bank's right to enforce it under the applicable law. The case raised questions about the validity of equitable mortgages by deposit of title deeds.", "judgement": "The Supreme Court upheld the validity of equitable mortgages created by deposit of title deeds as a form of security recognised under the Transfer of Property Act. Banks can enforce such mortgages by sale of the mortgaged property. The Court laid down principles for the calculation of the amount due to the bank including compound interest where the contract so provides.", "principle": "An equitable mortgage created by deposit of title deeds is a valid security interest that can be enforced by the mortgagee. Banks are entitled to compound interest on their dues where the loan agreement provides for it. This case is significant for the enforcement of bank securities and preceded the enactment of the SARFAESI Act, which created a statutory framework for security enforcement."}, {"id": "kck-radha-krishna-v-tata-consultancy-2009", "title": "Alstom Ltd. v. Siemens AG", "citation": "2015 SCC OnLine Del 7452", "court": "Delhi High Court", "year": 2015, "bench": 1, "judges": ["Manmohan J"], "subject": "Company Law", "tags": ["merger", "Competition Act", "combination", "CCI", "notification", "gun jumping", "competition law"], "facts": "Alstom's energy and grid businesses were being acquired by Siemens and GE respectively. Questions arose about the notification requirements under the Competition Act for these combinations and whether any steps taken before CCI approval amounted to 'gun jumping' — implementing a combination before receiving regulatory clearance.", "judgement": "The Delhi High Court examined the requirements of the Competition Act for notification of combinations and the consequences of gun jumping. The Court held that parties to a notifiable combination must obtain CCI approval before implementing any aspect of the combination that has an effect in India. Pre-implementation steps that affect the competitive dynamics in India may constitute gun jumping.", "principle": "Parties to a notifiable combination under the Competition Act must obtain CCI clearance before implementing any steps that affect competitive conditions in India. Gun jumping — taking steps to implement a combination before approval — can attract penalties under the Competition Act. This case is important for understanding the scope of pre-merger notification requirements in India."}, {"id": "corporate-veil-cci-v-cci-steel-2015", "title": "CCI v. Steel Authority of India Ltd.", "citation": "(2010) 10 SCC 744", "court": "Supreme Court of India", "year": 2010, "bench": 2, "judges": ["Dalveer Bhandari J", "Mukundakam Sharma J"], "subject": "Company Law", "tags": ["Competition Act", "CCI", "interim order", "COMPAT", "procedure", "natural justice", "dominant position"], "facts": "The Competition Commission of India passed an interim order under Section 33 of the Competition Act against Steel Authority of India. SAIL challenged the interim order arguing procedural impropriety and that the CCI had not followed the principles of natural justice before passing the order. Questions arose about the CCI's power to pass interim orders.", "judgement": "The Supreme Court held that the CCI must give a party whose conduct is in question an opportunity to be heard before passing an interim order under Section 33. The power to pass interim orders does not override the fundamental requirements of natural justice. The order against SAIL was set aside for failure to afford a hearing.", "principle": "The CCI must observe principles of natural justice, including giving a hearing to the affected party, before passing an interim order under Section 33 of the Competition Act. Regulatory bodies, however pressing the urgency, cannot pass orders affecting parties without affording them an opportunity to be heard. This case established the procedural framework for CCI interim orders."}, {"id": "v-nithyanandam-v-union-2014", "title": "Daiichi Sankyo Co. Ltd. v. Malvinder Mohan Singh", "citation": "(2018) 16 SCC 387", "court": "Supreme Court of India", "year": 2018, "bench": 3, "judges": ["Ranjan Gogoi J", "Navin Sinha J", "K.M. Joseph J"], "subject": "Company Law", "tags": ["foreign arbitral award", "enforcement", "New York Convention", "fraud", "public policy", "Section 48", "Arbitration Act"], "facts": "Daiichi Sankyo, a Japanese pharmaceutical company, obtained a large arbitral award against Malvinder and Shivinder Singh for misrepresentation in the sale of Ranbaxy. When the Singhs failed to satisfy the award, Daiichi sought to enforce it in India against various assets. The Singhs challenged enforcement on grounds of public policy.", "judgement": "The Supreme Court upheld enforcement of the foreign arbitral award. The Court held that the enforcement of a foreign award can only be refused on the limited grounds specified in Section 48 of the Arbitration and Conciliation Act. Disputes about the merits of the claim cannot be re-litigated at the enforcement stage. The narrow public policy exception does not include general questions of Indian law.", "principle": "The enforcement of foreign arbitral awards in India is governed by the narrow grounds specified in Section 48 of the Arbitration Act. Indian courts at the enforcement stage do not re-examine the merits of the award. The public policy exception to enforcement is narrowly construed and does not permit a general review of the award. This case is the leading authority on enforcement of foreign awards in India."}, {"id": "maruti-rustomji-v-cit-1993", "title": "Edelweiss Financial Services Ltd. v. Essar Ports Ltd.", "citation": "2016 SCC OnLine NCLAT 97", "court": "National Company Law Appellate Tribunal", "year": 2016, "bench": 2, "judges": ["S.J. Mukhopadhaya J (Chairman)", "Balvinder Singh J"], "subject": "Company Law", "tags": ["debentures", "financial debt", "IBC", "CIRP", "Section 7", "default", "threshold", "creditor"], "facts": "Edelweiss Financial Services held debentures issued by Essar Ports. When Essar Ports defaulted on the debentures, Edelweiss filed an application under Section 7 of the IBC to initiate corporate insolvency resolution proceedings. The question was whether debenture holders qualify as 'financial creditors' under the IBC and can initiate CIRP.", "judgement": "The NCLAT held that debenture holders are financial creditors under the IBC. Debentures are instruments of financial debt and a holder of debentures who is owed a financial debt can initiate CIRP under Section 7 upon default. The threshold of minimum default applies equally to debenture holders.", "principle": "Debenture holders are financial creditors under the Insolvency and Bankruptcy Code and can initiate corporate insolvency resolution proceedings on default. Debentures constitute a financial debt as they represent money borrowed with a commitment to repay with interest. This ruling expanded the class of financial creditors who can invoke the IBC's resolution mechanism."}, {"id": "byford-v-butler-2003", "title": "In Re: Cadila Pharmaceuticals Ltd.", "citation": "2019 SCC OnLine NCLT 4218", "court": "National Company Law Tribunal, Ahmedabad", "year": 2019, "bench": 2, "judges": ["H.V. Subba Rao J (Member Technical)", "Manorama Kumari J (Member Judicial)"], "subject": "Company Law", "tags": ["scheme of merger", "Section 230", "Companies Act 2013", "NCLT", "tribunal jurisdiction", "cross-border merger", "procedural requirements"], "facts": "Cadila Pharmaceuticals proposed a merger scheme between two group companies under Sections 230-232 of the Companies Act 2013. The NCLT, as the forum replacing the High Courts post Companies Act 2013, was required to sanction the scheme. Questions arose about the procedural requirements before the NCLT for scheme sanction.", "judgement": "The NCLT laid down the procedural framework for scheme sanction under the Companies Act 2013. The Tribunal must be satisfied that all statutory requirements have been met, including proper notice to creditors, shareholders, and regulators, and that the scheme is fair and reasonable. The Tribunal has power to modify the scheme if required.", "principle": "The NCLT, having replaced High Courts as the forum for scheme sanction under the Companies Act 2013, applies the same substantive standards as High Courts previously applied. The Tribunal must independently assess the fairness and reasonableness of the scheme and has the power to impose conditions or modifications. Procedural compliance with notice and disclosure requirements is mandatory."}, {"id": "prakash-roadlines-v-cit-2001", "title": "In Re: Videocon Industries Ltd.", "citation": "2021 SCC OnLine NCLAT 287", "court": "National Company Law Appellate Tribunal", "year": 2021, "bench": 3, "judges": ["S.J. Mukhopadhaya J (Chairman)", "Bansi Lal Bhat J", "Justice Jarat Kumar Jain J"], "subject": "Company Law", "tags": ["IBC", "group insolvency", "substantive consolidation", "pooling of assets", "related companies", "CIRP", "Videocon"], "facts": "Videocon Industries and numerous related companies went into insolvency simultaneously. The resolution applicant proposed a consolidated resolution plan covering multiple Videocon group entities. Questions arose about whether multiple CIRP proceedings could be consolidated and whether assets and liabilities of related companies could be pooled.", "judgement": "The NCLAT upheld the substantive consolidation of related Videocon group companies for the purposes of the resolution plan. Where companies in a group share assets, liabilities, management, and financial arrangements to such an extent that they cannot be effectively resolved as separate entities, consolidation may be permitted in the interests of maximising value.", "principle": "Indian insolvency law, while not expressly providing for group insolvency, permits substantive consolidation of related companies in exceptional circumstances where the intertwining of affairs makes separate resolution impractical. This case is the leading authority on group insolvency in India and has prompted calls for express legislative provision for group insolvency under the IBC."}, {"id": "lakshmidas-morarji-v-sebi-2018", "title": "Sterlite Technologies Ltd. v. SEBI", "citation": "2019 SCC OnLine SAT 205", "court": "Securities Appellate Tribunal", "year": 2019, "bench": 1, "judges": ["Justice Tarun Agarwala (Presiding Officer)"], "subject": "Company Law", "tags": ["SEBI", "disclosure", "LODR", "listed company", "continuous disclosure", "material event", "SEBI Regulations", "KYC"], "facts": "Sterlite Technologies was found to have delayed disclosure of a material event — specifically a significant business development — to the stock exchanges as required under SEBI's Listing Obligations and Disclosure Requirements Regulations. SEBI imposed a penalty for the delayed disclosure. Sterlite challenged the penalty as disproportionate.", "judgement": "The SAT held that prompt disclosure of material events is a fundamental obligation of listed companies. Delay in making required disclosures violates investor confidence in the capital markets and attracts regulatory sanction. The penalty was upheld as proportionate to the gravity of the delay in disclosure.", "principle": "Listed companies have a continuous obligation to promptly disclose material events that may affect the price of their securities. Delay in making required disclosures violates the LODR Regulations and attracts penalties. Timely disclosure is the cornerstone of investor protection in the capital markets and listed companies must have robust systems to identify and disclose material events promptly."}, {"id": "sca-hygiene-products-v-first-quality-baby-2017", "title": "In Re: Jet Airways (India) Ltd. Resolution", "citation": "2019 SCC OnLine NCLAT 900", "court": "National Company Law Appellate Tribunal", "year": 2019, "bench": 2, "judges": ["S.J. Mukhopadhaya J (Chairman)", "Bansi Lal Bhat J"], "subject": "Company Law", "tags": ["IBC", "airline insolvency", "operational creditor", "employee dues", "resolution", "Jet Airways", "aviation"], "facts": "Jet Airways went into insolvency and its resolution was complicated by the aviation sector's regulatory requirements, the cross-border nature of aircraft leasing, and large unpaid employee dues. The NCLAT was called upon to address the treatment of employee dues, aircraft lessor claims, and the special considerations applicable to aviation sector insolvencies.", "judgement": "The NCLAT addressed various procedural and substantive issues in the Jet Airways insolvency. The Court recognised the unique features of aviation insolvency including the status of lessors of aircraft under the Cape Town Convention and the priority of workman dues. The resolution process must comply with aviation sector regulations.", "principle": "Aviation sector insolvencies present unique challenges including the treatment of lessors under international conventions (Cape Town Convention), the regulatory requirements for airline operations, and the significant employee dues. The IBC must be applied in a manner consistent with India's international treaty obligations and sector-specific regulations. Jet Airways established important precedents for aviation insolvency in India."}, {"id": "in-re-article-21-covid-2020", "title": "In Re: Problems and Miseries of Migrant Labourers", "citation": "2020 SCC OnLine SC 411", "court": "Supreme Court of India", "year": 2020, "bench": 3, "judges": ["L. Nageswara Rao J", "S.K. Kaul J", "B.R. Gavai J"], "subject": "Constitutional Law", "tags": ["migrant workers", "COVID-19", "Article 21", "right to food", "shelter", "humanitarian", "suo motu", "PIL"], "facts": "During the COVID-19 lockdown, millions of migrant workers were stranded across India without food, shelter, or means to return to their home states. The Supreme Court took suo motu cognizance of their plight and issued directions to governments to provide food, shelter, and transportation to stranded workers.", "judgement": "The Supreme Court held that the State has a constitutional obligation to ensure that citizens are not deprived of food and basic necessities in times of crisis. The right to life under Article 21 encompasses the right to food, shelter, and the basic means of survival. The Court issued comprehensive directions to central and state governments to provide relief to migrant workers.", "principle": "The right to life under Article 21 includes the right to food and basic necessities of life, particularly in crisis situations. The State has an affirmative obligation to protect the right to life by ensuring access to food and shelter for vulnerable populations. Suo motu cognizance by the Supreme Court in humanitarian crises is a legitimate exercise of judicial power under Article 32."}, {"id": "sudha-rustagi-v-union-2015", "title": "National Legal Services Authority v. Union of India", "citation": "(2014) 5 SCC 438", "court": "Supreme Court of India", "year": 2014, "bench": 2, "judges": ["K.S. Panicker Radhakrishnan J", "A.K. Sikri J"], "subject": "Constitutional Law", "tags": ["transgender rights", "Article 14", "Article 21", "third gender", "gender identity", "dignity", "NALSA", "self-identification"], "facts": "NALSA filed a petition seeking recognition of transgender persons as a third gender and enforcement of their fundamental rights. Transgender persons faced systemic discrimination in education, employment, healthcare, and public life. The petition sought recognition of their gender identity without requiring sex reassignment surgery.", "judgement": "The Supreme Court unanimously recognised transgender persons as a third gender. Gender identity is a fundamental right under Articles 14 and 21. The right to self-identification of gender — without requiring surgery or hormonal treatment — is protected under Article 21. The Court directed governments to take affirmative steps to include transgender persons in OBC reservations and to ensure their access to education, employment, and healthcare.", "principle": "Transgender persons have a fundamental right to be recognised as a third gender under Articles 14 and 21 of the Constitution. Gender identity — one's internal sense of gender — is a core aspect of personal liberty protected by Article 21. The State cannot require surgical or medical alteration as a condition for recognising gender identity. This is a landmark judgment on gender identity rights in India."}, {"id": "saurabh-chaudhary-v-union-2003", "title": "Ashok Kumar Thakur v. Union of India", "citation": "(2008) 6 SCC 1", "court": "Supreme Court of India", "year": 2008, "bench": 5, "judges": ["K.G. Balakrishnan CJ", "Dalveer Bhandari J", "R.V. Raveendran J", "Arijit Pasayat J", "C.K. Thakker J"], "subject": "Constitutional Law", "tags": ["OBC reservations", "27% Central Educational Institutions", "93rd Amendment", "Article 15(5)", "creamy layer", "higher education", "IIT IIM"], "facts": "The 93rd Constitutional Amendment inserted Article 15(5), enabling the State to provide reservations for OBCs in private unaided educational institutions and centrally funded institutions including IITs and IIMs. The Central Educational Institutions (Reservation in Admission) Act 2006 implemented 27% OBC reservations. The constitutional validity of both the amendment and the Act was challenged.", "judgement": "The Supreme Court upheld the 93rd Amendment and the CEI Act but read in the requirement that the creamy layer must be excluded from OBC reservations in central institutions. The Court held that Parliament cannot provide reservations without excluding the creamy layer, as this would undermine the principle of equal opportunity. The total reservation in central institutions was capped at 50%.", "principle": "Reservations for OBCs in centrally funded educational institutions are constitutionally valid but must exclude the creamy layer and must not exceed the 50% ceiling. The creamy layer exclusion is a constitutional requirement that cannot be overridden by legislation. This case extended the Indra Sawhney principles to the domain of higher education reservations."}, {"id": "union-india-v-r-gandhi-2010", "title": "Union of India v. R. Gandhi", "citation": "(2010) 11 SCC 1", "court": "Supreme Court of India", "year": 2010, "bench": 5, "judges": ["K.G. Balakrishnan CJ", "S.H. Kapadia J", "B. Sudershan Reddy J", "P. Sathasivam J", "Aftab Alam J"], "subject": "Constitutional Law", "tags": ["NCLT", "CLB", "High Court jurisdiction", "Company Law Tribunal", "Article 323B", "separation of powers", "basic structure"], "facts": "The Companies (Second Amendment) Act 2002 proposed to establish the National Company Law Tribunal and the National Company Law Appellate Tribunal to replace the High Courts' jurisdiction in company matters. R. Gandhi and others challenged the transfer of jurisdiction to the tribunals as violating the basic structure of the Constitution.", "judgement": "The Supreme Court upheld the establishment of the NCLT and NCLAT in principle but struck down specific provisions relating to the qualifications and tenure of members that compromised judicial independence. The Court held that tribunals exercising judicial power must have members with judicial qualifications and must be insulated from executive interference.", "principle": "Tribunals exercising judicial functions of the nature previously exercised by High Courts must be composed of members with judicial qualifications and must be independent of the executive. While Parliament can create tribunals to discharge judicial functions, such tribunals must maintain the essential attributes of judicial independence. This case established the constitutional requirements for the design of NCLT and similar adjudicatory bodies."}, {"id": "state-of-up-v-ram-achal-2018", "title": "State of Uttar Pradesh v. Ram Achal Singh", "citation": "(2018) 9 SCC 704", "court": "Supreme Court of India", "year": 2018, "bench": 2, "judges": ["A.K. Sikri J", "Ashok Bhushan J"], "subject": "Constitutional Law", "tags": ["service law", "promotion", "ACR", "annual confidential report", "opportunity to represent", "Article 16", "natural justice"], "facts": "A state government employee was denied promotion on the basis of adverse entries in his Annual Confidential Report. He challenged the denial on the ground that he had not been informed of the adverse entries and had not been given an opportunity to represent against them before promotion was denied.", "judgement": "The Supreme Court held that where adverse entries in an ACR form the basis for denial of promotion, the employee must be informed of those entries and given an opportunity to make a representation. The principles of natural justice apply to promotion decisions, particularly where they are adverse to the employee's career interests.", "principle": "The right to be informed of adverse entries in an Annual Confidential Report and to make a representation before those entries are acted upon is a requirement of natural justice applicable to public employment. The right to equality in public employment under Article 16 includes the right to a fair assessment process. ACR entries cannot be used against an employee without being communicated to them."}, {"id": "deepak-sibal-v-punjab-university-1989", "title": "Deepak Sibal v. Punjab University", "citation": "AIR 1989 SC 903", "court": "Supreme Court of India", "year": 1989, "bench": 2, "judges": ["E.S. Venkataramiah J", "K.N. Singh J"], "subject": "Constitutional Law", "tags": ["university", "autonomy", "Article 19(1)(g)", "private coaching", "regulation", "course recognition", "higher education"], "facts": "Punjab University refused to recognise courses conducted by private coaching institutes for the purpose of university examination eligibility. Students who had attended only private coaching without attending regular college classes challenged the university's refusal to grant them examination eligibility.", "judgement": "The Supreme Court held that a university has the right to prescribe conditions for examination eligibility, including requirements of attendance at recognised institutions. Such conditions are a reasonable exercise of academic autonomy. Students do not have an absolute right to appear in university examinations regardless of how they have prepared.", "principle": "Universities have wide autonomy in prescribing conditions for examination eligibility and in setting academic standards. Requiring students to attend recognised institutions as a condition for examination eligibility is a reasonable regulation of higher education. Academic autonomy is a component of the right to establish and administer educational institutions."}, {"id": "sudhir-kumar-v-union-india-1987", "title": "Kathi Raning Rawat v. State of Saurashtra", "citation": "AIR 1952 SC 123", "court": "Supreme Court of India", "year": 1952, "bench": 5, "judges": ["Patanjali Sastri CJ", "Mehr Chand Mahajan J", "Mukherjea J", "Das J", "Chandrasekhara Aiyar J"], "subject": "Constitutional Law", "tags": ["Article 14", "classification", "special courts", "trial procedure", "reasonable nexus", "intelligible differentia", "criminal law"], "facts": "The Saurashtra State established special courts for the trial of certain categories of offences with a different procedure than ordinary courts. The accused challenged this as a violation of Article 14, arguing that the selection of cases for trial by the special procedure was arbitrary and discriminatory.", "judgement": "The Supreme Court upheld the establishment of special courts. The Court held that the legislature is entitled to create distinct classes of offences and provide for their trial by special procedure, provided there is an intelligible differentia between the classes and the differentia has a rational nexus to the object of the legislation. Classification of offences for special trial is permissible if reasonably based.", "principle": "The legislature has wide latitude to classify offences for different modes of trial, including by special courts with expedited procedures. The classification must be based on an intelligible differentia with a rational nexus to the legislative object. The mere creation of different procedures for different classes of offences does not violate Article 14 if the classification is reasonable. This case elaborated the two-pronged test for Article 14 classification."}, {"id": "ms-narayan-menon-v-state-of-kerala-1958", "title": "State of Bombay v. United Motors (India) Ltd.", "citation": "AIR 1953 SC 252", "court": "Supreme Court of India", "year": 1953, "bench": 7, "judges": ["Patanjali Sastri CJ", "Mukherjea J", "Das J", "Vivian Bose J", "Ghulam Hasan J", "Chandrasekhara Aiyar J", "Bhagwati J"], "subject": "Constitutional Law", "tags": ["Article 301", "freedom of trade", "Article 302", "Article 304", "inter-state trade", "sales tax", "constitutional interpretation"], "facts": "The State of Bombay levied sales tax on motor cars. United Motors challenged the tax as an infringement of the freedom of trade and commerce guaranteed under Article 301 of the Constitution. The question was whether a State tax on goods constituted a restriction on freedom of trade under Article 301.", "judgement": "The Supreme Court held that Article 301 guarantees freedom of trade and commerce from all restrictions, including taxation. However, States may impose non-discriminatory taxes on goods under Article 304, provided they do not amount to a prohibition on trade. A compensatory tax levied to meet the cost of facilities provided to traders may be permissible.", "principle": "Article 301 guarantees freedom of trade and commerce from all restrictions, but States can impose non-discriminatory taxes under Article 304. The distinction between a permissible regulatory tax and an impermissible restriction on trade requires examination of whether the tax is non-discriminatory and proportionate. This is a fo
