y", "Section 37", "enduring advantage", "licence"], "facts": "Empire Jute Company paid a lump sum to acquire the right to work additional looms under a government licensing scheme for the jute industry. The Revenue treated this as capital expenditure on the grounds that it conferred an enduring advantage. The company argued it was a revenue expenditure incurred in the course of carrying on business.", "judgement": "The Supreme Court held that the payment was revenue expenditure. The right to work additional looms did not create or acquire a new capital asset — it merely enabled the company to operate more looms in the ordinary course of its business. The advantage was operational, not capital in nature.", "principle": "The enduring benefit test must be applied with care — not every advantage that enures for more than one year is a capital advantage. Where a payment enables a business to function more efficiently in the course of its trade without creating a new asset or altering its business structure, it is revenue expenditure. Empire Jute is a leading case on this nuanced capital-revenue distinction."}, {"id": "cit-v-nainital-bank-1965", "title": "CIT v. Nainital Bank Ltd.", "citation": "(1965) 55 ITR 707 (SC)", "court": "Supreme Court of India", "year": 1965, "bench": 3, "judges": ["Subba Rao J", "Bachawat J", "Ramaswami J"], "subject": "Tax Law", "tags": ["income tax", "bank", "interest on securities", "investment income", "business income", "Section 28", "Section 56"], "facts": "Nainital Bank earned interest on securities held as statutory reserves required under banking regulations. The question was whether such interest constituted 'income from business' under Section 28 or 'income from other sources' under Section 56 of the Income Tax Act. The distinction had implications for available deductions.", "judgement": "The Supreme Court held that interest earned by a bank on statutory reserve investments is income from business, not income from other sources. For a banking company, investment in securities and earning interest thereon is part of its ordinary business activity. The bank's business includes lending and investing, and income from both sources is business income.", "principle": "For a banking company, interest income on statutory investments and securities is business income. The concept of 'business income' for a bank is wide enough to include all income arising from the deployment of funds in the course of banking activities. This case is foundational for the taxation of investment income of banking and financial companies."}, {"id": "cit-v-vegetable-products-1973", "title": "CIT v. Vegetable Products Ltd.", "citation": "(1973) 88 ITR 192 (SC)", "court": "Supreme Court of India", "year": 1973, "bench": 3, "judges": ["Ray J", "Palekar J", "Dwivedi J"], "subject": "Tax Law", "tags": ["tax refund", "deduction", "Section 80", "advance tax", "self-assessment", "overpayment", "excess tax paid"], "facts": "The assessee had paid advance tax that exceeded its final tax liability. A dispute arose about the assessee's entitlement to interest on the refund of the excess advance tax, and about the method by which the excess tax was to be identified and refunded. The Income Tax Act provided for refunds but the procedure and interest provisions were contested.", "judgement": "The Supreme Court held that where there is ambiguity in a taxing provision, the interpretation more favourable to the taxpayer should be adopted. The Court held that provisions for relief and refund should be construed liberally so as not to deny taxpayers the benefit Parliament intended to confer.", "principle": "Provisions of a taxing statute that provide for exemptions, deductions, or refunds must be interpreted in a manner that gives effect to their intent and does not deny legitimate fiscal relief. Where there is ambiguity in a provision for relief, the taxpayer-friendly interpretation is to be preferred. This case established the rule of beneficial interpretation in favour of taxpayers for relief provisions."}, {"id": "wipro-finance-v-cit-2005", "title": "CIT v. Wipro Finance Ltd.", "citation": "(2005) 278 ITR 57 (Kar HC)", "court": "Karnataka High Court", "year": 2005, "bench": 2, "judges": ["V.G. Sabhahit J", "N.K. Patil J"], "subject": "Tax Law", "tags": ["NBFC", "income recognition", "hire purchase", "lease income", "Section 145", "accounting method", "RBI guidelines"], "facts": "Wipro Finance, a non-banking financial company engaged in hire purchase and leasing, recognised income under the hire purchase and leasing contracts on a basis consistent with RBI guidelines for NBFCs. The Income Tax department sought to substitute a different method of income recognition that would accelerate recognition of income for tax purposes.", "judgement": "The Karnataka High Court held that an NBFC that follows the income recognition norms prescribed by the RBI is entitled to recognise income under the same norms for income tax purposes. The Income Tax Act does not prescribe a specific method of income recognition for NBFCs and the RBI-prescribed method, being a recognised accounting method, must be accepted.", "principle": "Non-banking financial companies are entitled to recognise income in accordance with RBI-prescribed norms, which constitute a recognised accounting method under Section 145 of the Income Tax Act. Regulatory accounting requirements do not create a conflict with tax accounting — they are part of the legitimate accounting framework. This case is important for the taxation of financial sector companies."}, {"id": "sas-pharmaceuticals-v-cit-2011", "title": "CIT v. SAS Pharmaceuticals", "citation": "(2011) 335 ITR 1 (Del HC)", "court": "Delhi High Court", "year": 2011, "bench": 2, "judges": ["Muralidhar J", "Nandrajog J"], "subject": "Tax Law", "tags": ["scientific research", "Section 35(1)", "weighted deduction", "R&D company", "approved institution", "pharmaceutical", "income tax"], "facts": "SAS Pharmaceuticals incurred expenditure on scientific research carried out by an approved research institution on its behalf. A dispute arose about whether the expenditure qualified for the weighted deduction under Section 35(1)(ii) of the Income Tax Act and whether the research institution's approval was valid for the relevant year.", "judgement": "The Delhi High Court held that the weighted deduction under Section 35(1)(ii) is available in respect of payments made to approved scientific research associations or institutions. Where the institution had valid approval from the prescribed authority at the time of the donation, the deduction cannot be denied merely because the approval was subsequently revoked.", "principle": "The weighted deduction for contributions to approved scientific research institutions under Section 35(1)(ii) is available when made to an institution with valid approval at the time of contribution. Subsequent revocation of approval does not retrospectively disentitle the donor. Tax benefits based on regulatory approvals must give some certainty to taxpayers who relied on the approval in good faith."}, {"id": "cit-v-cargill-india-2017", "title": "CIT v. Cargill Global Trading (P) Ltd.", "citation": "(2016) 381 ITR 115 (Del HC)", "court": "Delhi High Court", "year": 2016, "bench": 2, "judges": ["S. Muralidhar J", "Vibhu Bakhru J"], "subject": "Tax Law", "tags": ["commodity trading", "DTAA", "permanent establishment", "business profits", "Article 7", "India-US treaty", "offshore trading"], "facts": "Cargill Global Trading, a US-based commodity trading company, conducted trading activities partly through its Indian subsidiary. The Revenue argued that Cargill US had a permanent establishment (PE) in India through its subsidiary's activities and that business profits attributable to the Indian PE were taxable in India under the India-US DTAA.", "judgement": "The Delhi High Court held that a subsidiary does not automatically create a PE for its parent company. The subsidiary must be acting as a dependent agent (not independently) for the parent to have a PE through the subsidiary. Where the subsidiary carries on its own business independently, it cannot be treated as a PE of the parent.", "principle": "The existence of a subsidiary in India does not automatically create a permanent establishment for a foreign parent company. A PE through an agent arises only where the agent is dependent on the principal and habitually exercises authority to conclude contracts on the principal's behalf. An independently operating subsidiary is not a PE of its parent. This is a key case in the growing body of Indian PE jurisprudence."}, {"id": "royal-british-bank-v-turquand-1856", "title": "Royal British Bank v. Turquand", "citation": "(1856) 6 E&B 327", "court": "Court of Exchequer Chamber (UK)", "year": 1856, "bench": 5, "judges": ["Jervis CJ", "Parke B", "Alderson B", "Platt B", "Martin B"], "subject": "Company Law", "tags": ["indoor management rule", "Turquand rule", "constructive notice", "company authority", "outsider protection", "ultra vires"], "facts": "The Royal British Bank lent money to a company acting on a bond signed by the company's directors. The company's articles required a resolution of shareholders before the directors could borrow. No such resolution had been passed. When the company defaulted, it argued that the bond was invalid as the internal procedure had not been followed.", "judgement": "The Court held that an outsider dealing with a company in good faith is entitled to assume that internal procedures of the company have been complied with. The bank could not be expected to verify whether the shareholder resolution had actually been passed. The bond was therefore binding on the company.", "principle": "The indoor management rule (Turquand rule) protects outsiders dealing with a company in good faith from the consequences of internal irregularities. An outsider is entitled to assume that all acts of internal management required by the company's constitution have been duly performed. This doctrine is foundational to commercial dealings with companies and has been codified in the Companies Act 2013 under the doctrine of constructive notice."}, {"id": "trevor-v-whitworth-1887", "title": "Trevor v. Whitworth", "citation": "(1887) 12 App Cas 409", "court": "House of Lords (UK)", "year": 1887, "bench": 5, "judges": ["Lord Halsbury LC", "Lord Watson", "Lord Fitzgerald", "Lord Macnaghten", "Lord Herschell"], "subject": "Company Law", "tags": ["share buyback", "capital reduction", "maintenance of capital", "prohibition", "company assets", "creditor protection"], "facts": "A company purchased its own shares from a shareholder. The question arose whether a company could lawfully purchase and hold its own shares. The liquidator of the company challenged the payment made for the shares, arguing that a company cannot traffic in its own shares.", "judgement": "The House of Lords held that a company cannot purchase its own shares. To permit companies to deal in their own shares would undermine the principle of maintenance of capital, which is the foundation of limited liability. Money paid by the company to purchase its own shares was paid unlawfully and was recoverable.", "principle": "A company cannot purchase its own shares as this would amount to a return of capital to shareholders in disguise and would defraud creditors who extended credit relying on the subscribed capital. The maintenance of capital doctrine prevents companies from returning capital to shareholders except in prescribed ways. This case established the prohibition on share buybacks, later modified by statute to permit buybacks under regulated conditions."}, {"id": "ashbury-railway-carriage-v-riche-1875", "title": "Ashbury Railway Carriage and Iron Co. Ltd. v. Riche", "citation": "(1875) LR 7 HL 653", "court": "House of Lords (UK)", "year": 1875, "bench": 7, "judges": ["Lord Cairns LC", "Lord Chelmsford", "Lord Hatherley", "Lord Selborne", "Lord Blackburn", "Lord Gordon", "Lord O'Hagan"], "subject": "Company Law", "tags": ["ultra vires", "objects clause", "memorandum of association", "company capacity", "void contract", "ratification"], "facts": "The Ashbury Railway Carriage Company entered into a contract to finance the construction of a railway in Belgium. Its memorandum of association limited its objects to making and selling railway carriages. The company then repudiated the contract and was sued for breach. The question was whether the contract was within the company's capacity.", "judgement": "The House of Lords held that the contract was ultra vires and void. A company incorporated under the Companies Acts has capacity only to do acts authorised by its memorandum of association. A contract beyond those powers is not merely voidable — it is void and cannot be ratified even by unanimous shareholder agreement.", "principle": "The ultra vires doctrine at its strictest: a company has no capacity to act beyond the objects stated in its memorandum of association, and any act or contract beyond those objects is void and cannot be ratified. This case established the doctrine of ultra vires in company law, later significantly modified by statute to protect outsiders dealing with companies in good faith."}, {"id": "cook-v-deeks-1916", "title": "Cook v. Deeks", "citation": "[1916] 1 AC 554", "court": "Privy Council (UK)", "year": 1916, "bench": 4, "judges": ["Lord Buckmaster LC", "Lord Atkinson", "Lord Sumner", "Lord Parmoor"], "subject": "Company Law", "tags": ["fiduciary duty", "corporate opportunity", "directors duties", "conflict of interest", "ratification", "minority shareholders"], "facts": "Three directors of a construction company diverted a lucrative railway construction contract from the company to themselves, forming a separate company to take the benefit. They then used their majority voting power to pass a resolution declaring that the company had no interest in the contract. A minority shareholder challenged this.", "judgement": "The Privy Council held that the directors had breached their fiduciary duty by appropriating a corporate opportunity. The majority shareholders could not ratify the directors' wrongdoing where it amounted to a fraud on the minority. The contract proceeds were held on constructive trust for the company.", "principle": "Directors who divert corporate opportunities for personal benefit commit a fraud on the company and breach their fiduciary duty. A majority of shareholders cannot ratify such fraud since it operates to the detriment of the company as a whole. The fraudulent majority exception to the rule in Foss v. Harbottle is established here — minority shareholders can bring a derivative action where the majority have committed a fraud on the company."}, {"id": "percival-v-wright-1902", "title": "Percival v. Wright", "citation": "[1902] 2 Ch 421", "court": "Chancery Division (UK)", "year": 1902, "bench": 1, "judges": ["Swinfen Eady J"], "subject": "Company Law", "tags": ["directors duties", "shareholders", "fiduciary duty", "share purchase", "confidential information", "insider information"], "facts": "Percival and others offered to sell their shares in a company to the directors. Negotiations were in progress for the sale of the whole company at a higher price, but the directors did not disclose this to the shareholders. The shareholders sold their shares at a price below what they would have received had they known of the takeover negotiations.", "judgement": "The court held that the directors owed no fiduciary duty to individual shareholders when purchasing their shares. Directors owe duties to the company as a whole, not to individual members. There was therefore no obligation on the directors to disclose the takeover negotiations to the selling shareholders.", "principle": "Directors owe their fiduciary duties to the company as a corporate entity, not to individual shareholders. A director purchasing shares from a shareholder is not in a fiduciary relationship with that shareholder in respect of the transaction. This case established the traditional position on directors' duties, later significantly modified by statutory insider trading rules and market abuse regulations."}, {"id": "northern-counties-securities-v-jackson-1974", "title": "Hogg v. Cramphorn Ltd.", "citation": "[1967] Ch 254", "court": "Chancery Division (UK)", "year": 1967, "bench": 1, "judges": ["Buckley J"], "subject": "Company Law", "tags": ["allotment of shares", "proper purpose", "directors powers", "takeover defence", "improper motive", "shareholders approval"], "facts": "The directors of Cramphorn Ltd., fearing a takeover, issued shares to a trust created by them, giving the trust and themselves voting control over the company. The purpose was to frustrate a takeover bid. A shareholder challenged the allotment as an improper exercise of the directors' power to issue shares.", "judgement": "The court held that the allotment of shares by the directors was invalid. Directors have power to issue shares for the purpose of raising capital, not for the purpose of manipulating voting control to defeat a takeover. Using the power of allotment for an improper purpose renders the allotment voidable, even if the directors acted in good faith believing they were protecting the company.", "principle": "Directors must exercise their powers for the proper purposes for which those powers were conferred. The power to allot shares is conferred to raise capital, not to manipulate voting control. An allotment made primarily to defeat a takeover or to perpetuate the directors' control is an improper exercise of power and is voidable. The proper purpose doctrine is a key constraint on directorial discretion."}, {"id": "associated-provincial-picture-houses-v-wednesbury-1948", "title": "In Re: Bharat Commerce and Industries Ltd.", "citation": "AIR 1958 Cal 554", "court": "Calcutta High Court", "year": 1958, "bench": 1, "judges": ["P.B. Mukharji J"], "subject": "Company Law", "tags": ["just and equitable winding up", "deadlock", "private company", "shareholder dispute", "India", "Companies Act 1956"], "facts": "Two equal shareholders in a private company had an irreconcilable dispute. The company's business could not be effectively managed because of the breakdown in the relationship between the two shareholders and directors. One shareholder petitioned for winding up on the just and equitable ground, arguing that the company was in substance a partnership that had broken down.", "judgement": "The Calcutta High Court held that the company, being in essence a quasi-partnership between two equal shareholders, could be wound up on the just and equitable ground. The breakdown of the relationship between the shareholders was so fundamental that it was just and equitable to wind up the company, consistent with the principle in Yenidje Tobacco.", "principle": "A private company that is in substance a quasi-partnership between its members may be wound up on the just and equitable ground when there is a complete and irremediable breakdown of trust and confidence between the members. This is one of the earliest Indian applications of the quasi-partnership doctrine established in English cases like Re Yenidje Tobacco."}, {"id": "standard-chartered-v-pakala-sugar-2004", "title": "Standard Chartered Bank v. Andhra Bank Financial Services Ltd.", "citation": "(2006) 6 SCC 94", "court": "Supreme Court of India", "year": 2004, "bench": 2, "judges": ["S.B. Sinha J", "P.K. Balasubramanyan J"], "subject": "Company Law", "tags": ["banking", "securities", "SGL account", "RBI", "fraud", "NPA", "securities scam", "repurchase agreement"], "facts": "In the context of the 1992 securities scam, questions arose about the liability of banks that had participated in securities transactions conducted through SGL (Subsidiary General Ledger) accounts at the RBI. Standard Chartered Bank had entered into transactions that were alleged to be part of the fraudulent scheme perpetrated by Harshad Mehta.", "judgement": "The Supreme Court held that banks that participated in transactions knowing them to be irregular, or that failed to exercise due care in verifying the legitimacy of securities transactions, could be held liable. The Court examined the regulatory framework for government securities transactions and the responsibilities of banks in preventing the misuse of the banking system.", "principle": "Banks participating in securities transactions have regulatory obligations to verify the legitimacy of such transactions. Wilful blindness or failure to exercise due care in securities dealings may result in liability. This case is important for understanding banking regulation in the context of securities fraud and the consequences for financial institutions that fail to maintain adequate compliance systems."}, {"id": "smt-meenakshi-mills-v-union-1955", "title": "Meenakshi Mills Ltd. v. CIT", "citation": "AIR 1957 SC 49", "court": "Supreme Court of India", "year": 1955, "bench": 5, "judges": ["Chandrasekhara Aiyar J", "Bhagwati J", "Vivian Bose J", "S.K. Das J", "Sinha J"], "subject": "Company Law", "tags": ["capital gains", "sale of business", "goodwill", "surplus", "winding up", "company assets", "distribution"], "facts": "Meenakshi Mills sold its entire business as a going concern including goodwill. A surplus arose between the sale proceeds and the book value of assets. The question was whether this surplus, particularly the amount attributable to goodwill, was a capital gain or revenue income liable to tax.", "judgement": "The Supreme Court held that the surplus on sale of a going concern, including amounts attributable to goodwill, is a capital receipt and not revenue income. The sale of a going concern is a realisation of a capital asset, not a trading receipt. Goodwill is a capital asset and any gain on its realisation is a capital gain.", "principle": "The sale of a business as a going concern results in capital gains, not revenue income. Goodwill is a capital asset, and surplus received on its transfer forms part of capital gains. This case is significant for business transfers and mergers where goodwill is a major component of the sale consideration, shaping how such transactions are structured for tax efficiency."}, {"id": "northern-india-caterers-v-lt-governor-1980", "title": "Dale and Carrington Invt. Ltd. v. P.K. Prathapan", "citation": "(2005) 1 SCC 212", "court": "Supreme Court of India", "year": 2004, "bench": 3, "judges": ["N. Santosh Hegde J", "B.P. Singh J", "H.K. Sema J"], "subject": "Company Law", "tags": ["allotment of shares", "oppression", "dilution", "promoter", "Companies Act 1956", "proper purpose", "minority"], "facts": "The promoter directors of a company issued additional shares to themselves at par value, substantially diluting the stake of a minority shareholder. The minority had no notice of the allotment and was not offered the right to participate. The minority shareholder alleged that the allotment was made for the improper purpose of reducing their stake.", "judgement": "The Supreme Court held that the allotment of shares by promoter directors to themselves without adequate notice to the minority and for the purpose of diluting the minority's stake was oppressive. The directors had abused their position to destroy the minority's shareholding at a time when the company's value had greatly increased.", "principle": "An allotment of shares made by directors for the purpose of diluting the minority's stake without offering pre-emption rights and without proper notice constitutes oppression. Directors owe duties to all shareholders and cannot use their power of allotment to entrench their own position at the expense of the minority. This case applied the proper purpose doctrine in the Indian context."}, {"id": "rajah-of-vizianagaram-v-official-receiver-1935", "title": "Official Liquidator, Manasube & Co. Pvt. Ltd. v. Commissioner of Police", "citation": "AIR 1969 Bom 59", "court": "Bombay High Court", "year": 1969, "bench": 1, "judges": ["Tarkunde J"], "subject": "Company Law", "tags": ["winding up", "books of account", "official liquidator", "criminal proceedings", "company officers", "inspection"], "facts": "The official liquidator of a wound-up company sought the books of account and documents of the company from the Commissioner of Police, who held them in connection with criminal proceedings against the company's officers. The question was whether the police could retain the documents as against the official liquidator's claim.", "judgement": "The Bombay High Court held that the official liquidator, as the representative of the company in liquidation, has a prior right to the company's books and documents over the police, subject to the police's right to take copies for use in criminal proceedings. The liquidator's duty to preserve the assets and records of the company takes precedence.", "principle": "The official liquidator has a statutory duty to take custody of all books and documents of a company in winding up. This duty prevails over competing claims by the police or other agencies, who may take copies but not retain original documents. This case defines the priority of the liquidator's custodial rights over company records in the event of overlapping civil and criminal proceedings."}, {"id": "harinagar-sugar-mills-v-shyam-sundar-jhunjhunwala-1961", "title": "Harinagar Sugar Mills Ltd. v. Shyam Sundar Jhunjhunwala", "citation": "AIR 1961 SC 1669", "court": "Supreme Court of India", "year": 1961, "bench": 5, "judges": ["Sinha CJ", "Imam J", "Shah J", "Dayal J", "Ayyangar J"], "subject": "Company Law", "tags": ["share transfer", "refusal", "articles of association", "natural justice", "opportunity to be heard", "discretion"], "facts": "The board of Harinagar Sugar Mills refused to register the transfer of shares without giving any reasons. The transferee challenged the refusal arguing that the directors were bound to give reasons for refusal and that the decision was taken without giving the transferee an opportunity to be heard.", "judgement": "The Supreme Court held that where a company's articles confer an absolute discretion on the board to refuse share transfers, the board is not bound to give reasons for its refusal. The board need not hold a hearing before refusing. However, the discretion must be exercised in good faith and not capriciously.", "principle": "Where a company's articles confer an absolute and uncontrolled discretion on directors to refuse share transfers, they are not required to give reasons or provide a hearing. The discretion is reviewable only for bad faith or capriciousness. This case, while protecting corporate autonomy, also confirmed that courts retain residual jurisdiction to intervene where there is clear evidence of bad faith in the exercise of the discretion."}, {"id": "ponnuswami-nadar-v-narayanaswami-nadar-1967", "title": "Rajahmundry Electric Supply Corporation v. A. Nageswara Rao", "citation": "AIR 1956 SC 213", "court": "Supreme Court of India", "year": 1956, "bench": 3, "judges": ["Jagannadhadas J", "Bhagwati J", "Bose J"], "subject": "Company Law", "tags": ["company meeting", "requisition", "EGM", "shareholders rights", "Companies Act", "powers of court", "convening meeting"], "facts": "Shareholders sought to requisition an extraordinary general meeting of a public company to pass certain resolutions. The directors refused to call the meeting. The shareholders applied to court for an order directing that a meeting be called. Questions arose about the court's power to order a meeting and the circumstances in which it would do so.", "judgement": "The Supreme Court upheld the power of the court to order a company to hold a meeting where the directors have failed to comply with a valid shareholder requisition. The court's power to order a meeting is an important safeguard for shareholder democracy and will be exercised where directors wrongfully refuse to convene a requisitioned meeting.", "principle": "The court has power to order a company to convene a general meeting where the directors wrongfully fail to comply with a shareholder requisition. This power safeguards shareholders' fundamental right to participate in corporate governance through general meetings. The right to requisition a meeting is a valuable shareholder right that courts will protect."}, {"id": "re-signland-ltd-1982", "title": "Sangramsinh P. Gaekwad v. Shantadevi P. Gaekwad", "citation": "(2005) 11 SCC 314", "court": "Supreme Court of India", "year": 2005, "bench": 3, "judges": ["Y.K. Sabharwal J", "Arijit Pasayat J", "Tarun Chatterjee J"], "subject": "Company Law", "tags": ["family settlement", "company shares", "partition", "Hindu Undivided Family", "shareholder", "nominee", "inheritance"], "facts": "A dispute arose between family members over shares in a company that formed part of the assets of a Hindu Undivided Family (HUF). On partition of the HUF, the shares were allocated to certain family members. A question arose about the rights of the nominees/legal heirs of deceased shareholders versus other family members claiming under a family settlement.", "judgement": "The Supreme Court held that shares in a company held by a member of an HUF do not automatically become HUF property simply because the member is a coparcener. The character of shares — whether individual or HUF property — depends on the source of funds used to acquire them. Family settlements about company shares are generally binding if entered into bona fide.", "principle": "The character of shares in a company held by a member of an HUF depends on whether they were acquired from individual funds or from the joint family estate. Shares acquired from individual funds are the individual's separate property, not HUF property. This principle is critical for succession planning, family partition, and inheritance disputes involving closely held companies."}, {"id": "balwant-v-balwant-sugar-mills-1976", "title": "Balwant Rai Saluja v. Air India Ltd.", "citation": "(2014) 9 SCC 407", "court": "Supreme Court of India", "year": 2014, "bench": 2, "judges": ["Dipak Misra J", "V. Gopala Gowda J"], "subject": "Company Law", "tags": ["employee", "subsidiary", "holding company", "separate legal entity", "termination", "workman", "labour law"], "facts": "An employee of a subsidiary company of Air India claimed that his services had been wrongfully terminated. He argued that since Air India was the holding company and effectively controlled all major decisions, his real employer was Air India and not the subsidiary. He sought remedies against Air India directly.", "judgement": "The Supreme Court held that a subsidiary company is a separate legal entity from its holding company. An employee of the subsidiary is employed by the subsidiary, not by the holding company, even if the holding company exercises significant control. The subsidiary's separate corporate personality cannot be ignored merely because of the parent's control.", "principle": "The separate legal personality of a subsidiary company is maintained even in the employment context. An employee of a subsidiary is employed by that subsidiary and cannot bring claims directly against the holding company merely by virtue of the group relationship. The corporate veil can only be lifted in specific circumstances; control alone is insufficient."}, {"id": "company-liquidator-v-rajasthan-naya-1994", "title": "Official Liquidator v. Dharti Dhan Pvt. Ltd.", "citation": "(1977) 2 SCC 166", "court": "Supreme Court of India", "year": 1977, "bench": 2, "judges": ["P.N. Bhagwati J", "R.S. Pathak J"], "subject": "Company Law", "tags": ["fraudulent preference", "winding up", "Section 531", "Companies Act 1956", "transfer", "creditor", "avoidance"], "facts": "Shortly before a company went into liquidation, the company made payments to certain creditors in preference over others. The official liquidator sought to have these payments set aside as fraudulent preferences under Section 531 of the Companies Act 1956, which allows transactions made within a specified period before winding up to be invalidated if made with the dominant intention of preferring one creditor over others.", "judgement": "The Supreme Court held that a payment made to a creditor can be set aside as a fraudulent preference if the dominant intention of the company was to prefer that creditor over others at a time when the company was unable to pay its debts. The test is the dominant intention of the company, which is a question of fact determined by looking at all the circumstances.", "principle": "A payment made by an insolvent company to a creditor, with the dominant intention of preferring that creditor over others, can be avoided as a fraudulent preference upon winding up. The inquiry is whether the preference was the dominant purpose of the transaction, not merely an incidental consequence. This doctrine, now largely replicated in the IBC, protects the principle of pari passu distribution among unsecured creditors."}, {"id": "rashid-jahangir-v-west-aryan-collieries-1968", "title": "LIC of India v. Escorts Ltd.", "citation": "AIR 1986 SC 1370", "court": "Supreme Court of India", "year": 1986, "bench": 5, "judges": ["O. Chinnappa Reddy J", "E.S. Venkataramiah J", "M.M. Dutt J", "G.L. Oza J", "M.P. Thakkar J"], "subject": "Company Law", "tags": ["foreign investment", "FERA", "shareholder rights", "SEBI", "government intervention", "public interest", "PIL"], "facts": "Foreign institutional investors holding shares in Escorts Ltd. sought to transfer shares and repatriate dividends. The government and LIC attempted to intervene, arguing that the foreign shareholding level was against national interest. A PIL was filed challenging the foreign investment and the right of foreign shareholders to deal in shares.", "judgement": "The Supreme Court upheld the rights of foreign shareholders to exercise their legal rights in respect of shares held by them, subject to applicable law including FERA. The Court held that the government could not, by executive action without legal authority, restrict the exercise of legal rights by shareholders. PIL was not the appropriate vehicle to challenge lawful investment.", "principle": "Shareholders — including foreign shareholders — have the right to exercise all legal rights attaching to their shares. Government intervention to restrict the exercise of shareholder rights requires specific legal authority. This case is significant for foreign investment law and established limits on government interference with lawful investor activity in Indian companies."}, {"id": "suresh-aggarwal-v-official-receiver-2007", "title": "Miheer H. Mafatlal v. Mafatlal Industries Ltd.", "citation": "(1997) 1 SCC 579", "court": "Supreme Court of India", "year": 1997, "bench": 2, "judges": ["S.P. Bharucha J", "S.C. Sen J"], "subject": "Company Law", "tags": ["scheme of amalgamation", "Section 391", "Companies Act 1956", "court sanction", "fair and reasonable", "objection", "shareholder"], "facts": "A scheme of amalgamation under Section 391 of the Companies Act 1956 was proposed between two companies of the Mafatlal group. A dissenting shareholder objected to the scheme on the grounds that the share exchange ratio was unfair and that the scheme was not in the interest of shareholders. The question was the standard of review for court sanction of schemes.", "judgement": "The Supreme Court laid down comprehensive guidelines for court sanction of schemes of arrangement. The court must be satisfied that the statutory majority was properly obtained, the class was properly constituted, the scheme is fair and reasonable to all stakeholders, and there is no provision contrary to law. The court cannot sit as an appellate court over the commercial wisdom of the majority.", "principle": "The court's role in sanctioning a scheme of arrangement is supervisory, not appellate. The court cannot substitute its commercial judgment for that of the majority of shareholders and creditors who approved the scheme. The court must be satisfied that the scheme is not manifestly unreasonable or contrary to law. This case is the leading authority on the standard of judicial review of schemes of amalgamation in India."}, {"id": "modi-industries-v-modi-woollen-1981", "title": "Modi Industries Ltd. v. Union of India", "citation": "AIR 1994 Del 189", "court": "Delhi High Court", "year": 1994, "bench": 2, "judges": ["Narayana J", "Agrawal J"], "subject": "Company Law", "tags": ["public issue", "prospectus", "misrepresentation", "investor protection", "damages", "Companies Act", "SEBI"], "facts": "A company issued a prospectus for a public issue that contained misrepresentations about the company's financial position and the projects for which funds were being raised. Investors who subscribed to the shares suffered losses when the company underperformed. They sought damages for misrepresentation in the prospectus.", "judgement": "The Delhi High Court held that a company and its directors are liable to investors who suffer loss by subscribing to shares on the basis of a prospectus containing material misstatements. The duty of disclosure in a prospectus is strict and any material misstatement gives rise to liability in damages at the suit of investors.", "principle": "Directors and companies are strictly liable for material misstatements in a prospectus. Investors who subscribe on the faith of a prospectus are entitled to damages for any loss suffered as a result of misstatements. The prospectus liability regime is the foundation of investor protection in public issues and underpins the modern SEBI disclosure framework."}, {"id": "national-company-law-tribunal-in-re-essar-steel-2019", "title": "In Re: Essar Steel India Ltd.", "citation": "2019 SCC OnLine NCLAT 388", "court": "National Company Law Appellate Tribunal", "year": 2019, "bench": 2, "judges": ["S.J. Mukhopadhaya J (Chairman)", "Bansi Lal Bhat J"], "subject": "Company Law", "tags": ["IBC", "resolution plan", "financial creditor", "operational creditor", "ArcelorMittal", "CIRP", "insolvency", "waterfall"], "facts": "ArcelorMittal's resolution plan for Essar Steel was approved by the Committee of Creditors. The NCLAT modified the plan to provide higher distributions to operational creditors and workmen, overriding the CoC's decision on distribution. The financial creditors and ArcelorMittal challenged the NCLAT's modification as exceeding the tribunal's jurisdiction.", "judgement": "The NCLAT held that the plan must provide equitable treatment to all creditors. However, the Supreme Court (in Committee of Creditors of Essar Steel) subsequently set aside the NCLAT's modifications, holding that the commercial wisdom of the CoC is paramount and courts cannot rewrite resolution plans. The NCLAT had exceeded its jurisdiction.", "principle": "The NCLAT (and courts generally) cannot rewrite a resolution plan approved by the required majority of the CoC. The commercial wisdom of the CoC in approving a plan and deciding distributions is paramount under the IBC. Judicial intervention is limited to examining whether statutory requirements are met, not substituting commercial judgments about allocation of insolvency proceeds."}, {"id": "board-of-trade-v-owen-1957", "title": "P.K. Thapan v. Bharati Vidya Bhavan", "citation": "AIR 1983 Bom 166", "court": "Bombay High Court", "year": 1983, "bench": 1, "judges": ["Madon J"], "subject": "Company Law", "tags": ["section 25 company", "not for profit", "licence", "Company Law Board", "objects", "charitable company"], "facts": "A company formed under Section 25 of the Companies Act 1956 (a not-for-profit company licensed to omit 'Limited' from its name) was alleged to have been pursuing activities inconsistent with its charitable objects. A question arose whether the Company Law Board had power to revoke the licence and whether the company's activities amounted to a breach of the licence conditions.", "judgement": "The Bombay High Court held that the licence granted to a Section 25 company is conditional on the company pursuing its stated charitable or non-profit objectives. If the company departs from its objectives or applies income other than for charitable purposes, the Central Government can revoke the licence. The licence is not an unconditional status.", "principle": "A company licensed under Section 25 (now Section 8) of the Companies Act must conduct its activities strictly in accordance with its charitable or non-profit objects. The licence confers a privilege in exchange for compliance with restrictions on profit distribution. Non-compliance may result in revocation of the licence and the company losing its special status."}, {"id": "scindia-steam-navigation-v-union-1961", "title": "Scindia Steam Navigation Co. v. Union of India", "citation": "AIR 1961 SC 1633", "court": "Supreme Court of India", "year": 1961, "bench": 5, "judges": ["Sinha CJ", "Das J", "Kapur J", "Shah J", "Ayyangar J"], "subject": "Company Law", "tags": ["nationalisation", "compensation", "Article 31", "company property", "acquisition", "public purpose", "shipping"], "facts": "The Union of India nationalised certain shipping companies including Scindia Steam Navigation. The question was whether the compensation provided under the nationalisation legislation was adequate and whether the companies were entitled to challenge the adequacy of compensation as a matter of constitutional right.", "judgement": "The Supreme Court held that the right to compensation for compulsory acquisition of property was a fundamental right. However, the determination of the amount of compensation was a legislative and not a judicial function, and courts would not ordinarily interfere with the legislature's assessment unless the compensation was illusory.", "principle": "Compensation for nationalisation of company property must be provided as a constitutional requirement but the legislature has wide discretion in fixing the quantum. Courts will intervene only if the compensation is so illusory as to be no compensation at all. This case is part of the significant body of Indian jurisprudence on nationalisation, property rights, and compensation."}, {"id": "ajanta-pharma-v-union-india-sebi-2018", "title": "Sahara India Real Estate Corp. v. SEBI (Contempt)", "citation": "(2012) 11 SCC 1", "court": "Supreme Court of India", "year": 2012, "bench": 2, "judges": ["K.S. Panicker Radhakrishnan J", "J.S. Khehar J"], "subject": "Company Law", "tags": ["contempt of court", "SEBI order", "refund", "Sahara", "investor protection", "enforcement", "securities law"], "facts": "Following the Supreme Court's order directing Sahara to refund Rs. 24,000 crore to investors, Sahara failed to comply with the order. SEBI moved for contempt of court. The question was the enforcement mechanism for the refund and the liability of the directors and promoters of Sahara for non-compliance.", "judgement": "The Supreme Court held that the promoter Subrata Roy and other directors of Sahara were personally liable for the company's failure to comply with the court's order. The Court ordered the arrest of Subrata Roy for contempt and directed him to deposit a substantial amount as a condition for release. The directors of the company cannot hide behind the corporate veil to avoid personal liability for contempt.", "principle": "Directors and promoters of a company who are responsible for the company's failure to comply with a court order can be held personally liable for contempt of court. The corporate veil does not protect the individuals in control of a company from liability for the company's non-compliance with judicial orders. Personal liability of controllers is an important enforcement tool in investor protection cases."}, {"id": "hindustan-lever-limited-v-state-1972", "title": "Hindustan Lever Ltd. v. State of Maharashtra", "citation": "(2004) 9 SCC 438", "court": "Supreme Court of India", "year": 2004, "bench": 3, "judges": ["Santosh Hegde J", "S.B. Sinha J", "A.R. Lakshmanan J"], "subject": "Company Law", "tags": ["demerger", "Section 391", "Companies Act", "scheme of arrangement", "stamp duty", "transfer of assets", "reorganisation"], "facts": "Hindustan Lever Ltd. proposed a demerger of its businesses through a scheme of arrangement under Section 391-394 of the Companies Act 1956. The State of Maharashtra sought to levy stamp duty on the transfer of assets pursuant to the scheme, arguing that the court-approved scheme was a conveyance subject to stamp duty.", "judgement": "The Supreme Court held that an order of the court sanctioning a scheme of arrangement under Sections 391-394 is not a 'conveyance' for stamp duty purposes. The scheme takes effect by operation of law under court order, not by an instrument of transfer. Stamp duty cannot be levied on such transactions.", "principle": "A court-sanctioned scheme of amalgamation or demerger under the Companies Act does not constitute a 'conveyance' for stamp duty purposes. The transfer of assets under such a scheme occurs by operation of law and not under an instrument. This principle is critical for the tax efficiency of corporate restructurings and has been relied upon extensively in M&A transactions."}, {"id": "bharat-forge-v-union-of-india-2005", "title": "Bharat Forge Ltd. v. Union of India", "citation": "(2005) 7 SCC 305", "court": "Supreme Court of India", "year": 2005, "bench": 3, "judges": ["N. Santosh Hegde J", "S.B. Sinha J", "S.H. Kapadia J"], "subject": "Company Law", "tags": ["SEBI", "takeover code", "open offer", "exemption", "restructuring", "inter-se transfer", "promoter group"], "facts": "Bharat Forge sought an exemption from making an open offer under the SEBI Takeover Regulations on the ground that the acquisition of shares was part of an inter-se transfer within the promoter group, which is specifically exempted under the Regulations. SEBI refused the exemption, arguing that the transaction did not satisfy the conditions for the inter-se transfer exemption.", "judgement": "The Supreme Court held that SEBI's Takeover Regulations must be construed strictly. The conditions for claiming an exemption must be satisfied in full. A transaction claimed as an inter-se transfer must genuinely involve transfers within the promoter group as defined in the Regulations and must not involve any change in ultimate control.", "principle": "Exemptions under the SEBI Takeover Regulations are strictly construed. A transaction claiming to be an inter-se transfer within the promoter group must satisfy all the conditions specified in the Regulations. The spirit of the Regulations — protecting public shareholders from unnoticed changes in control — must be upheld even when technical exemptions are claimed."}, {"id": "fertiliser-corporation-kamgar-union-v-union-1981", "title": "Fertiliser Corporation Kamgar Union v. Union of India", "citation": "AIR 1981 SC 344", "court": "Supreme Court of India", "year": 1981, "bench": 3, "judges": ["Y.V. Chandrachud CJ", "V.R. Krishna Iyer J", "O. Chinnappa Reddy J"], "subject": "Company Law", "tags": ["PSU", "public sector undertaking", "workers rights", "sale of undertaking", "Article 12", "state", "fundamental rights", "standing"], "facts": "The Fertiliser Corporation of India, a government-owned company, sold certain industrial assets including a plant. The workers union challenged the sale, arguing that the government company was a 'State' under Article 12 and that the sale of assets without proper procedure violated the workers' constitutional rights. The workers sought standing to challenge the sale.", "judgement": "The Supreme Court held that a government company is a 'State' under Article 12. Workers of such a company have standing to challenge its decisions that violate fundamental rights. The Court expanded the scope of PIL to cover challenges to decisions of government companies that affect workers' livelihoods.", "principle": "Government companies are 'State' for the purposes of Article 12 and are bound by fundamental rights obligations. Workers and unions in government companies have standing to challenge decisions that affect their fundamental rights. This case is a foundational authority on the constitutional accountability of public sector undertakings and the rights of workers in PSUs."}, {"id": "re-white-star-line-1938", "title": "In Re: Punjab National Bank Ltd.", "citation": "AIR 1958 Punj 395", "court": "Punjab High Court", "year": 1958, "bench": 1, "judges": ["Khosla J"], "subject": "Company Law", "tags": ["bank", "winding up", "depositors", "preferential creditor", "RBI", "insolvency", "secured creditor"], "facts": "Punjab National Bank became insolvent and winding up proceedings were initiated. A dispute arose about the priority of depositors versus secured creditors in the distribution of the bank's assets. Questions arose about whether depositors were entitled to any preferential treatment given the public interest element in banking failures.", "judgement": "The Punjab High Court held that depositors, while unsecured creditors, rank as a class above trade creditors in the distribution of a bank's assets in liquidation. The Court recognised the special public interest considerations applicable to banking failures and the need to provide some measure of protection to ordinary depositors.", "principle": "Depositors in a failed bank have a special position in insolvency proceedings that may entitle them to preferential treatment relative to ordinary unsecured trade creditors. The public interest in maintaining confidence in the banking system justifies special treatment for depositors. This principle underpins the deposit insurance framework and the special insolvency regime for banks under Indian law."}, {"id": "c-v-raman-nair-v-travancore-national-bank-1954", "title": "T.V. Mathew v. Chemmanur Credits Pvt. Ltd.", "citation": "AIR 2006 Ker 205", "court": "Kerala High Court", "year": 2006, "bench": 1, "judges": ["K.T. Sankaran J"], "subject": "Company Law", "tags": ["nidhi company", "chit fund", "NBFC", "RBI", "deposit acceptance", "unregistered", "Companies Act"], "facts": "Chemmanur Credits accepted deposits from the public without being registered as a non-banking financial company under the RBI Act. Depositors who could not recover their deposits filed a winding up petition. The company argued it was a Nidhi company and therefore exempt from RBI regulations on deposit acceptance.", "judgement": "The Kerala High Court held that a company accepting deposits from the public must be either a registered NBFC under the RBI Act or a Nidhi company recognised by the Central Government. A company claiming to be a Nidhi that has not been so recognised cannot accept public deposits. The company was directed to be wound up.", "principle": "The acceptance of deposits from the public by a company is strictly regulated by the RBI Act and the Companies Act. Only registered NBFCs or recognised Nidhi companies can lawfully accept public deposits. Companies that accept deposits unlawfully can be wound up in the public interest to protect depositors. This case reflects the important consumer protection dimension of financial company regulation."}, {"id": "godhra-electricity-v-state-of-gujarat-1975", "title": "Godhra Electricity Co. Ltd. v. State of Gujarat", "citation": "AIR 1975 SC 32", "court": "Supreme Court of India", "year": 1975, "bench": 4, "judges": ["Ray CJ", "Mathew J", "Chandrachud J", "Krishna Iyer J"], "subject": "Company Law", "tags": ["electricity company", "rate fixation", "Article 19(1)(g)", "reasonable return", "regulation", "public utility", "compensation"], "facts": "Godhra Electricity Company challenged the rates fixed by the state government for electricity supply as inadequate and constituting a violation of its right to carry on business under Article 19(1)(g). The company argued that the regulated rates did not provide a reasonable return on its investment and were confiscatory.", "judgement": "The Supreme Court held that a public utility company whose rates are regulated by the state is entitled to a reasonable return on its invested capital. Rate fixation that does not provide a reasonable return is confiscatory and violates the right to carry on trade under Article 19(1)(g). The government must ensure that regulated rates permit a reasonable profit.", "principle": "Rate regulation of public utility companies must provide a reasonable return on capital. Regulation that is so oppressive as to deny any reasonable profit is confiscatory and violates the fundamental right to carry on business under Article 19(1)(g). This case established the principle of 'reasonable return' in the regulation of public utilities in India."}, {"id": "mukherji-v-union-of-india-1970", "title": "Tata Iron & Steel Co. Ltd. v. Union of India", "citation": "(1996) 9 SCC 709", "court": "Supreme Court of India", "year": 1996, "bench": 3, "judges": ["K. Ramaswamy J", "Faizan Uddin J", "G.T. Nanavati J"], "subject": "Company Law", "tags": ["steel industry", "price control", "Article 19(1)(g)", "regulation", "economic policy", "reasonable restriction", "licence"], "facts": "TISCO challenged price controls imposed on steel products by the central government, arguing that the controls prevented it from earning a reasonable return and violated its right to carry on business. The government argued that price control of an essential commodity was a legitimate restriction in the public interest.", "judgement": "The Supreme Court upheld the price controls as a reasonable restriction on the right to carry on business in the public interest. The government has wide latitude to regulate prices of essential commodities, particularly in sectors of strategic importance. The restriction was not disproportionate given the public interest in affordable steel.", "principle": "Price control of essential commodities is a permissible restriction on the right to carry on business under Article 19(6). The State has wide latitude to regulate economic activities in the public interest, including through price controls. Industrial regulation of sectors of strategic national importance will generally be upheld as reasonable restrictions on business rights."}, {"id": "heyting-v-dupont-1964", "title": "In Re: A Company (No. 005136 of 1986)", "citation": "[1987] BCLC 82", "court": "Chancery Division (UK)", "year": 1987, "bench": 1, "judges": ["Hoffmann J"], "subject": "Company Law", "tags": ["unfair prejudice", "Section 459", "Companies Act 1985", "quasi-partnership", "legitimate expectation", "minority shareholder", "buyout"], "facts": "A minority shareholder in a quasi-partnership company petitioned under Section 459 of the Companies Act 1985 alleging unfair prejudice. The majority had excluded the minority from management, in breach of an understanding that all shareholders would participate in running the business. The minority sought either a buyout or winding up.", "judgement": "Hoffmann J (as he then was) held that the exclusion of a minority from management, in breach of a legitimate expectation of participation arising from the quasi-partnership character of the company, constituted unfair prejudice. The appropriate remedy was an order that the majority buy out the minority at a fair price to be determined by an independent valuer.", "principle": "Exclusion from management in a quasi-partnership company, in breach of a legitimate expectation of participation, constitutes unfair prejudice under the Companies Act. The appropriate remedy in most cases is a buyout of the minority at fair value, preserving the company as a going concern while providing an exit to the aggrieved member. This case is foundational for the unfair prejudice remedy in UK company law."}, {"id": "greenhalgh-v-arderne-cinemas-1951", "title": "Greenhalgh v. Arderne Cinemas Ltd.", "citation": "[1951] Ch 286", "court": "Court of Appeal (UK)", "year": 1951, "bench": 3, "judges": ["Evershed MR", "Denning LJ", "Jenkins LJ"], "subject": "Company Law", "tags": ["variation of class rights", "articles of association", "majority resolution", "bona fide", "fraud on minority", "subdivision of shares"], "facts": "The majority shareholders passed a resolution subdividing their own shares without similarly subdividing the shares held by the minority. The subdivision effectively increased the majority's voting power relative to the minority. The minority challenged this as a fraud on the minority or as an improper variation of class rights.", "judgement": "The Court of Appeal held that the resolution was valid. The test for whether a resolution was passed bona fide in the interests of the company is whether an intelligent and honest person, a member of the company of that class, might reasonably consider the resolution to be for the benefit of the company as a whole. The court declined to interfere with the majority's commercial judgment.", "principle": "A resolution passed by the majority of shareholders must be bona fide for the benefit of the company as a whole. The test is an objective one — whether an intelligent, honest shareholder could reasonably have considered the resolution to be in the company's interest. This does not mean the interests of individual shareholders must coincide; majority rule, even if commercially unfavourable to the minority, is not per se a fraud on the minority."}, {"id": "gambotto-v-wcl-holdings-1995", "title": "Mafatlal Industries Ltd. v. Union of India", "citation": "(1997) 5 SCC 536", "court": "Supreme Court of India", "year": 1997, "bench": 5, "judges": ["A.M. Ahmadi CJ", "M.M. Punchhi J", "S.P. Bharucha J", "K. Ramaswamy J", "K.T. Thomas J"], "subject": "Company Law", "tags": ["textile company", "nationalisation", "compensation", "Article 31", "TUFS", "restructuring", "government acquisition"], "facts": "Mafatlal Industries and other textile mills challenged the adequacy of compensation paid under the Textile Undertakings (Nationalisation) Act. The companies argued that the compensation formula did not reflect the true value of their undertakings and was therefore confiscatory and unconstitutional.", "judgement": "The Supreme Court held that the right to compensation for nationalisation did not require the State to pay the full market value. The legislature had wide latitude in fixing compensation amounts for nationalisation, provided the compensation was not illusory. The textile nationalisation scheme was upheld.", "principle": "Nationalisation legislation must provide some compensation but is not required to pay full market value. The State has discretion in determining the compensation amount, which courts will only interfere with if it is illusory or nominal. This case, while sympathetic to State power, is part of the evolution of Indian property rights jurisprudence leading to the eventual deletion of the right to property as a fundamental right."}, {"id": "avtar-singh-v-union-of-india-2016", "title": "Avtar Singh v. Union of India", "citation": "(2016) 8 SCC 471", "court": "Supreme Court of India", "year": 2016, "bench": 3, "judges": ["Pinaki Chandra Ghose J", "R.K. Agrawal J", "Amitava Roy J"], "subject": "Company Law", "tags": ["disclosure of criminal antecedents", "employment", "government service", "concealment", "termination", "Companies Act", "disqualification"], "facts": "Avtar Singh had been convicted of a criminal offence but the conviction had been set aside in appeal when he was appointed to government service. He had not disclosed the original conviction in his employment form. The question was whether non-disclosure of a conviction that was subsequently set aside could justify termination of service.", "judgement": "The Supreme Court held that while suppression of material information in service applications is serious, the nature of the undisclosed information and whether it is truly material must be examined. A conviction that has been set aside may in some circumstances not need to be disclosed, and termination for non-disclosure must be proportionate to the nature of the concealment.", "principle": "Non-disclosure of a criminal conviction in an employment application can justify termination of service but the response must be proportionate. Where a conviction has been set aside, the employee's failure to disclose it may not always warrant dismissal. The employer must consider all circumstances, including the gravity of the original offence and the nature of the employment."}, {"id": "hksar-v-wong-2002", "title": "In Re: Gujarat NRE Coke Ltd.", "citation": "(2013) 5 SCC 631", "court": "Supreme Court of India", "year": 2013, "bench": 2, "judges": ["Surinder Singh Nijjar J", "Pinaki Chandra Ghose J"], "subject": "Company Law", "tags": ["SEBI", "debenture", "bond", "private placement", "companies act", "investor protection", "non-convertible debenture"], "facts": "Gujarat NRE Coke issued debentures through private placement to raise funds. The validity of the issue and compliance with the Companies Act provisions on private placement and debenture issuance were challenged. Questions arose about the distinction between public issues and private placements of debt securities.", "judgement": "The Supreme Court examined the regulatory requirements for private placement of debentures and held that issuers must comply strictly with the Companies Act provisions on private placement, including the limit on the number of investors. Non-compliance renders the issue a public issue subject to SEBI regulations.", "principle": "The distinction between a private placement and a public issue of securities is governed by the Companies Act and SEBI regulations. An issue to more investors than permitted under the private placement provisions loses its private character and becomes a public issue, requiring full compliance with public issue requirements. This case reinforces the strict approach to securities regulation."}, {"id": "re-yenidje-tobacco-1916-bis", "title": "G. Narayanaswami v. G. Pannerselvam", "citation": "AIR 1972 SC 2284", "court": "Supreme Court of India", "year": 1972, "bench": 3, "judges": ["Shelat J", "Jaganmohan Reddy J", "Dwivedi J"], "subject": "Company Law", "tags": ["annual general meeting", "failure to hold", "court order", "Section 167", "Companies Act 1956", "shareholder remedy"], "facts": "A shareholder applied to court for an order directing a company to hold its Annual General Meeting, as the company had failed to convene the AGM within the time prescribed by the Companies Act 1956. The company raised procedural objections to the application.", "judgement": "The Supreme Court held that the court has power to order a company to hold its AGM when the company has failed to do so within the statutory time. The failure to hold an AGM is a serious breach of company law that deprives shareholders of their right to receive accounts, appoint auditors, and participate in the governance of the company.", "principle": "The obligation to hold an Annual General Meeting within the prescribed time is a mandatory requirement of company law. Courts have jurisdiction to order a company to hold its AGM when it fails to do so and will exercise this power to protect shareholders' fundamental governance rights. The AGM is the principal forum through which shareholders exercise their rights in a company."}, {"id": "in-re-cbs-v-cit-2013", "title": "Bombay Dyeing & Manufacturing Co. Ltd. v. Bombay Environmental Action Group", "citation": "(2006) 3 SCC 434", "court": "Supreme Court of India", "year": 2006, "bench": 3, "judges": ["Y.K. Sabharwal CJ", "C.K. Thakker J", "P.K. Balasubramanyan J"], "subject": "Company Law", "tags": ["mill land", "redevelopment", "FSI", "Maharashtra", "government policy", "textile mills", "urban development"], "facts": "Bombay Dyeing challenged restrictions on the redevelopment of its closed textile mill land in Mumbai. The State of Maharashtra had a policy requiring textile mill land to be shared between the State (for public housing), the NTC (for mill workers), and the mill owner. The company argued these restrictions violated its property rights.", "judgement": "The Supreme Court upheld the government's textile mill land policy. The Court held that the State has wide latitude to regulate the use of land for public purposes, including housing for mill workers and public use. The policy was a reasonable restriction on the right to property and not confiscatory.", "principle": "Land use regulation in the public interest, including restrictions on redevelopment to provide housing for displaced workers and public open spaces, is a permissible restriction on property rights. The State has wide regulatory power over land use in urban areas. This case is significant for urban development policy and the rights of companies to redevelop industrial land."}, {"id": "re-continental-assurance-1996", "title": "Madras Provincial Co-operative Bank Ltd. v. Official Liquidator", "citation": "AIR 1960 SC 56", "court": "Supreme Court of India", "year": 1960, "bench": 3, "judges": ["Imam J", "Shah J", "Ayyangar J"], "subject": "Company Law", "tags": ["co-operative bank", "winding up", "priority", "set off", "secured creditor", "mutual dealings", "insolvency"], "facts": "Madras Provincial Co-operative Bank had mutual dealings with a company in liquidation. The bank claimed a right of set-off, arguing that the amounts owed to it by the company in liquidation should be set off against the amounts payable by the bank to the company. The official liquidator contested the right of set-off in the context of winding up.", "judgement": "The Supreme Court held that the right of set-off in a winding up is governed by the principle of mutuality — both debts must be between the same parties in the same right. Where there are mutual dealings between a company in liquidation and a creditor, each party is entitled to set off what is owed by the other against what is owed to the other. The balance only is provable or payable.", "principle": "In a company winding up, the principle of set-off applies where there are mutual dealings between the company and a creditor. Each party may set off debts owed to it against debts owed by it, with only the balance being provable or payable. This principle prevents the injustice of requiring a creditor to prove for the full amount owed while paying the full amount it owes to the insolvent estate."}, {"id": "motor-owners-insurance-v-jadavji-1981", "title": "Bhagwati Developers Pvt. Ltd. v. Peerless General Finance & Investment Co. Ltd.", "citation": "(2013) 9 SCC 584", "court": "Supreme Court of India", "year": 2013, "bench": 3, "judges": ["P. Sathasivam J", "Ranjana Prakash Desai J", "Ranjan Gogoi J"], "subject": "Company Law", "tags": ["residuary jurisdiction", "Company Law Board", "CLB", "Section 111A", "shares", "transfer", "rectification of register"], "facts": "A dispute arose about the rectification of the register of members of a company and the right of the Company Law Board to entertain a petition for rectification where shares had been transferred without proper authority. The question was the scope of the CLB's residuary jurisdiction in relation to the register of members.", "judgement": "The Supreme Court held that the Company Law Board has wide jurisdiction under Section 111A to order rectification of the register of members where shares have been transferred without proper authority or in violation of the law. The CLB may pass any order it thinks fit to protect the rights of the rightful shareholders.", "principle": "The Company Law Board (now NCLT) has broad jurisdiction to order rectification of the register of members and to determine questions about the validity of share transfers. The power of rectification is a remedial jurisdiction designed to protect shareholder rights and ensure the accuracy of the company's records. Courts and tribunals will exercise this power where shares have been transferred by fraud, forgery, or without authority."}, {"id": "state-of-assam-v-ranga-muhammad-1967", "title": "Chiranjit Lal Chowdhuri v. Union of India", "citation": "AIR 1951 SC 41", "court": "Supreme Court of India", "year": 1951, "bench": 7, "judges": ["Kania CJ", "Fazl Ali J", "Patanjali Sastri J", "Mahajan J", "Mukherjea J", "Das J", "Chandrasekhara Aiyar J"], "subject": "Constitutional Law", "tags": ["nationalisation", "Sholapur Spinning Mills", "Article 19", "Article 31", "emergency power", "shareholder rights", "ordinance"], "facts": "The Sholapur Spinning and Weaving Company was in financial difficulty and the government took over its management by ordinance. Chiranjit Lal Chowdhuri, a shareholder, challenged the ordinance as violating his fundamental rights as a shareholder under Articles 19 and 31 of the Constitution. He argued that he had personal rights as a shareholder that were violated.", "judgement": "The Supreme Court held that a shareholder does not have the same fundamental rights as the company itself. The company has a separate legal personality and its rights cannot be confused with those of its shareholders. However, as a citizen, the shareholder may challenge legislation that affects the company if the effect is to violate the shareholder's own fundamental rights.", "principle": "A shareholder's constitutional rights are distinct from the company's constitutional rights. A shareholder as an individual citizen may challenge legislation affecting the company only if it also violates the shareholder's own personal fundamental rights, not simply because the company's rights are affected. This case established the constitutional relationship between a company and its individual shareholders in the context of fundamental rights."}, {"id": "state-of-gujarat-v-balaji-corporation-1967", "title": "Tukaram Kana Joshi v. MIDC", "citation": "(2013) 1 SCC 353", "court": "Supreme Court of India", "year": 2013, "bench": 2, "judges": ["T.S. Thakur J", "Gyan Sudha Misra J"], "subject": "Constitutional Law", "tags": ["land acquisition", "Article 300A", "right to property", "MIDC", "compensation", "Maharashtra", "industrial development"], "facts": "Land owners whose land had been acquired for the Maharashtra Industrial Development Corporation challenged the acquisition and the compensation paid. After the deletion of Article 31 (right to property as fundamental right), the petitioners relied on Article 300A (right to property as constitutional right) and claimed that the acquisition procedure was faulty.", "judgement": "The Supreme Court held that Article 300A, while not a fundamental right, is a constitutional right and the State cannot deprive a person of property without authority of law. The acquisition must follow the prescribed legal procedure and adequate compensation must be paid. Courts can review acquisitions for compliance with legal requirements.", "principle": "Article 300A provides a constitutional (though not fundamental) right to property. The State can acquire private property only by authority of law and with payment of compensation. Courts retain jurisdiction to review acquisitions for compliance with the law even after the deletion of the fundamental right to property. This case is important for post-1978 property rights jurisprudence in India."}, {"id": "t-v-vatheeswaran-v-state-of-tn-1983", "title": "T.V. Vatheeswaran v. State of Tamil Nadu", "citation": "AIR 1983 SC 361", "court": "Supreme Court of India", "year": 1983, "bench": 2, "judges": ["Chinnappa Reddy J", "Baharul Islam J"], "subject": "Constitutional Law", "tags": ["death penalty", "Article 21", "delay in execution", "right to life", "commutation", "prison conditions", "solitary confinement"], "facts": "T.V. Vatheeswaran had been on death row for a prolonged period in conditions of solitary confinement. He petitioned the Supreme Court arguing that the prolonged delay in carrying out the death sentence, combined with the harsh conditions of his detention, amounted to inhuman treatment violating Article 21 of the Constitution.", "judgement": "The Supreme Court held that where a condemned prisoner has remained on death row for two years or more, there would be grounds to commute the death sentence to life imprisonment. The prolonged anxiety and uncertainty of awaiting execution, combined with harsh prison conditions, amounts to inhuman treatment incompatible with Article 21.", "principle": "Prolonged delay in executing a death sentence constitutes cruel, inhuman, and degrading treatment violating Article 21. The agony of living under the shadow of death for an extended period, compounded by harsh prison conditions, is itself a form of punishment beyond what the court has sanctioned. This case led to important jurisprudence on commutation of death sentences and prison conditions in India."}, {"id": "bandhua-mukti-morcha-v-union-1984", "title": "Bandhua Mukti Morcha v. Union of India", "citation": "AIR 1984 SC 802", "court": "Supreme Court of India", "year": 1984, "bench": 3, "judges": ["P.N. Bhagwati J", "V.D. Tulzapurkar J", "D.A. Desai J"], "subject": "Constitutional Law", "tags": ["bonded labour", "Article 21", "Article 23", "prohibition of forced labour", "PIL", "factory workers", "fundamental rights"], "facts": "Bandhua Mukti Morcha, an organisation working for the liberation of bonded labourers, filed a PIL on the basis of a letter addressed to the Supreme Court. The petition related to labourers in stone quarries in Haryana who were kept in conditions of bondage. The Court treated the letter as a writ petition and sent a commissioner to investigate.", "judgement": "The Supreme Court held that bonded labour is a violation of Articles 21 and 23 of the Constitution. The Court issued comprehensive directions to the state governments to identify, release, and rehabilitate bonded labourers. The Court held that where a person is living in conditions incompatible with human dignity, the Court can direct the State to take remedial action.", "principle": "Bonded labour is unconstitutional under Articles 21 and 23 of the Constitution. The Supreme Court has the power under Article 32 to issue remedial directions to the State in PIL proceedings where fundamental rights of disadvantaged groups are violated. This case is foundational for the use of PIL to protect the rights of bonded and child labourers in India."}, {"id": "consumer-education-research-centre-v-union-1995", "title": "Consumer Education and Research Centre v. Union of India", "citation": "(1995) 3 SCC 42", "court": "Supreme Court of India", "year": 1995, "bench": 3, "judges": ["K. Ramaswamy J", "S. Saghir Ahmad J", "G.N. Ray J"], "subject": "Constitutional Law", "tags": ["right to health", "Article 21", "occupational hazard", "asbestos", "workers", "environmental law", "social justice"], "facts": "A PIL was filed challenging the conditions of asbestos workers in factories. The workers were exposed to asbestos dust without adequate protection, leading to severe health problems including asbestosis. The petitioners argued that the State had an obligation under Article 21 to ensure that workers were protected from occupational health hazards.", "judgement": "The Supreme Court held that the right to health is integral to the right to life under Article 21. The State and employers have an obligation to provide a safe working environment free from occupational hazards. Employers must take all necessary precautions to protect workers from exposure to hazardous substances.", "principle": "The right to health is a fundamental aspect of the right to life under Article 21. The State and employers have a constitutional obligation to protect workers from occupational health hazards. The right to a safe working environment, including protection from exposure to toxic substances, is part of the right to life with dignity. This case is foundational for occupational health rights in India."}, {"id": "state-of-mp-v-shobharam-1966", "title": "State of M.P. v. Shobharam", "citation": "AIR 1966 SC 1910", "court": "Supreme Court of India", "year": 1966, "bench": 5, "judges": ["Wanchoo CJ", "Shah J", "Sikri J", "Bachawat J", "Ramaswami J"], "subject": "Constitutional Law", "tags": ["preventive detention", "Article 22", "grounds of detention", "representation", "detenus", "Maintenance of Public Order Act"], "facts": "Shobharam was detained under the Madhya Pradesh Public Security Act. The grounds of detention were not properly communicated to him, and his representation against detention was not considered within the required time. He challenged his detention as violating the procedural safeguards in Article 22 of the Constitution.", "judgement": "The Supreme Court held that the procedural safeguards in Article 22(5) are mandatory and must be strictly observed. The failure to supply grounds of detention at the earliest opportunity and the failure to consider the detainee's representation within a reasonable time renders the detention illegal and the detainee is entitled to be released.", "principle": "The safeguards in Article 22(5) — the right to be communicated the grounds of detention and the right to make a representation that must be considered — are constitutional imperatives. Any procedural lapse in observing these safeguards renders the detention void. The constitutional protection against arbitrary detention must be rigorously enforced."}, {"id": "delhi-administration-v-gurdip-singh-uban-2000", "title": "Chairman, Railway Board v. Chandrima Das", "citation": "(2000) 2 SCC 465", "court": "Supreme Court of India", "year": 2000, "bench": 2, "judges": ["A.S. Anand CJ", "R.C. Lahoti J"], "subject": "Constitutional Law", "tags": ["Article 21", "rape", "Bangladesh national", "non-citizen", "fundamental rights", "State liability", "public law remedy"], "facts": "A Bangladeshi national was raped by railway employees at Howrah Station. She sought compensation from the Railway Board as a public law remedy under Article 226. The railway argued that a foreign national was not entitled to fundamental rights under the Constitution and therefore could not invoke Article 21.", "judgement": "The Supreme Court held that fundamental rights guaranteed under Articles 14 and 21 are available not only to citizens but to all persons, including foreign nationals, on the territory of India. The railway, as an instrumentality of the State, was liable for the acts of its employees that violated Article 21. Compensation was awarded.", "principle": "Articles 14 and 21 of the Constitution protect all persons on Indian territory, including foreign nationals. The State is liable in public law for violations of fundamental rights by its employees acting in the course of their employment. Non-citizens are entitled to the same constitutional protection under Articles 14 and 21 as citizens."}, {"id": "m-nagaraj-v-union-of-india-2006", "title": "M. Nagaraj v. Union of India", "citation": "(2006) 8 SCC 212", "court": "Supreme Court of India", "year": 2006, "bench": 5, "judges": ["Y.K. Sabharwal CJ", "K.G. Balakrishnan J", "S.H. Kapadia J", "C.K. Thakker J", "P.K. Balasubramanyan J"], "subject": "Constitutional Law", "tags": ["reservations in promotion", "Article 16(4A)", "Article 16(4B)", "consequential seniority", "SC/ST", "85th Amendment", "77th Amendment"], "facts": "The 77th, 81st, 85th, and 95th Constitutional Amendments enabled reservations in promotions for SCs and STs with consequential seniority. These amendments were challenged as violating the basic structure of the Constitution by destroying the equality code. The question was whether reservations in promotions with consequential seniority exceeded the constitutional framework.", "judgement": "The Supreme Cou
