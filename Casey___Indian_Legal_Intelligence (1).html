"The Supreme Court upheld the constitutionality of AFSPA but imposed limitations on its operation. The Court held that AFSPA must be read consistently with fundamental rights and that the powers conferred must be exercised in a reasonable manner. The Court laid down guidelines for the exercise of powers under AFSPA and held that declarations of disturbed areas must be periodically reviewed.", "principle": "Special security legislation operating in disturbed areas must be read consistently with fundamental rights and the principles of proportionality and reasonableness. Even in disturbed areas, the armed forces must exercise their powers in a manner consistent with the right to life under Article 21. Courts will review the legality of such powers and their exercise."}, {"id": "state-of-ap-v-mcdownells-1996", "title": "State of A.P. v. McDowell & Co.", "citation": "(1996) 3 SCC 709", "court": "Supreme Court of India", "year": 1996, "bench": 3, "judges": ["Jeevan Reddy J", "B.P. Panda J", "S.P. Kurdukar J"], "subject": "Constitutional Law", "tags": ["prohibition of liquor", "Article 19(1)(g)", "right to trade", "directive principles", "Article 47", "total prohibition", "Andhra Pradesh"], "facts": "The State of Andhra Pradesh enacted a total prohibition on the manufacture, sale, and consumption of liquor pursuant to Article 47 of the Constitution (which directs the State to endeavour to bring about total prohibition). Liquor manufacturers challenged this as violating Article 19(1)(g) — the right to carry on any trade or profession.", "judgement": "The Supreme Court upheld total prohibition as constitutional. The right to carry on trade under Article 19(1)(g) can be restricted in the public interest. Trade in intoxicating liquor is not a fundamental right — it is a res extra commercium (inherently injurious to public health and morals) and can be totally prohibited by the State. Article 47 supports such prohibition.", "principle": "Trade in intoxicating liquor is not a fundamental right and the State can impose total prohibition. Res extra commercium — things inherently injurious to public health and morals — can be excluded from the domain of the right to trade under Article 19(1)(g). Directive principles under Article 47 actively support total prohibition of liquor as a matter of constitutional policy."}, {"id": "secretary-ministry-of-information-v-cricket-association-bengal-1995", "title": "Secretary, Ministry of Information & Broadcasting v. Cricket Association of Bengal", "citation": "(1995) 2 SCC 161", "court": "Supreme Court of India", "year": 1995, "bench": 3, "judges": ["P.B. Sawant J", "S. Mohan J", "B.P. Jeevan Reddy J"], "subject": "Constitutional Law", "tags": ["airwaves", "spectrum", "Article 19(1)(a)", "broadcasting", "Doordarshan", "right to broadcast", "media regulation"], "facts": "The Cricket Association of Bengal sought permission to allow foreign satellite channels to broadcast cricket matches played in India. The government, through Doordarshan, insisted on monopoly rights over broadcast signals. The Association challenged this as a violation of the right to freedom of speech and expression under Article 19(1)(a).", "judgement": "The Supreme Court held that the airwaves are public property and no private individual or government can claim monopoly over them. The right to freedom of speech and expression includes the right to broadcast and receive information via electronic media. The government's monopoly over broadcasting was unconstitutional.", "principle": "Airwaves/spectrum are a public resource and their use must be regulated in the public interest — no monopoly over them is constitutionally permissible. The right to freedom of speech and expression under Article 19(1)(a) extends to electronic media and broadcasting. This case led to the liberalisation of broadcasting in India and the end of the Doordarshan monopoly."}, {"id": "waman-rao-v-union-of-india-1981", "title": "Waman Rao v. Union of India", "citation": "AIR 1981 SC 271", "court": "Supreme Court of India", "year": 1981, "bench": 5, "judges": ["Chandrachud CJ", "Bhagwati J", "Fazal Ali J", "Pathak J", "Venkataramaiah J"], "subject": "Constitutional Law", "tags": ["Ninth Schedule", "Article 31B", "judicial review", "property rights", "land reform", "basic structure", "immunity from challenge"], "facts": "The Ninth Schedule to the Constitution confers immunity on the laws placed in it from challenge as violating fundamental rights. Petitioners challenged whether laws placed in the Ninth Schedule after the Kesavananda Bharati judgment are still immune from challenge on the ground that they violate the basic structure of the Constitution.", "judgement": "The Supreme Court held that laws placed in the Ninth Schedule prior to the Kesavananda Bharati judgment (April 24, 1973) continue to enjoy complete immunity. Laws placed in the Ninth Schedule after that date can be challenged if they violate the basic structure of the Constitution, even though they are notionally protected by Article 31B.", "principle": "The Ninth Schedule is not a safe harbour for unconstitutional legislation enacted after April 24, 1973. Laws added to the Ninth Schedule after Kesavananda Bharati remain open to judicial review on the ground that they damage the basic structure of the Constitution. This principle was reaffirmed in IR Coelho v. State of Tamil Nadu (2007)."}, {"id": "selvi-v-state-of-karnataka-2010", "title": "Selvi v. State of Karnataka", "citation": "(2010) 7 SCC 263", "court": "Supreme Court of India", "year": 2010, "bench": 3, "judges": ["K.G. Balakrishnan CJ", "R.V. Raveendran J", "J.M. Panchal J"], "subject": "Constitutional Law", "tags": ["narco analysis", "brain mapping", "polygraph", "Article 20(3)", "self-incrimination", "involuntary", "compelled testimony", "Article 21"], "facts": "The State of Karnataka sought to conduct narco analysis, brain mapping (P300), and polygraph tests on suspects in criminal cases without their consent. Selvi and other accused persons challenged these tests as violating Article 20(3) (right against self-incrimination) and Article 21 (right to life and personal liberty).", "judgement": "The Supreme Court held that narco analysis, brain mapping, and polygraph tests conducted without the consent of the accused violate Articles 20(3) and 21. Such tests amount to compelled testimony and intrude upon the mental privacy of the accused. The results of such tests are inadmissible as evidence even if they lead to discovery of facts.", "principle": "Involuntary narco analysis, polygraph, and brain mapping tests violate the right against self-incrimination under Article 20(3) and the right to mental privacy under Article 21. Compelled disclosure of information from the mind of an accused, even through scientific means, constitutes testimonial compulsion. This case drew an important line between permissible investigation techniques and constitutional violations."}, {"id": "shreya-singhal-v-union-india-2015", "title": "Shreya Singhal v. Union of India", "citation": "(2015) 5 SCC 1", "court": "Supreme Court of India", "year": 2015, "bench": 2, "judges": ["J. Chelameswar J", "Rohinton Nariman J"], "subject": "Constitutional Law", "tags": ["Section 66A IT Act", "Article 19(1)(a)", "online speech", "internet freedom", "vagueness", "overbreadth", "freedom of expression", "social media"], "facts": "Section 66A of the Information Technology Act, which criminalised sending 'offensive' or 'menacing' messages online, was challenged as unconstitutional. Arrests had been made for Facebook posts critical of politicians. Shreya Singhal and others challenged the provision as an unconstitutional restriction on freedom of speech that was vague and overbroad.", "judgement": "The Supreme Court unanimously struck down Section 66A of the IT Act as unconstitutional. The provision was vague — terms like 'offensive', 'menacing', and 'grossly offensive' had no clear meaning and gave the police unguided discretion. It restricted speech beyond what Article 19(2) permits and created a chilling effect on online expression.", "principle": "A law restricting freedom of speech must be sufficiently precise and cannot be vague or overbroad. Laws that give the State unguided discretion to punish speech create a chilling effect on expression and are unconstitutional. Online speech is entitled to the same constitutional protection as offline speech. This is the most significant judgment on internet freedom in India."}, {"id": "subramanian-swamy-v-union-2016-defamation", "title": "Subramanian Swamy v. Union of India", "citation": "(2016) 7 SCC 221", "court": "Supreme Court of India", "year": 2016, "bench": 2, "judges": ["Dipak Misra J", "Prafulla C. Pant J"], "subject": "Constitutional Law", "tags": ["criminal defamation", "Section 499 IPC", "Section 500 IPC", "Article 19(1)(a)", "reputation", "right to reputation", "freedom of speech"], "facts": "Subramanian Swamy and other petitioners challenged criminal defamation under Sections 499 and 500 of the IPC as unconstitutional. They argued that these provisions — which make defamation a criminal offence punishable by imprisonment — placed an unconstitutional restriction on freedom of speech and expression and had a chilling effect on political and public discourse.", "judgement": "The Supreme Court upheld the constitutional validity of criminal defamation. The Court held that reputation is a part of Article 21 (right to life and dignity) and the provisions of Sections 499 and 500 IPC are reasonable restrictions on free speech under Article 19(2). The restrictions are in the interests of decency and morality and are proportionate.", "principle": "Criminal defamation is a constitutionally valid restriction on freedom of speech. The right to reputation is protected under Article 21 and can justify criminal sanctions against defamatory speech. The maintenance of personal dignity and reputation is a sufficiently important public interest to justify restrictions on speech beyond the civil remedy of damages."}, {"id": "panchayat-raj-v-state-2001", "title": "Pramati Educational & Cultural Trust v. Union of India", "citation": "(2014) 8 SCC 1", "court": "Supreme Court of India", "year": 2014, "bench": 5, "judges": ["P. Sathasivam CJ", "Ranjana Prakash Desai J", "Ranjan Gogoi J", "S.A. Bobde J", "S.A. Nazeer J"], "subject": "Constitutional Law", "tags": ["Article 21A", "Right to Education", "Article 30", "private unaided schools", "minority institutions", "RTE Act", "reservation in admissions"], "facts": "Pramati Educational Trust and other private unaided schools challenged the Right to Education Act 2009 insofar as it required private unaided non-minority schools to reserve 25% of seats for economically weaker sections and disadvantaged groups. Minority institutions also challenged the application of the RTE Act to them.", "judgement": "The Supreme Court held that the RTE Act's 25% reservation requirement is valid as applied to private unaided non-minority schools, but cannot be applied to minority institutions which are protected under Article 30. The fundamental right to education under Article 21A read with Article 19(1)(g) justifies the obligation on private schools.", "principle": "The State can impose reasonable social obligations on private schools in the exercise of its power to regulate education for the public good. However, minority educational institutions are exempt from such obligations by virtue of Article 30. This case defines the scope of the RTE Act and the limits of the State's power to impose obligations on private educational institutions."}, {"id": "shayara-bano-v-union-india-2017", "title": "Shayara Bano v. Union of India", "citation": "(2017) 9 SCC 1", "court": "Supreme Court of India", "year": 2017, "bench": 5, "judges": ["J.S. Khehar CJ", "Kurian Joseph J", "Rohinton Nariman J", "U.U. Lalit J", "S. Abdul Nazeer J"], "subject": "Constitutional Law", "tags": ["triple talaq", "talaq-e-biddat", "Muslim personal law", "Article 14", "Article 15", "Article 21", "gender equality", "manifest arbitrariness"], "facts": "Shayara Bano challenged the practice of instantaneous triple talaq (talaq-e-biddat) under Muslim personal law as unconstitutional. She had been divorced by her husband through a triple talaq sent by registered post. She argued that the practice violated fundamental rights of Muslim women including the right to equality and dignity.", "judgement": "By a majority of 3:2, the Supreme Court held that triple talaq is manifestly arbitrary and therefore unconstitutional under Article 14. Three judges held it void on the ground of manifest arbitrariness; two judges (including the Chief Justice) held that it was void as it violated Muslim personal law itself. The practice was struck down.", "principle": "The doctrine of manifest arbitrariness — that what is manifestly arbitrary violates Article 14 — was applied to invalidate a personal law practice. The constitution cannot be subordinated to personal law norms that are inherently arbitrary and discriminatory. This case, though divided in reasoning, established that personal laws are subject to constitutional scrutiny."}, {"id": "rohit-tandon-case-unaccounted-money-2017", "title": "Rojer Mathew v. South Indian Bank Ltd.", "citation": "(2020) 6 SCC 1", "court": "Supreme Court of India", "year": 2019, "bench": 5, "judges": ["Ranjan Gogoi CJ", "N.V. Ramana J", "D.Y. Chandrachud J", "Deepak Gupta J", "Sanjiv Khanna J"], "subject": "Constitutional Law", "tags": ["tribunal reform", "Article 50", "separation of powers", "financial service appellate tribunal", "FSAT", "independence of tribunals", "judicial power"], "facts": "The Finance Act 2017 amended the qualifications, terms, service conditions, and appointment of members of various tribunals including the Debt Recovery Tribunal and the National Company Law Tribunal. The amendments were challenged as compromising the independence of these tribunals by subjecting them to executive control.", "judgement": "The Supreme Court struck down several provisions of the Finance Act 2017 relating to tribunals as unconstitutional. The Court held that the independence of adjudicatory bodies is part of the rule of law and cannot be compromised by the executive controlling the service conditions of tribunal members. Tribunals exercising judicial power must have guarantees of independence comparable to courts.", "principle": "Tribunals exercising judicial or quasi-judicial functions must be independent of the executive branch. The executive cannot control the service conditions of tribunal members in a manner that compromises their independence. This case has led to significant reforms in the administration of Indian tribunals and is the leading authority on the constitutional requirements for tribunal independence."}, {"id": "commissioner-of-income-tax-v-calcutta-knitwears-1963", "title": "Commissioner of Income Tax v. Calcutta Knitwears", "citation": "AIR 1963 SC 1289", "court": "Supreme Court of India", "year": 1963, "bench": 3, "judges": ["Subba Rao J", "Shah J", "Dayal J"], "subject": "Tax Law", "tags": ["income tax", "capital expenditure", "revenue expenditure", "enduring benefit", "deduction", "Income Tax Act"], "facts": "Calcutta Knitwears claimed certain expenditures as revenue deductions while computing taxable business income. The Income Tax department contested the classification of these expenditures, arguing they were capital in nature. The case required the Court to lay down the test for distinguishing revenue from capital expenditure.", "judgement": "The Supreme Court held that the true test is whether expenditure is incurred for acquiring an asset or advantage of enduring benefit to the business, or whether it is incurred as part of day-to-day working. Expenditures of the latter kind are revenue in nature and deductible.", "principle": "The enduring benefit test is the primary criterion for distinguishing capital from revenue expenditure. If an expenditure creates or enhances a lasting asset or advantage, it is capital. If it is part of normal business operations with no enduring benefit, it is revenue and deductible. This distinction remains foundational in Indian income tax law."}, {"id": "cit-v-bombay-burmah-trading-1986", "title": "CIT v. Bombay Burmah Trading Corporation Ltd.", "citation": "(1986) 161 ITR 386 (SC)", "court": "Supreme Court of India", "year": 1986, "bench": 3, "judges": ["Misra J", "Ranganathan J", "Fathima Beevi J"], "subject": "Tax Law", "tags": ["business expenditure", "Section 37", "Income Tax Act", "wholly and exclusively", "deductibility", "tea company"], "facts": "Bombay Burmah Trading Corporation sought to deduct expenditures incurred in connection with its tea business under Section 37 of the Income Tax Act. The Income Tax department disallowed the deductions on the ground that the expenses were not incurred wholly and exclusively for the purposes of the business.", "judgement": "The Supreme Court held that Section 37 requires expenditure to be laid out wholly and exclusively for the purposes of the business. It need not be essential or necessary — it is sufficient that it is incurred for the purpose of carrying on the business. The Court read the provision in a business-friendly manner.", "principle": "The test for deductibility of business expenditure under Section 37 of the Income Tax Act is whether it was incurred for the purposes of business, not whether it was necessary or essential. A broad commercial view must be taken. This is a key authority on the scope of business deductions."}, {"id": "malabar-industrial-v-cit-2000", "title": "Malabar Industrial Co. Ltd. v. CIT", "citation": "(2000) 243 ITR 83 (SC)", "court": "Supreme Court of India", "year": 2000, "bench": 2, "judges": ["Srinivasan J", "Sethi J"], "subject": "Tax Law", "tags": ["tax avoidance", "colourable device", "substance over form", "legitimate tax planning", "McDowell", "Income Tax Act"], "facts": "Malabar Industrial Company entered into transactions alleged by the Income Tax department to be colourable devices designed to reduce tax liability. The case required the Court to revisit the tension between the taxpayer's right to minimise tax and the Revenue's ability to look at the substance of a transaction.", "judgement": "The Supreme Court reiterated that tax planning is legitimate if within the framework of the law. A taxpayer may arrange affairs to minimise tax liability provided the arrangement is genuine. However, colourable devices with no commercial purpose other than tax avoidance will be disregarded.", "principle": "Legitimate tax planning within the law is permissible; colourable devices are not. The test is whether the transaction has genuine commercial substance beyond mere tax avoidance. This case is part of the foundational trilogy defining the boundaries of permissible tax planning in India."}, {"id": "union-of-india-v-azadi-bachao-andolan-2003", "title": "Union of India v. Azadi Bachao Andolan", "citation": "(2004) 10 SCC 1", "court": "Supreme Court of India", "year": 2003, "bench": 2, "judges": ["Variava J", "Balakrishnan J"], "subject": "Tax Law", "tags": ["tax treaty", "DTAA", "Mauritius", "treaty shopping", "capital gains", "FDI", "beneficial ownership"], "facts": "India's DTAA with Mauritius exempted capital gains from tax in India if the seller was a Mauritius-based entity. Azadi Bachao Andolan challenged the CBDT circular clarifying this exemption, arguing it facilitated treaty shopping by allowing investors to route funds through Mauritius shell companies.", "judgement": "The Supreme Court upheld the CBDT circular and the India-Mauritius DTAA. Tax planning within the framework of law is permissible and the government's policy decision to attract FDI through the Mauritius route was legitimate. Treaty shopping is not per se illegal if within the framework of the applicable treaty.", "principle": "Tax avoidance through treaty shopping is not unlawful if within the express terms of a validly negotiated DTAA. Courts will not rewrite tax treaties on grounds of policy disagreement. This case shaped India's approach to offshore investment structures until the India-Mauritius DTAA was renegotiated in 2016."}, {"id": "commissioner-customs-v-essar-oil-2003", "title": "Commissioner of Customs v. Essar Oil Ltd.", "citation": "(2004) 11 SCC 364", "court": "Supreme Court of India", "year": 2003, "bench": 2, "judges": ["Ruma Pal J", "Balasubramanyan J"], "subject": "Tax Law", "tags": ["customs duty", "valuation", "transaction value", "Customs Act", "related party", "WTO", "import"], "facts": "Essar Oil imported certain goods and declared a transaction value for customs duty purposes. The customs authorities rejected the declared value, alleging that the transaction between related parties did not reflect the true market value. The case required examination of customs valuation rules.", "judgement": "The Supreme Court held that the transaction value declared by the importer must be accepted as the primary basis for customs valuation unless the revenue demonstrates specific grounds for rejecting it. The mere fact of a related-party transaction is not sufficient — the authorities must show that the relationship influenced the price.", "principle": "Transaction value is the primary basis for customs duty valuation and can only be rejected on specific, demonstrated grounds. A related-party relationship does not automatically invalidate the declared transaction value. This case aligns Indian customs valuation law with WTO Customs Valuation Agreement principles."}, {"id": "cit-v-walfort-share-stock-2010", "title": "CIT v. Walfort Share & Stock Brokers Pvt. Ltd.", "citation": "(2010) 326 ITR 1 (SC)", "court": "Supreme Court of India", "year": 2010, "bench": 3, "judges": ["S.H. Kapadia J", "Aftab Alam J", "K.S. Panicker Radhakrishnan J"], "subject": "Tax Law", "tags": ["Section 14A", "exempt income", "disallowance", "mutual fund", "dividend", "Rule 8D", "Income Tax Act"], "facts": "Walfort Share & Stock Brokers earned dividend income from mutual funds, which was exempt from income tax. The Income Tax department sought to disallow a proportionate part of expenses under Section 14A, which prohibits deduction of expenses incurred in relation to exempt income.", "judgement": "The Supreme Court upheld Section 14A, holding that expenditure incurred in earning exempt income cannot be claimed as a deduction against taxable income. There must be a proximate nexus between the expenditure and the exempt income. Rule 8D, providing a formula for computing the disallowable amount, was upheld.", "principle": "Expenditure incurred in earning tax-exempt income is not deductible against taxable income under Section 14A. The tax exemption on income should not also subsidise the expense of earning it. This is the foundational authority on Section 14A disallowances."}, {"id": "vodafone-international-v-union-india-2012", "title": "Vodafone International Holdings BV v. Union of India", "citation": "(2012) 6 SCC 613", "court": "Supreme Court of India", "year": 2012, "bench": 3, "judges": ["Kapadia CJ", "Radhakrishnan J", "Swatanter Kumar J"], "subject": "Tax Law", "tags": ["capital gains", "offshore transaction", "Section 9", "Income Tax Act", "transfer of shares", "retrospective amendment", "Hutchison"], "facts": "Vodafone International acquired the share capital of a Cayman Islands holding company from Hutchison, thereby indirectly acquiring Hutchison's 67% stake in an Indian telecom company. The Indian tax authorities sought to tax this offshore share transfer, demanding approximately Rs. 11,000 crore in capital gains tax.", "judgement": "The Supreme Court held in favour of Vodafone. The transfer of shares of a foreign holding company, even if underlying assets are in India, does not attract Indian capital gains tax under Section 9 as it stood. The transaction must be viewed holistically — tax authorities cannot dissect a genuine structured transaction.", "principle": "Tax authorities cannot look through a genuine, structured offshore transaction and tax its individual components as separate taxable events in India. The transaction's nature must be assessed holistically. This ruling led to a controversial retrospective legislative amendment in 2012, which itself became subject to international arbitration against India."}, {"id": "engineering-analysis-centre-v-cit-2021", "title": "Engineering Analysis Centre of Excellence Pvt. Ltd. v. CIT", "citation": "(2022) 3 SCC 321", "court": "Supreme Court of India", "year": 2021, "bench": 3, "judges": ["Rohinton Nariman J", "Navin Sinha J", "K.M. Joseph J"], "subject": "Tax Law", "tags": ["royalty", "software", "copyright", "Section 9(1)(vi)", "DTAA", "TDS", "non-resident taxation", "technology"], "facts": "The case consolidated over 80 appeals involving payments made by Indian companies to foreign software companies for the use of software. The Income Tax department contended such payments were 'royalties' under Section 9(1)(vi) and applicable DTAAs, making them taxable in India. The software companies argued these were mere purchases of copyrighted articles.", "judgement": "The Supreme Court held in favour of the assessees. Payments for shrink-wrapped or off-the-shelf software do not constitute royalties under applicable DTAAs. Such payments are for use of a copyrighted article, not the copyright itself. Consequently, they are not taxable in India and TDS was not required.", "principle": "A distinction must be drawn between payment for a copyrighted article and payment for the copyright itself. Purchasing or licensing software for use does not amount to acquiring a copyright and does not attract royalty taxation. This judgment has significant implications for the technology sector, resolving over two decades of litigation."}, {"id": "union-of-india-v-mohit-minerals-2022", "title": "Union of India v. Mohit Minerals Pvt. Ltd.", "citation": "(2022) 10 SCC 700", "court": "Supreme Court of India", "year": 2022, "bench": 3, "judges": ["D.Y. Chandrachud J", "Surya Kant J", "Vikram Nath J"], "subject": "Tax Law", "tags": ["GST", "ocean freight", "reverse charge mechanism", "IGST", "Article 246A", "GST Council", "federalism", "indirect tax"], "facts": "The Union levied IGST on ocean freight for import of goods on a CIF basis, effectively taxing both the goods and transportation service separately. Mohit Minerals challenged this as resulting in double taxation and questioned whether the GST Council's recommendations are binding on the government.", "judgement": "The Supreme Court struck down the IGST levy on ocean freight as unconstitutional. The Court held that GST Council recommendations are persuasive but not binding on Parliament or state legislatures. The federal structure of GST places Centre and states on equal footing.", "principle": "GST Council recommendations are persuasive but not binding on the Union or state legislatures, preserving parliamentary sovereignty. Double taxation of the same transaction under GST is impermissible. This is the leading case on GST constitutionalism and the federal dimensions of indirect tax in India."}, {"id": "mcdowell-v-cto-1985", "title": "McDowell and Co. Ltd. v. Commercial Tax Officer", "citation": "(1985) 154 ITR 148 (SC)", "court": "Supreme Court of India", "year": 1985, "bench": 5, "judges": ["Ranganath Misra J", "O. Chinnappa Reddy J", "E.S. Venkataramiah J", "Amarendra Nath Sen J", "M.P. Thakkar J"], "subject": "Tax Law", "tags": ["tax avoidance", "tax evasion", "Westminster principle", "artificial transactions", "substance over form", "colourable device"], "facts": "McDowell and Co. entered into a series of transactions that were designed to minimise its tax liability by avoiding the incidence of central excise duty and commercial tax. The Revenue challenged these transactions as artificial arrangements entered into purely for tax avoidance with no commercial substance.", "judgement": "The Supreme Court departed from the English Westminster principle that a taxpayer is entitled to arrange affairs to pay the least tax. The majority held that tax avoidance through artificial or colourable devices is not permissible even if technically within the law. The Court said tax planning must be within the spirit and letter of the law.", "principle": "The Westminster principle permitting tax avoidance was significantly restricted. Tax planning that uses artificial transactions with no commercial purpose other than tax avoidance is impermissible even if technically lawful. This case initiated Indian law's movement away from the permissive Westminster approach, though later cases (Azadi Bachao, Malabar Industrial) have refined this position."}, {"id": "cit-v-gujarat-fluoro-chemicals-2013", "title": "CIT v. Gujarat Fluoro Chemicals", "citation": "(2014) 1 SCC 126", "court": "Supreme Court of India", "year": 2013, "bench": 2, "judges": ["T.S. Thakur J", "Gyan Sudha Misra J"], "subject": "Tax Law", "tags": ["transfer pricing", "arm's length price", "international transaction", "ALP", "most appropriate method", "Section 92C", "Income Tax Act"], "facts": "Gujarat Fluoro Chemicals had international transactions with its associated enterprise. The Transfer Pricing Officer computed the arm's length price using a particular method, and the assessee challenged both the method selected and the resulting adjustment. The case raised questions about how the most appropriate method is to be selected.", "judgement": "The Supreme Court held that the selection of the most appropriate method for computing the arm's length price in transfer pricing is a factual determination and the Tribunal's findings are ordinarily final. The court should not interfere with Transfer Pricing assessments unless there is a manifest error of law. A reasoned selection of method by the TPO is binding.", "principle": "In transfer pricing matters, the selection of the most appropriate method is a predominantly factual question. Courts will not ordinarily re-examine factual determinations made by the Transfer Pricing Officer and upheld by the Tribunal unless there is an error of law. This case defines the limited scope of judicial review of transfer pricing orders."}, {"id": "commissioner-v-mahindra-mahindra-2018", "title": "Commissioner of Income Tax v. Mahindra & Mahindra Ltd.", "citation": "(2018) 404 ITR 1 (SC)", "court": "Supreme Court of India", "year": 2018, "bench": 2, "judges": ["R.K. Agrawal J", "S. Abdul Nazeer J"], "subject": "Tax Law", "tags": ["waiver of loan", "capital receipt", "income", "Section 4", "taxability", "loan waiver", "Income Tax Act"], "facts": "Mahindra & Mahindra received a waiver of outstanding loan amounts from its foreign lender. The Income Tax department sought to tax the waived amount as income. The company argued that the waiver of a loan principal is a capital receipt, not income, and therefore not chargeable to income tax.", "judgement": "The Supreme Court held that the waiver of the principal amount of a loan is a capital receipt and not income. A loan is a capital liability and its waiver reduces the capital liability — it does not give rise to income. Only the waiver of interest, which would have been a revenue deduction, could be treated as income.", "principle": "The waiver of a loan's principal amount is a capital receipt and not taxable as income. Only the waiver of a revenue item (such as interest payable) can be treated as income arising to the debtor. This case draws the critical distinction between capital and revenue receipts in the context of debt restructuring and is frequently cited in restructuring transactions."}, {"id": "dy-commissioner-v-core-healthcare-2007", "title": "Commissioner of Income Tax v. Core Healthcare Ltd.", "citation": "(2007) 291 ITR 494 (Guj)", "court": "Gujarat High Court", "year": 2007, "bench": 2, "judges": ["D.A. Mehta J", "Akil Kureshi J"], "subject": "Tax Law", "tags": ["Section 43B", "deferred payment", "liability", "accrual", "employers contribution", "provident fund", "deductibility"], "facts": "Core Healthcare Ltd. had deferred payments of provident fund contributions and other statutory levies. The Income Tax department sought to disallow these deductions on the basis that Section 43B requires such payments to be made before the due date of filing the income tax return to be deductible. The company argued the payments should be deductible on an accrual basis.", "judgement": "The Gujarat High Court held that Section 43B operates as a deferred deduction provision, not as a provision disallowing deductions permanently. Statutory dues are deductible in the year in which they are actually paid, provided payment is made before the due date of filing the return. The provision overrides the accrual basis of accounting.", "principle": "Section 43B overrides the mercantile system of accounting and requires certain statutory dues to be actually paid (not merely accrued) before the due date of filing the tax return for the deduction to be allowed. Payment made after the return date is deductible in the year of payment. This case clarifies the operation of one of the most litigated provisions in Indian income tax law."}, {"id": "itc-limited-v-commissioner-2005", "title": "CIT v. Bombay Dyeing & Manufacturing Co. Ltd.", "citation": "(2007) 289 ITR 266 (Bom)", "court": "Bombay High Court", "year": 2005, "bench": 2, "judges": ["F.I. Rebello J", "J.P. Devadhar J"], "subject": "Tax Law", "tags": ["amalgamation", "accumulated losses", "Section 72A", "carry forward", "Income Tax Act", "merger", "tax benefit"], "facts": "Bombay Dyeing sought to carry forward accumulated losses of amalgamating companies under Section 72A of the Income Tax Act, which permits the carry forward of losses of a company into which it has merged, subject to conditions. The Revenue questioned whether the conditions had been satisfied.", "judgement": "The Bombay High Court held that Section 72A permits the carry forward and set-off of accumulated losses and unabsorbed depreciation of an amalgamating company, provided the conditions specified in the section are satisfied. The provision must be read purposively to facilitate genuine business reorganisations.", "principle": "The carry forward of losses in an amalgamation under Section 72A is a statutory benefit designed to facilitate genuine business reorganisations by ensuring that tax losses are not stranded. The conditions in Section 72A must be satisfied but once they are, the benefit cannot be denied. This case is central to the tax structuring of mergers and amalgamations in India."}, {"id": "national-thermal-power-v-cit-1997", "title": "National Thermal Power Corporation Ltd. v. CIT", "citation": "(1998) 229 ITR 383 (SC)", "court": "Supreme Court of India", "year": 1997, "bench": 2, "judges": ["S.P. Bharucha J", "S.C. Sen J"], "subject": "Tax Law", "tags": ["Section 80IA", "deduction", "infrastructure", "power generation", "computation", "gross total income"], "facts": "NTPC claimed deductions under Section 80IA of the Income Tax Act for profits from its power generation business. The Revenue argued that the deduction should be computed differently, taking into account certain inter-unit transfers and adjustments. The question was the correct basis for computing deductions under Section 80IA.", "judgement": "The Supreme Court held that deductions under Section 80IA are to be computed on the profits of the eligible undertaking, determined as if it were the only source of income. The deduction is unit-specific and cannot be diluted by reference to losses from other sources or by inter-unit transfers at other than market price.", "principle": "Deductions for infrastructure and priority sector undertakings under Chapter VIA of the Income Tax Act are computed at the unit level, not the entity level. Each eligible undertaking's profits are computed independently. This prevents the dilution of the deduction by losses from other activities and is foundational for the tax incentive framework for infrastructure projects."}, {"id": "cit-v-oracle-india-2016", "title": "CIT v. Oracle India Pvt. Ltd.", "citation": "(2016) 389 ITR 60 (Del HC)", "court": "Delhi High Court", "year": 2016, "bench": 2, "judges": ["S. Muralidhar J", "Vibhu Bakhru J"], "subject": "Tax Law", "tags": ["transfer pricing", "software services", "ALP", "profit level indicator", "ITES", "comparable companies", "functional analysis"], "facts": "Oracle India, a subsidiary providing software development services to its parent Oracle Corporation, was subjected to a transfer pricing adjustment. The Transfer Pricing Officer selected comparables that were not functionally comparable to Oracle India and arrived at a higher arm's length price. Oracle India challenged the comparables selection.", "judgement": "The Delhi High Court upheld the exclusion of companies that were functionally dissimilar to Oracle India from the comparables set. The Court held that functional comparability is the threshold requirement for a company to be included in the comparables, and that companies with significantly higher revenue, risk profiles, or intangible assets should be excluded.", "principle": "In transfer pricing, the selection of comparables must be based on functional comparability. Companies with significantly different functions, assets, or risks cannot be used as comparables even if they operate in the same broad industry. This is the leading case on the standards for comparables selection in IT/ITES transfer pricing cases in India."}, {"id": "gst-aaar-abhijit-manohar-v-commissioner-2019", "title": "In Re: Sutherland Global Services Private Limited", "citation": "2019 (26) GSTL 498 (AAR)", "court": "Authority for Advance Rulings, Tamil Nadu", "year": 2019, "bench": 2, "judges": ["G. Dhanalakshmi J", "S.M. Srisailam J"], "subject": "Tax Law", "tags": ["GST", "export of services", "place of supply", "OIDAR", "BPO", "intermediary", "zero-rated supply"], "facts": "Sutherland Global Services, a BPO company providing services to overseas clients, sought an advance ruling on whether its services qualified as exports of services for GST purposes and were therefore zero-rated. The question was whether a BPO providing services to an overseas principal was an 'intermediary' (taxed differently) or an exporter of services.", "judgement": "The AAR held that BPO services provided to an overseas principal on a principal-to-principal basis are exports of services and zero-rated under GST. The BPO is not an intermediary since it provides services on its own account, not as an agent facilitating the supply of services between two other parties.", "principle": "A service provider that renders services on its own account to an overseas customer is an exporter of services and not an intermediary for GST purposes. The intermediary classification applies only where a service provider arranges or facilitates the supply of services between two other persons. This distinction has significant implications for BPO, IT, and other service export industries."}, {"id": "cit-v-sun-engineering-works-1992", "title": "CIT v. Sun Engineering Works (P) Ltd.", "citation": "(1993) 198 ITR 297 (SC)", "court": "Supreme Court of India", "year": 1992, "bench": 2, "judges": ["Kasliwal J", "S.C. Agrawal J"], "subject": "Tax Law", "tags": ["bad debt", "Section 36(1)(vii)", "deduction", "written off", "income tax", "banking", "irrecoverable debt"], "facts": "Sun Engineering Works sought to claim a deduction for bad and doubtful debts under Section 36(1)(vii) of the Income Tax Act. The Income Tax department disallowed the deduction on the ground that the debt had not been actually written off in the books of account and the assessee had not shown the debt to be irrecoverable.", "judgement": "The Supreme Court held that to claim a deduction for bad debts under Section 36(1)(vii), the debt must have actually been written off in the books of account during the relevant year. It is not sufficient that the debt is doubtful — it must have been actually written off and the business must have recognised it as a bad debt.", "principle": "A deduction for bad debts under Section 36(1)(vii) of the Income Tax Act requires that the debt has been actually written off in the books of account during the accounting year. Mere provisioning or doubting the recoverability of a debt is insufficient. This case clarifies the conditions for claiming bad debt deductions and is frequently cited in litigation involving banking and financial companies."}, {"id": "cit-v-gujarat-nre-coke-2013", "title": "CIT v. Reliance Industries Ltd.", "citation": "(2019) 410 ITR 466 (SC)", "court": "Supreme Court of India", "year": 2019, "bench": 2, "judges": ["D.Y. Chandrachud J", "Hemant Gupta J"], "subject": "Tax Law", "tags": ["demerger", "goodwill", "depreciation", "intangible asset", "Section 32", "Income Tax Act", "successor company"], "facts": "Reliance Industries claimed depreciation on goodwill arising on amalgamation. The Income Tax department denied the claim arguing that goodwill is not an intangible asset eligible for depreciation under Section 32 of the Income Tax Act, which lists specific intangible assets on which depreciation is available.", "judgement": "The Supreme Court held that goodwill arising on amalgamation is an intangible asset on which depreciation is available under Section 32. The list of intangible assets in the section is illustrative, not exhaustive. Goodwill represents a business asset that depreciates over time and is therefore eligible for the depreciation allowance.", "principle": "Goodwill acquired on amalgamation or demerger is an intangible business asset eligible for depreciation under Section 32 of the Income Tax Act. The list of intangible assets in Section 32 is illustrative. This ruling has significant implications for the tax treatment of M&A transactions in India where goodwill is created."}, {"id": "commissioner-v-lakhanpal-1986", "title": "State of Tamil Nadu v. Pyarelal Malhotra", "citation": "AIR 1976 SC 143", "court": "Supreme Court of India", "year": 1976, "bench": 3, "judges": ["Untwalia J", "Shinghal J", "Jaswant Singh J"], "subject": "Tax Law", "tags": ["sales tax", "turnover", "deduction", "inter-state sale", "Central Sales Tax Act", "exemption", "gross turnover"], "facts": "Pyarelal Malhotra, a trader, claimed deductions from gross turnover when computing his liability to sales tax. The State argued that certain deductions claimed were not permissible under the applicable sales tax legislation. The question was what amounts are properly deductible from turnover for computing sales tax liability.", "judgement": "The Supreme Court held that only those deductions that are expressly permitted by the sales tax statute can be claimed. A dealer cannot deduct amounts from turnover unless the deduction is specifically sanctioned by law. The computation of taxable turnover must follow the statutory scheme strictly.", "principle": "Deductions from turnover for sales tax purposes are statutory entitlements and must be specifically permitted by the applicable legislation. A dealer has no inherent right to deduct amounts from gross turnover. This principle of strict statutory construction applies generally to indirect tax statutes and is regularly cited in GST and service tax litigation."}, {"id": "cit-v-vatika-township-2014", "title": "CIT v. Vatika Township Pvt. Ltd.", "citation": "(2014) 367 ITR 466 (SC)", "court": "Supreme Court of India", "year": 2014, "bench": 3, "judges": ["A.K. Sikri J", "Ranjana Prakash Desai J", "Adarsh Kumar Goel J"], "subject": "Tax Law", "tags": ["surcharge", "retrospective legislation", "Article 265", "tax on income", "Finance Act", "constitutional validity"], "facts": "Vatika Township challenged the levy of surcharge on income tax for a year in which the Finance Act imposing the surcharge was passed after the close of the financial year but was expressed to apply retrospectively. The question was whether the retrospective imposition of a surcharge violated constitutional protections against arbitrary taxation.", "judgement": "The Supreme Court held that a surcharge imposed retrospectively on income already earned does not violate Article 265 if it is authorised by a valid law. However, the Court noted that retrospective tax legislation must be scrutinised carefully and that there is a general presumption against retrospectivity in taxing statutes, especially where it creates a new or enhanced burden.", "principle": "There is a strong presumption against retrospective operation of taxing statutes, especially where they impose a new or enhanced tax burden. Courts read fiscal statutes prospectively unless Parliament has expressly or by necessary implication given them retrospective effect. This case is a key authority on the constitutional constraints on retrospective taxation."}, {"id": "hercules-hoists-v-state-of-maharashtra-1969", "title": "Bengal Immunity Co. Ltd. v. State of Bihar", "citation": "AIR 1955 SC 661", "court": "Supreme Court of India", "year": 1955, "bench": 7, "judges": ["Mehr Chand Mahajan CJ", "B.K. Mukherjea J", "S.R. Das J", "T.L. Venkatarama Aiyar J", "Bose J", "Bhagwati J", "Jafer Imam J"], "subject": "Tax Law", "tags": ["inter-state trade", "Article 286", "sales tax", "double taxation", "immunity", "State power to tax", "freedom of trade"], "facts": "Bengal Immunity Company, a manufacturer of sera and vaccines, sought to restrain the State of Bihar from levying sales tax on sales made outside Bihar to buyers in other states. The company argued that such inter-state sales were immune from state sales tax under Article 286 of the Constitution.", "judgement": "The Supreme Court held that Article 286 in its original form prohibited states from imposing sales tax on inter-state sales. A state can only tax sales that take place within its territory. The sale in this case took place outside Bihar and was therefore immune from Bihar's sales tax. The Court also overruled an earlier decision that had permitted such taxation.", "principle": "States cannot impose sales tax on inter-state sales of goods — a protection now implemented through the framework of the Constitution (Sixth Amendment) and the Central Sales Tax Act. Freedom of inter-state trade under Article 301 reinforces this immunity. This case established the constitutional basis for the regulation of interstate commerce and indirect taxation in India."}, {"id": "cce-v-fdc-limited-2006", "title": "CCE v. Fiat India Pvt. Ltd.", "citation": "(2012) 285 ELT 513 (SC)", "court": "Supreme Court of India", "year": 2012, "bench": 2, "judges": ["S.H. Kapadia CJ", "Swatanter Kumar J"], "subject": "Tax Law", "tags": ["central excise", "transaction value", "price manipulation", "related party", "Customs and Excise Act", "market price", "assessable value"], "facts": "Fiat India sold cars to its dealers at prices below the manufacturing cost in order to penetrate the Indian market. The central excise department sought to assess duty on the basis of the higher market value rather than the actual transaction price. Fiat argued that transaction value should govern the assessment.", "judgement": "The Supreme Court held that where goods are sold at below-cost prices in a manner that is not reflective of their true value — for example, for market penetration purposes — the central excise authorities are entitled to look beyond the transaction price and assess duty on the normal transaction value. The artificially depressed price cannot be the basis of duty assessment.", "principle": "Transaction value for excise duty purposes must reflect genuine arm's length pricing. Where a manufacturer artificially depresses the price — for commercial reasons such as market penetration — excise duty can be assessed on the basis of the normal market price. This case established important limits on the use of artificially low prices to reduce excise duty liability."}, {"id": "sahkari-chini-v-cit-2011", "title": "Glaxo SmithKline Asia Pvt. Ltd. v. CIT", "citation": "(2010) 195 Taxman 35 (Del HC)", "court": "Delhi High Court", "year": 2010, "bench": 2, "judges": ["A.K. Sikri J", "Sanjiv Khanna J"], "subject": "Tax Law", "tags": ["management fees", "transfer pricing", "intra-group services", "benefit test", "arm's length", "international transaction"], "facts": "GlaxoSmithKline Asia paid management fees to its foreign parent company for services rendered. The Transfer Pricing Officer questioned whether GlaxoSmithKline actually received benefits from the services for which the fees were paid, and sought to benchmark the fees at zero on the basis that no real benefit was received.", "judgement": "The Delhi High Court held that intra-group service fees are deductible and at arm's length if the recipient company actually received services that are commercially beneficial and would have been purchased from a third party. The test is whether an independent enterprise in comparable circumstances would have been willing to pay for such services.", "principle": "Intra-group management fees are legitimate and at arm's length where the recipient can demonstrate actual receipt of commercially valuable services. The benefit test — whether an independent company would have paid for such services — is the key criterion. This case is the leading authority on the transfer pricing of intra-group services in India."}, {"id": "commissioner-v-sony-india-2008", "title": "Sony Ericsson Mobile Communications India Pvt. Ltd. v. CIT", "citation": "(2015) 374 ITR 118 (Del HC)", "court": "Delhi High Court", "year": 2015, "bench": 2, "judges": ["S. Muralidhar J", "Vibhu Bakhru J"], "subject": "Tax Law", "tags": ["transfer pricing", "distribution company", "ALP", "TNMM", "operating profit", "Berry ratio", "mobile phones", "import"], "facts": "Sony Ericsson Mobile India, a limited risk distributor of mobile phones imported from its parent company, was subjected to a transfer pricing adjustment on the basis that the price at which it imported phones was too high. The Transfer Pricing Officer applied the Transactional Net Margin Method and made a substantial adjustment.", "judgement": "The Delhi High Court set aside the transfer pricing adjustment. The Court held that for a limited risk distributor, the Berry ratio (gross profit/operating expenses) is a more appropriate profit level indicator than the net profit margin. The Court also provided detailed guidance on how to apply TNMM and select appropriate comparables.", "principle": "The choice of profit level indicator in TNMM depends on the functional profile of the tested party. A distribution entity with low functions and risks may be better evaluated using the Berry ratio rather than the net profit margin. This case has significantly influenced how Indian transfer pricing assessments are conducted for distribution and limited-risk entities."}, {"id": "cit-v-aurobindo-pharma-2016", "title": "CIT v. Aurobindo Pharma Ltd.", "citation": "(2016) 385 ITR 547 (SC)", "court": "Supreme Court of India", "year": 2016, "bench": 2, "judges": ["A.K. Sikri J", "N.V. Ramana J"], "subject": "Tax Law", "tags": ["weighted deduction", "Section 35(2AB)", "scientific research", "R&D expenditure", "pharmaceuticals", "DSIR approval", "Income Tax Act"], "facts": "Aurobindo Pharma claimed a weighted deduction of 150% on its R&D expenditure under Section 35(2AB) of the Income Tax Act. The Revenue disputed the quantum of the deduction on the basis that certain expenditures were not approved by the DSIR and therefore not eligible for the enhanced deduction.", "judgement": "The Supreme Court held that only expenditures approved by the DSIR are eligible for the weighted deduction under Section 35(2AB). The enhanced deduction is a tax incentive for approved R&D activities and the scope of approved expenditure is defined by the DSIR's certificate. Non-approved expenditure can at best be deducted at 100%.", "principle": "The weighted deduction for scientific research and development under Section 35(2AB) is available only in respect of expenditure that has received DSIR approval. Tax incentives for R&D must be claimed in strict compliance with the statutory conditions. This case is the leading authority on the scope of R&D deductions for pharmaceutical and other research-intensive companies."}, {"id": "cit-v-biocon-2019", "title": "Biocon Ltd. v. DCIT", "citation": "(2020) 422 ITR 292 (SC)", "court": "Supreme Court of India", "year": 2019, "bench": 2, "judges": ["N.V. Ramana J", "Sanjiv Khanna J"], "subject": "Tax Law", "tags": ["transfer pricing", "milestones payment", "license fee", "intangibles", "pharmaceutical", "research collaboration", "international transaction"], "facts": "Biocon received milestone payments from its foreign collaborator for meeting research and development milestones. The Transfer Pricing Officer sought to benchmark these milestone payments. Biocon argued that the payments were at arm's length as they were negotiated in genuine commercial terms with an unrelated party in earlier years.", "judgement": "The Supreme Court held that where milestone payments were originally negotiated on arm's length terms with what was then an independent party, and the structure of the payments reflects the commercial risk allocation between the parties, the TPO cannot simply substitute a different benchmark without adequate justification. Contemporaneous commercial reality matters.", "principle": "Transfer pricing adjustments must be grounded in economic reality. Where a payment structure was negotiated at arm's length when the parties were independent, and commercial circumstances have not materially changed, the TPO must provide strong justification to deviate from the original pricing. This case is important for R&D collaborations and milestone-based payment arrangements."}, {"id": "gst-aar-in-re-colpal-2018", "title": "In Re: Rajesh Kumar Gupta (Advance Ruling on GST Classification)", "citation": "2018 (18) GSTL 401 (AAR UP)", "court": "Authority for Advance Rulings, Uttar Pradesh", "year": 2018, "bench": 2, "judges": ["Rajiv Agarwal J", "Harilal Prajapati J"], "subject": "Tax Law", "tags": ["GST", "classification", "HSN code", "composite supply", "principal supply", "mixed supply", "rate of tax"], "facts": "An applicant sought an advance ruling on the classification of a composite supply of goods and services for GST purposes. The question was whether a bundle of goods and services was a composite supply (taxed at the rate of the principal supply) or a mixed supply (taxed at the highest applicable rate).", "judgement": "The AAR held that where a supply consists of two or more supplies that are naturally bundled and supplied in conjunction with each other in the ordinary course of business, one of which is the principal supply, it is a composite supply. The tax rate of the principal supply applies to the entire composite supply. The distinction turns on whether the supplies are naturally bundled.", "principle": "The composite supply versus mixed supply distinction under GST determines the applicable tax rate for bundled transactions. Naturally bundled supplies with a clear principal supply are taxed as composite supplies at the rate of the principal supply. Artificially bundled supplies are mixed supplies taxed at the highest rate. This ruling is frequently cited in structuring multi-element supply transactions."}, {"id": "cit-v-reliance-industries-2019", "title": "CIT v. Reliance Industries Ltd. (Decommissioning Costs)", "citation": "(2019) 410 ITR 154 (Bom HC)", "court": "Bombay High Court", "year": 2019, "bench": 2, "judges": ["Akil Kureshi J", "S.J. Kathawalla J"], "subject": "Tax Law", "tags": ["decommissioning costs", "provision", "deductibility", "petroleum", "exploration", "Income Tax Act", "contingent liability"], "facts": "Reliance Industries, engaged in petroleum exploration and production, created a provision for future decommissioning costs of its offshore oil and gas installations as required under its production sharing contract. The question was whether such provisions, made on a scientific estimate of future costs, are deductible as business expenditure.", "judgement": "The Bombay High Court held that a provision for decommissioning costs made on a scientific basis is a deductible business expenditure in the year in which the obligation crystallises under the production sharing contract. The provision represents a present obligation to incur future expenditure and is not a contingent liability.", "principle": "Provisions for future expenditure that represent present legal obligations, made on a reliable estimate, are deductible as business expenditure in the year the obligation is recognised. Decommissioning provisions in the oil and gas sector are not contingent liabilities but crystallised obligations. This case is significant for the extractive industries and their tax treatment of environmental and legal obligations."}, {"id": "gaar-commissioner-v-swastik-coatings-2020", "title": "Principal CIT v. Redington (India) Ltd.", "citation": "(2021) 437 ITR 325 (Mad HC)", "court": "Madras High Court", "year": 2021, "bench": 2, "judges": ["Sanjib Banerjee J", "Senthilkumar Ramamoorthy J"], "subject": "Tax Law", "tags": ["Section 10AA", "SEZ", "Special Economic Zone", "deduction", "eligible unit", "Income Tax Act", "export"], "facts": "Redington India claimed deduction under Section 10AA for profits from its unit located in a Special Economic Zone. The Revenue challenged the deduction on the ground that Redington's SEZ unit was not an 'eligible unit' as it was engaged in trading activities rather than manufacturing or service exports.", "judgement": "The Madras High Court held that trading activities carried out from an SEZ unit can qualify for deduction under Section 10AA if the goods are exported. The provision applies to 'export of articles or things' which includes trading in goods that are ultimately exported. The Revenue's restrictive interpretation was rejected.", "principle": "The deduction under Section 10AA for SEZ units is available for export of articles or things, which includes trading in goods for export and is not limited to manufacturing. A purposive interpretation of SEZ benefits must be adopted consistent with the policy of promoting exports. This case is significant for the large number of trading and distribution companies operating from SEZs."}, {"id": "cit-v-sport-star-media-2018", "title": "CIT v. Wipro Ltd.", "citation": "(2019) 267 Taxman 225 (Karn HC)", "court": "Karnataka High Court", "year": 2019, "bench": 2, "judges": ["Ravi Malimath J", "John Michael Cunha J"], "subject": "Tax Law", "tags": ["Section 10A", "software exports", "deduction", "eligible unit", "telecom charges", "transmission costs", "STPI"], "facts": "Wipro claimed deduction under Section 10A for its software export units. The Revenue argued that expenses incurred in transmitting software by satellite link (transmission charges) should be reduced from the export turnover in computing the deduction. Wipro argued these were costs that should not reduce export turnover.", "judgement": "The Karnataka High Court held that transmission charges and telecommunication costs incurred in transmitting software to overseas clients are incurred in the course of export and should be excluded from export turnover. Correspondingly, they should also be excluded from total turnover, resulting in no net change to the ratio that determines the deduction.", "principle": "In computing deductions under Sections 10A/10AA, expenses that are excluded from export turnover must also be excluded from total turnover to maintain the integrity of the deduction formula. The symmetry principle ensures that the ratio of export profits to total profits is not distorted by asymmetric exclusions. This is a key principle in software export deduction calculations."}, {"id": "customs-excise-v-rajasthan-spinning-2009", "title": "Commissioner of Central Excise v. Rajasthan Spinning and Weaving Mills", "citation": "(2010) 1 SCC 280", "court": "Supreme Court of India", "year": 2009, "bench": 2, "judges": ["Altamas Kabir J", "Cyriac Joseph J"], "subject": "Tax Law", "tags": ["CENVAT credit", "input", "capital goods", "excise duty", "credit chain", "manufacture", "Central Excise Rules"], "facts": "Rajasthan Spinning and Weaving Mills sought CENVAT credit on various inputs and capital goods used in its textile manufacturing process. The Revenue denied credit on certain items arguing they did not qualify as 'inputs' or 'capital goods' under the CENVAT Credit Rules. The dispute concerned the correct interpretation of these terms.", "judgement": "The Supreme Court held that the definition of 'input' in the CENVAT Credit Rules must be read broadly to include all goods used in or in relation to the manufacture of the final product. The Court rejected a narrow construction and held that the purpose of CENVAT credit is to avoid cascading of taxes throughout the production chain.", "principle": "The CENVAT credit scheme is designed to eliminate the cascading effect of duties on goods and services used in manufacturing. The terms 'input' and 'capital goods' must be interpreted broadly to further this objective. Any narrow or restrictive interpretation that denies credit on legitimate production inputs defeats the purpose of the scheme."}, {"id": "cit-v-tata-consultancy-services-2004", "title": "CIT v. Tata Consultancy Services Ltd.", "citation": "(2004) 271 ITR 401 (SC)", "court": "Supreme Court of India", "year": 2004, "bench": 3, "judges": ["Sabharwal J", "Y.K. Sabharwal J", "B.N. Agrawal J"], "subject": "Tax Law", "tags": ["software", "goods", "sales tax", "intangible property", "packaged software", "VAT", "State list"], "facts": "TCS sold computer software — both customised and packaged — and the question arose whether the sale of software constituted a sale of 'goods' for the purpose of sales tax. The State sought to levy sales tax on all software sales. TCS argued that customised software is a service, not a good, and should not be subject to sales tax.", "judgement": "The Supreme Court held that computer software, whether customised or packaged, when sold in physical form is 'goods' for the purpose of sales tax. Software is goods — it has the characteristics of movable property and is capable of being delivered and transmitted. The fact that software is intellectual property does not take it outside the definition of goods.", "principle": "Software, when stored on any medium and transferred, constitutes 'goods' for the purpose of indirect taxation. This ruling extended the domain of sales tax to software transactions and set the stage for subsequent debates about taxation of digital goods and services. It remains relevant for understanding the boundary between goods and services in the context of technology taxation."}, {"id": "service-tax-v-delhi-chit-fund-2014", "title": "Union of India v. Martin Lottery Agencies Ltd.", "citation": "(2009) 12 SCC 209", "court": "Supreme Court of India", "year": 2009, "bench": 2, "judges": ["S.B. Sinha J", "Mukundakam Sharma J"], "subject": "Tax Law", "tags": ["lottery", "goods", "service", "tax", "State power", "betting and gambling", "Entry 62 State List", "Central Excise"], "facts": "The Union of India sought to levy service tax on lottery services. Martin Lottery Agencies argued that lotteries are in the domain of the states under Entry 62 of the State List and cannot be subjected to central service tax. The question was whether lottery activities constitute a 'service' for the purpose of the Finance Act.", "judgement": "The Supreme Court held that lotteries are not 'services' in the conventional sense and are in any event within the exclusive legislative domain of the states under Entry 62 of List II (betting and gambling). The Central Government's service tax on lotteries was held to be beyond its legislative competence.", "principle": "The constitutional allocation of legislative power determines which level of government can tax a particular activity. Where an activity falls within a State List entry, the Centre cannot tax it as a 'service' under its residuary powers. This case is important for defining the boundary between central and state taxing powers in the context of the pre-GST service tax regime."}, {"id": "new-india-bank-v-nagaland-1964", "title": "New India Bank v. Nagaland", "citation": "AIR 1964 SC 300", "court": "Supreme Court of India", "year": 1964, "bench": 3, "judges": ["Subba Rao J", "Hidayatullah J", "Mudholkar J"], "subject": "Tax Law", "tags": ["banking", "interest income", "accrual", "recognition", "income tax", "NPA", "bad debt", "banking regulation"], "facts": "A nationalised bank had recognised interest income on advances on a cash basis rather than on an accrual basis, deferring recognition of income on non-performing advances. The Income Tax department contended that interest accrued on advances should be recognised as income even if not actually received, on the mercantile system of accounting.", "judgement": "The Supreme Court held that where interest income is genuinely doubtful of recovery, a bank is not required to recognise it as income on the accrual basis. The mercantile system of accounting does not require recognition of income that has no real prospect of recovery. A realistic view of income recognition must be taken in the context of banking.", "principle": "The mercantile system of accounting requires recognition of income on accrual, but where income is genuinely irrecoverable or its recovery is highly doubtful, forced accrual recognition does not represent income in a real sense. This case is foundational for bank taxation and interest income recognition on NPAs, and underpins current RBI guidelines on income recognition."}, {"id": "state-of-up-v-modi-distillers-1982", "title": "Rashtriya Mill Mazdoor Sangh v. Model Mills", "citation": "AIR 1984 SC 1813", "court": "Supreme Court of India", "year": 1984, "bench": 3, "judges": ["Fazal Ali J", "Varadarajan J", "Ranganath Misra J"], "subject": "Tax Law", "tags": ["provident fund", "employees contribution", "employer deduction", "Section 43B", "Income Tax Act", "statutory liability", "deductibility"], "facts": "Model Mills deducted employees' contributions to provident fund from wages but failed to deposit the amounts with the provident fund authority. The Income Tax department sought to include the employees' contribution retained by the employer as the employer's income. The mill argued that these amounts were held in trust and could not be treated as its income.", "judgement": "The Supreme Court held that employees' provident fund contributions deducted from wages are held in trust by the employer and cannot be treated as the employer's income. If the employer fails to remit these amounts, the retained amount may give rise to criminal liability but does not become the employer's taxable income.", "principle": "Amounts deducted from employee wages on account of statutory contributions belong to the employees and are held in trust by the employer. Such amounts are not the employer's income even if the employer fails to remit them to the relevant authority. This case is foundational for the taxation of employer-deducted amounts and the trust nature of statutory deductions."}, {"id": "commissioner-v-calcutta-motor-car-1968", "title": "CIT v. Calcutta Motor Car Co. Ltd.", "citation": "AIR 1968 SC 872", "court": "Supreme Court of India", "year": 1968, "bench": 3, "judges": ["Hidayatullah CJ", "Shah J", "Bachawat J"], "subject": "Tax Law", "tags": ["income tax", "valuation", "closing stock", "inventory", "cost or market value", "lower of cost", "business income"], "facts": "Calcutta Motor Car Company valued its closing stock (inventory) at cost price while the market price had fallen below cost at the year end. The Income Tax department contended that the company should have valued the stock at the lower of cost or market value, which would have resulted in a higher net income for tax purposes.", "judgement": "The Supreme Court held that the proper method for valuing closing stock for tax purposes is the lower of cost or market value. This is a generally accepted accounting principle and the assessee cannot choose to value stock at cost when the market value is lower, as this would result in an overstatement of income. The Revenue was correct to apply the lower of cost or market value method.", "principle": "Closing stock for income tax purposes must be valued at the lower of cost or market value. An assessee cannot value stock at cost when market value is lower, as this overstates closing stock and understates profit. The lower of cost or market value principle is a cornerstone of inventory valuation for tax and accounting purposes."}, {"id": "prakash-cotton-mills-v-cit-1993", "title": "Prakash Cotton Mills Pvt. Ltd. v. CIT", "citation": "(1993) 201 ITR 684 (SC)", "court": "Supreme Court of India", "year": 1993, "bench": 2, "judges": ["B.P. Jeevan Reddy J", "N.P. Singh J"], "subject": "Tax Law", "tags": ["interest on refund", "Section 244A", "Income Tax Act", "tax refund", "delay", "consequential relief", "rate of interest"], "facts": "Prakash Cotton Mills had overpaid income tax and was entitled to a refund. A dispute arose about the rate of interest payable on the refund under Section 244A of the Income Tax Act and from what date the interest should run. The company argued that interest must run from the date of payment of the excess tax.", "judgement": "The Supreme Court held that interest under Section 244A runs from the date on which the excess tax was paid by the assessee. A taxpayer is entitled to interest on refunds as a matter of right from the date of overpayment. The provision must be construed in favour of the taxpayer since the government has had the use of the taxpayer's money.", "principle": "A taxpayer is entitled to interest on tax refunds from the date of overpayment as a matter of statutory right under Section 244A. The government cannot retain tax refunds without paying interest on the amount wrongly retained. This case established the principle that fiscal statutes must be read in a manner that does not unduly prejudice taxpayers who have overpaid."}, {"id": "commissioner-v-mrf-1995", "title": "CIT v. MRF Ltd.", "citation": "(1995) 213 ITR 610 (Mad HC)", "court": "Madras High Court", "year": 1995, "bench": 2, "judges": ["Srinivasan J", "Krishnaswamy J"], "subject": "Tax Law", "tags": ["technical know-how", "royalty", "capital or revenue", "lump sum payment", "foreign collaboration", "Section 37", "Income Tax Act"], "facts": "MRF Ltd. paid a lump sum fee for the right to use technical know-how provided by a foreign collaborator for the manufacture of tyres. The Income Tax department classified this as a capital expenditure on the grounds that MRF acquired a long-term right to use the know-how. MRF argued it was a revenue expenditure.", "judgement": "The Madras High Court held that a lump sum payment for the right to use technical know-how in the course of carrying on business is a revenue expenditure and not capital expenditure. The payment does not result in the acquisition of a capital asset — know-how is a tool that facilitates the business process, not an enduring asset that gives the business its structure.", "principle": "Payments for the right to use technical know-how in the ordinary course of manufacturing are revenue expenditure, not capital expenditure, even if paid in a lump sum. The enduring benefit test must be applied carefully — know-how helps run the business but does not create its capital structure. This case is an important precedent for the tax treatment of technology licensing payments."}, {"id": "tds-194c-cit-v-united-engineering-2000", "title": "Associated Cement Companies Ltd. v. CIT", "citation": "(1994) 207 ITR 631 (SC)", "court": "Supreme Court of India", "year": 1994, "bench": 2, "judges": ["Pandian J", "Mohan J"], "subject": "Tax Law", "tags": ["deduction at source", "TDS", "Section 194C", "contract", "sub-contract", "transporters", "work contract"], "facts": "Associated Cement Companies deducted tax at source on payments made to contractors for transportation and other services. A question arose whether certain payments made under contracts for transportation constituted 'work contracts' under Section 194C of the Income Tax Act requiring TDS, or were mere payments for the purchase of goods.", "judgement": "The Supreme Court held that the true test for whether a payment is for a 'work contract' under Section 194C is whether the payee undertakes to produce a result — that is, whether the contract is predominantly for work and labour. If the substance of the contract is the supply of goods, TDS under Section 194C is not applicable.", "principle": "The distinction between a works contract and a contract for supply of goods determines whether TDS under Section 194C applies. Where the dominant purpose of the contract is the supply of goods (with work being incidental), TDS is not required. Where the dominant purpose is the performance of work or services, TDS applies. This case is frequently cited in TDS litigation."}, {"id": "liberty-india-v-cit-2009", "title": "Liberty India v. CIT", "citation": "(2009) 317 ITR 218 (SC)", "court": "Supreme Court of India", "year": 2009, "bench": 2, "judges": ["S.H. Kapadia J", "Aftab Alam J"], "subject": "Tax Law", "tags": ["Section 80IB", "duty drawback", "DEPB", "profits", "derived from", "industrial undertaking", "incentives"], "facts": "Liberty India claimed deduction under Section 80IB on the basis of profits including duty drawback receipts and DEPB (Duty Entitlement Pass Book) benefits received from the government. The Revenue argued that these incentives were not 'profits derived from the industrial undertaking' as required by Section 80IB.", "judgement": "The Supreme Court held that duty drawback and DEPB benefits are not 'profits derived from' the industrial undertaking. These are incentives linked to the act of exportation, not to the manufacturing process. For a profit to be eligible for Section 80IB deduction, it must have a direct nexus with the activity of the industrial undertaking.", "principle": "Deductions under Section 80IB and similar provisions are limited to profits that are directly derived from the qualifying industrial activity. Export incentives (duty drawback, DEPB) are derived from the act of export, not from manufacturing, and do not qualify for the deduction. This case has significantly narrowed the scope of industrial deductions and is widely cited in sectoral tax planning."}, {"id": "principal-cit-v-maruti-suzuki-india-2021", "title": "Principal CIT v. Maruti Suzuki India Ltd.", "citation": "(2021) 430 ITR 101 (SC)", "court": "Supreme Court of India", "year": 2021, "bench": 2, "judges": ["D.Y. Chandrachud J", "M.R. Shah J"], "subject": "Tax Law", "tags": ["transfer pricing", "advertising expenditure", "brand building", "AMP", "bright line test", "marketing intangibles", "Section 92"], "facts": "Maruti Suzuki India incurred advertising, marketing and promotional (AMP) expenses to promote the Maruti and Suzuki brands in India. The Transfer Pricing Officer applied the 'bright line test' to determine the portion of AMP expenses that exceeded an industry norm and treated the excess as an international transaction for which an arm's length adjustment was required.", "judgement": "The Supreme Court held that the Transfer Pricing Officer was not justified in applying the 'bright line test' to AMP expenses without establishing that a specific international transaction had taken place. AMP expenses alone do not create a deemed international transaction unless there is evidence of an agreement between the assessee and its associated enterprise regarding brand building.", "principle": "Transfer pricing adjustments require the existence of an actual international transaction. The bright line test for advertising, marketing, and promotion expenses is not a legitimate tool for creating deemed transactions. Marketing intangible adjustments can only be made where an actual arrangement to build brand value for the parent is established. This is the leading Indian authority on AMP transfer pricing."}, {"id": "godrej-industries-v-deputy-cit-2017", "title": "Godrej Industries Ltd. v. DCIT", "citation": "(2017) 395 ITR 1 (Bom HC)", "court": "Bombay High Court", "year": 2017, "bench": 2, "judges": ["M.S. Sanklecha J", "S.C. Gupte J"], "subject": "Tax Law", "tags": ["Section 68", "unexplained cash credit", "share premium", "FEMA", "FDI", "angel tax", "Section 56(2)"], "facts": "Godrej Industries received share premium on issue of shares to investors. The Income Tax department sought to treat the share premium as unexplained cash credit under Section 68, arguing that Godrej could not satisfactorily explain the source and nature of the premium received. Godrej argued that share premium from identifiable investors is not unexplained.", "judgement": "The Bombay High Court held that share premium received from identifiable investors who have provided their identity, source of funds, and creditworthiness cannot be treated as unexplained cash credit under Section 68. The section is intended to deal with genuinely unexplained credits, not with capital raised from known investors.", "principle": "Share premium received from identified investors who provide satisfactory explanation of their identity and the source of funds cannot be treated as unexplained cash credit under Section 68 of the Income Tax Act. Section 68 is a provision dealing with genuine mystery credits, not capital raises from known investors. This case is significant in the context of startup funding and Section 56(2) angel tax disputes."}, {"id": "karti-chidambaram-v-cbi-2018", "title": "CIT v. Strides Shasun Ltd.", "citation": "(2019) 416 ITR 155 (Bom HC)", "court": "Bombay High Court", "year": 2019, "bench": 2, "judges": ["Akil Kureshi J", "Pushpa Ganediwala J"], "subject": "Tax Law", "tags": ["amalgamation", "goodwill", "depreciation", "Section 32", "intangible assets", "merger", "tax benefit", "successor company"], "facts": "Strides Shasun claimed depreciation on goodwill acquired on amalgamation. The Income Tax department denied the claim arguing that goodwill is not an intangible asset eligible for depreciation under Section 32. The case required the court to examine whether goodwill falls within the category of intangible assets listed in the proviso to Section 32(1)(ii).", "judgement": "The Bombay High Court held that goodwill is an intangible asset eligible for depreciation under Section 32. The list of intangible assets in the section (know-how, patents, copyrights, trademarks, licences, franchises) is illustrative and not exhaustive. Goodwill acquired on amalgamation as part of a real and genuine business combination is a depreciable intangible asset.", "principle": "The category of intangible assets eligible for depreciation under Section 32 is not closed and includes goodwill acquired in a genuine business combination. Courts take a commercial and purposive approach to the identification of depreciable intangibles. This ruling, subsequently affirmed by the Supreme Court in Reliance Industries, is critical for M&A tax planning in India."}, {"id": "cit-v-empire-jute-co-1980", "title": "CIT v. Empire Jute Co. Ltd.", "citation": "(1980) 124 ITR 1 (SC)", "court": "Supreme Court of India", "year": 1980, "bench": 3, "judges": ["Bhagwati J", "Untwalia J", "Pathak J"], "subject": "Tax Law", "tags": ["capital vs revenue", "right to weave", "looms", "jute industr
