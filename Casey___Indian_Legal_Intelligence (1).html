*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --black: #07070f;
  --surface: #0d0d1c;
  --surface-2: #131324;
  --surface-3: #1a1a30;
  --border: rgba(124, 58, 237, 0.14);
  --border-hover: rgba(139, 92, 246, 0.38);
  --purple: #7c3aed;
  --purple-bright: #a78bfa;
  --purple-mid: #8b5cf6;
  --purple-dim: rgba(124, 58, 237, 0.09);
  --purple-glow: rgba(124, 58, 237, 0.22);
  --text-primary: #eeeaff;
  --text-secondary: #9b93c4;
  --text-muted: #524d72;
  --tag-bg: rgba(124, 58, 237, 0.11);
  --tag-text: #c4b5fd;
  --radius: 16px;
  --radius-sm: 10px;
  --radius-pill: 100px;
  font-family: 'Gilroy', sans-serif;
  font-weight: 300;
}

html { scroll-behavior: smooth; }

body {
  background: #000000e4;
  color: var(--text-primary);
  font-family: 'Gilroy', sans-serif;
  font-weight: 300;
  font-size: 15px;
  line-height: 1.65;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── GLOW ── */
.orb {
  position: fixed;
  border-radius: 100%;
  filter: blur(90px);
  pointer-events: none;
  z-index: 0;
  opacity: 0;
  transition: opacity 2s ease;
}
.orb.visible { opacity: 1; }
.orb-1 {
  width: 3000px; height: 1000px;
  background: radial-gradient(circle, #ff8418 0%, transparent 45%);
  top: -80px; left: -1720px;
}
.orb-2 {
  width: 2000px; height: 1000px;
  background: radial-gradient(circle, #9954d5 0%, transparent 65%);
  bottom: -20%; right: -1150px;
}

/* ── NAV ── */
nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 500;
  height: 62px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 48px;
  background: rgba(246, 246, 247, 0);
  backdrop-filter: blur(0px);
  -webkit-backdrop-filter: blur(24px);
  border-bottom: 0px solid var(--border);
}

.nav-logo {
  font-weight: 800;
  font-size: 20px;
  color: var(--text-primary);
  letter-spacing: -0.03em;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 9px;
  text-decoration: none;
}

.nav-logo-mark {
  width: 28px; height: 28px;
  background: linear-gradient(135deg, #0a0602 0%, #050110 100%);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px;
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 4px;
}

.nav-link {
  background: none;
  border: none;
  font-family: 'Gilroy', sans-serif;
  font-weight: 300;
  font-size: 14px;
  color: #fdfdfd var(--text-muted);
  padding: 7px 14px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: color 0.15s,  0.15s;
  text-decoration: none;
}

.nav-link:hover { color: var(--text-primary); background: var(--purple-dim); }
.nav-link.active { color: var(--purple-bright); }

.nav-badge {
  background: #000000;
  border: #fdfdfd;
  color: #fdfdfd;
  font-size: 11px;
  font-weight: 800;
  padding: 5px 14px;
  border-radius: var(--radius-pill);
  cursor: pointer;
  transition: 0.15s;
  font-family: 'Gilroy', sans-serif;
}
.nav-badge:hover { background: rgba(187, 101, 36, 0.18); }

/* ══════════════════════════════════
   LANDING PAGE
══════════════════════════════════ */
#page-landing {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  position: relative;
  z-index: 1;
}

.landing-inner {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 120px 24px 80px;
  text-align: center;
}

.hero-chip {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #fdfdfd var(--purple-bright);
  padding: 6px 16px;
  border: 1px solid var(--border-hover);
  border-radius: var(--radius-pill);
  background: var(--purple-dim);
  margin-bottom: 36px;
}

.hero-chip-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--purple-bright);
  box-shadow: 0 0 8px var(--purple-bright);
}

.hero-title {
  font-weight: 300;
  font-size: clamp(48px, 7.5vw, 88px);
  line-height: 1.0;
  letter-spacing: -0.04em;
  color: var(--text-primary);
  margin-bottom: 24px;
  max-width: 820px;
  background: -webkit-linear-gradient(#ffffff, #958e8e, #ffffff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent
}

.hero-title .purple { 
  background: -webkit-linear-gradient(#ffffffb0, #ae5a10);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent
  
}

.hero-sub {
  font-weight: 800;
  font-size: clamp(15px, 2vw, 17px);
  color: var(--text-secondary);
  max-width: 440px;
  margin: 0 auto 52px;
  line-height: 1.75;
}

/* ── SEARCH ── */
.search-container {
  position: relative;
  width: 100%;
  max-width: 600px;
  margin: 0 auto;
}

.search-box {
  position: relative;
  display: flex;
  align-items: center;
}

.search-input {
  width: 100%;
  background: #fdfdfd;
  border: 0px solid var(--border-hover);
  border-radius: var(--radius-pill);
  padding: 18px 60px 18px 28px;
  font-family: 'Gilroy', sans-serif;
  font-weight: 300;
  font-size: 15px;
  color: #000000;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
  box-shadow: 0 0 0 0 transparent;
}

.search-input::placeholder { color: var(--text-muted); }

.search-input:focus {
  border-color: #fdfdfd;
  box-shadow: 0 0 0 0px #fdfdfd, 0 8px 40px rgba(252, 251, 252, 0.338);
}

.search-btn {
  position: absolute;
  right: 8px;
  background: linear-gradient(135deg, #be5a09, #4000ff);
  border: none;
  border-radius: var(--radius-pill);
  width: 42px; height: 42px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: opacity 0.15s, transform 0.15s;
  color: white;
}
.search-btn:hover { opacity: 0.88; transform: scale(1.04); }

/* ── AUTOCOMPLETE DROPDOWN ── */
.autocomplete-dropdown {
  position: absolute;
  top: calc(100% + 10px);
  left: 0; right: 0;
  background: #000000;
  border: 1px solid #fdfdfd66;
  border-radius: var(--radius);
  overflow: hidden;
  z-index: 600;
  box-shadow: 0 24px 64px rgba(231, 226, 226, 0.26), 0 0 0 1px rgba(139,92,246,0.1);
  display: none;
}

.autocomplete-dropdown.open { display: block; }

.autocomplete-item {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  padding: 14px 20px;
  cursor: pointer;
  border-bottom: 1px solid var(--border);
  transition: background 0.12s;
}

.autocomplete-item:last-child { border-bottom: none; }
.autocomplete-item:hover, .autocomplete-item.highlighted { background: #a85e23; }

.autocomplete-icon {
  width: 32px; height: 32px;
  border-radius: 8px;
  background: #000000;
  border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  font-size: 13px;
  margin-top: 1px;
}

.autocomplete-info { flex: 1; min-width: 0; text-align: left; }

.autocomplete-title {
  font-weight: 800;
  font-size: 13px;
  color: #fdfdfd;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 2px;
}

.autocomplete-meta {
  font-size: 11px;
  color: #fdfdfd;
  display: flex;
  gap: 8px;
  align-items: center;
}

.autocomplete-subject {
  font-size: 10px;
  font-weight: 800;
  color: #fdfdfd;
  background: var(--tag-bg);
  padding: 2px 8px;
  border-radius: var(--radius-pill);
  flex-shrink: 0;
}

.autocomplete-footer {
  padding: 10px 20px;
  background: var(--surface-3);
  font-size: 12px;
  color: #fdfdfd;
  text-align: left;
  cursor: pointer;
  transition: color 0.12s;
  border-top: 1px solid var(--border);
  font-weight: 800;
}
.autocomplete-footer:hover { color: #be5a09; }

.search-hint {
  margin-top: 14px;
  font-size: 12px;
  color: #fdfdfd;
}

.search-hint span {
  color: #fdfdfd;
  background: var(--surface-2);
  border: 1px solid #fdfdfd69;
  border-radius: 5px;
  padding: 1px 7px;
  font-size: 11px;
  margin: 0 2px;
  font-weight: 800;
}

/* ── LANDING FOOTER STATS ── */
.landing-stats {
  display: flex;
  justify-content: center;
  gap: 56px;
  padding: 28px 48px;
  border-top: 0px solid var(--border);
  background: #b41b1b00;
  position: relative;
  z-index: 1;
}

.landing-stat { text-align: center; }

.landing-stat-num {
  font-weight: 800;
  font-size: 26px;
  color: #fdfdfd;
  display: block;
  line-height: 1;
  margin-bottom: 5px;
  letter-spacing: -0.03em;
}

.landing-stat-label {
  font-size: 11px;
  color: #fdfdfd var;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  font-weight: 800;
}

/* ══════════════════════════════════
   RESULTS PAGE
══════════════════════════════════ */
#page-results {
  display: none;
  min-height: 100vh;
  position: relative;
  z-index: 1;
  padding-top: 62px;
}

.results-topbar {
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  padding: 20px 48px;
  display: flex;
  align-items: center;
  gap: 20px;
}

.results-search-box {
  position: relative;
  flex: 1;
  max-width: 520px;
}

.results-search-input {
  width: 100%;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-pill);
  padding: 12px 48px 12px 20px;
  font-family: 'Gilroy', sans-serif;
  font-weight: 300;
  font-size: 14px;
  color: var(--text-primary);
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.results-search-input::placeholder { color: var(--text-muted); }
.results-search-input:focus {
  border-color: var(--purple-mid);
  box-shadow: 0 0 0 3px var(--purple-glow);
}

.results-search-icon {
  position: absolute;
  right: 16px; top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  pointer-events: none;
}

.results-count-label {
  font-size: 13px;
  color: var(--text-muted);
  white-space: nowrap;
}

.results-count-label strong {
  color: var(--purple-bright);
  font-weight: 800;
}

.back-btn {
  background: none;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-muted);
  font-family: 'Gilroy', sans-serif;
  font-size: 13px;
  font-weight: 800;
  padding: 8px 16px;
  cursor: pointer;
  display: flex; align-items: center; gap: 6px;
  transition: all 0.15s;
  white-space: nowrap;
}
.back-btn:hover { border-color: var(--purple); color: var(--purple-bright); }

.results-layout {
  display: grid;
  grid-template-columns: 220px 1fr;
  max-width: 1320px;
  margin: 0 auto;
  padding: 36px 48px 80px;
  gap: 0;
  align-items: start;
}

/* ── SIDEBAR ── */
.sidebar {
  position: sticky;
  top: 110px;
  padding-right: 36px;
}

.filter-group { margin-bottom: 28px; }

.filter-group-label {
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 10px;
  display: block;
}

.filter-pill {
  display: block;
  width: 100%;
  text-align: left;
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  border: none;
  background: transparent;
  color: var(--text-secondary);
  font-family: 'Gilroy', sans-serif;
  font-weight: 300;
  font-size: 13px;
  cursor: pointer;
  transition: background 0.12s, color 0.12s;
  margin-bottom: 1px;
}
.filter-pill:hover { background: var(--purple-dim); color: var(--text-primary); }
.filter-pill.active { background: var(--purple-dim); color: var(--purple-bright); font-weight: 800; }

.filter-sep { height: 1px; background: var(--border); margin: 18px 0; }

.year-row { display: flex; gap: 8px; }

.year-input {
  width: 100%;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 8px 10px;
  font-size: 12px;
  font-family: 'Gilroy', sans-serif;
  font-weight: 300;
  color: var(--text-primary);
  outline: none;
  transition: border-color 0.2s;
}
.year-input:focus { border-color: var(--purple); }
.year-input::placeholder { color: var(--text-muted); }

.clear-all {
  display: block;
  width: 100%;
  margin-top: 14px;
  padding: 9px;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-muted);
  font-family: 'Gilroy', sans-serif;
  font-size: 12px;
  font-weight: 800;
  cursor: pointer;
  transition: all 0.15s;
  text-align: center;
}
.clear-all:hover { border-color: var(--purple); color: var(--purple-bright); }

/* ── CASE GRID ── */
.case-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 14px;
}

/* ── CASE CARD ── */
.case-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 22px;
  cursor: pointer;
  transition: border-color 0.18s, transform 0.18s, box-shadow 0.18s;
  position: relative;
  overflow: hidden;
}

.case-card::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: var(--radius);
  background: linear-gradient(135deg, rgba(124,58,237,0.05) 0%, transparent 60%);
  opacity: 0;
  transition: opacity 0.18s;
  pointer-events: none;
}

.case-card:hover {
  border-color: var(--border-hover);
  transform: translateY(-3px);
  box-shadow: 0 12px 40px rgba(88, 28, 220, 0.18);
}
.case-card:hover::after { opacity: 1; }

.card-subject-tag {
  display: inline-block;
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--purple-bright);
  background: var(--tag-bg);
  border: 1px solid rgba(139,92,246,0.18);
  border-radius: var(--radius-pill);
  padding: 3px 10px;
  margin-bottom: 12px;
}

.card-title {
  font-weight: 800;
  font-size: 15px;
  line-height: 1.3;
  color: var(--text-primary);
  margin-bottom: 6px;
  letter-spacing: -0.01em;
}

.card-meta {
  font-size: 11px;
  color: var(--text-muted);
  margin-bottom: 12px;
  display: flex;
  gap: 8px;
  align-items: center;
}

.card-sep { opacity: 0.35; }

.card-preview {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.65;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-bottom: 14px;
  font-weight: 300;
}

.card-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}

.tag {
  font-size: 10px;
  font-weight: 800;
  padding: 3px 9px;
  background: var(--tag-bg);
  color: var(--tag-text);
  border-radius: var(--radius-pill);
  border: 1px solid rgba(139,92,246,0.18);
}

.tag-overflow {
  font-size: 10px;
  color: var(--text-muted);
  padding: 3px 4px;
  align-self: center;
}

/* ── EMPTY ── */
.empty-state {
  grid-column: 1/-1;
  text-align: center;
  padding: 80px 32px;
}
.empty-icon { font-size: 42px; opacity: 0.25; margin-bottom: 18px; }
.empty-title { font-weight: 800; font-size: 20px; color: var(--text-secondary); margin-bottom: 8px; }
.empty-body { font-size: 14px; color: var(--text-muted); }

/* ══════════════════════════════════
   MODAL
══════════════════════════════════ */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(5, 5, 14, 0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  z-index: 900;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.22s;
}

.modal-overlay.open {
  opacity: 1;
  pointer-events: all;
}

.modal {
  background: var(--surface-2);
  border: 1px solid var(--border-hover);
  border-radius: 20px;
  width: 100%;
  max-width: 700px;
  max-height: 88vh;
  overflow-y: auto;
  transform: translateY(20px) scale(0.98);
  transition: transform 0.22s;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}

.modal-overlay.open .modal {
  transform: translateY(0) scale(1);
}

.modal-head {
  padding: 30px 30px 22px;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  background: var(--surface-2);
  border-radius: 20px 20px 0 0;
  z-index: 10;
}

.modal-subject-tag {
  display: inline-block;
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--purple-bright);
  background: var(--tag-bg);
  border: 1px solid rgba(139,92,246,0.22);
  border-radius: var(--radius-pill);
  padding: 3px 10px;
  margin-bottom: 12px;
}

.modal-title {
  font-weight: 800;
  font-size: clamp(18px, 3vw, 24px);
  line-height: 1.22;
  color: var(--text-primary);
  letter-spacing: -0.02em;
  margin-bottom: 8px;
}

.modal-citation {
  font-size: 12px;
  color: var(--text-muted);
  font-style: italic;
  margin-bottom: 14px;
  font-weight: 300;
}

.modal-facts-row {
  display: flex;
  flex-wrap: wrap;
  gap: 18px;
  font-size: 12px;
  color: var(--text-muted);
}

.modal-facts-row strong {
  color: var(--text-secondary);
  font-weight: 800;
}

.modal-close {
  position: absolute;
  top: 22px; right: 22px;
  background: var(--surface-3);
  border: 1px solid var(--border);
  border-radius: 50%;
  width: 30px; height: 30px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  color: var(--text-muted);
  font-size: 14px;
  transition: all 0.15s;
  line-height: 1;
  font-family: 'Gilroy', sans-serif;
}
.modal-close:hover { border-color: var(--purple); color: var(--purple-bright); }

.modal-body { padding: 26px 30px 30px; }

.modal-section { margin-bottom: 26px; }

.modal-section-head {
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--purple-mid);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.modal-section-head::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

.modal-section p {
  font-size: 14px;
  font-weight: 300;
  color: var(--text-secondary);
  line-height: 1.8;
}

.modal-judges {
  font-size: 13px;
  font-weight: 300;
  color: var(--text-secondary);
  line-height: 2;
}

.modal-tags-row {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-top: 20px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
}

/* ── UTILS ── */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

@media (max-width: 900px) {
  nav { padding: 0 20px; }
  .nav-links { display: none; }
  .results-layout { grid-template-columns: 1fr; padding: 24px 20px 60px; }
  .sidebar { position: static; padding-right: 0; margin-bottom: 24px; }
  .results-topbar { padding: 16px 20px; flex-wrap: wrap; }
  .landing-stats { gap: 28px; padding: 24px 20px; }
  .landing-inner { padding: 100px 20px 60px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}

/* ── LOGO / SPLASH ── */
:root { --logo-h: 36px; }
.nav-logo svg { height: var(--logo-h); width: auto; display: block; }
.nav-logo .mk, .nav-logo .lt, .nav-logo .dv { opacity: 1; }
body.splashing { overflow: hidden; }
body.splashing .nav-logo { visibility: hidden; }
nav > :not(.nav-logo) { transition: opacity .8s ease .35s; }
body.splashing nav > :not(.nav-logo) { opacity: 0; }
body.splashing .landing-inner > * { opacity: 0; }
body.reveal .landing-inner > * { animation: rise .9s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(var(--i, 0) * 90ms + 250ms); }
.landing-inner > :nth-child(1){--i:0}.landing-inner > :nth-child(2){--i:1}.landing-inner > :nth-child(3){--i:2}
.landing-inner > :nth-child(4){--i:3}.landing-inner > :nth-child(5){--i:4}.landing-inner > :nth-child(n+6){--i:5}
@keyframes rise { from { opacity: 0; transform: translateY(28px); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }

@property --r { syntax: '<length>'; inherits: false; initial-value: 0px; }
#splash { position: fixed; inset: 0; z-index: 9998; background: #000; cursor: pointer;
  -webkit-mask-image: radial-gradient(circle at 50% 50%, transparent var(--r), #000 calc(var(--r) + 14vmax));
          mask-image: radial-gradient(circle at 50% 50%, transparent var(--r), #000 calc(var(--r) + 14vmax));
  transition: --r 1.3s cubic-bezier(.6,0,.2,1), opacity .4s ease 1.1s; }
#splash.out { --r: 150vmax; opacity: 0; pointer-events: none; }
#splash::before { content: ""; position: absolute; left: 50%; top: 50%; width: 90vmin; height: 90vmin; translate: -50% -50%;
  background: radial-gradient(circle, rgba(255,132,24,.30) 0%, rgba(153,84,213,.22) 40%, transparent 68%);
  filter: blur(40px); opacity: 0; animation: glow 2.6s ease-out .3s forwards; }
@keyframes glow { 0% { opacity: 0; scale: .5; } 60% { opacity: 1; } 100% { opacity: .75; scale: 1; } }
#splash-logo { position: fixed; z-index: 9999; left: 0; top: 0; transform-origin: 0 0; pointer-events: none; }
#splash-logo svg { display: block; width: 100%; height: auto; overflow: visible; }
#splash-logo .mk { fill: #fff; fill-opacity: 0; stroke: #fff; stroke-width: 1.4; stroke-linejoin: miter;
  stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.1s cubic-bezier(.6,0,.3,1) .35s forwards, fillin .6s ease 1.15s forwards; }
#splash-logo .mk:nth-of-type(2) { animation-delay: .55s, 1.3s; }
#splash-logo .dv { transform-box: fill-box; transform-origin: 50% 100%; transform: scaleY(0); animation: grow .6s cubic-bezier(.3,.7,.2,1) 1.35s forwards; }
#splash-logo .lt { opacity: 0; animation: letter .7s cubic-bezier(.2,.7,.2,1) forwards; animation-delay: calc(1.7s + var(--d) * 90ms); }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes fillin { to { fill-opacity: 1; stroke-opacity: 0; } }
@keyframes grow { to { transform: scaleY(1); } }
@keyframes letter { from { opacity: 0; translate: 0 22px; filter: blur(6px); } to { opacity: 1; translate: 0 0; filter: none; } }
</style>

<script>
const JUDGMENTS = [{"id": "ramsgate-victoria-hotel-v-montefiore-1866", "title": "Ramsgate Victoria Hotel Co. v. Montefiore", "citation": "(1866) LR 1 Ex 109", "court": "Court of Exchequer (UK)", "year": 1866, "bench": 3, "judges": ["Bramwell B", "Channell B", "Pigott B"], "subject": "Company Law", "tags": ["offer and acceptance", "lapse of offer", "share allotment", "reasonable time", "contract formation"], "facts": "Montefiore applied for shares in the Ramsgate Victoria Hotel Company in June 1864 and paid a deposit. The company did not allot the shares until November 1864, five months later. When the allotment was communicated, Montefiore refused to accept it and declined to pay the balance due on the shares.", "judgement": "The Court of Exchequer held that Montefiore was not bound to accept the allotment. An offer to take shares lapses if not accepted within a reasonable time. A gap of five months between application and allotment was unreasonable, and the offer had therefore lapsed before purported acceptance by the company.", "principle": "An offer must be accepted within a reasonable time, failing which it lapses. In the context of share subscriptions, a company cannot sit on an application indefinitely and then enforce acceptance against the applicant. This case is foundational for understanding the time-sensitivity of offer and acceptance in corporate subscription contracts."}, {"id": "salomon-v-salomon-1897", "title": "Salomon v. Salomon and Co. Ltd.", "citation": "[1897] AC 22", "court": "House of Lords (UK)", "year": 1897, "bench": 5, "judges": ["Lord Halsbury LC", "Lord Watson", "Lord Herschell", "Lord Macnaghten", "Lord Morris"], "subject": "Company Law", "tags": ["corporate personality", "separate legal entity", "veil of incorporation", "limited liability", "secured creditor"], "facts": "Aron Salomon transferred his shoe business to a company he incorporated. He received shares and debentures as consideration. When the company became insolvent, unsecured creditors argued that Salomon and the company were essentially the same person, and that Salomon should be personally liable for the company's debts. The lower courts agreed, but Salomon appealed.", "judgement": "The House of Lords unanimously reversed the lower courts and held that the company was a legal entity entirely separate from its members. Salomon was a secured creditor by virtue of his debentures and was entitled to be paid ahead of unsecured creditors. The motive behind incorporation was irrelevant as long as the statutory requirements were met.", "principle": "A company is a distinct legal person separate from its members, even if one person effectively controls it. This is the foundational principle of corporate personality and limited liability. The case establishes that courts will not look behind the corporate veil merely because a company is owned or controlled by a single individual or a small group."}, {"id": "lee-v-lees-air-farming-1961", "title": "Lee v. Lee's Air Farming Ltd.", "citation": "[1961] AC 12", "court": "Privy Council (UK)", "year": 1961, "bench": 5, "judges": ["Viscount Simonds", "Lord Reid", "Lord Tucker", "Lord Morris", "Lord Guest"], "subject": "Company Law", "tags": ["corporate personality", "separate legal entity", "director as employee", "workers compensation", "veil of incorporation"], "facts": "Mr. Lee incorporated a company for his aerial top-dressing business and was its sole governing director and majority shareholder. He was also employed by the company as a pilot. He died in a crash while working and his widow claimed workers' compensation. The company's insurer argued that Lee could not simultaneously be an employer and an employee of the same company.", "judgement": "The Privy Council held that Lee and his company were separate legal persons. Lee could validly enter into a contract of employment with the company he controlled. The company, as a separate entity, was the employer, and Lee was its employee. Mrs. Lee was therefore entitled to compensation.", "principle": "The principle of separate corporate personality extends to allowing a controlling shareholder-director to also be an employee of the company. A person can wear multiple legal hats in relation to the same company. This case reinforces Salomon and is particularly relevant in disputes about director employment rights, insurance claims, and liability."}, {"id": "state-trading-corporation-v-commercial-tax-officer-1963", "title": "State Trading Corporation of India Ltd. v. Commercial Tax Officer, Visakhapatnam", "citation": "AIR 1963 SC 1811", "court": "Supreme Court of India", "year": 1963, "bench": 5, "judges": ["Gajendragadkar CJ", "Wanchoo J", "Gupta J", "Shah J", "Ayyangar J"], "subject": "Company Law", "tags": ["government company", "corporate personality", "citizenship", "fundamental rights", "state instrumentality"], "facts": "The State Trading Corporation, a government-owned company, claimed exemption from certain state taxes on the ground that it was an agent of the Union of India and therefore entitled to constitutional immunity. The question arose whether a government company could claim the status and rights of a citizen under the Constitution.", "judgement": "The Supreme Court held that a corporation, even if wholly owned by the government, is not a citizen for the purposes of fundamental rights under the Constitution. A company is a juristic person and not a citizen. However, the Court left open the question of whether it could be considered a 'State' under Article 12.", "principle": "A statutory or government-owned corporation does not acquire the status of a citizen and cannot claim fundamental rights available only to citizens. This case is significant for delineating the constitutional personality of government companies and forms part of the foundational jurisprudence on the distinction between corporate personality and citizenship."}, {"id": "seth-mohanlal-v-grain-chambers-1967", "title": "Seth Mohanlal v. Grain Chambers Ltd.", "citation": "AIR 1968 SC 772", "court": "Supreme Court of India", "year": 1967, "bench": 3, "judges": ["Shah J", "Bachawat J", "Ramaswami J"], "subject": "Company Law", "tags": ["articles of association", "share transfer", "refusal of transfer", "company discretion", "Companies Act"], "facts": "A shareholder of Grain Chambers Ltd. sought to transfer his shares to a third party. The company's board refused to register the transfer, exercising a discretion provided under the articles of association. The shareholder challenged this refusal, arguing it was arbitrary and not exercised in good faith.", "judgement": "The Supreme Court upheld the company's right to refuse registration of the share transfer. Where the articles of association vest discretion in the board to refuse transfers, that discretion is valid and enforceable. The Court held that such discretion must be exercised in good faith but courts will not ordinarily interfere with a bona fide exercise of that power.", "principle": "A company's articles of association may validly restrict the transfer of shares by granting the board discretion to refuse registration. Such restrictions are binding on shareholders and are a legitimate feature of private companies. This case is authority for the principle that share transferability can be contractually limited through the constitutional documents of a company."}, {"id": "bennett-coleman-v-union-of-india-1973", "title": "Bennett Coleman & Co. v. Union of India", "citation": "AIR 1973 SC 106", "court": "Supreme Court of India", "year": 1973, "bench": 5, "judges": ["Ray CJ", "Palekar J", "Mathew J", "Beg J", "Dwivedi J"], "subject": "Company Law", "tags": ["freedom of press", "fundamental rights", "newsprint policy", "Article 19", "corporate rights"], "facts": "The Union of India introduced a Newsprint Control Order that imposed restrictions on the number of pages newspapers could publish, effectively limiting the operations of large newspaper groups like Bennett Coleman. The petitioners argued this violated their fundamental right to freedom of speech and expression under Article 19(1)(a) of the Constitution.", "judgement": "The Supreme Court struck down the Newsprint Policy as unconstitutional. The Court held that freedom of the press is an integral part of freedom of speech and expression, and that a corporate entity operating a newspaper can assert this right. Restrictions on newsprint that curtailed circulation and content were a direct abridgement of this fundamental right.", "principle": "A company engaged in publishing can invoke the fundamental right to freedom of speech and expression, which includes freedom of the press. This case is significant for establishing that corporations can hold and assert certain fundamental rights where the nature of the right permits. It is also a key authority on the limits of government regulation of the media."}, {"id": "union-bank-of-india-v-khader-international-2001", "title": "Union Bank of India v. Khader International Construction", "citation": "AIR 2001 SC 2277", "court": "Supreme Court of India", "year": 2001, "bench": 3, "judges": ["Pattanaik J", "Variava J", "Wad J"], "subject": "Company Law", "tags": ["lifting the corporate veil", "fraud", "group companies", "guarantor liability", "banking law"], "facts": "Khader International Construction borrowed funds from Union Bank of India. The loan was not repaid and the bank sought to recover from associated group companies, arguing that the corporate structure was used as a facade to avoid liability. The question was whether the corporate veil could be lifted to make the group companies liable.", "judgement": "The Supreme Court held that the corporate veil can be lifted where the corporate form is used as a sham or to perpetrate fraud. Where companies within a group are operated as a single economic unit without genuine independence, courts can pierce the veil and hold related entities liable. The bank was entitled to pursue recovery across the group in the circumstances.", "principle": "The corporate veil is not absolute and will be lifted where the company is used as a device to evade legal obligations or perpetrate fraud. Indian courts can look behind the corporate structure where group companies are mere facades for a single economic enterprise. This case is a leading authority on veil-lifting in the context of banking and credit recovery."}, {"id": "mack-soft-tech-v-quinn-logistics-2017", "title": "Mack Soft-Tech Pvt. Ltd. v. Quinn Logistics India Pvt. Ltd.", "citation": "2017 SCC OnLine Bom 614", "court": "Bombay High Court", "year": 2017, "bench": 1, "judges": ["Kathawalla J"], "subject": "Company Law", "tags": ["oppression and mismanagement", "minority shareholder", "Companies Act 2013", "NCLT", "joint venture"], "facts": "Mack Soft-Tech, a minority shareholder in a joint venture company with Quinn Logistics, alleged oppression and mismanagement by the majority shareholder. The minority alleged exclusion from management, diversion of funds, and breach of the shareholders' agreement. Relief was sought under the Companies Act 2013 before the NCLT.", "judgement": "The Bombay High Court addressed the interplay between the remedies for oppression and mismanagement under the Companies Act 2013 and the jurisdiction of the NCLT. The Court affirmed that minority shareholders have a right to seek relief against oppressive conduct by the majority and that the NCLT is the appropriate forum under the 2013 Act.", "principle": "Minority shareholders are protected under the Companies Act 2013 against oppression and mismanagement by the majority. The NCLT has exclusive jurisdiction over such disputes post the 2013 Act. This case illustrates the procedural framework for minority protection in Indian company law and the shift in jurisdiction from High Courts to the NCLT."}, {"id": "imai-v-rbi-2020", "title": "Internet and Mobile Association of India v. Reserve Bank of India", "citation": "(2020) 10 SCC 274", "court": "Supreme Court of India", "year": 2020, "bench": 3, "judges": ["Nageswara Rao J", "Aniruddha Bose J", "V. Ramasubramanian J"], "subject": "Company Law", "tags": ["cryptocurrency", "virtual currency", "RBI circular", "proportionality", "Article 19(1)(g)", "banking regulation", "freedom of trade"], "facts": "The Reserve Bank of India issued a circular in April 2018 directing all entities regulated by it to stop providing services to businesses dealing in virtual currencies. The Internet and Mobile Association of India, representing crypto exchanges, challenged this circular arguing it was disproportionate and violated their right to carry on trade under Article 19(1)(g).", "judgement": "The Supreme Court struck down the RBI circular. While affirming that the RBI has wide regulatory powers over the financial system, the Court held that the blanket ban on banking services to crypto businesses was disproportionate. The RBI had not demonstrated actual harm to the regulated entities that would justify such a severe restriction.", "principle": "Regulatory action by a central bank, even within its statutory powers, must satisfy the test of proportionality when it restricts the fundamental right to carry on trade or business. A blanket prohibition without demonstrated harm is excessive. This case is significant for fintech regulation in India and establishes limits on how far the RBI can go in restricting emerging financial technologies."}, {"id": "tata-sons-v-cyrus-mistry-2020", "title": "Tata Sons Pvt. Ltd. v. Cyrus Investments Pvt. Ltd.", "citation": "(2021) 9 SCC 1", "court": "Supreme Court of India", "year": 2020, "bench": 3, "judges": ["S.A. Bobde CJ", "A.S. Bopanna J", "V. Ramasubramanian J"], "subject": "Company Law", "tags": ["oppression and mismanagement", "removal of director", "Articles of Association", "NCLT", "NCLAT", "minority shareholder", "corporate governance", "Tata"], "facts": "Cyrus Mistry was removed as Executive Chairman of Tata Sons by its Board in October 2016. The minority shareholders filed a petition before the NCLT alleging oppression and mismanagement. The NCLT dismissed the petition but the NCLAT reversed, reinstating Mistry and making wide-ranging findings against Tata Sons. Tata Sons appealed to the Supreme Court.", "judgement": "The Supreme Court set aside the NCLAT order and restored the NCLT's dismissal. The Court held that the removal of a director through a valid board resolution in accordance with the Articles does not by itself constitute oppression. The NCLAT had exceeded its jurisdiction by ordering reinstatement.", "principle": "Removal of a director in accordance with a company's Articles of Association and the Companies Act does not constitute oppression merely because the removed director disagrees with it. Reinstatement of a director is not a remedy available under the Companies Act 2013. This case is the leading authority on the limits of NCLT/NCLAT jurisdiction in corporate governance disputes."}, {"id": "foss-v-harbottle-1843", "title": "Foss v. Harbottle", "citation": "(1843) 2 Hare 461", "court": "Court of Chancery (UK)", "year": 1843, "bench": 1, "judges": ["Wigram VC"], "subject": "Company Law", "tags": ["proper plaintiff rule", "majority rule", "derivative action", "internal irregularity", "minority shareholder"], "facts": "Two minority shareholders in a company brought an action alleging that the directors and others had misapplied company property. The defendants argued that the proper plaintiff to sue for wrongs done to the company was the company itself, and that the majority shareholders could ratify the alleged irregularities.", "judgement": "The court dismissed the suit. It held that where a wrong is done to a company, the company itself is the proper plaintiff. Additionally, where the alleged wrong is one that could be ratified by a simple majority of shareholders, a minority shareholder has no standing to bring the action on behalf of the company.", "principle": "The rule in Foss v. Harbottle establishes two fundamental principles: the proper plaintiff rule (only the company can sue for wrongs done to it) and the majority rule (courts will not interfere where the majority can ratify the act complained of). These principles are the cornerstone of company litigation and define when derivative actions by minority shareholders are permissible."}, {"id": "derry-v-peek-1889", "title": "Derry v. Peek", "citation": "(1889) 14 App Cas 337", "court": "House of Lords (UK)", "year": 1889, "bench": 5, "judges": ["Lord Halsbury LC", "Lord Watson", "Lord Bramwell", "Lord Fitzgerald", "Lord Herschell"], "subject": "Company Law", "tags": ["fraud", "misrepresentation", "deceit", "prospectus", "company shares", "honest belief"], "facts": "A company's prospectus stated that it had permission to use steam-powered trams, when in fact it only had provisional consent subject to Board of Trade approval. The Board eventually refused consent, the company wound up, and shareholders who had relied on the prospectus sued the directors for deceit.", "judgement": "The House of Lords held that the directors were not liable in deceit. Fraud requires a false representation made knowingly, without belief in its truth, or recklessly as to whether it was true or false. As the directors genuinely (though mistakenly) believed the statement to be true, there was no fraud, even if they were negligent.", "principle": "Fraud requires a dishonest state of mind. A false statement made with an honest belief in its truth, however unreasonable that belief may be, does not constitute fraudulent misrepresentation. This case defines the mens rea of deceit and is foundational in company law for prospectus liability and directors' duties of honest disclosure."}, {"id": "macaura-v-northern-assurance-1925", "title": "Macaura v. Northern Assurance Co. Ltd.", "citation": "[1925] AC 619", "court": "House of Lords (UK)", "year": 1925, "bench": 4, "judges": ["Lord Buckmaster", "Lord Atkinson", "Lord Sumner", "Lord Wrenbury"], "subject": "Company Law", "tags": ["insurable interest", "corporate property", "separate legal entity", "shareholder", "insurance"], "facts": "Macaura sold timber to a company he wholly owned but continued to insure the timber in his own name. The timber was destroyed by fire. The insurance company refused to pay, arguing that Macaura had no insurable interest in the timber since it belonged to the company, not to him personally.", "judgement": "The House of Lords held that Macaura had no insurable interest in the company's property. A shareholder, even a sole shareholder, has no direct legal or equitable interest in the property of the company. The company, as a separate legal entity, is the owner of its assets.", "principle": "A shareholder has no proprietary interest in the company's assets and therefore cannot insure those assets in their own name. This case reinforces the Salomon principle of separate corporate personality and illustrates its practical consequences — the company's property belongs to the company alone, not to its members, regardless of how much of the company they own."}, {"id": "gilford-motor-co-v-horne-1933", "title": "Gilford Motor Co. Ltd. v. Horne", "citation": "[1933] Ch 935", "court": "Court of Appeal (UK)", "year": 1933, "bench": 3, "judges": ["Lord Hanworth MR", "Lawrence LJ", "Romer LJ"], "subject": "Company Law", "tags": ["lifting the corporate veil", "sham company", "restraint of trade", "fraud on contract", "alter ego"], "facts": "Horne had entered into a covenant with his employer not to solicit their customers after leaving employment. After leaving, he set up a company in his wife's name and used it to solicit the former employer's customers. The employer sought an injunction against both Horne and the company.", "judgement": "The Court of Appeal granted the injunction against both Horne and the company. The court held that the company was a mere sham and device formed by Horne to evade his contractual obligations. The corporate veil was lifted to prevent the fraud, and the injunction bound both Horne personally and his company.", "principle": "Where a company is formed as a sham or device to evade legal obligations, courts will lift the corporate veil and treat the company's acts as acts of the person who controls it. This is a foundational authority for the sham or fraud exception to the Salomon principle, and is frequently cited in cases where incorporation is used to sidestep contractual or statutory duties."}, {"id": "re-smith-fawcett-1942", "title": "Re Smith and Fawcett Ltd.", "citation": "[1942] Ch 304", "court": "Court of Appeal (UK)", "year": 1942, "bench": 3, "judges": ["Lord Greene MR", "Luxmoore LJ", "Goddard LJ"], "subject": "Company Law", "tags": ["directors duties", "bona fide", "articles of association", "share transfer", "discretion"], "facts": "The articles of a private company gave directors an absolute and uncontrolled discretion to refuse to register a transfer of shares. One of two equal shareholders died. The surviving director refused to register the transfer of shares to the deceased's executor, instead offering to register only half the shares if the other half were sold to him at a price he fixed.", "judgement": "The Court of Appeal held that directors exercising a discretion under the articles must act bona fide in what they consider to be the interests of the company as a whole. However, the court held that this was a subjective test and declined to interfere with the directors' decision absent clear evidence of bad faith.", "principle": "Directors exercising discretionary powers under the articles must act in what they subjectively and honestly believe to be the best interests of the company. The test is subjective, not objective — courts will not substitute their judgment for that of directors unless bad faith is demonstrated. This is the leading authority on the standard of the bona fide duty of directors."}, {"id": "dhakeshwari-cotton-mills-v-cit-1954", "title": "Dhakeshwari Cotton Mills Ltd. v. CIT West Bengal", "citation": "AIR 1955 SC 65", "court": "Supreme Court of India", "year": 1954, "bench": 3, "judges": ["Mehr Chand Mahajan CJ", "Mukherjea J", "Bose J"], "subject": "Company Law", "tags": ["piercing corporate veil", "tax evasion", "associated companies", "income tax", "sham transactions"], "facts": "The Income Tax authorities alleged that two cotton mills under common management were being operated as one unit to evade tax. The companies shared directors, offices, and management, and transactions between them were alleged to be non-arm's length. The question was whether the companies could be treated as one entity for tax purposes.", "judgement": "The Supreme Court held that while the companies were legally distinct, the court could examine the reality of their relationship. Where the corporate form is used to disguise what is in substance a single enterprise, the courts and tax authorities are entitled to look at the substance over form. However, the mere existence of common management does not collapse two companies into one.", "principle": "Substance over form is an important principle in company and tax law. While common management or shareholding does not automatically merge two companies, courts will examine the true economic reality of transactions between associated companies. This case is an early Indian authority on the intersection of corporate law and tax avoidance through group structures."}, {"id": "life-insurance-corporation-v-escort-1986", "title": "Life Insurance Corporation of India v. Escorts Ltd.", "citation": "AIR 1986 SC 1370", "court": "Supreme Court of India", "year": 1986, "bench": 5, "judges": ["O. Chinnappa Reddy J", "E.S. Venkataramiah J", "M.M. Dutt J", "G.L. Oza J", "M.P. Thakkar J"], "subject": "Company Law", "tags": ["foreign investment", "FERA", "shareholder rights", "SEBI", "repatriation of dividends", "public interest"], "facts": "Foreign shareholders of Escorts Ltd. sought to repatriate dividends and sell their shares. The government and LIC, which held significant shares, opposed the repatriation on grounds of public interest and FERA regulations. The dispute involved questions about the rights of foreign shareholders in Indian companies and the extent of government control over private companies.", "judgement": "The Supreme Court upheld the rights of foreign shareholders to deal with their shares subject to applicable law. The Court held that FERA regulations had to be followed, but that public interest alone was not a ground for preventing a shareholder from exercising legal rights. The rights of shareholders in a company are governed by company law and cannot be overridden by executive fiat.", "principle": "Shareholders in a company have statutory and contractual rights that cannot be overridden by executive action without legal authority. Foreign shareholders are entitled to the same protections as domestic shareholders, subject to applicable regulatory requirements. This case is significant for foreign investment law and the limits of government intervention in private companies."}, {"id": "bacha-f-guzdar-v-cit-1955", "title": "Bacha F. Guzdar v. CIT Bombay", "citation": "AIR 1955 SC 74", "court": "Supreme Court of India", "year": 1955, "bench": 3, "judges": ["Mehr Chand Mahajan CJ", "S.R. Das J", "Vivian Bose J"], "subject": "Company Law", "tags": ["agricultural income", "tea company", "dividend", "shareholder taxation", "corporate veil", "income tax"], "facts": "A shareholder in a tea company received dividends and sought to treat them as agricultural income exempt from tax, arguing that since the company's income was partly agricultural, the dividends she received should carry the same character. The question was whether the character of a company's income is passed through to its shareholders via dividends.", "judgement": "The Supreme Court held that dividends paid by a company to its shareholders do not retain the character of the income from which they were paid. A dividend is the shareholder's income from property (shares), not a share of the company's business income. The corporate veil separates the company's income from the shareholder's income.", "principle": "The income of a company and the income of its shareholders are legally distinct. Dividends paid by a company do not carry the character — agricultural, industrial, or otherwise — of the underlying income from which they were distributed. This case illustrates the Salomon principle in the context of taxation and is frequently cited in disputes about the tax treatment of dividend income."}, {"id": "nrc-v-official-liquidator-2008", "title": "National Rayon Corporation Ltd. v. Official Liquidator", "citation": "(2008) 3 SCC 46", "court": "Supreme Court of India", "year": 2008, "bench": 2, "judges": ["Tarun Chatterjee J", "Dalveer Bhandari J"], "subject": "Company Law", "tags": ["winding up", "official liquidator", "preferential payment", "secured creditor", "Companies Act 1956"], "facts": "The National Rayon Corporation was wound up and the official liquidator was tasked with distributing the company's assets among creditors. Disputes arose regarding the priority of payments — secured creditors, preferential creditors, and unsecured creditors all claimed priority. The question was the correct order of distribution under the Companies Act 1956.", "judgement": "The Supreme Court held that secured creditors have priority over all other classes of creditors in a winding up, followed by preferential creditors as specified in the statute, and then unsecured creditors. The Court laid down the order of priorities applicable in a company liquidation and rejected attempts to alter this statutory order by private agreement.", "principle": "The order of distribution of assets in a company winding up is governed by statute and cannot be altered by private arrangement. Secured creditors rank first, followed by preferential creditors (including employees and tax dues), and then unsecured creditors. This case is a key authority on creditor priorities in Indian insolvency proceedings prior to the IBC."}, {"id": "needle-industries-v-needle-industries-newey-1981", "title": "Needle Industries (India) Ltd. v. Needle Industries Newey (India) Holding Ltd.", "citation": "AIR 1981 SC 1298", "court": "Supreme Court of India", "year": 1981, "bench": 3, "judges": ["Chandrachud CJ", "A.C. Gupta J", "Fazal Ali J"], "subject": "Company Law", "tags": ["oppression and mismanagement", "joint venture", "foreign company", "FERA", "minority rights", "rights issue"], "facts": "A joint venture company was set up between Indian and foreign shareholders. A rights issue was proposed that the Indian minority could not participate in fully due to FERA restrictions, effectively diluting their stake. The minority petitioned alleging that the rights issue was designed to oppress them by reducing their shareholding below a threshold that would affect their voting rights.", "judgement": "The Supreme Court found in favour of the minority and held that the rights issue, structured in a manner that the minority could not participate in due to regulatory restrictions they had no control over, amounted to oppression. Relief was granted requiring the majority to purchase the minority's shares at a fair value.", "principle": "A corporate action that is technically lawful but is deliberately structured to take advantage of a minority shareholder's regulatory disability may still constitute oppression. Courts in oppression proceedings look at the substance and effect of corporate actions, not merely their legal form. This case is significant for joint venture disputes involving foreign investment constraints."}, {"id": "shanti-prasad-jain-v-kalinga-tubes-1965", "title": "Shanti Prasad Jain v. Kalinga Tubes Ltd.", "citation": "AIR 1965 SC 1535", "court": "Supreme Court of India", "year": 1965, "bench": 3, "judges": ["Hidayatullah J", "Wanchoo J", "Ramaswami J"], "subject": "Company Law", "tags": ["oppression", "section 397", "Companies Act", "majority rule", "minority protection", "just and equitable"], "facts": "Minority shareholders in Kalinga Tubes filed a petition under Section 397 of the Companies Act 1956 alleging oppression by the majority. The majority had allotted shares to themselves at a discounted price, effectively diluting the minority's stake, and had removed minority directors from the board.", "judgement": "The Supreme Court held that oppression under Section 397 requires something more than a mere act that the majority was legally entitled to do. The conduct complained of must be burdensome, harsh, and wrongful — a visible departure from the standards of fair dealing to which a member is entitled. The allotment here was found to be oppressive.", "principle": "Oppression under the Companies Act requires conduct that is not merely discriminatory or unfair in a commercial sense but which is, in all the circumstances, oppressive. The test is whether the acts complained of are so inequitable that they cannot be allowed to continue. This is the leading Indian case defining the standard of oppression in minority shareholder petitions."}, {"id": "tata-engineering-locomotive-v-state-of-bihar-1965", "title": "Tata Engineering and Locomotive Co. Ltd. v. State of Bihar", "citation": "AIR 1965 SC 40", "court": "Supreme Court of India", "year": 1965, "bench": 5, "judges": ["Gajendragadkar CJ", "Wanchoo J", "Shah J", "Sikri J", "Ramaswami J"], "subject": "Company Law", "tags": ["corporate locus standi", "fundamental rights", "Article 19", "shareholders rights", "company as a person"], "facts": "TELCO challenged a Bihar tax imposed on its vehicles. A question arose whether the company could assert the fundamental rights of its shareholders to challenge the tax, and whether a company itself had fundamental rights under Articles 19(1)(f) and (g) of the Constitution.", "judgement": "The Supreme Court held that a company cannot assert the fundamental rights of its individual shareholders. However, it may independently assert fundamental rights available to companies as legal persons, such as Article 19(1)(g) (right to carry on business), where the nature of the right permits its assertion by a legal person.", "principle": "A company is a distinct legal person and can assert fundamental rights available to legal persons independently of its shareholders. However, it cannot claim rights that are personal to human beings nor assert its shareholders' individual rights vicariously. This case clarifies the constitutional standing of corporations in India and is foundational for corporate challenges to taxation and regulation."}, {"id": "arcelormittal-india-v-satish-kumar-gupta-2019", "title": "ArcelorMittal India Pvt. Ltd. v. Satish Kumar Gupta", "citation": "(2019) 2 SCC 1", "court": "Supreme Court of India", "year": 2019, "bench": 3, "judges": ["R.F. Nariman J", "Sanjay Kishan Kaul J", "Indu Malhotra J"], "subject": "Company Law", "tags": ["Insolvency and Bankruptcy Code", "IBC", "resolution applicant", "eligibility", "Section 29A", "NPA", "promoter"], "facts": "ArcelorMittal submitted a resolution plan for Essar Steel under the Insolvency and Bankruptcy Code 2016. Questions arose about the eligibility of resolution applicants under Section 29A, which bars promoters of non-performing assets from bidding for insolvent companies. The case involved complex questions about who qualifies as a promoter and the scope of disqualification.", "judgement": "The Supreme Court upheld the constitutional validity of Section 29A and ruled that resolution applicants who are connected to companies that have been classified as NPAs for a year or more are ineligible unless they pay off the NPA. The Court gave a wide interpretation to 'promoter' and 'connected person' to prevent back-door entry by those responsible for the insolvency.", "principle": "The IBC's bar on promoters and connected persons from submitting resolution plans is a substantive disqualification designed to prevent those responsible for insolvency from regaining control of the company at a discount. Section 29A must be read expansively to fulfil the legislative intent of keeping unscrupulous persons out of the resolution process. This is the foundational case on resolution applicant eligibility under the IBC."}, {"id": "committee-of-creditors-essar-steel-v-satish-kumar-gupta-2019", "title": "Committee of Creditors of Essar Steel India Ltd. v. Satish Kumar Gupta", "citation": "(2020) 8 SCC 531", "court": "Supreme Court of India", "year": 2019, "bench": 3, "judges": ["R.F. Nariman J", "Sanjay Kishan Kaul J", "Indu Malhotra J"], "subject": "Company Law", "tags": ["IBC", "Committee of Creditors", "resolution plan", "financial creditor", "operational creditor", "waterfall mechanism", "Essar Steel"], "facts": "After ArcelorMittal's resolution plan was approved for Essar Steel, disputes arose about how the plan distributed proceeds between financial creditors, operational creditors, and other stakeholders. Operational creditors and workmen challenged the differential treatment, arguing they were being given far less than financial creditors in violation of the IBC.", "judgement": "The Supreme Court held that the Committee of Creditors has wide commercial discretion in approving resolution plans and deciding the distribution of value. The IBC does not require equal treatment of all creditors — financial creditors and operational creditors occupy different positions and may be treated differently. However, a resolution plan cannot completely ignore the claims of any class of creditors.", "principle": "The CoC's commercial wisdom in approving a resolution plan is paramount under the IBC and courts will interfere only when the plan is arbitrary or violates statutory requirements. Different classes of creditors may be treated differently in a resolution plan, but the plan must provide something to each class. This is the definitive case on the distribution of insolvency proceeds and the boundaries of judicial review of resolution plans."}, {"id": "piramal-enterprises-v-official-liquidator-2015", "title": "Piramal Enterprises Ltd. v. Official Liquidator", "citation": "(2016) 9 SCC 709", "court": "Supreme Court of India", "year": 2015, "bench": 2, "judges": ["Kurian Joseph J", "Rohinton Nariman J"], "subject": "Company Law", "tags": ["winding up", "sale of assets", "official liquidator", "Companies Act", "court sanction", "going concern"], "facts": "Piramal Enterprises sought to purchase the assets of a company in liquidation from the official liquidator as a going concern. Questions arose about the procedure for sale of assets in a winding up, the powers of the official liquidator, and whether court sanction was required for the sale to be binding.", "judgement": "The Supreme Court held that a sale of assets in a winding up requires court sanction to be effective. The court's role in a winding up is supervisory and all major disposals of company property must be approved by the court. The official liquidator has no authority to bind the estate by sale without court approval.", "principle": "In a court-ordered winding up, all significant transactions involving company assets require the sanction of the winding-up court. The official liquidator acts as an officer of the court and is not an independent commercial actor. This case defines the powers and limits of an official liquidator in Indian company law and the importance of court oversight in the liquidation process."}, {"id": "sahara-india-v-sebi-2012", "title": "Sahara India Real Estate Corporation Ltd. v. SEBI", "citation": "(2013) 1 SCC 1", "court": "Supreme Court of India", "year": 2012, "bench": 2, "judges": ["K.S. Panicker Radhakrishnan J", "J.S. Khehar J"], "subject": "Company Law", "tags": ["SEBI", "public issue", "optionally fully convertible debentures", "OFCD", "securities regulation", "investor protection", "Sahara"], "facts": "Sahara India raised money from millions of small investors through Optionally Fully Convertible Debentures. SEBI alleged this was an unlawful public issue of securities not complying with SEBI regulations. Sahara argued that OFCDs were not 'securities' and that the issue was a private placement to which SEBI had no jurisdiction.", "judgement": "The Supreme Court held that OFCDs were securities within the meaning of the SEBI Act and the Companies Act. The issue, having been made to over 50 persons, was a public issue requiring compliance with SEBI regulations. Sahara was directed to refund approximately Rs. 24,000 crore to investors with interest.", "principle": "The definition of 'securities' in Indian law is broad and includes instruments that are convertible into equity shares. Any issue of securities to more than 50 persons is a public issue subject to SEBI regulations, regardless of how the issuer characterises the instrument. This case is a landmark in Indian securities law and investor protection, and established SEBI's jurisdiction over non-traditional financial instruments."}, {"id": "rakesh-arora-v-rajinder-bhandari-2014", "title": "Rakesh Arora v. Rajinder Bhandari", "citation": "(2014) 10 SCC 721", "court": "Supreme Court of India", "year": 2014, "bench": 2, "judges": ["Ranjana Prakash Desai J", "Madan B. Lokur J"], "subject": "Company Law", "tags": ["company meeting", "notice", "quorum", "extraordinary general meeting", "articles of association", "shareholder disputes"], "facts": "A dispute arose between shareholders of a private company regarding the validity of an extraordinary general meeting held without proper notice to all members. One faction of shareholders held a meeting and passed resolutions changing the board. The other faction challenged the meeting as invalid for want of proper notice and quorum.", "judgement": "The Supreme Court held that meetings of shareholders must strictly comply with the requirements of the Companies Act and the articles of association regarding notice and quorum. A meeting held without proper notice to all shareholders entitled to attend is invalid and resolutions passed at such a meeting have no legal effect.", "principle": "Proper notice and quorum are mandatory prerequisites for a valid company meeting. Any resolution passed at a meeting that did not comply with notice requirements is void and cannot bind the company. This case reinforces the procedural safeguards available to shareholders and is frequently cited in corporate disputes involving contested board resolutions."}, {"id": "k-k-modi-v-k-n-modi-1998", "title": "K.K. Modi v. K.N. Modi", "citation": "(1998) 3 SCC 573", "court": "Supreme Court of India", "year": 1998, "bench": 2, "judges": ["S.C. Agrawal J", "S.B. Majmudar J"], "subject": "Company Law", "tags": ["arbitration", "shareholders agreement", "company dispute", "Arbitration Act", "jurisdiction", "oppression"], "facts": "Two brothers, joint promoters of several companies, had a falling out and disputes arose about the management and ownership of the companies. One party sought to refer the disputes to arbitration under a shareholders' agreement. The question was whether disputes involving oppression and mismanagement under the Companies Act could be referred to arbitration.", "judgement": "The Supreme Court held that disputes relating to oppression and mismanagement under the Companies Act are statutory remedies which only the Company Law Board (now NCLT) can grant. Matters involving such statutory relief cannot be sent to arbitration, though purely contractual disputes between shareholders can be so referred.", "principle": "Not all disputes in a company can be submitted to arbitration. Statutory remedies, such as relief from oppression and mismanagement, can only be granted by the forums designated by statute. This demarcation between arbitrable contractual disputes and non-arbitrable statutory claims is essential in corporate and shareholder litigation."}, {"id": "vodafone-international-v-union-india-transfer-pricing-2016", "title": "Vodafone India Services Pvt. Ltd. v. Union of India", "citation": "(2017) 394 ITR 414 (Bom)", "court": "Bombay High Court", "year": 2016, "bench": 2, "judges": ["M.S. Sanklecha J", "S.C. Gupte J"], "subject": "Company Law", "tags": ["transfer pricing", "ESOP", "capital account transaction", "arm's length price", "multinational company", "income tax"], "facts": "Vodafone India provided employee stock options to its employees under a plan implemented through its overseas parent. The Income Tax department sought to treat the difference between the fair market value and the exercise price of the options as a transfer pricing adjustment, arguing that the subsidiary received a service from the parent for which it had not paid arm's length consideration.", "judgement": "The Bombay High Court held that the issuance of ESOPs by a parent company to employees of its subsidiary is a capital account transaction and not a service. There is no income arising to the subsidiary from such a transaction, and consequently no transfer pricing adjustment can be made. The revenue's approach was rejected.", "principle": "Employee stock option plans implemented by a parent company for subsidiary employees are capital transactions and not taxable services. Transfer pricing adjustments can only be made in respect of international transactions involving income; they cannot be applied to capital account items. This case significantly limits the Revenue's ability to make transfer pricing adjustments in the context of equity compensation plans."}, {"id": "pepper-v-webb-1969", "title": "Pepper v. Webb", "citation": "[1969] 1 WLR 514", "court": "Court of Appeal (UK)", "year": 1969, "bench": 3, "judges": ["Harman LJ", "Karminski LJ", "Sachs LJ"], "subject": "Company Law", "tags": ["employment contract", "wrongful dismissal", "repudiatory breach", "conduct", "notice"], "facts": "A head gardener employed by Mr. Pepper was dismissed after he refused to obey reasonable instructions and used abusive language to his employer. The gardener claimed wrongful dismissal arguing that a single incident of misconduct was insufficient to justify summary dismissal. The employer argued the incident was the culmination of a long course of unsatisfactory conduct.", "judgement": "The Court of Appeal upheld the dismissal. A single act of insubordination or gross misconduct may justify summary dismissal where it represents a repudiatory breach of the employment contract. Here, the final incident, viewed against the background of prior misconduct, was sufficient to justify termination without notice.", "principle": "Summary dismissal for gross misconduct is lawful where the employee's conduct amounts to a repudiatory breach of the contract of employment. A single serious incident may justify dismissal, especially when it is the culmination of a pattern of unsatisfactory behaviour. This case is foundational in employment and company law for the law of wrongful dismissal."}, {"id": "bharat-petroleum-corporation-v-maddula-ratnavalli-2007", "title": "Bharat Petroleum Corporation Ltd. v. Maddula Ratnavalli", "citation": "(2007) 6 SCC 81", "court": "Supreme Court of India", "year": 2007, "bench": 2, "judges": ["S.B. Sinha J", "Markandey Katju J"], "subject": "Company Law", "tags": ["government company", "Article 12", "state", "fundamental rights", "instrumentality of state", "public sector"], "facts": "The question arose whether BPCL, a government-owned petroleum company, was a 'State' within the meaning of Article 12 of the Constitution, and therefore bound to observe fundamental rights in its dealings with citizens and employees. An employee challenged BPCL's actions as violating fundamental rights.", "judgement": "The Supreme Court held that BPCL is a 'State' under Article 12 of the Constitution. A government company whose share capital is predominantly held by the government, which carries out functions of a public nature, and which operates under significant government control is an instrumentality of State. As such, BPCL is bound to observe fundamental rights.", "principle": "A government-owned company that is an instrumentality or agency of the State is bound by Part III of the Constitution and must act in conformity with fundamental rights. The test for an 'instrumentality of State' considers government ownership, functional character, and the degree of government control. This case is part of the line of authority defining what amounts to a 'State' under Article 12."}, {"id": "navneet-lal-v-gokul-1976", "title": "Navneet Lal alias Pannalal v. Gokul", "citation": "AIR 1976 SC 794", "court": "Supreme Court of India", "year": 1976, "bench": 2, "judges": ["Untwalia J", "Goswami J"], "subject": "Company Law", "tags": ["partnership", "conversion to company", "goodwill", "dissolution", "business transfer"], "facts": "A partnership business was converted into a company with the partners becoming shareholders. A dispute arose about whether the goodwill of the original partnership was transferred to the company or remained with the individual partners. One ex-partner set up a competing business using the same trade name.", "judgement": "The Supreme Court held that on the conversion of a partnership into a company, all assets of the partnership, including goodwill, vest in the company unless expressly reserved by the partners. A partner who subsequently sets up a competing business using the same trade name may be restrained from doing so if the goodwill was transferred to the company.", "principle": "On conversion of a partnership firm into a company, the company acquires all assets of the partnership, including intangible assets like goodwill, unless there is a specific agreement to the contrary. Partners cannot subsequently use the goodwill they have transferred to the company. This case is significant for business conversions and the protection of goodwill in corporate transactions."}, {"id": "cms-forex-v-sebi-2019", "title": "CMS Info Systems Ltd. v. SEBI", "citation": "(2019) 5 SCC 380", "court": "Supreme Court of India", "year": 2019, "bench": 2, "judges": ["R. Banumathi J", "R. Subhash Reddy J"], "subject": "Company Law", "tags": ["SEBI", "takeover code", "open offer", "acquirer", "market manipulation", "Takeover Regulations"], "facts": "CMS Info Systems made an acquisition of shares that triggered the open offer obligation under the SEBI Takeover Regulations. SEBI alleged violations of the takeover code in the manner in which the acquisition was structured and the open offer conducted. Questions arose about the definition of 'acquirer' and the timing of open offer obligations.", "judgement": "The Supreme Court upheld SEBI's interpretation of the Takeover Regulations and found that the company had breached the open offer obligations. The Court confirmed that the Takeover Regulations must be read strictly and any acquisition that triggers the threshold must be followed by a compliant open offer without delay.", "principle": "The SEBI Takeover Regulations are protective legislation designed to ensure that public shareholders receive a fair exit opportunity when control of a listed company changes hands. Strict compliance is required, and acquirers cannot use structural devices to avoid or delay open offer obligations. This case reinforces SEBI's enforcement powers in takeover situations."}, {"id": "standard-chartered-bank-v-directorate-of-enforcement-2006", "title": "Standard Chartered Bank v. Directorate of Enforcement", "citation": "(2006) 4 SCC 278", "court": "Supreme Court of India", "year": 2006, "bench": 5, "judges": ["Y.K. Sabharwal CJ", "C.K. Thakker J", "P.K. Balasubramanyan J", "Dalveer Bhandari J", "Lokeshwar Singh Panta J"], "subject": "Company Law", "tags": ["FERA", "criminal liability", "company", "prosecution", "fine", "imprisonment", "corporate criminal liability"], "facts": "Standard Chartered Bank was prosecuted for violations of the Foreign Exchange Regulation Act. The bank argued that a company cannot be criminally prosecuted where the only punishment provided by law is imprisonment, since a company cannot be imprisoned. This raised the question of whether companies can be subjected to criminal prosecution at all.", "judgement": "The Supreme Court held that a company can be prosecuted for criminal offences. Where the statute provides for both imprisonment and fine, the court can impose the fine on the company even though imprisonment cannot apply. The inability to impose one part of a sentence does not make the company immune from prosecution.", "principle": "Companies are criminally liable for offences committed in their name and can be prosecuted and fined. The fact that a company cannot be imprisoned does not exclude it from criminal liability — courts will apply the sentence in a manner compatible with the company's nature. This is the leading Indian authority on corporate criminal liability."}, {"id": "sun-pharmaceuticals-v-sebi-2019", "title": "Sun Pharmaceuticals Industries Ltd. v. SEBI", "citation": "(2020) 12 SCC 166", "court": "Supreme Court of India", "year": 2019, "bench": 2, "judges": ["D.Y. Chandrachud J", "Hemant Gupta J"], "subject": "Company Law", "tags": ["insider trading", "unpublished price sensitive information", "UPSI", "SEBI regulations", "connected person", "listed company"], "facts": "SEBI alleged that certain trades in Sun Pharmaceutical shares were executed on the basis of unpublished price sensitive information. The accused persons were alleged to be 'connected persons' under the SEBI Insider Trading Regulations who had traded during a period when UPSI was in circulation. The question was the scope of the connected person definition and the reverse burden of proof.", "judgement": "The Supreme Court examined the scope of the insider trading regulations and held that the regulations impose a reverse burden on a connected person who trades during a period when UPSI is in circulation to prove that they did not trade on the basis of such information. The mere fact of trading during the UPSI window raises a presumption of insider trading.", "principle": "Insider trading regulations create a presumption against connected persons who trade in securities during a period when unpublished price sensitive information exists. The burden shifts to the accused to demonstrate that they did not use UPSI. This case clarifies the evidentiary framework for insider trading enforcement in India and strengthens SEBI's ability to prosecute such cases."}, {"id": "v-b-rangaraj-v-v-b-gopalakrishnan-1992", "title": "V.B. Rangaraj v. V.B. Gopalakrishnan", "citation": "(1992) 1 SCC 160", "court": "Supreme Court of India", "year": 1992, "bench": 2, "judges": ["M.H. Kania CJ", "B.P. Jeevan Reddy J"], "subject": "Company Law", "tags": ["pre-emption", "shareholders agreement", "share transfer restriction", "articles of association", "private company", "right of first refusal"], "facts": "Shareholders in a family private company had entered into a private agreement giving members of the family a right of pre-emption on any transfer of shares. The articles of association did not contain this restriction. When shares were transferred to an outsider without offering them to family members first, the pre-emption agreement was invoked.", "judgement": "The Supreme Court held that restrictions on share transfer in a company must be contained in the articles of association to be binding on all shareholders. A private agreement between shareholders imposing restrictions not reflected in the articles is not enforceable against the company or third party transferees.", "principle": "Share transfer restrictions are only effective against all parties if incorporated in the company's articles of association. A private agreement between shareholders cannot create binding transfer restrictions on shares unless those restrictions are also in the articles. This case defines the relationship between shareholders' agreements and articles of association in Indian company law."}, {"id": "laxmi-rattan-cotton-mills-v-j-k-cotton-spinning-1971", "title": "Laxmi Rattan Cotton Mills Co. Ltd. v. J.K. Cotton Spinning & Weaving Mills Co. Ltd.", "citation": "AIR 1971 SC 1451", "court": "Supreme Court of India", "year": 1971, "bench": 3, "judges": ["Hidayatullah CJ", "J.C. Shah J", "G.K. Mitter J"], "subject": "Company Law", "tags": ["compromise and arrangement", "scheme of arrangement", "Section 391", "class of creditors", "court sanction", "amalgamation"], "facts": "A scheme of compromise and arrangement under Section 391 of the Companies Act 1956 was proposed to restructure the debts of a company. The scheme was approved by the requisite majority of creditors but some dissenting creditors challenged the scheme as unfair and as not being in the interests of creditors as a whole.", "judgement": "The Supreme Court held that a scheme of arrangement under Section 391 requires the sanction of the court even after approval by the required majority. The court must be satisfied that the scheme is fair and reasonable and does not unfairly prejudice any class of creditors. The court is not a rubber stamp and must exercise independent judgment.", "principle": "Court sanction is a substantive requirement for schemes of compromise and arrangement, not a mere formality. The court must independently assess whether the scheme is fair and reasonable from the perspective of creditors and members, and whether the statutory majorities were properly obtained. This is the foundational case on the court's role in sanctioning schemes of arrangement."}, {"id": "borland-trustee-v-steel-brothers-1901", "title": "Borland's Trustee v. Steel Brothers & Co. Ltd.", "citation": "[1901] 1 Ch 279", "court": "Chancery Division (UK)", "year": 1901, "bench": 1, "judges": ["Farwell J"], "subject": "Company Law", "tags": ["share", "nature of share", "property right", "articles of association", "interest in company"], "facts": "The plaintiff as trustee in bankruptcy of a shareholder sought to claim the full market value of the shares. The company's articles provided that on bankruptcy of a shareholder, the shares were to be sold at a price fixed by the directors, which was below market value. The trustee argued this was an unlawful deprivation of property.", "judgement": "The court held that the articles' provision was valid. A share in a company is not simply property in the ordinary sense — it is a bundle of rights and obligations defined by the company's constitution. A shareholder takes their shares subject to all the terms of the articles, including provisions about what happens to shares on insolvency.", "principle": "A share in a company is not an ordinary item of property but a bundle of contractual and statutory rights and obligations as defined by the company's constitution. Shareholders are bound by the articles and cannot complain if those articles provide for compulsory acquisition of shares at a specified price on the happening of defined events. This case defines the legal nature of a share."}, {"id": "re-yenidje-tobacco-1916", "title": "Re Yenidje Tobacco Co. Ltd.", "citation": "[1916] 2 Ch 426", "court": "Court of Appeal (UK)", "year": 1916, "bench": 3, "judges": ["Lord Cozens-Hardy MR", "Warrington LJ", "Younger LJ"], "subject": "Company Law", "tags": ["just and equitable winding up", "deadlock", "quasi-partnership", "section 122", "Insolvency Act", "breakdown of trust"], "facts": "Two equal shareholders in a private company had fallen out completely. Each held 50% of the shares and there was a complete deadlock in management. Communication between them had broken down entirely and the company could not effectively function. One shareholder petitioned for winding up on the just and equitable ground.", "j
