udgement": "The Court of Appeal held that a winding-up order was appropriate. Where a private company is in substance a quasi-partnership and there is a complete and irremediable breakdown in trust and confidence between the shareholders such that the company cannot be managed, winding up on the just and equitable ground is appropriate.", "principle": "A company that is in substance a quasi-partnership may be wound up on the just and equitable ground where there is a fundamental breakdown in the relationship between its members analogous to a partnership dissolution. Deadlock between equal shareholders is a paradigm case for just and equitable winding up. This case is foundational for quasi-partnership company law."}, {"id": "per-hari-om-agarwal-v-rajendra-kumar-agarwal-2014", "title": "Hari Om Agarwal v. Rajendra Kumar Agarwal", "citation": "(2014) 8 SCC 161", "court": "Supreme Court of India", "year": 2014, "bench": 2, "judges": ["T.S. Thakur J", "Adarsh Kumar Goel J"], "subject": "Company Law", "tags": ["family company", "oppression", "just and equitable", "deadlock", "private company", "Company Law Board"], "facts": "Two brothers were equal shareholders in a family company and had a falling out. One brother alleged that the other had excluded him from management and misappropriated company funds. The Company Law Board found oppression but declined to order winding up. The aggrieved brother appealed seeking winding up.", "judgement": "The Supreme Court upheld the CLB's order for relief other than winding up. The Court held that winding up is a remedy of last resort and courts should prefer remedies that keep the company alive, such as buyout orders, unless the company's continued existence serves no useful purpose. The buyout of the aggrieved shareholder at fair value was the appropriate remedy.", "principle": "In oppression cases involving closely held companies, winding up is a remedy of last resort. Courts prefer alternative reliefs such as a buyout of the aggrieved minority at fair value, which balances the interests of all parties. This approach preserves the going concern value of the business while providing an exit to the aggrieved shareholder."}, {"id": "vodafone-indus-services-2017", "title": "Cairn India Ltd. v. Union of India", "citation": "(2017) 390 ITR 504 (Del)", "court": "Delhi High Court", "year": 2017, "bench": 2, "judges": ["S. Ravindra Bhat J", "A.K. Chawla J"], "subject": "Company Law", "tags": ["corporate restructuring", "demerger", "tax neutrality", "Companies Act", "SEBI", "capital gains", "Section 2(19AA)"], "facts": "Cairn India undertook a corporate restructuring involving a demerger of its Indian oil and gas business. Questions arose about whether the demerger qualified as a tax-neutral demerger under the Income Tax Act, with the tax authorities alleging that the conditions for a demerger were not met and that capital gains were chargeable.", "judgement": "The Delhi High Court upheld the tax neutrality of the demerger. The Court held that where a demerger complies with the conditions specified in Section 2(19AA) of the Income Tax Act — including transfer of all assets and liabilities on a going concern basis — the resulting distribution of shares to shareholders is not a taxable event.", "principle": "A demerger that meets the statutory conditions under the Income Tax Act is tax-neutral at the time of restructuring. The policy behind tax-neutral demergers is to facilitate business reorganization without triggering an immediate tax liability. This case is significant for corporate restructuring transactions and the scope of the definition of 'demerger' under Indian law."}, {"id": "re-h-r-harmer-1958", "title": "Re H.R. Harmer Ltd.", "citation": "[1959] 1 WLR 62", "court": "Court of Appeal (UK)", "year": 1958, "bench": 3, "judges": ["Jenkins LJ", "Romer LJ", "Ormerod LJ"], "subject": "Company Law", "tags": ["oppression", "family company", "quasi-partnership", "minority shareholder", "just and equitable", "alter ego"], "facts": "H.R. Harmer was the autocratic founder and dominant shareholder of a family philatelic business. His sons, who were also shareholders, alleged that he had systematically excluded them from management, entered into transactions against the company's interests, and acted as though the company were his sole property. They petitioned for relief on the ground of oppression.", "judgement": "The Court of Appeal upheld the finding of oppression. The founder's conduct was oppressive — he treated the company as his own property and ignored the interests of the other shareholders. The court ordered that he be appointed a president without executive power and that the majority of his shares be transferred to reduce his voting control.", "principle": "Even in a family company where the founder is the dominant shareholder, conduct that systematically ignores the interests of other members and treats the company as personal property constitutes oppression. Courts have wide remedial powers in oppression proceedings including altering shareholding structures. This is the foundational UK authority on quasi-partnership oppression."}, {"id": "bhagwandas-goverdhandas-kedia-v-girdharilal-1966", "title": "Bhagwandas Goverdhandas Kedia v. Girdharilal Parshottamdas & Co.", "citation": "AIR 1966 SC 543", "court": "Supreme Court of India", "year": 1966, "bench": 5, "judges": ["Subba Rao CJ", "Shah J", "Sikri J", "Ramaswami J", "Bachawat J"], "subject": "Company Law", "tags": ["contract", "acceptance by telephone", "place of contract", "jurisdiction", "offer and acceptance", "instantaneous communication"], "facts": "A contract was concluded over the telephone between parties in different cities. When a dispute arose, the question was where the contract was concluded for the purposes of determining which court had jurisdiction. The Supreme Court had to decide whether the place of contract was where the acceptance was communicated or where it was received.", "judgement": "The Supreme Court held that in the case of instantaneous communication such as telephone, the contract is concluded at the place where the acceptance is received by the offeror. This was held to be consistent with the Indian Contract Act since acceptance is only complete against the acceptor when it comes to the knowledge of the offeror.", "principle": "For contracts concluded by instantaneous means of communication (telephone, telex, and by extension electronic means), the contract is formed at the place where the acceptance is received by the offeror. This rule has significant implications for jurisdictional questions in commercial disputes and is foundational for e-commerce contract formation in Indian law."}, {"id": "re-westminster-property-1984", "title": "Ebrahimi v. Westbourne Galleries Ltd.", "citation": "[1973] AC 360", "court": "House of Lords (UK)", "year": 1972, "bench": 5, "judges": ["Lord Wilberforce", "Lord Dilhorne", "Lord Pearson", "Lord Cross", "Lord Salmon"], "subject": "Company Law", "tags": ["just and equitable winding up", "quasi-partnership", "exclusion from management", "legitimate expectation", "personal relationship"], "facts": "Ebrahimi and Nazar had run a carpet business in partnership. They then incorporated it into a company with Nazar's sons joining as shareholders. When the relationship deteriorated, Nazar and his sons used their majority to remove Ebrahimi as director, depriving him of income from the company while retaining their own directorships. Ebrahimi petitioned for winding up.", "judgement": "The House of Lords held that the company should be wound up on the just and equitable ground. Lord Wilberforce articulated the concept of a quasi-partnership company where equitable considerations arising from the personal relationship between members can be superimposed on the strict legal rights. Exclusion from management in such a company can justify winding up.", "principle": "A company that is in substance a quasi-partnership is subject to equitable constraints beyond the strict terms of its constitution. Where there is a mutual understanding that all members will participate in management, exclusion of a member from management may entitle that member to wind up the company on just and equitable grounds. This is the foundational authority on quasi-partnership companies."}, {"id": "pioneer-urban-land-v-union-india-2019", "title": "Pioneer Urban Land and Infrastructure Ltd. v. Union of India", "citation": "(2019) 8 SCC 416", "court": "Supreme Court of India", "year": 2019, "bench": 3, "judges": ["Rohinton Nariman J", "Sanjiv Khanna J", "Surya Kant J"], "subject": "Company Law", "tags": ["IBC", "real estate", "home buyers", "financial creditor", "RERA", "Insolvency and Bankruptcy Code", "allottee"], "facts": "Real estate developers challenged the amendment to the Insolvency and Bankruptcy Code that classified home buyers (allottees) as financial creditors entitled to initiate insolvency proceedings against developers. Developers argued that home buyers were not creditors in the traditional sense and that RERA was the appropriate forum for their disputes.", "judgement": "The Supreme Court upheld the constitutional validity of the IBC amendment. Home buyers who have paid money to developers under agreements to purchase flats are financial creditors since the developer has effectively borrowed money from them with a promise to deliver a commercial return. Home buyers can initiate CIRP against defaulting developers.", "principle": "Home buyers who have made advance payments to real estate developers are financial creditors under the IBC. Their claim is in the nature of a financial debt since the developer receives money with the promise of delivering a flat (a commercial return) and can be initiated against for corporate insolvency. This case transformed home buyer remedies in the Indian real estate sector."}, {"id": "avitel-post-studioz-v-hsbc-2021", "title": "Avitel Post Studioz Ltd. v. HSBC PI Holdings (Mauritius) Ltd.", "citation": "(2021) 4 SCC 713", "court": "Supreme Court of India", "year": 2021, "bench": 2, "judges": ["Rohinton Nariman J", "B.R. Gavai J"], "subject": "Company Law", "tags": ["arbitration", "fraud", "Section 8", "Arbitration Act", "shareholders agreement", "foreign award", "enforcement"], "facts": "HSBC had invested in Avitel through a shareholders agreement with an arbitration clause. Avitel's promoters allegedly made fraudulent misrepresentations to induce the investment. HSBC sought to litigate in Indian courts despite the arbitration clause, arguing that fraud allegations cannot be referred to arbitration. Avitel sought referral to arbitration.", "judgement": "The Supreme Court held that allegations of fraud do not automatically make a dispute non-arbitrable. Where the arbitration agreement covers the dispute and the fraud alleged is internal to the parties (not affecting third parties or the public at large), the matter must be referred to arbitration. Only fraud that goes to the validity of the arbitration agreement itself renders it non-arbitrable.", "principle": "Fraud between contracting parties is arbitrable where the arbitration agreement covers the dispute. The distinction is between fraud that is internal to the contract (between the parties) and fraud that has broader public or third-party implications. This case significantly expanded the scope of arbitrability of fraud disputes in Indian commercial law."}, {"id": "shriram-transport-finance-v-cit-1992", "title": "CIT v. Shriram Transport Finance Co. Ltd.", "citation": "(1994) 209 ITR 63 (SC)", "court": "Supreme Court of India", "year": 1992, "bench": 2, "judges": ["Venkatachaliah J", "Mohan J"], "subject": "Company Law", "tags": ["NBFC", "hire purchase", "asset ownership", "beneficial owner", "depreciation", "finance company", "Section 32"], "facts": "Shriram Transport Finance, a non-banking financial company, claimed depreciation on vehicles financed by it under hire purchase agreements. The Income Tax department denied the claim on the ground that the vehicles were not legally owned by Shriram. The case required examination of the concept of ownership for depreciation purposes.", "judgement": "The Supreme Court held that beneficial ownership of an asset is sufficient for claiming depreciation. A financier under a hire purchase agreement retains legal title and uses the vehicle for its business purpose of earning hire purchase income. The assessee was entitled to depreciation as beneficial owner.", "principle": "Depreciation can be claimed by the beneficial owner of an asset, not merely its legal titleholder. This principle is significant for leasing, hire purchase, and structured finance transactions where economic ownership and legal title may differ. Companies in the financial sector regularly rely on this principle to determine which party claims depreciation on financed assets."}, {"id": "in-re-avenue-supermarts-2017", "title": "In Re: Avenue Supermarts Ltd. (IPO)", "citation": "SEBI Order dated March 2017", "court": "Securities and Exchange Board of India", "year": 2017, "bench": 1, "judges": ["SEBI Whole Time Member"], "subject": "Company Law", "tags": ["IPO", "SEBI", "ICDR regulations", "pricing", "anchor investor", "QIB", "retail investor", "listing"], "facts": "Avenue Supermarts (D-Mart) conducted an IPO that was oversubscribed massively. Questions arose about the pricing mechanism, allocation to anchor investors, and compliance with SEBI's ICDR Regulations. The IPO raised regulatory questions about the book building process and whether the price discovery mechanism was functioning correctly.", "judgement": "SEBI reviewed the IPO process and found that the book building mechanism had functioned as designed, with price discovery reflecting genuine investor demand. The allocation to anchor investors, QIBs, and retail investors followed the prescribed percentages. The dramatic oversubscription and listing gains were market outcomes, not regulatory failures.", "principle": "The book building IPO mechanism is designed to discover the market-clearing price through genuine investor participation. SEBI's ICDR Regulations prescribe allocation percentages across investor categories to ensure broad participation. This case illustrates how SEBI evaluates the regulatory compliance of high-profile IPOs and the operation of the price discovery mechanism."}, {"id": "section-241-242-in-re-tata-2017", "title": "In Re: Tata Sons Ltd. (NCLT Mumbai Order)", "citation": "CP No. 82/241-242/MB/2016 (NCLT)", "court": "National Company Law Tribunal, Mumbai", "year": 2017, "bench": 2, "judges": ["B.S.V. Prakash Kumar (Member Technical)", "V. Nallasenapathy (Member Judicial)"], "subject": "Company Law", "tags": ["Section 241", "Section 242", "NCLT", "oppression", "Tata Sons", "Cyrus Mistry", "corporate governance", "Articles of Association"], "facts": "The Mistry family entities filed a petition under Sections 241 and 242 of the Companies Act 2013 before the NCLT Mumbai alleging oppression and mismanagement by Tata Sons. The petition raised issues about the removal of Cyrus Mistry as Chairman, the role of Tata Trusts, and alleged that the company was being run in a manner prejudicial to the interests of minority shareholders.", "judgement": "The NCLT dismissed the petition filed by the Mistry family. The Tribunal found that the removal of Mistry was in accordance with the Articles of Association and the Companies Act and did not constitute oppression. The NCLT held that commercial decisions of the board, made in good faith, are beyond the scope of Section 241 relief.", "principle": "The NCLT's jurisdiction under Sections 241 and 242 is to remedy oppression and mismanagement, not to substitute its commercial judgment for that of the board. The removal of an officer through the prescribed procedure under the Companies Act is not itself oppression, even when the removed person disagrees. This ruling, subsequently affirmed by the Supreme Court, sets important limits on shareholder litigation."}, {"id": "insolvency-professional-v-kirloskar-2021", "title": "Kirloskar Brothers Ltd. v. SEBI", "citation": "(2021) 16 SCC 591", "court": "Supreme Court of India", "year": 2021, "bench": 2, "judges": ["S. Abdul Nazeer J", "Krishna Murari J"], "subject": "Company Law", "tags": ["SEBI", "promoter", "creeping acquisition", "Takeover Regulations", "disclosure", "open offer", "acquisition threshold"], "facts": "Kirloskar Brothers exceeded the creeping acquisition limit under the SEBI Takeover Regulations through purchases made over time. SEBI imposed penalties for the failure to make an open offer and for non-disclosure. Kirloskar argued that certain acquisitions were exempt and that the threshold had not been crossed in a single transaction.", "judgement": "The Supreme Court held that the Takeover Regulations must be read cumulatively. The creeping acquisition limits apply to the aggregate of all acquisitions in a financial year. Where the aggregate exceeds the threshold, the open offer obligation is triggered regardless of whether any single transaction alone crossed the limit.", "principle": "Takeover Code obligations are calculated on a cumulative basis over the financial year, not transaction by transaction. A series of small acquisitions that together exceed the threshold trigger the open offer obligation just as a single large acquisition would. This case is important for listed company compliance monitoring and corporate acquisitions strategy."}, {"id": "ak-gopalan-v-state-of-madras-1950", "title": "A.K. Gopalan v. State of Madras", "citation": "AIR 1950 SC 27", "court": "Supreme Court of India", "year": 1950, "bench": 6, "judges": ["Kania CJ", "Fazl Ali J", "Patanjali Sastri J", "Mahajan J", "Mukherjea J", "Das J"], "subject": "Constitutional Law", "tags": ["Article 21", "personal liberty", "preventive detention", "Article 19", "procedure established by law", "fundamental rights"], "facts": "A.K. Gopalan, a Communist Party leader, was detained under the Preventive Detention Act 1950. He filed a habeas corpus petition challenging his detention as violative of Articles 13, 19, 21, and 22 of the Constitution. He argued that 'procedure established by law' under Article 21 must be fair, just, and reasonable.", "judgement": "The Supreme Court by majority rejected Gopalan's petition. The Court held that Articles 19 and 21 operate in distinct, watertight compartments and that a law depriving personal liberty need only satisfy the procedural requirements of Article 21. The Court rejected the argument that such procedure must also be fair or reasonable.", "principle": "In its early jurisprudence, the Supreme Court held that fundamental rights must be read independently. 'Procedure established by law' under Article 21 was interpreted narrowly to mean any procedure prescribed by a validly enacted law, not necessarily a just or fair one. This reading was significantly overruled by Maneka Gandhi v. Union of India in 1978."}, {"id": "state-of-madras-v-champakam-dorairajan-1951", "title": "State of Madras v. Champakam Dorairajan", "citation": "AIR 1951 SC 226", "court": "Supreme Court of India", "year": 1951, "bench": 5, "judges": ["Kania CJ", "Fazl Ali J", "Patanjali Sastri J", "Mukherjea J", "Das J"], "subject": "Constitutional Law", "tags": ["Article 15", "Article 16", "reservations", "caste-based classification", "right to equality", "first constitutional amendment"], "facts": "Champakam Dorairajan, a Brahmin woman, was denied admission to a state medical college in Madras despite having higher marks than candidates from reserved communities. The state operated a communal Government Order that allocated seats in educational institutions based on religion and caste.", "judgement": "The Supreme Court struck down the communal Government Order as unconstitutional. The Court held that the order violated Article 15(1) since it discriminated purely on the basis of caste and religion. This judgment directly prompted the First Constitutional Amendment in 1951, which inserted Article 15(4).", "principle": "Fundamental rights prevail over directive principles of state policy. Caste or religion-based reservations in state educational institutions without specific constitutional backing violate the right to equality. This case led to the first amendment to the Indian Constitution and remains the starting point for India's reservation jurisprudence."}, {"id": "kesavananda-bharati-v-state-of-kerala-1973", "title": "Kesavananda Bharati v. State of Kerala", "citation": "AIR 1973 SC 1461", "court": "Supreme Court of India", "year": 1973, "bench": 13, "judges": ["Sikri CJ", "Shelat J", "Grover J", "Hegde J", "Mukherjea J", "Jaganmohan Reddy J", "Khanna J", "Palekar J", "Mathew J", "Beg J", "Dwivedi J", "Ray J", "Chandrachud J"], "subject": "Constitutional Law", "tags": ["basic structure doctrine", "Article 368", "constitutional amendment", "parliamentary sovereignty", "judicial review", "fundamental rights"], "facts": "Swami Kesavananda Bharati challenged state land reform legislation that curtailed his property rights. The case expanded into a fundamental constitutional question: does Parliament's power to amend the Constitution under Article 368 extend to destroying or abrogating the Constitution itself?", "judgement": "The Supreme Court, by a majority of 7:6, held that while Parliament has wide power to amend the Constitution, it cannot alter or destroy its 'basic structure'. The majority identified elements such as supremacy of the Constitution, republican and democratic form of government, secularism, and judicial review as part of the basic structure.", "principle": "Parliament's constituent power under Article 368 is not unlimited. The basic structure of the Constitution is immune from amendment. This doctrine acts as a judicial check on legislative and executive excess and is the most significant contribution of the Indian Supreme Court to constitutional law worldwide."}, {"id": "maneka-gandhi-v-union-of-india-1978", "title": "Maneka Gandhi v. Union of India", "citation": "AIR 1978 SC 597", "court": "Supreme Court of India", "year": 1978, "bench": 7, "judges": ["Beg CJ", "Chandrachud J", "Bhagwati J", "Krishna Iyer J", "Untwalia J", "Fazal Ali J", "Kailasam J"], "subject": "Constitutional Law", "tags": ["Article 21", "right to life", "due process", "passport impoundment", "natural justice", "golden triangle", "Article 14", "Article 19"], "facts": "Maneka Gandhi's passport was impounded by the government under the Passport Act without giving her reasons or an opportunity to be heard. The central constitutional question was the scope of 'personal liberty' under Article 21 and the meaning of 'procedure established by law'.", "judgement": "The Supreme Court unanimously held that the impoundment was unconstitutional. The Court overruled A.K. Gopalan and held that Articles 14, 19, and 21 must be read together. 'Procedure established by law' must be fair, just, and reasonable. The right to travel abroad was held to be part of personal liberty under Article 21.", "principle": "Article 21 guarantees not merely a procedure but a fair, just, and reasonable one. Articles 14, 19, and 21 form a 'golden triangle' of fundamental rights that must be read harmoniously. This case transformed Article 21 into the most expansive fundamental right in the Constitution."}, {"id": "sp-gupta-v-union-of-india-1981", "title": "S.P. Gupta v. Union of India", "citation": "AIR 1982 SC 149", "court": "Supreme Court of India", "year": 1981, "bench": 7, "judges": ["Bhagwati J", "Fazal Ali J", "Gupta J", "Desai J", "Sen J", "Venkataramiah J", "Baharul Islam J"], "subject": "Constitutional Law", "tags": ["independence of judiciary", "judicial appointments", "locus standi", "public interest litigation", "transparency", "Article 124", "collegium"], "facts": "The case arose from disputes about the transfer and non-appointment of judges. Lawyers filed petitions challenging executive interference in judicial appointments. The case raised questions about primacy in judicial appointments and dramatically expanded the doctrine of locus standi.", "judgement": "The Supreme Court held by majority that the executive had primacy in judicial appointments, with the Chief Justice's role being merely consultative. The Court also liberalised standing rules, holding that any person acting in public interest could approach the Court on behalf of those unable to do so — the foundational ruling for PIL in India.", "principle": "This case is the origin of public interest litigation in India, establishing that procedural barriers to court access must yield where fundamental rights of the disadvantaged are at stake. On judicial appointments, it was subsequently overruled by the Second Judges Case (1993). Together these cases form the bedrock of India's judicial independence jurisprudence."}, {"id": "indra-sawhney-v-union-of-india-1992", "title": "Indra Sawhney v. Union of India", "citation": "AIR 1993 SC 477", "court": "Supreme Court of India", "year": 1992, "bench": 9, "judges": ["Kania CJ", "Venkatachaliah J", "Ahmadi J", "Sawant J", "Kuldip Singh J", "Sahai J", "Jeevan Reddy J", "Pandian J", "Thommen J"], "subject": "Constitutional Law", "tags": ["OBC reservations", "Mandal Commission", "Article 16(4)", "50% cap", "creamy layer", "backward classes", "reservations in promotion"], "facts": "The V.P. Singh government implemented the Mandal Commission report in 1990, reserving 27% of central government jobs for OBCs. A nine-judge bench was constituted to settle the law on reservations, including the validity of the 50% cap, the creamy layer concept, and reservations in promotions.", "judgement": "The Supreme Court upheld OBC reservations up to 27%. It imposed a ceiling of 50% on total reservations, introduced the creamy layer concept excluding advanced OBCs, and held that reservations in promotions were impermissible under Article 16(4).", "principle": "Reservations for backward classes are constitutionally valid but subject to a ceiling of 50% and the exclusion of the creamy layer. This case comprehensively defines the contours of affirmative action in India and remains the foundational authority on reservation law."}, {"id": "sr-bommai-v-union-of-india-1994", "title": "S.R. Bommai v. Union of India", "citation": "AIR 1994 SC 1918", "court": "Supreme Court of India", "year": 1994, "bench": 9, "judges": ["Venkatachaliah CJ", "Pandian J", "Jeevan Reddy J", "Ahmadi J", "Kuldip Singh J", "Sawant J", "Ramaswamy J", "Agarwal J", "Yogeshwar Dayal J"], "subject": "Constitutional Law", "tags": ["Article 356", "President's Rule", "federalism", "floor test", "secularism", "basic structure", "judicial review"], "facts": "S.R. Bommai was the Chief Minister of Karnataka whose government was dismissed under Article 356 in 1989. Similar dismissals of state governments occurred after the Babri Masjid demolition in 1992. The constitutional validity of these proclamations came before a nine-judge bench.", "judgement": "The Supreme Court held that Article 356 proclamations are subject to judicial review. The floor test — not the Governor's subjective satisfaction — is the proper test of majority. Secularism was affirmed as a basic feature of the Constitution.", "principle": "Presidential proclamations under Article 356 are justiciable and courts can strike them down if mala fide. The floor test is the only legitimate method to determine a government's majority. Secularism is part of the basic structure. This case is the cornerstone of Indian federalism jurisprudence."}, {"id": "vishaka-v-state-of-rajasthan-1997", "title": "Vishaka v. State of Rajasthan", "citation": "AIR 1997 SC 3011", "court": "Supreme Court of India", "year": 1997, "bench": 3, "judges": ["Verma CJ", "Sujata Manohar J", "B.N. Kirpal J"], "subject": "Constitutional Law", "tags": ["sexual harassment", "workplace", "Article 21", "Article 14", "CEDAW", "Vishaka guidelines", "gender equality", "fundamental rights"], "facts": "Bhanwari Devi, a social worker in Rajasthan, was gang-raped while trying to prevent a child marriage. The acquittal of the accused prompted women's rights groups to file a PIL seeking enforcement of fundamental rights of working women and guidelines to address workplace sexual harassment.", "judgement": "The Supreme Court issued binding Vishaka Guidelines defining sexual harassment, imposing employer duties, and requiring workplace complaints committees. The Court drew from CEDAW and international law to supplement domestic constitutional guarantees.", "principle": "Where domestic law is absent, the Supreme Court can issue binding guidelines under Article 32 drawing from international conventions. Sexual harassment at the workplace violates the fundamental rights to equality, dignity, and life. The Vishaka Guidelines remained binding law until replaced by the 2013 Act."}, {"id": "puttaswamy-v-union-of-india-2017", "title": "Justice K.S. Puttaswamy (Retd.) v. Union of India", "citation": "(2017) 10 SCC 1", "court": "Supreme Court of India", "year": 2017, "bench": 9, "judges": ["Khehar CJ", "Chelameswar J", "Bobde J", "Rohinton Nariman J", "Abhay Manohar Sapre J", "D.Y. Chandrachud J", "S.K. Kaul J", "S. Abdul Nazeer J", "Sanjay Kishan Kaul J"], "subject": "Constitutional Law", "tags": ["right to privacy", "Article 21", "Aadhaar", "data protection", "dignity", "autonomy", "informational privacy", "basic structure", "surveillance"], "facts": "The constitutional validity of the Aadhaar scheme was challenged. A preliminary question arose whether privacy is a fundamental right. Earlier judgments in M.P. Sharma (1954) and Kharak Singh (1962) had held that privacy was not a fundamental right. A nine-judge bench was constituted to settle this.", "judgement": "All nine judges unanimously held that the right to privacy is a fundamental right protected under Article 21. Earlier judgments were overruled. Privacy encompasses bodily integrity, informational privacy, and the right to make personal choices. State intrusion must satisfy legality, necessity, and proportionality.", "principle": "Privacy is a fundamental right intrinsic to life, liberty, and dignity under Article 21. State action that infringes privacy must be backed by law, serve a legitimate aim, and be proportionate. This judgment is the constitutional foundation for India's data protection framework."}, {"id": "joseph-shine-v-union-of-india-2018", "title": "Joseph Shine v. Union of India", "citation": "(2019) 3 SCC 39", "court": "Supreme Court of India", "year": 2018, "bench": 5, "judges": ["Dipak Misra CJ", "Rohinton Nariman J", "A.M. Khanwilkar J", "D.Y. Chandrachud J", "Indu Malhotra J"], "subject": "Constitutional Law", "tags": ["adultery", "Section 497 IPC", "Article 14", "Article 15", "Article 21", "gender equality", "dignity", "decriminalisation", "autonomy"], "facts": "Joseph Shine filed a PIL challenging Section 497 IPC which criminalised adultery, punishing only men and treating women as property of their husbands. It was challenged as discriminatory and violative of Articles 14, 15, and 21.", "judgement": "The Supreme Court unanimously struck down Section 497 IPC. The provision was rooted in a patriarchal notion that a wife is the property of her husband. It violated equality and the right to dignity and personal autonomy under Article 21. Adultery was decriminalised, though it may remain a ground for divorce.", "principle": "Laws that treat women as less than equal or reduce them to the status of property are unconstitutional. Individual autonomy, dignity, and the right to make intimate choices are protected under Article 21. This judgment is a landmark in India's constitutional recognition of gender equality and sexual autonomy."}, {"id": "romesh-thappar-v-state-of-madras-1950", "title": "Romesh Thappar v. State of Madras", "citation": "AIR 1950 SC 124", "court": "Supreme Court of India", "year": 1950, "bench": 5, "judges": ["Kania CJ", "Fazl Ali J", "Patanjali Sastri J", "Das J", "Mukherjea J"], "subject": "Constitutional Law", "tags": ["freedom of speech", "Article 19(1)(a)", "press freedom", "restrictions", "sedition", "Madras Maintenance of Public Order Act"], "facts": "Romesh Thappar published a journal, Crossroads, which was banned by the Government of Madras under the Madras Maintenance of Public Order Act. The Act allowed restrictions on publications in the interest of public safety and the maintenance of public order. Thappar challenged the ban as a violation of freedom of speech and expression.", "judgement": "The Supreme Court struck down the ban. The Constitution permits restrictions on free speech only on the grounds specified in Article 19(2). Public order and public safety were not grounds mentioned in the original Article 19(2), and a law restricting speech on those grounds alone was unconstitutional. The Court held that freedom of speech cannot be curtailed except on the specific grounds in the Constitution.", "principle": "Freedom of speech and expression can only be restricted on the grounds explicitly enumerated in Article 19(2) of the Constitution. A law that restricts speech on grounds not listed in Article 19(2) is unconstitutional. This case established the principle that the grounds for restricting fundamental rights are exhaustive and cannot be supplemented by legislation."}, {"id": "shankari-prasad-v-union-of-india-1951", "title": "Shankari Prasad Singh Deo v. Union of India", "citation": "AIR 1951 SC 458", "court": "Supreme Court of India", "year": 1951, "bench": 5, "judges": ["Kania CJ", "Patanjali Sastri J", "Mahajan J", "Mukherjea J", "Das J"], "subject": "Constitutional Law", "tags": ["constitutional amendment", "Article 368", "fundamental rights", "Article 13", "first amendment", "property rights"], "facts": "The First Constitutional Amendment was challenged as being ultra vires because it amended Article 31 (right to property) and Article 19(1)(f), which were fundamental rights. The petitioner argued that since Article 13 prohibited laws abridging fundamental rights, Parliament could not amend fundamental rights under Article 368.", "judgement": "The Supreme Court held that Parliament's constituent power under Article 368 is distinct from its ordinary legislative power under Article 245. The word 'law' in Article 13 refers to ordinary legislation and not to constitutional amendments. Therefore, Parliament can amend fundamental rights through Article 368 without violating Article 13.", "principle": "Parliament has power to amend fundamental rights through the constitutional amendment procedure in Article 368. A constitutional amendment is not 'law' within the meaning of Article 13. This position was subsequently modified by Golak Nath (1967) and then by the basic structure doctrine in Kesavananda Bharati (1973)."}, {"id": "state-of-west-bengal-v-subodh-gopal-bose-1954", "title": "State of West Bengal v. Subodh Gopal Bose", "citation": "AIR 1954 SC 92", "court": "Supreme Court of India", "year": 1954, "bench": 5, "judges": ["Mehr Chand Mahajan CJ", "Mukherjea J", "S.R. Das J", "Vivian Bose J", "Ghulam Hasan J"], "subject": "Constitutional Law", "tags": ["Article 31", "right to property", "acquisition", "compensation", "public purpose", "zamindari abolition"], "facts": "The State of West Bengal acquired land belonging to Subodh Gopal Bose under land reform legislation without paying what the respondent considered adequate compensation. The petitioner challenged the acquisition as violating the right to property under Article 31, which required that compensation be paid for compulsory acquisition.", "judgement": "The Supreme Court held that the right to property under Article 31 required that just and adequate compensation be paid for compulsory acquisition of property. A law that provides for acquisition without adequate compensation violates Article 31. The Court read into Article 31 a requirement of justness in the amount of compensation.", "principle": "Compulsory acquisition of property by the State must be accompanied by just and adequate compensation. A law that extinguishes private property rights without adequate compensation violates the constitutional right to property. This case is part of the long property rights saga that eventually led to the deletion of Article 19(1)(f) and Article 31 from the Constitution in 1978."}, {"id": "golak-nath-v-state-of-punjab-1967", "title": "I.C. Golak Nath v. State of Punjab", "citation": "AIR 1967 SC 1643", "court": "Supreme Court of India", "year": 1967, "bench": 11, "judges": ["Subba Rao CJ", "Shah J", "Wanchoo J", "Hidayatullah J", "Ramaswami J", "Sikri J", "Bachawat J", "Vaidyalingam J", "Shelat J", "Bhargava J", "Mitter J"], "subject": "Constitutional Law", "tags": ["constitutional amendment", "fundamental rights", "Article 368", "Article 13", "property rights", "prospective overruling"], "facts": "Henry Golak Nath's family held vast agricultural lands in Punjab. The State of Punjab acquired land beyond the ceiling fixed by the Punjab Security of Land Tenures Act. Golak Nath challenged the validity of constitutional amendments (the First, Fourth, and Seventeenth) which curtailed his property rights.", "judgement": "By a majority of 6:5, the Supreme Court overruled Shankari Prasad and held that Parliament cannot amend fundamental rights. The Court introduced the doctrine of prospective overruling — the decision would apply only prospectively so as not to disturb amendments already made. Fundamental rights were held to be outside the scope of the amending power.", "principle": "Parliament has no power to abridge or take away fundamental rights through constitutional amendments. Fundamental rights are transcendental and cannot be curtailed. The doctrine of prospective overruling was introduced for the first time in India in this case. Golak Nath was itself overruled by the Kesavananda Bharati judgment in 1973."}, {"id": "state-of-kerala-v-np-poulose-1974", "title": "Superintendent and Remembrancer of Legal Affairs v. A.K. Roy", "citation": "AIR 1973 SC 819", "court": "Supreme Court of India", "year": 1973, "bench": 5, "judges": ["Chandrachud J", "Bhagwati J", "Goswami J", "Dwivedi J", "Sarkaria J"], "subject": "Constitutional Law", "tags": ["preventive detention", "Article 22", "MISA", "personal liberty", "representation", "detaining authority"], "facts": "A.K. Roy was detained under the Maintenance of Internal Security Act (MISA). He challenged the detention on the grounds that the grounds of detention were vague, that his representation to the detaining authority had not been considered, and that the procedural safeguards under Article 22 had not been complied with.", "judgement": "The Supreme Court held that the safeguards in Article 22(5) are mandatory and must be strictly complied with. The detaining authority must communicate the grounds of detention enabling the detainee to make an effective representation. Vague grounds that do not give the detainee a real opportunity to challenge the detention are constitutionally invalid.", "principle": "Article 22 provides minimum procedural guarantees for persons in preventive detention. These guarantees — the right to be informed of grounds of detention, the right to make a representation, and the right to have that representation considered — are mandatory. Any failure to comply with these requirements renders the detention unconstitutional."}, {"id": "menaka-gandhi-v-union-1978", "title": "Additional District Magistrate, Jabalpur v. Shivakant Shukla", "citation": "AIR 1976 SC 1207", "court": "Supreme Court of India", "year": 1976, "bench": 5, "judges": ["Ray CJ", "Beg J", "Chandrachud J", "Bhagwati J", "Khanna J"], "subject": "Constitutional Law", "tags": ["Emergency", "Article 21", "habeas corpus", "preventive detention", "MISA", "suspension of fundamental rights", "Khanna J dissent"], "facts": "During the Emergency (1975-77), the President of India suspended the right to move courts for enforcement of Article 21 (right to life) and Article 14. Detainees under MISA challenged their detention through habeas corpus petitions. The question was whether courts could examine the legality of detention during the Emergency when Article 21 was suspended.", "judgement": "The majority of four judges held that no court could grant habeas corpus during the Emergency when Article 21 was suspended. Justice H.R. Khanna dissented, holding that the right to life and personal liberty under Article 21 is not merely a constitutional right but a natural right that cannot be suspended even during Emergency.", "principle": "This case is historically significant for Justice Khanna's lone dissent — widely regarded as one of the finest hours of Indian judicial courage — insisting that the right to life cannot be extinguished even by the Executive during Emergency. It catalysed the 44th Amendment, which made Article 21 non-suspendable even during Emergency. The majority judgment is widely regarded as the nadir of Indian constitutional jurisprudence."}, {"id": "minerva-mills-v-union-of-india-1980", "title": "Minerva Mills Ltd. v. Union of India", "citation": "AIR 1980 SC 1789", "court": "Supreme Court of India", "year": 1980, "bench": 5, "judges": ["Chandrachud CJ", "Bhagwati J", "Gupta J", "Untwalia J", "Kailasam J"], "subject": "Constitutional Law", "tags": ["basic structure", "Article 368", "judicial review", "directive principles", "fundamental rights", "42nd Amendment", "balance"], "facts": "Minerva Mills challenged the 42nd Constitutional Amendment which, among other things, gave directive principles absolute primacy over fundamental rights and excluded judicial review of constitutional amendments. The 42nd Amendment was passed during the Emergency and sought to override the Kesavananda Bharati judgment.", "judgement": "The Supreme Court struck down the relevant provisions of the 42nd Amendment as unconstitutional. The Court held that judicial review and the balance between fundamental rights and directive principles are part of the basic structure of the Constitution. Parliament cannot remove the Court's power to review constitutional amendments.", "principle": "The power to amend the Constitution does not include the power to destroy its basic structure. Judicial review of constitutional amendments is itself a basic feature of the Constitution and cannot be abrogated by Parliament. The balance between fundamental rights and directive principles is also a basic feature. Minerva Mills is the definitive application of Kesavananda Bharati."}, {"id": "olga-tellis-v-bombay-municipal-corporation-1985", "title": "Olga Tellis v. Bombay Municipal Corporation", "citation": "AIR 1986 SC 180", "court": "Supreme Court of India", "year": 1985, "bench": 5, "judges": ["Chandrachud CJ", "Fazal Ali J", "Varadarajan J", "Sen J", "Misra J"], "subject": "Constitutional Law", "tags": ["right to livelihood", "Article 21", "pavement dwellers", "eviction", "due process", "socio-economic rights", "directive principles"], "facts": "The Bombay Municipal Corporation sought to evict pavement and slum dwellers from public land. The dwellers argued that eviction without providing alternative accommodation and without following due process violated their fundamental rights. They contended that the right to life under Article 21 included the right to livelihood.", "judgement": "The Supreme Court held that the right to life under Article 21 includes the right to livelihood. You cannot live without the means of living, i.e., the means of livelihood. While the Court allowed the eviction, it held that the procedure must be fair and that persons cannot be evicted without being heard and without adequate notice.", "principle": "The right to life under Article 21 encompasses the right to livelihood. Deprivation of livelihood amounts to deprivation of life itself. This case expanded the scope of Article 21 to include socio-economic rights and is foundational for the constitutional protection of the urban poor and the right to shelter in Indian constitutional law."}, {"id": "mc-mehta-v-union-of-india-1987", "title": "M.C. Mehta v. Union of India (Shriram Gas Leak)", "citation": "AIR 1987 SC 1086", "court": "Supreme Court of India", "year": 1987, "bench": 3, "judges": ["Bhagwati CJ", "Ranganath Misra J", "Oza J"], "subject": "Constitutional Law", "tags": ["absolute liability", "hazardous industry", "Article 21", "environment", "Oleum gas", "PIL", "Rylands v Fletcher", "strict liability"], "facts": "Oleum gas leaked from the Shriram Food and Fertilizer Industries plant in Delhi, killing one person and injuring several others. M.C. Mehta filed a PIL before the Supreme Court. The question arose what standard of liability applied to enterprises engaged in hazardous or inherently dangerous activities.", "judgement": "The Supreme Court laid down the rule of absolute liability — an enterprise engaged in hazardous or inherently dangerous activity is absolutely and non-delegably liable to compensate all those affected, with no exceptions permitted. This went beyond the English rule in Rylands v. Fletcher, which allowed certain defences.", "principle": "Enterprises engaged in hazardous activities are absolutely liable for any harm caused by such activities and cannot avail themselves of any exception or defence. This absolute liability is higher than strict liability under Rylands v. Fletcher. The size of the enterprise determines the quantum of compensation. This case established absolute liability as a distinctly Indian tort law and constitutional principle."}, {"id": "unni-krishnan-v-state-of-andhra-pradesh-1993", "title": "Unni Krishnan v. State of Andhra Pradesh", "citation": "AIR 1993 SC 2178", "court": "Supreme Court of India", "year": 1993, "bench": 5, "judges": ["Kania CJ", "Venkatachaliah J", "Mohan J", "Sahai J", "Jeevan Reddy J"], "subject": "Constitutional Law", "tags": ["right to education", "Article 21", "Article 41", "private schools", "capitation fee", "directive principles", "free and compulsory education"], "facts": "Petitions were filed challenging the practice of private educational institutions charging capitation fees for admissions. The fundamental question was whether the right to education is a fundamental right under the Constitution and, if so, what the obligations of the State and private institutions were.", "judgement": "The Supreme Court held that the right to education is a fundamental right flowing from Article 21, read with the directive principles in Articles 41 and 45. Every citizen has a right to free education up to the age of 14. Capitation fees charged by private institutions were held to be unconstitutional. The Court laid down a regulatory scheme for private educational institutions.", "principle": "The right to education is a fundamental right under Article 21 of the Constitution, read with directive principles. Children have a right to free and compulsory education up to the age of 14. This case preceded the 86th Amendment which expressly inserted Article 21A guaranteeing the right to education, and the Right to Education Act 2009."}, {"id": "t-ma-pai-foundation-v-state-of-karnataka-2002", "title": "T.M.A. Pai Foundation v. State of Karnataka", "citation": "(2002) 8 SCC 481", "court": "Supreme Court of India", "year": 2002, "bench": 11, "judges": ["B.N. Kirpal CJ", "V.N. Khare J", "S.N. Variava J", "K.G. Balakrishnan J", "P. Venkatarama Reddi J", "Arijit Pasayat J", "D.M. Dharmadhikari J", "Ashok Bhan J", "Lokeshwar Singh Panta J", "S.B. Sinha J", "A.R. Lakshmanan J"], "subject": "Constitutional Law", "tags": ["Article 30", "minority institutions", "right to establish educational institutions", "regulatory power", "government aid", "reservation in admissions"], "facts": "An eleven-judge bench was constituted to settle the law on the rights of minority and non-minority private educational institutions under Articles 19(1)(g) and 30. The questions included whether private unaided institutions had the right to admission procedures and fee structures free from government regulation.", "judgement": "The Supreme Court held that private unaided educational institutions have the right to establish and administer them without undue government interference. Minority institutions have additional protections under Article 30. Government can impose reasonable regulatory conditions but cannot compulsorily apply reservation policies to private unaided institutions.", "principle": "Private educational institutions have a fundamental right to establish and administer institutions. While the State may regulate, it cannot take away the essential character of private management. Minority institutions additionally enjoy the protection of Article 30. This is the definitive case on the rights of private educational institutions in India."}, {"id": "peoples-union-for-civil-liberties-v-union-1997", "title": "People's Union for Civil Liberties v. Union of India", "citation": "(1997) 1 SCC 301", "court": "Supreme Court of India", "year": 1997, "bench": 2, "judges": ["Kuldip Singh J", "S.P. Bharucha J"], "subject": "Constitutional Law", "tags": ["telephone tapping", "right to privacy", "Article 19(1)(a)", "Article 21", "surveillance", "Indian Telegraph Act", "freedom of speech"], "facts": "PUCL filed a PIL challenging the practice of telephone tapping by the government. The petitioner argued that telephone tapping without judicial oversight violated the right to privacy and freedom of speech and expression under Articles 19 and 21. The government argued that tapping was permitted under the Indian Telegraph Act.", "judgement": "The Supreme Court held that telephone tapping constitutes a serious invasion of privacy. The right to privacy is part of the right to life and liberty under Article 21 and also of freedom of speech under Article 19(1)(a). The Court laid down procedural safeguards for telephone tapping, including that orders must be given at a senior level and must be reviewed.", "principle": "Telephone tapping is a violation of the right to privacy and freedom of speech unless done strictly in accordance with procedural safeguards. The State's surveillance powers must be accompanied by procedural guarantees against abuse. This case laid down the first set of procedural rules for telephone interception and is a precursor to the comprehensive right to privacy affirmed in Puttaswamy."}, {"id": "state-of-rajasthan-v-union-of-india-1977", "title": "State of Rajasthan v. Union of India", "citation": "AIR 1977 SC 1361", "court": "Supreme Court of India", "year": 1977, "bench": 7, "judges": ["Beg CJ", "Chandrachud J", "Bhagwati J", "Krishna Iyer J", "Untwalia J", "Fazal Ali J", "Goswami J"], "subject": "Constitutional Law", "tags": ["Article 356", "President's Rule", "political question", "justiciability", "federalism", "Janata government", "governor"], "facts": "After the Janata Party came to power at the Centre in 1977, it issued a directive to Governors of Congress-ruled states recommending dissolution of state assemblies and imposition of President's Rule. Several states challenged this as unconstitutional, arguing that the Centre could not dissolve state governments that had the confidence of their assemblies.", "judgement": "The Supreme Court held by majority that courts could examine the grounds on which President's Rule is imposed to a limited extent, but that political questions involving the dissolution of assemblies were largely non-justiciable. The Court was reluctant to interfere with the Centre's exercise of political discretion.", "principle": "While the imposition of President's Rule is not entirely beyond judicial review, courts exercise restraint in interfering with political decisions in the federal sphere. This case preceded S.R. Bommai, which significantly expanded judicial review of President's Rule. Together they chart the evolving judicial approach to Centre-State relations in India."}, {"id": "navtej-singh-johar-v-union-of-india-2018", "title": "Navtej Singh Johar v. Union of India", "citation": "(2018) 10 SCC 1", "court": "Supreme Court of India", "year": 2018, "bench": 5, "judges": ["Dipak Misra CJ", "Rohinton Nariman J", "A.M. Khanwilkar J", "D.Y. Chandrachud J", "Indu Malhotra J"], "subject": "Constitutional Law", "tags": ["Section 377 IPC", "homosexuality", "Article 14", "Article 15", "Article 19", "Article 21", "decriminalisation", "dignity", "sexual orientation"], "facts": "A petition was filed challenging Section 377 of the IPC which criminalised consensual sexual acts between adults of the same sex. The petitioners argued that Section 377 violated the fundamental rights to equality, dignity, privacy, and freedom of expression of LGBTQ individuals. The case followed the reinstatement of Section 377 by the Supreme Court in 2013.", "judgement": "The Supreme Court unanimously struck down Section 377 insofar as it criminalised consensual sexual acts between adults. The Court held that sexual orientation is an intrinsic part of identity protected by Article 21. Discrimination based on sexual orientation violates Articles 14, 15, and 19. The State has no business in the bedrooms of consenting adults.", "principle": "Sexual orientation is an essential attribute of identity and its criminalisation violates the rights to dignity, privacy, and equality. Constitutional morality must trump popular morality. This case is a landmark in the constitutional recognition of the rights of LGBTQ persons in India and marked a decisive turn in the Court's engagement with identity-based rights."}, {"id": "habeas-corpus-adr-v-union-2003", "title": "Association for Democratic Reforms v. Union of India", "citation": "(2002) 5 SCC 294", "court": "Supreme Court of India", "year": 2002, "bench": 3, "judges": ["S.P. Bharucha J", "B.N. Kirpal J", "Ruma Pal J"], "subject": "Constitutional Law", "tags": ["electoral reform", "right to information", "voters right", "criminal antecedents", "Article 19(1)(a)", "disclosure", "free and fair elections"], "facts": "The Association for Democratic Reforms filed a PIL seeking that candidates contesting elections be required to disclose their criminal antecedents, assets, and educational qualifications. The government argued that Parliament had not prescribed such disclosures and that the Election Commission had no power to require them.", "judgement": "The Supreme Court held that voters have a fundamental right to know about the antecedents of candidates who seek their votes. This right flows from Article 19(1)(a) — the freedom of speech and expression. The Election Commission was directed to issue instructions requiring candidates to disclose criminal records, assets, and educational qualifications.", "principle": "The right to vote, though not expressly a fundamental right, carries with it the right to know about candidates. Voters have a fundamental right to receive material information from candidates, as this is essential for the exercise of informed franchise. This case led directly to the Representation of the People (Amendment) Act 2002 and transformed electoral information disclosure in India."}, {"id": "common-cause-v-union-of-india-2018", "title": "Common Cause v. Union of India", "citation": "(2018) 5 SCC 1", "court": "Supreme Court of India", "year": 2018, "bench": 5, "judges": ["Dipak Misra CJ", "A.M. Khanwilkar J", "D.Y. Chandrachud J", "A.K. Sikri J", "Ashok Bhushan J"], "subject": "Constitutional Law", "tags": ["right to die with dignity", "passive euthanasia", "living will", "advance directive", "Article 21", "terminal illness", "dignity"], "facts": "Common Cause, an NGO, filed a PIL seeking recognition of the right to die with dignity, including the right to refuse medical treatment and to execute advance directives (living wills). The petition raised constitutional questions about whether the right to life under Article 21 includes the right to a dignified death.", "judgement": "The Supreme Court held that the right to die with dignity is part of the fundamental right to life under Article 21. Passive euthanasia — withdrawal of life support — was held to be permissible. The Court recognised the validity of advance directives (living wills) through which a person can specify their wishes about end-of-life medical care.", "principle": "The right to life under Article 21 includes the right to live with dignity, which encompasses the right to die with dignity. Passive euthanasia and advance directives for end-of-life care are constitutionally permissible. This case represents the furthest extension of Article 21 into the domain of personal autonomy over bodily decisions."}, {"id": "anuradha-bhasin-v-union-of-india-2020", "title": "Anuradha Bhasin v. Union of India", "citation": "(2020) 3 SCC 637", "court": "Supreme Court of India", "year": 2020, "bench": 3, "judges": ["N.V. Ramana J", "R. Subhash Reddy J", "B.R. Gavai J"], "subject": "Constitutional Law", "tags": ["internet shutdown", "Article 19", "freedom of speech", "press freedom", "Kashmir", "Section 144", "proportionality", "indefinite restriction"], "facts": "After the abrogation of Article 370 in Jammu & Kashmir in August 2019, the government imposed a prolonged internet shutdown and restrictions on movement in the region. Anuradha Bhasin, the editor of a Kashmir newspaper, challenged the shutdown as a violation of freedom of the press and freedom of speech under Article 19.", "judgement": "The Supreme Court held that freedom of speech and expression through the internet is a fundamental right under Article 19(1)(a). An indefinite internet shutdown is impermissible; any restrictions must be subject to proportionality review and must be for the shortest period necessary. The government was directed to review and publish all orders imposing restrictions.", "principle": "The internet is a medium through which fundamental rights are exercised and restrictions on internet access engage the right to free speech. Any shutdown must be proportionate, time-limited, and subject to judicial review. Indefinite internet shutdowns violate Article 19. This is the first Supreme Court ruling on internet shutdowns and is foundational for digital rights in India."}, {"id": "in-re-article-370-2023", "title": "In Re: Article 370 of the Constitution", "citation": "(2023) SCC OnLine SC 1647", "court": "Supreme Court of India", "year": 2023, "bench": 5, "judges": ["D.Y. Chandrachud CJ", "Sanjay Kishan Kaul J", "Sanjiv Khanna J", "B.R. Gavai J", "Surya Kant J"], "subject": "Constitutional Law", "tags": ["Article 370", "Jammu and Kashmir", "special status", "federalism", "Presidential Order", "bifurcation", "Union Territory", "asymmetric federalism"], "facts": "The abrogation of Article 370 of the Constitution, which accorded special status to Jammu & Kashmir, was challenged. The central government had issued Presidential Orders removing Article 370 and bifurcating the state into two Union Territories. Petitioners argued that this was unconstitutional as it could not be done without the concurrence of the J&K Constituent Assembly, which no longer existed.", "judgement": "The Supreme Court upheld the abrogation of Article 370 by a unanimous verdict. The Court held that Article 370 was a temporary provision and that the President had the power to abrogate it unilaterally after the J&K Constituent Assembly was dissolved. The bifurcation of the state into Union Territories was also upheld, though the Court noted J&K's right to statehood should be restored.", "principle": "Article 370 was a temporary provision that could be abrogated by Presidential proclamation. The special status of J&K was not permanent under the Constitution. The Court also clarified that the federal compact can be altered by the Union through constitutional mechanisms. This is the most significant constitutional case on federalism and territorial integrity in post-independence India."}, {"id": "subramanian-swamy-v-union-of-india-sedition-2021", "title": "S.G. Vombatkere v. Union of India (Section 124A challenge)", "citation": "2022 SCC OnLine SC 929", "court": "Supreme Court of India", "year": 2022, "bench": 3, "judges": ["N.V. Ramana CJ", "Surya Kant J", "Hima Kohli J"], "subject": "Constitutional Law", "tags": ["sedition", "Section 124A IPC", "Article 19", "freedom of speech", "colonial law", "stay order", "pending challenge"], "facts": "Multiple petitions challenged Section 124A of the IPC (sedition) as unconstitutional. The provision criminalises speech or writing that incites disaffection towards the government established by law. Petitioners argued it was a colonial relic that violated freedom of speech under Article 19(1)(a) and was being misused to suppress dissent.", "judgement": "The Supreme Court put the operation of Section 124A IPC on hold and directed that no new FIRs be registered under it until the constitutionality of the provision is decided. The Court noted that the government had agreed to reconsider the provision and called for a fresh examination. The matter remains pending before a larger bench.", "principle": "The constitutionality of Section 124A IPC (sedition) has not been finally decided but the Supreme Court has stayed its operation, signalling serious concern about its compatibility with constitutional values of free speech. This case is part of a broader review of colonial era criminal laws and their consistency with fundamental rights under the Constitution."}, {"id": "election-commission-v-saka-venkata-subba-rao-1953", "title": "Election Commission of India v. Saka Venkata Subba Rao", "citation": "AIR 1953 SC 210", "court": "Supreme Court of India", "year": 1953, "bench": 3, "judges": ["Mehr Chand Mahajan CJ", "S.R. Das J", "Vivian Bose J"], "subject": "Constitutional Law", "tags": ["Election Commission", "Article 324", "plenary power", "elections", "constitutional body", "superintendence"], "facts": "The Election Commission issued directions regarding the conduct of elections that were challenged as exceeding its powers under Article 324 of the Constitution. The question was the scope of the Election Commission's power under Article 324 to issue directions for the conduct of elections in the absence of Parliamentary legislation on the subject.", "judgement": "The Supreme Court held that Article 324 confers plenary power on the Election Commission to supervise, direct, and control elections. In the absence of legislation by Parliament, the Commission has implied powers to fill gaps in the legal framework to ensure free and fair elections. The Commission is not limited to the powers expressly conferred on it by statute.", "principle": "The Election Commission has plenary power under Article 324 to ensure free and fair elections and can exercise implied powers where Parliament has not legislated. This case establishes the constitutional basis for the Election Commission's independent and wide-ranging regulatory power over the conduct of elections in India."}, {"id": "prem-chand-garg-v-excise-commissioner-up-1963", "title": "Prem Chand Garg v. Excise Commissioner, U.P.", "citation": "AIR 1963 SC 996", "court": "Supreme Court of India", "year": 1963, "bench": 3, "judges": ["Sinha CJ", "Gajendragadkar J", "Wanchoo J"], "subject": "Constitutional Law", "tags": ["Article 32", "Supreme Court rules", "surety", "access to justice", "restriction on fundamental rights", "right to constitutional remedies"], "facts": "The Supreme Court had framed rules under Article 145 requiring persons filing writs to furnish security. The petitioner challenged these rules as being inconsistent with the right to constitutional remedies under Article 32, arguing that the requirement of security effectively denied poor persons access to the Supreme Court.", "judgement": "The Supreme Court held that Article 32 confers an absolute right to move the Supreme Court for enforcement of fundamental rights and this right cannot be abridged by rules made under Article 145. Rules that impose financial conditions on the right to approach the Supreme Court under Article 32 are inconsistent with the Constitution.", "principle": "The right to move the Supreme Court under Article 32 is itself a fundamental right and cannot be curtailed by procedural rules. Any rule that imposes financial or other barriers to invoking Article 32 is unconstitutional. This case ensures that poverty is not a barrier to seeking enforcement of fundamental rights."}, {"id": "supreme-court-advocates-v-union-of-india-2016", "title": "Supreme Court Advocates-on-Record Association v. Union of India", "citation": "(2016) 5 SCC 1", "court": "Supreme Court of India", "year": 2015, "bench": 5, "judges": ["J.S. Khehar J", "J. Chelameswar J", "Madan B. Lokur J", "Kurian Joseph J", "Adarsh Kumar Goel J"], "subject": "Constitutional Law", "tags": ["NJAC", "99th Constitutional Amendment", "judicial appointments", "collegium", "basic structure", "separation of powers", "independence of judiciary"], "facts": "The 99th Constitutional Amendment established the National Judicial Appointments Commission (NJAC) to replace the collegium system of judicial appointments. The NJAC included politicians (the Law Minister) and lay members alongside judges. The Supreme Court Advocates-on-Record Association challenged the amendment as violating the basic structure of the Constitution.", "judgement": "The Supreme Court struck down the 99th Amendment and the NJAC Act as unconstitutional. The Court held that the independence of the judiciary and the primacy of the collegium in judicial appointments are part of the basic structure of the Constitution. Giving a veto to the Law Minister in judicial appointments would compromise judicial independence.", "principle": "The independence of the judiciary is a basic feature of the Constitution and cannot be abridged by constitutional amendment. The collegium system, which gives primacy to judges in judicial appointments, is constitutionally mandated to protect judicial independence from executive interference. This case reaffirmed and entrenched the collegium system."}, {"id": "constituent-assembly-debates-article-21", "title": "Constituent Assembly Debates on Fundamental Rights", "citation": "Constituent Assembly Debates, Vol. VII (1948)", "court": "Constituent Assembly of India", "year": 1948, "bench": 3, "judges": ["Dr. B.R. Ambedkar", "Jawaharlal Nehru", "Sardar Vallabhbhai Patel"], "subject": "Constitutional Law", "tags": ["Constituent Assembly", "fundamental rights", "Article 21", "due process", "procedure established by law", "Ambedkar", "drafting history"], "facts": "During the debates of the Constituent Assembly, there was intense deliberation on whether the Constitution should adopt the American 'due process of law' standard or the less protective 'procedure established by law' formulation in Article 21. Dr. Ambedkar moved the 'procedure established by law' formulation, arguing that 'due process' would give courts too much power to strike down social legislation.", "judgement": "The Constituent Assembly adopted 'procedure established by law' rather than 'due process of law' on the motion of Dr. Ambedkar. The Assembly was concerned that a due process standard would allow courts to invalidate progressive social and economic legislation. The narrower formulation was intended to leave social reform legislation to Parliament.", "principle": "The choice of 'procedure established by law' over 'due process' in Article 21 was a deliberate drafting decision reflecting concern about judicial overreach in social legislation. This legislative history was used to support the narrow interpretation in A.K. Gopalan (1950) but the Supreme Court in Maneka Gandhi (1978) effectively read back a due process standard through the harmonious reading of Articles 14, 19, and 21."}, {"id": "state-v-charusila-dasi-1959", "title": "State of West Bengal v. Anwar Ali Sarkar", "citation": "AIR 1952 SC 75", "court": "Supreme Court of India", "year": 1952, "bench": 7, "judges": ["Patanjali Sastri CJ", "Mahajan J", "Mukherjea J", "S.R. Das J", "Vivian Bose J", "Ghulam Hasan J", "Chandrasekhara Aiyar J"], "subject": "Constitutional Law", "tags": ["Article 14", "equality before law", "classification", "reasonable nexus", "West Bengal Special Courts Act", "intelligible differentia"], "facts": "The West Bengal Special Courts Act 1950 allowed the State government to refer certain criminal cases to special courts for speedy trial. The accused argued that the Act violated Article 14 (equality before law) because it permitted arbitrary selection of cases for trial by a separate procedure without reasonable basis for the classification.", "judgement": "The Supreme Court struck down the impugned provisions of the Act. The majority held that while classification is permissible under Article 14, the classification must be based on an intelligible differentia which distinguishes the persons or things grouped together from others, and the differentia must have a rational nexus to the object sought to be achieved. The Act failed this test.", "principle": "Article 14 permits classification but requires that it be based on an intelligible differentia with a rational nexus to the object of the legislation. This two-pronged test — intelligible differentia and rational nexus — is the foundational equality doctrine in Indian constitutional law and is applied in virtually every Article 14 challenge."}, {"id": "ep-royappa-v-state-of-tn-1974", "title": "E.P. Royappa v. State of Tamil Nadu", "citation": "AIR 1974 SC 555", "court": "Supreme Court of India", "year": 1974, "bench": 5, "judges": ["Ray CJ", "Palekar J", "Mathew J", "Beg J", "Chandrachud J"], "subject": "Constitutional Law", "tags": ["Article 14", "arbitrariness", "equality", "transfer of civil servant", "animus", "new equality doctrine"], "facts": "E.P. Royappa, a senior IAS officer, was transferred and given an inconsequential posting in what he alleged was an act of malice by the Chief Minister. He challenged the transfer as violative of Article 14 on the grounds that it was arbitrary and motivated by personal animus.", "judgement": "The Supreme Court held that the transfer was not proven to be mala fide in this case, but in doing so, Justice Bhagwati articulated a new and expansive meaning of equality: equality is antithetic to arbitrariness. Article 14 strikes at arbitrariness in State action in all forms — the guarantee of equality under Article 14 has a pervasive and all-pervading reach.", "principle": "Article 14 does not merely prohibit discrimination — it strikes at arbitrariness in all State action. Equality and arbitrariness are sworn enemies. Any State action that is arbitrary violates Article 14 even if it does not involve discrimination between persons. This expansive anti-arbitrariness doctrine transformed Article 14 from an equality clause into a general check on State power."}, {"id": "nandini-satpathy-v-p-l-dani-1978", "title": "Nandini Satpathy v. P.L. Dani", "citation": "AIR 1978 SC 1025", "court": "Supreme Court of India", "year": 1978, "bench": 2, "judges": ["Krishna Iyer J", "Desai J"], "subject": "Constitutional Law", "tags": ["Article 20(3)", "right against self-incrimination", "police questioning", "accused", "compelled testimony", "CrPC Section 161"], "facts": "Nandini Satpathy, a former Chief Minister of Odisha, was summoned to the police station for questioning in connection with a corruption case. She refused to answer questions on the ground that her answers would incriminate her. The police sought to compel her to answer under Section 161 of the CrPC and she challenged this as violating Article 20(3).", "judgement": "The Supreme Court held that Article 20(3) — the right against self-incrimination — extends to police questioning at the investigation stage and not just to court proceedings. No person accused of an offence can be compelled to be a witness against himself, which includes being compelled to answer incriminating questions during police interrogation.", "principle": "The right against self-incrimination under Article 20(3) protects an accused from being compelled to answer police questions that may incriminate them during investigation, not just at trial. An accused is entitled to remain silent when faced with incriminating questions. This case expanded the scope of Article 20(3) beyond the courtroom and is fundamental to criminal procedural rights in India."}, {"id": "hussainara-khatoon-v-home-secretary-1979", "title": "Hussainara Khatoon v. Home Secretary, State of Bihar", "citation": "AIR 1979 SC 1360", "court": "Supreme Court of India", "year": 1979, "bench": 2, "judges": ["Bhagwati J", "Desai J"], "subject": "Constitutional Law", "tags": ["speedy trial", "Article 21", "undertrial prisoners", "legal aid", "bail", "right to justice", "Bihar jails"], "facts": "A news report revealed that thousands of undertrial prisoners in Bihar had been in jail for periods exceeding the maximum sentence for the offences they were alleged to have committed. An advocate filed a PIL on the basis of this newspaper report. The Supreme Court took cognisance of the matter treating the newspaper article as a writ petition.", "judgement": "The Supreme Court held that the right to a speedy trial is a fundamental right implicit in Article 21. Detention of undertrials beyond the maximum sentence for the alleged offence is unconstitutional. The Court ordered the release of undertrial prisoners who had served the maximum sentence for the offences alleged against them.", "principle": "The right to a speedy trial is a fundamental right under Article 21. Unreasonable delay in trial violates the right to life and liberty. The Court also expanded the reach of PIL by treating a newspaper article as a writ petition, enabling those who cannot approach courts to have their rights vindicated through the agency of a concerned citizen. This case is the genesis of the movement for prison reforms in India."}, {"id": "municipal-corporation-of-delhi-v-birla-cotton-1968", "title": "Re: Special Courts Bill, 1978", "citation": "AIR 1979 SC 478", "court": "Supreme Court of India", "year": 1979, "bench": 7, "judges": ["Chandrachud CJ", "Bhagwati J", "Krishna Iyer J", "Untwalia J", "Fazal Ali J", "Shinghal J", "Sarkaria J"], "subject": "Constitutional Law", "tags": ["Article 143", "advisory jurisdiction", "special courts", "separation of powers", "Article 14", "special procedure", "President's reference"], "facts": "The President of India referred the Special Courts Bill 1978 to the Supreme Court under Article 143 for an advisory opinion. The Bill proposed setting up special courts to try offences committed by persons who held high public office during the Emergency (1975-77). Questions were raised about whether such special courts violated equality and separation of powers.", "judgement": "The Supreme Court opined that the establishment of special courts for high public officials does not per se violate Article 14, provided there is an intelligible basis for the classification and a rational nexus to the object. However, the Court also held that the separation of powers and the independence of the judiciary must be maintained even when special courts are established.", "principle": "The advisory jurisdiction of the Supreme Court under Article 143 is an important constitutional mechanism for resolving questions of law of public importance before legislation is enacted. Special courts for specific categories of accused are constitutionally permissible if the classification is rational. This case also elaborates on the requirements of judicial independence in special tribunals."}, {"id": "st-xavier-college-v-state-of-gujarat-1974", "title": "Rev. Sidhajbhai Sabhai v. State of Bombay", "citation": "AIR 1963 SC 540", "court": "Supreme Court of India", "year": 1963, "bench": 5, "judges": ["Sinha CJ", "Shah J", "Raghubar Dayal J", "Rajagopala Ayyangar J", "Mudholkar J"], "subject": "Constitutional Law", "tags": ["Article 30", "minority rights", "education", "religious minority", "government regulation", "aided institutions", "teachers appointment"], "facts": "A Christian minority institution challenged state regulations that required government approval for appointment of teachers. The institution argued that the right to establish and administer educational institutions under Article 30 includes the right to appoint staff without government interference.", "judgement": "The Supreme Court held that the right of minorities under Article 30 to establish and administer educational institutions is not absolute and the State may regulate such institutions in the interest of educational standards. However, regulation must not be such as to take away the essential character of minority management or interfere with the minority's choice of teaching staff on secular criteria.", "principle": "Minority educational institutions under Article 30 enjoy the right to administer their institutions but this right is subject to reasonable regulation by the State to maintain educational standards. Regulation that effectively takes away management control or imposes non-secular criteria for staff selection violates Article 30. This case balances minority rights with the State's regulatory interest in education."}, {"id": "a-v-dicey-constitutional-law-india", "title": "In Re: Special Reference No. 1 of 2012 (NJAC Reference)", "citation": "AIR 2013 SC 1", "court": "Supreme Court of India", "year": 2012, "bench": 5, "judges": ["Altamas Kabir CJ", "S.S. Nijjar J", "J. Chelameswar J", "Ranjana Prakash Desai J", "Jagdish Singh Khehar J"], "subject": "Constitutional Law", "tags": ["judicial review", "Article 143", "advisory opinion", "legislative competence", "constitutional validity", "President's reference"], "facts": "The President referred questions about the constitutional validity of the proposed National Judicial Appointments Commission to the Supreme Court under Article 143. The reference asked whether the replacement of the collegium system with the NJAC would violate the basic structure of the Constitution.", "judgement": "The Supreme Court opined that any system of judicial appointments that compromises the independence of the judiciary would violate the basic structure of the Constitution. The independence of the judiciary, including the manner of judicial appointments, is part of the basic structure. This advisory opinion preceded the formal challenge to the NJAC Act which was struck down in 2015.", "principle": "The independence of the judiciary is a non-negotiable element of the basic structure of the Constitution. Any mechanism for judicial appointments that gives the Executive a decisive or veto role over appointments is constitutionally suspect. This advisory opinion laid the groundwork for the subsequent invalidation of the NJAC in the Supreme Court Advocates-on-Record case."}, {"id": "naga-peoples-movement-v-union-1998", "title": "Naga People's Movement of Human Rights v. Union of India", "citation": "(1998) 2 SCC 109", "court": "Supreme Court of India", "year": 1998, "bench": 5, "judges": ["M.M. Punchhi CJ", "K. Venkataswami J", "S.P. Kurdukar J", "M. Srinivasan J", "D.P. Wadhwa J"], "subject": "Constitutional Law", "tags": ["AFSPA", "Armed Forces Special Powers Act", "Nagaland", "Article 21", "disturbed areas", "military powers", "human rights"], "facts": "The Armed Forces (Special Powers) Act 1958 was challenged as violating fundamental rights, particularly Article 21. The Act granted the armed forces extraordinary powers including the power to shoot to kill in disturbed areas without judicial oversight. The petitioners argued that the Act was unconstitutional as it permitted excessive and arbitrary use of force.", "judgement":
